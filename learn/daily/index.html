<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日一課 · ACC Flow</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2d2a24;--muted:#6f685c;--line:#e4d9c5;--biz:#2f5d7c;--per:#4f7a35;--km:#9a3a24;--ms:#b9852c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(246,241,231,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hin{max-width:820px;margin:auto;padding:10px 14px;display:flex;gap:10px;align-items:center}
.hin h1{font-size:1.1em;margin:0;flex:1}.back{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:.85em;background:#fff}
main{max-width:820px;margin:auto;padding:12px 14px 60px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:.9em;cursor:pointer}
.tabs button.on{color:#fff;border-color:transparent}
.sched{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.9em;margin-bottom:12px}
.sched b{white-space:nowrap}
.post{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 16px;margin:12px 0;box-shadow:0 2px 0 #eadfca}
.post .meta{font-size:.8em;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.post .meta span.tag{background:var(--c);color:#fff;border-radius:10px;padding:0 8px}
.post .body{white-space:pre-wrap;word-break:break-word}
.post code{display:block;white-space:pre;overflow-x:auto;background:#f3eee3;border-radius:8px;padding:6px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;margin:4px 0}
.post a{color:var(--biz)}
.spo{background:#2d2a24;color:transparent;border-radius:4px;cursor:pointer;transition:all .2s}.spo.open{background:#e6efd9;color:inherit}
.up{opacity:.75;border-style:dashed}.up .body{display:none}
.empty{color:var(--muted);text-align:center;padding:30px}
</style></head><body>
<header><div class="hin"><a class="back" href="../../os/index.html?view=edu">← 知識學習</a><h1>📅 每日一課</h1></div></header>
<main>
  <div class="sched">⏰ <b>週一～週六</b>（週日休息）<br>
  <b>10:00</b> 🏢 企業管理／🌱 個人學習 隔天輪流，每 1～2 週學完一個主題（入門→精通）<br>
  <b>13:00</b> 🇰🇭 高棉語／🇲🇾 馬來語 隔天輪流，一個月學完基本聽說與發音</div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">載入中…</div></div>
</main>
<script>
const T={all:['全部','#6f685c'],biz:['🏢 企業管理','#2f5d7c'],per:['🌱 個人學習','#4f7a35'],km:['🇰🇭 高棉語','#9a3a24'],ms:['🇲🇾 馬來語','#b9852c']};
let F=[],cur='all';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const now=new Date(),L=F.filter(x=>cur==='all'||x.track===cur);
  const sent=L.filter(x=>new Date(x.sendAt)<=now).reverse(),up=L.filter(x=>new Date(x.sendAt)>now);
  let h='';
  sent.forEach(x=>{h+=card(x,false)});
  if(up.length){h+='<h3 style="margin-top:24px">🗓️ 接下來</h3>';up.slice(0,8).forEach(x=>{h+=card(x,true)})}
  document.getElementById('list').innerHTML=h||'<div class="empty">第一則將於 '+(F[0]?F[0].sendAt.slice(0,10):'')+' 發出。</div>';
  document.querySelectorAll('.spo').forEach(s=>s.onclick=()=>s.classList.toggle('open'));
}
function card(x,upc){
  const c=T[x.track][1],d=new Date(x.sendAt),ds=(d.getMonth()+1)+'/'+d.getDate()+' '+['日','一','二','三','四','五','六'][d.getDay()]+' '+x.sendAt.slice(11,16);
  const body=x.tg.replace(/<tg-spoiler>/g,'<span class="spo" title="點一下看答案">').replace(/<\/tg-spoiler>/g,'</span>');
  return '<div class="post'+(upc?' up':'')+'" style="--c:'+c+'"><div class="meta"><span class="tag">'+T[x.track][0]+'</span><span>'+ds+'</span><span>'+esc(x.topicName)+' '+x.n+'/'+x.of+'</span></div><div class="body">'+(upc?'<b>'+esc(x.title)+'</b>':body)+'</div>'+(upc?'<b>'+esc(x.title)+'</b>':'')+'</div>';
}
Object.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=T[k][0];b.onclick=()=>{cur=k;document.querySelectorAll('.tabs button').forEach(z=>{z.classList.toggle('on',z===b);z.style.background=z===b?T[k][1]:'#fff'});render()};document.getElementById('tabs').appendChild(b);if(k==='all'){b.classList.add('on');b.style.background=T.all[1]}});
fetch('feed.json?t='+Date.now()).then(r=>r.json()).then(j=>{F=j.items.sort((a,b)=>a.sendAt.localeCompare(b.sendAt));render()}).catch(e=>{document.getElementById('list').innerHTML='<div class="empty">讀取失敗：'+esc(String(e))+'</div>'});
</script>
<script src="https://saintdou-weng.github.io/PSJERP/music.js?v=2.28" defer></script><!-- 2026-11-25 Paul：ACC Flow 也套用 ♪ 音樂＋🎨 調色盤／背景／3D 等設定（每個平台各自記住） -->
</body></html>
