<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>書庫 · ACC Flow</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#2d2a24;--muted:#6f685c;--line:#e2d7c3;--acc:#c0662b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(244,239,230,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1100px;margin:auto;padding:8px 12px;display:flex;gap:8px;align-items:center}
.hin h1{font-size:1.05em;margin:0;white-space:nowrap}
.back{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:3px 9px;font-size:.85em;background:#fff;white-space:nowrap}
#q{flex:1;min-width:0;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);font:inherit;background:#fff}
.tabs{max-width:1100px;margin:auto;display:flex;gap:4px;padding:0 12px}
.tabs button{border:none;background:none;font:inherit;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:700}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:10px 12px 70px}
.stat{font-size:.82em;color:var(--muted);margin:2px 0 8px}
.groups{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font:inherit;font-size:.86em;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.cats .chip.on{background:#f3dfcc;color:var(--ink)}
.cats small{color:var(--muted);margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px 12px}
.book{cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cv{position:relative;aspect-ratio:3/4;border-radius:6px 10px 10px 6px;overflow:hidden;box-shadow:0 4px 10px rgba(60,40,20,.18),inset 4px 0 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2em;transition:transform .15s}
.book:hover .cv{transform:translateY(-3px)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .pbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.25)}
.cv .pbar i{display:block;height:100%;background:#ffb54d}
.cv .badge{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:8px;padding:0 6px;z-index:1}
.book b{font-size:.82em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.book small{color:var(--muted);font-size:.72em}
.hist{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;cursor:pointer}
.hist .cv{width:46px;flex:none;font-size:1.1em}
.hist .info{flex:1;min-width:0}.hist .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .bar{height:5px;background:#eee3d0;border-radius:4px;overflow:hidden;margin-top:4px}.hist .bar i{display:block;height:100%;background:var(--acc)}
.gate{max-width:360px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.gate input{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);font:inherit;margin:10px 0}
.btn{border:none;background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:30px}
/* ===== 閱讀器 ===== */
#reader{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;--rb:#efe4c8;--rf:#3a2f1e;--rbar:rgba(239,228,200,.96)}
#reader.on{display:flex}
#reader[data-th="night"]{--rb:#121212;--rf:#cfcac2;--rbar:rgba(25,25,25,.96)}
#reader[data-th="paper"]{--rb:#efe4c8;--rf:#3a2f1e;--rbar:rgba(239,228,200,.96)}
#reader[data-th="eink"]{--rb:#f2f2f0;--rf:#000;--rbar:rgba(242,242,240,.97)}
#reader[data-th="day"]{--rb:#ffffff;--rf:#1d1d1d;--rbar:rgba(255,255,255,.96)}
#reader{background:var(--rb);color:var(--rf)}
.rbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--rbar);font-size:.88em;transition:opacity .25s,transform .25s;z-index:4;position:absolute;left:0;right:0;top:0;box-shadow:0 1px 8px rgba(0,0,0,.15)}
.rbar.bottom{top:auto;bottom:0;box-shadow:0 -1px 8px rgba(0,0,0,.15)}
#rOpts{display:none;flex:1 1 100%;flex-wrap:wrap;gap:6px;justify-content:center}#rOpts.on{display:flex}
.rbar .pg{font-size:.85em;opacity:.8;white-space:nowrap}
.rbar.bottom{flex-wrap:wrap;justify-content:center}
#reader.hide .rbar{opacity:0;pointer-events:none}
.rbar .t{flex:1;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rbar button,.rbar a{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.4);border-radius:8px;padding:4px 9px;font:inherit;cursor:pointer;text-decoration:none}
.rbar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rbar input[type=range]{flex:1 1 100%;accent-color:var(--acc)}
.optrow{flex:1 1 100%;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.optrow span{opacity:.7;font-size:.9em}
#page .dual{display:flex;gap:4px;justify-content:center;align-items:flex-start}#page .dual>div{display:flex;justify-content:center}
#stage{position:absolute;inset:0;overflow:auto;perspective:1800px;display:flex;justify-content:center;align-items:flex-start;padding:48px 0 64px}
#reader.hide #stage{padding:0}
#stage.fitv{align-items:center}
#page{transform-origin:left center;max-width:100%;padding:8px 0}
#page canvas,#page img{display:block;max-width:100%;margin:auto;box-shadow:0 2px 14px rgba(0,0,0,.25)}
#page.txt{max-width:720px;padding:22px 22px 80px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;text-align:justify;white-space:pre-wrap;word-break:break-word;-webkit-font-smoothing:antialiased}
/* 翻書：舊頁像紙一樣從一邊掀起、緩緩翻到另一邊 */
.leaf{position:absolute;z-index:2;transform-style:preserve-3d;pointer-events:none;transition:transform .8s cubic-bezier(.45,.05,.25,1)}
.leaf .lf,.leaf .lb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--rb)}
.leaf .lb{transform:rotateY(180deg);background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0) 35%),var(--rb)}
.leaf .sh{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s ease}
.leaf.go .sh{opacity:1}
.leaf.oL .sh{background:linear-gradient(90deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.4))}
.leaf.oR .sh{background:linear-gradient(270deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.4))}
#page.under{animation:under .8s ease}
@keyframes under{0%{filter:brightness(.8)}100%{filter:brightness(1)}}
/* 上下捲動模式 */
#page.vs{width:100%;max-width:1000px;padding:0 0 60px}
#page.vs .vp{min-height:60vh;margin:0 auto 10px;display:flex;justify-content:center;align-items:center;opacity:.8;font-size:.85em}
#page.vs .vp.ok{min-height:0;opacity:1}
#page.vs .vp.txt{display:block;max-width:720px;padding:18px 22px;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;text-align:justify;white-space:pre-wrap;word-break:break-word;line-height:1.9}

/* 系列 */
.cv .vols{position:absolute;left:6px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:9px;z-index:1}
.cv.stack{box-shadow:4px 4px 0 -1px #d8c8b0,8px 8px 0 -2px #c4b294}
.serHead{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}.serHead b{font-size:1.1em}
.serHead button{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font:inherit;cursor:pointer}
.nextVol{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:6;background:var(--acc);color:#fff;border:none;border-radius:22px;padding:10px 20px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#reader[data-th="night"] #page canvas{filter:invert(1) hue-rotate(180deg) contrast(1.05)}
#reader[data-th="night"] #page img{filter:brightness(.8)}
#reader[data-th="paper"] #page canvas{filter:sepia(.35) contrast(1.08)}
#reader[data-th="eink"] #page canvas,#reader[data-th="eink"] #page img{filter:grayscale(1) contrast(1.35)}
#reader.sharp[data-th="day"] #page canvas{filter:contrast(1.25)}
#reader.sharp[data-th="paper"] #page canvas{filter:sepia(.35) contrast(1.3)}
/* 2026-11-26 Paul：字太小 → A＋ 可以放大超過螢幕寬（左右上下拖著看）；🖋 加深讓淡淡的字變黑 */
#reader.zoom #page canvas,#reader.zoom #page img{max-width:none}#reader.zoom #stage{justify-content:flex-start}#reader.zoom #page{margin:0 auto}
#reader.dk1 #page canvas,#reader.dk1 #page img{filter:grayscale(.2) contrast(1.7) brightness(.93)!important}
#reader.dk2 #page canvas,#reader.dk2 #page img{filter:grayscale(.4) contrast(2.4) brightness(.86)!important}
#reader[data-th="night"].dk1 #page canvas,#reader[data-th="night"].dk2 #page canvas{filter:invert(1) hue-rotate(180deg) contrast(1.6)!important}
#rJump{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:var(--rbar);color:inherit;padding:16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
#rJump.on{display:block}#rJump input{font:inherit;font-size:1.4em;width:6em;text-align:center;padding:6px;border-radius:8px;border:1px solid rgba(128,128,128,.5)}#rJump button{margin:8px 4px 0;font:inherit;padding:6px 14px;border-radius:8px;border:1px solid rgba(128,128,128,.5);background:var(--acc);color:#fff}
.bk-fail{position:absolute;top:4px;right:4px;background:#b91c1c;color:#fff;border-radius:6px;padding:1px 5px;font-size:.7em}.book{position:relative}
.msg{padding:40px;text-align:center;opacity:.8}
.sum{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sum.on{display:flex}
.sum .box{background:var(--rb);color:var(--rf);width:min(760px,100%);max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px 30px;line-height:1.8}
.sum h3{margin:.2em 0 .4em}.sum li{margin:.25em 0}.sum .x{float:right;border:none;background:none;font-size:1.3em;color:inherit;cursor:pointer}

</style></head><body>
<header><div class="hin"><a class="back" href="../../os/index.html?view=edu">← 知識學習</a><h1>📚 書庫</h1><input id="q" placeholder="🔍 搜尋書名"></div>
<div class="tabs"><button data-tab="shelf" class="on">書架</button><button data-tab="lib">書城</button><button data-tab="comic">🎨 漫畫</button><button data-tab="hist">閱讀紀錄</button></div></header>

  <div class="rbar"><button id="rClose">✕</button><span class="t" id="rTitle"></span><span id="rPage" title="點一下跳到第幾頁" style="cursor:pointer;text-decoration:underline dotted">—</span><button id="rJumpBtn">🔢 跳頁</button><a id="rDrive" target="_blank" rel="noopener">雲端</a><button id="rDel" title="從書庫移除">🗑</button></div>

    <button id="rOptBtn">⚙️ 設定</button><button id="rSum">📝 精華</button>

      <div class="optrow"><span>翻頁</span><button data-fl="r2l">⬅️ 左翻</button><button data-fl="l2r">➡️ 右翻（日漫）</button><button data-fl="v">⬇️ 上下捲</button></div>

      <div class="optrow"><button id="rMode">文字模式</button><button id="rSharp">✨ 清晰</button><button id="rMinus">A−</button><button id="rPlus">A＋</button><button id="rDark">🖋 加深</button></div>

</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbzojXP0ixSsJqO1Ri2lfkdazTF-9XxoDqRYI0B4OEThkvjc95zacRflYtuArOd8ewHp/exec';
const INLINE_MAX=200*1024*1024;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#a0522d','#2f5d7c','#4f7a35','#9a3a24','#b9852c','#5a3a7a','#2a7a6a','#7a2a4a','#3a5a7a'];
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let K=load('acc_lib_k',''),CAT=null,TAB='shelf',G='all',C='',Q='';
let PROG=load('acc_lib_prog',{});            // 每本的進度 {id:{p,n,ts,done}}，同步到雲端（手機、電腦共用）
let SET=Object.assign({th:'paper',sharp:true,fs:20,mode:'page',flip:'r2l',ly:'w',dark:0},load('acc_lib_set',{}));
let HIDDEN=new Set(load('acc_lib_hidden',[])),FAIL=new Set(load('acc_lib_fail',[]));
let SER='';                                  // 正在看的系列
/* ===== 本機快取（看過的書不重複下載）：上限 600MB，滿了先清最久沒讀的 ===== */
const CACHE_MAX=600*1024*1024;
const IDB=new Promise((ok,no)=>{try{const r=indexedDB.open('acc_lib',1);r.onupgradeneeded=()=>{r.result.createObjectStore('b')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}catch(e){ok(null)}});
async function idb(mode,fn){const db=await IDB;if(!db)return null;return new Promise(ok=>{try{const tx=db.transaction('b',mode),st=tx.objectStore('b');const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ok(null)}catch(e){ok(null)}})}
async function cget(k){const v=await idb('readonly',st=>st.get(k));if(v){const m=load('acc_lib_cm',{});if(m[k]){m[k].ts=Date.now();store('acc_lib_cm',m)}}return v}
async function cput(k,v,size){const m=load('acc_lib_cm',{});m[k]={s:size,ts:Date.now()};
  let tot=Object.values(m).reduce((a,x)=>a+x.s,0);const old=Object.keys(m).sort((a,b)=>m[a].ts-m[b].ts);
  while(tot>CACHE_MAX&&old.length){const o=old.shift();if(o===k)continue;tot-=m[o].s;delete m[o];await idb('readwrite',st=>st.delete(o))}
  store('acc_lib_cm',m);await idb('readwrite',st=>st.put(v,k))}
const api=qs=>fetch(GAS+'?k='+encodeURIComponent(K)+'&'+qs).then(r=>r.json());

const EDTAG='[.．]?\\s*(高清)?(掃描|彩圖|全彩|文字|高清)版?';
function tidy(t){                                  // 拿掉下載站標記；[書名].作者、《書名》作者 拆成「書名｜作者」
  t=String(t||'').replace(/\.(pdf|epub|zip)$/i,'')
    .replace(/【[^】]*(文字版|電子書|下載|雅書)[^】]*】/g,'')
    .replace(/[\[(（【]\s*(V版?|VDOOK[^\])）】]*|[\w.-]*(60de|yabook|mydbfx|vdook)[\w.-]*\.(com|org|net)|非高清|掃描版|文字版|\d)\s*[\])）】]/gi,'')
    .replace(/_+/g,' ').trim();
  const au=x=>x.replace(new RegExp(EDTAG,'g'),'').replace(/[.．]+/g,' ').trim();
  let m=t.match(/^\[([^\]]{2,})\][.．]?\s*(.*)$/);
  if(m&&!/原版|系列/.test(m[1])){const a=au(m[2]);t=m[1]+(a?'｜'+a:'')}
  m=t.match(/^《([^》]{2,})》\s*(.*)$/);
  if(m)t=m[1]+(m[2].trim()?'｜'+m[2].trim():'');
  m=t.match(/^[\[(（【]([^\])）】]{1,10})[\])）】]\s*(.{2,})$/);                 // [英文原版]書名 → 書名（英文原版），排序才不會全擠在最前面
  if(m)t=m[2]+'（'+m[1]+'）';
  return t.replace(/\s{2,}/g,' ').trim()||'（未命名）'}

function serKey(b){

    try{const j=await api('lib=thumb&id='+id+(b.type==='img'?'&folder=1':''));if(j.ok){src='data:'+j.type+';base64,'+j.b64;CVC[id]=src;cput('cv:'+id,src,src.length)}}catch(e){}cvBusy--}
  if(src){const im=new Image();im.src=src;im.alt='';el.prepend(im)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;SER='';render()});
$('q').oninput=e=>{Q=e.target.value.trim();if(Q&&TAB!=='lib')TAB='lib';if(CAT)render()};

/* ===== 閱讀器 ===== */
let B=null,PDF=null,IMGS=null,CACHE={},PG=1,N=1,TXT={},busy=false;
function applySet(){const r=$('reader');r.dataset.th=SET.th;r.classList.toggle('sharp',SET.sharp);
  document.querySelectorAll('#reader button[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===SET.th));
  $('rSharp').classList.toggle('on',SET.sharp);r.classList.toggle('dk1',SET.dark===1);r.classList.toggle('dk2',SET.dark===2);r.classList.toggle('zoom',SET.fs>20&&SET.mode!=='text');$('rDark').classList.toggle('on',!!SET.dark);$('rDark').textContent=['🖋 加深','🖋 加深 1','🖋 加深 2'][SET.dark||0];document.querySelectorAll('[data-fl]').forEach(b=>b.classList.toggle('on',b.dataset.fl===SET.flip));document.querySelectorAll('[data-ly]').forEach(b=>b.classList.toggle('on',b.dataset.ly===SET.ly));r.classList.toggle('vmode',SET.flip==='v');$('rMode').classList.toggle('on',SET.mode==='text');store('acc_lib_set',SET)}
async function openBook(id){
  B=book(id);if(!B)return;PDF=null;IMGS=null;CACHE={};TXT={};$('stage').onscroll=null;if(VIO)VIO.disconnect();document.querySelectorAll('.leaf,.nextVol').forEach(x=>x.remove());
  $('reader').classList.add('on');$('reader').classList.remove('hide');$('rTitle').textContent=B.title;
  $('rDrive').href=B.type==='img'?'https://drive.google.com/drive/folders/'+id:'https://drive.google.com/file/d/'+id+'/view';
  applySet();$('rMode').style.display=B.type==='pdf'?'':'none';
  PG=(PROG[id]&&PROG[id].p)||1;$('page').className='';$('page').innerHTML='<div class="msg">開書中…</div>';
  try{
    if(FAIL.has(id)){FAIL.delete(id);store('acc_lib_fail',[...FAIL])}
    if(B.type==='img'){let L=await cget('imgs:'+id);if(!L){const j=await api('lib=imgs&id='+id);if(!j.ok)throw j.error;L=j.images;cput('imgs:'+id,L,JSON.stringify(L).length)}IMGS=L;N=IMGS.length}
    else if(B.type==='pdf'&&B.size<=INLINE_MAX&&window.pdfjsLib){
      let u8=await cget('pdf2:'+id);
      if(u8)u8=new Uint8Array(u8);
      else{const parts=[];let total=1;                                              // 一段一段下載，不同時開多條
        for(let p=0;p<total;p++){const j=await api('lib=pdf&id='+id+'&part='+p+'&size='+(B.size||0));if(!j.ok)throw j.error;total=j.total;parts.push(j.b64);$('page').innerHTML='<div class="msg">下載中 '+Math.round((p+1)/total*100)+'%（之後不用再下載）</div>'}
        const bufs=parts.map(b=>{const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a});
        u8=new Uint8Array(bufs.reduce((t,a)=>t+a.length,0));let off=0;bufs.forEach(a=>{u8.set(a,off);off+=a.length});
        await cput('pdf2:'+id,u8.buffer.slice(0),u8.length)}
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      PDF=await pdfjsLib.getDocument({data:u8,cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'}).promise;N=PDF.numPages}
    else{$('page').innerHTML='<iframe src="https://drive.google.com/file/d/'+id+'/preview" style="width:100vw;height:78vh;border:0;background:#fff"></iframe>';N=0;$('rPage').textContent='（大檔用雲端預覽）';saveProg();return}
    PG=Math.min(Math.max(1,PG),N);$('rSlider').max=N;await draw(0);clearTimeout(window._hb);window._hb=setTimeout(()=>{if(!$('rOpts').classList.contains('on'))toggleBars(true)},2500);
  }catch(e){FAIL.add(id);store('acc_lib_fail',[...FAIL]);$('page').innerHTML='<div class="msg">這本開不起來：'+esc(e)+'<br><small>雲端也打不開的話，通常是檔案本身壞了或沒傳完整。</small><br><br><button onclick="document.getElementById(\'rDel\').click()" style="font:inherit;padding:8px 16px;border-radius:10px;border:0;background:#b91c1c;color:#fff">🗑 從書庫移除</button>　<a href="'+$('rDrive').href+'" target="_blank">改用 Google 雲端開啟</a></div>'}
}
function dualOn(){return SET.ly==='dual'&&SET.flip!=='v'&&!(SET.mode==='text'&&PDF)}
async function renderOne(el,n,W,H){                                 // 在 W×H 的空間畫第 n 頁
  if(IMGS){const src=await imgSrc(n-1);const z=SET.fs/20,st=SET.ly==='w'&&!H?'width:'+Math.round(z*100)+'%':(z>1?'width:'+Math.round(W*z)+'px;height:auto':'max-width:'+W+'px;max-height:'+H+'px;width:auto;height:auto');
    el.innerHTML='<img src="'+src+'" style="'+st+'">';return}
  const page=await PDF.getPage(n),v1=page.getViewport({scale:1});
  let sc=W/v1.width;if(H)sc=Math.min(sc,H/v1.height);if((SET.ly==='w'&&!H)||(H&&SET.fs>20))sc*=SET.fs/20;
  const q=Math.min(3,(window.devicePixelRatio||1)*(SET.sharp?2:1.25));
  const vp=page.getViewport({scale:sc*q}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/q)+'px';
  await page.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise;el.innerHTML='';el.appendChild(c)}
async function renderInto(el,n,scroll){                            // 把第 n 頁（雙頁時 n、n+1）畫進 el
  if(SET.mode==='text'&&PDF){const t=await pageText(n);el.classList.add('txt');el.style.fontSize=SET.fs+'px';el.textContent=t||'（這一頁沒有可抽出的文字，請切回「頁面模式」）';return}
  const st=$('stage'),hid=$('reader').classList.contains('hide'),W=Math.min(st.clientWidth,1400)-8,H=window.innerHeight-(hid?20:124);
  if(scroll||SET.ly==='w')return renderOne(el,n,Math.min(W,1000),0);
  if(SET.ly==='fit')return renderOne(el,n,W,H);
  const a=document.createElement('div'),b=document.createElement('div'),box=document.createElement('div');box.className='dual';
  await renderOne(a,n,W/2-2,H);if(n+1<=N)await renderOne(b,n+1,W/2-2,H);
  if(SET.flip==='l2r')box.append(b,a);else box.append(a,b);el.innerHTML='';el.appendChild(box)}
function snap(el){const c=el.cloneNode(true);c.removeAttribute('id');const a=el.querySelectorAll('canvas'),b=c.querySelectorAll('canvas');
  a.forEach((x,i)=>{const d=b[i];d.width=x.width;d.height=x.height;d.style.width=x.style.width;try{d.getContext('2d').drawImage(x,0,0)}catch(e){}});return c}
function pageTurn(old,r,dir){                                        // 舊頁當成一張紙翻過去
  document.querySelectorAll('.leaf').forEach(x=>x.remove());
  const toLeft=(dir>0)===(SET.flip!=='l2r');                          // 往左翻（一般書下一頁）或往右翻（日漫下一頁）
  const lf=document.createElement('div');lf.className='leaf '+(toLeft?'oL':'oR');
  lf.style.cssText='left:'+r.l+'px;top:'+r.t+'px;width:'+r.w+'px;height:'+r.h+'px;transform-origin:'+(toLeft?'left':'right')+' center';
  const f=document.createElement('div');f.className='lf';old.style.margin='0';old.style.width='100%';f.appendChild(old);
  const bk=document.createElement('div');bk.className='lb';const sh=document.createElement('div');sh.className='sh';
  lf.append(f,bk);f.appendChild(sh);$('stage').appendChild(lf);
  const pg=$('page');pg.classList.remove('under');void pg.offsetWidth;pg.classList.add('under');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{lf.classList.add('go');lf.style.transform='rotateY('+(toLeft?-180:180)+'deg)'}));
  setTimeout(()=>lf.remove(),900)}
async function draw(dir){
  if(SET.flip==='v')return drawScroll();
  if(busy)return;busy=true;
  const pg=$('page');$('rPage').textContent=(dualOn()&&PG<N?PG+'-'+(PG+1):PG)+' / '+N;$('rSlider').value=PG;
  try{
    const anim=dir&&pg.firstChild&&!pg.classList.contains('vs');
    const old=anim?snap(pg):null,st=$('stage'),r=anim?{l:pg.offsetLeft,t:pg.offsetTop-st.scrollTop,w:pg.offsetWidth,h:Math.min(pg.offsetHeight,st.clientHeight+40)}:null;
    if(old){old.style.height=r.h+'px';old.style.overflow='hidden';old.scrollTop=st.scrollTop}
    const tmp=document.createElement('div');await renderInto(tmp,PG);
    pg.className=tmp.className;pg.removeAttribute('style');if(tmp.classList.contains('txt')){pg.style.fontSize=SET.fs+'px';pg.style.lineHeight='1.9'}
    pg.innerHTML='';while(tmp.firstChild)pg.appendChild(tmp.firstChild);
    if(IMGS)[PG,PG+1,PG+2].forEach(i=>IMGS[i]&&imgSrc(i));
    st.scrollTop=0;
    if(old){r.t=pg.offsetTop;pageTurn(old,r,dir)}
    saveProg();showNext();
  }finally{busy=false}
}
/* 上下捲動：整本由上往下連續看，看到哪頁自動記進度 */
let VIO=null,scrollT=null;
async function drawScroll(){
  const pg=$('page'),st=$('stage');pg.className='vs';pg.removeAttribute('style');if(SET.mode==='text'&&PDF)pg.style.fontSize=SET.fs+'px';
  let h='';for(let i=1;i<=N;i++)h+='<div class="vp" data-n="'+i+'">第 '+i+' 頁</div>';pg.innerHTML=h;
  if(VIO)VIO.disconnect();
  const busyN={};
  const load=async el=>{const n=+el.dataset.n;if(el.classList.contains('ok')||busyN[n])return;busyN[n]=1;try{await renderInto(el,n,true);el.classList.add('ok')}catch(e){}busyN[n]=0};
  VIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)load(e.target)}),{root:st,rootMargin:'1500px 0px'});
  const target=pg.querySelector('[data-n="'+PG+'"]');
  if(target){await load(target);target.scrollIntoView({block:'start'})}
  pg.querySelectorAll('.vp').forEach(el=>VIO.observe(el));
  st.onscroll=()=>{clearTimeout(scrollT);scrollT=setTimeout(()=>{
    const y=st.getBoundingClientRect().top+st.clientHeight/3;let cur=PG;
    for(const el of pg.querySelectorAll('.vp')){if(el.getBoundingClientRect().top<=y)cur=+el.dataset.n;else break}
    if(PDF&&SET.mode!=='text')pg.querySelectorAll('.vp.ok').forEach(el=>{if(Math.abs(+el.dataset.n-cur)>8){el.style.minHeight=el.offsetHeight+'px';el.innerHTML='';el.classList.remove('ok')}});  // 遠的頁先收起來，省記憶體
    if(cur!==PG){PG=cur;$('rPage').textContent=PG+' / '+N;$('rSlider').value=PG;saveProg();showNext()}},200)};
  $('rPage').textContent=PG+' / '+N;$('rSlider').value=PG;saveProg();showNext();
}
function scrollToPage(n){const el=$('page').querySelector('[data-n="'+n+'"]');if(el)el.scrollIntoView({block:'start'})}
/* 讀到最後一頁：出現「下一卷」 */
function showNext(){document.querySelectorAll('.nextVol').forEach(x=>x.remove());if(!B||!N||PG+(dualOn()?1:0)<N)return;const nx=nextInSeries(B);if(!nx)return;
  const bt=document.createElement('button');bt.className='nextVol';bt.textContent='下一'+(B.type==='img'?'卷':'冊')+' ▶ '+nx.title.slice(0,18);bt.onclick=()=>{bt.remove();saveProg();openBook(nx.id)};$('reader').appendChild(bt)}
async function pageText(n){if(TXT[n])return TXT[n];const tc=await (await PDF.getPage(n)).getTextContent();let s='',lastY=null;
  tc.items.forEach(it=>{const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2)s+=(Math.abs(y-lastY)>18?'\n\n':'\n');s+=it.str;lastY=y});
  s=toTrad(s.replace(/[\u2E80-\u2FDF]/g,c=>c.normalize('NFKC'))).replace(/([^\n。！？」.!?])\n(?!\n)/g,'$1');return TXT[n]=s.trim()}
function imgSrc(i){if(!CACHE[i]){const k='img:'+IMGS[i].id;
  CACHE[i]=cget(k).then(v=>v||api('lib=img&id='+IMGS[i].id).then(j=>{const d='data:'+j.type+';base64,'+j.b64;cput(k,d,d.length);return d}))}return CACHE[i]}
let saveT=null;
let lastSent={};
function saveProg(){if(!B)return;PROG[B.id]={p:PG,n:N,ts:new Date().toISOString(),done:N>0&&PG>=N};store('acc_lib_prog',PROG);
  const id=B.id,p=PG,n=N;if(lastSent[id]===p+'/'+n)return;                     // 頁數沒變就不上傳
  clearTimeout(saveT);saveT=setTimeout(()=>{lastSent[id]=p+'/'+n;api('lib=progset&id='+id+'&p='+p+'&n='+n).catch(()=>{delete lastSent[id]})},1500)}
function go(d){if(!N||busy)return;const n=PG+d*(dualOn()?2:1);if(n<1||n>N){if(n>N&&B){const nx=nextInSeries(B);if(nx){saveProg();openBook(nx.id)}}return}PG=n;if(SET.flip==='v')return scrollToPage(n);draw(d)}
const side=x=>SET.flip==='l2r'?-x:x;                       // 日漫：左邊是下一頁
let lastSwipe=0;
$('stage').addEventListener('click',e=>{if(e.target.closest('a,button,iframe'))return;if(Date.now()-lastSwipe<400)return;
  const x=e.clientX/window.innerWidth;
  if(SET.flip==='v'||(x>.3&&x<.7)){toggleBars();return}
  go(side(x>=.7?1:-1))});
function toggleBars(force){const r=$('reader');const hide=force!==undefined?force:!r.classList.contains('hide');r.classList.toggle('hide',hide);if(hide)$('rOpts').classList.remove('on');if(SET.ly!=='w'&&SET.flip!=='v'&&B)setTimeout(()=>draw(0),260)}
$('rSlider').oninput=e=>{$('rPage').textContent=e.target.value+' / '+N};$('rSlider').onchange=e=>{PG=+e.target.value;if(SET.flip==='v')scrollToPage(PG);else draw(1)};
document.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{SET.flip=b.dataset.fl;applySet();$('stage').onscroll=null;if(VIO)VIO.disconnect();draw(0)});
document.querySelectorAll('[data-ly]').forEach(b=>b.onclick=()=>{SET.ly=b.dataset.ly;applySet();if(dualOn()&&PG%2===0&&PG>1)PG--;draw(0)});
document.querySelectorAll('#reader button[data-th]').forEach(b=>b.onclick=()=>{SET.th=b.dataset.th;applySet()});
$('rOpts').addEventListener('click',e=>e.stopPropagation());
$('rSharp').onclick=()=>{SET.sharp=!SET.sharp;applySet();draw(0)};
$('rMode').onclick=()=>{SET.mode=SET.mode==='text'?'page':'text';applySet();draw(0)};
$('rPlus').onclick=()=>{SET.fs=Math.min(SET.mode==='text'?34:60,SET.fs+(SET.mode==='text'?2:4));applySet();redrawZoom()};$('rMinus').onclick=()=>{SET.fs=Math.max(SET.mode==='text'?14:20,SET.fs-(SET.mode==='text'?2:4));applySet();redrawZoom()};
function redrawZoom(){if(SET.flip==='v'){$('page').querySelectorAll('.vp').forEach(el=>{el.classList.remove('ok');el.innerHTML='第 '+el.dataset.n+' 頁';el.style.minHeight=''});drawScroll()}else draw(0);toast2((SET.mode==='text'?'字級 ':'放大 ')+Math.round(SET.fs/20*100)+'%')}
function toast2(t){let el=document.getElementById('zt');if(!el){el=document.createElement('div');el.id='zt';el.style.cssText='position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.75);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700';document.body.appendChild(el)}el.textContent=t;el.style.display='';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1200)}
$('rDark').onclick=()=>{SET.dark=((SET.dark||0)+1)%3;applySet()};
/* 🔢 跳頁：不用一頁一頁翻（拉下面的長條也可以） */
function openJump(){if(!N)return;$('rJumpN').max=N;$('rJumpN').value=PG;$('rJumpN').placeholder='1 – '+N;$('rJump').classList.add('on');setTimeout(()=>{$('rJumpN').focus();$('rJumpN').select()},50)}
$('rJumpBtn').onclick=e=>{e.stopPropagation();openJump()};$('rPage').onclick=e=>{e.stopPropagation();openJump()};
$('rJump').addEventListener('click',e=>e.stopPropagation());$('rJumpX').onclick=()=>$('rJump').classList.remove('on');
$('rJumpGo').onclick=()=>{const n=Math.round(+$('rJumpN').value);$('rJump').classList.remove('on');if(!n||!N)return;PG=Math.min(Math.max(1,n),N);if(SET.flip==='v')scrollToPage(PG);else draw(1)};
$('rJumpN').addEventListener('keydown',e=>{if(e.key==='Enter')$('rJumpGo').click()});
$('rDel').onclick=e=>{e.stopPropagation();if(!B)return;if(!confirm('把「'+B.title+'」從書庫移除？\n（雲端檔案不會刪掉，之後可以在「閱讀紀錄」最下面還原）'))return;const id=B.id;$('rClose').click();hideBook(id,true);render()};
/* 📝 書的精華 */
$('rOptBtn').onclick=e=>{e.stopPropagation();$('rOpts').classList.toggle('on')};
$('rSum').onclick=async()=>{if(!B)return;const box=$('sumBox'),body=$('sumBody');box.classList.add('on');
  const close='<button class="x" onclick="document.getElementById(\'sumBox\').classList.remove(\'on\')">✕</button>';
  body.innerHTML=close+'<div class="msg">讀取精華…</div>';
  try{let S=await cget('sum:'+B.id);
    if(!S){const j=await api('lib=sum&id='+B.id);if(!j.ok)throw j.error;S=j.summary;if(S)cput('sum:'+B.id,S,JSON.stringify(S).length);
      if(!S){if(!j.queued)await api('lib=sumreq&id='+B.id+'&t='+encodeURIComponent(B.title));
        body.innerHTML=close+'<h3>📝 '+esc(B.title)+'</h3><p>這本書的精華還沒生成，<b>已經排進待生成清單</b>。每天中午會自動整理，完成後再按一次「📝 精華」就看得到。</p><p style="opacity:.7;font-size:.9em">每本只生成一次，生成後存起來，之後打開不用再等。漫畫、純圖片掃描書沒有文字，可能無法生成。</p>';return}}
    const L=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
    body.innerHTML=close+'<h3>📝 '+esc(B.title)+'</h3>'+(S.oneLine?'<p><b>一句話：</b>'+esc(S.oneLine)+'</p>':'')+
      (S.keyPoints?'<h4>🔑 重點</h4>'+L(S.keyPoints):'')+(S.chapters?'<h4>📚 章節摘要</h4>'+S.chapters.map(c=>'<p><b>'+esc(c.t)+'</b>　'+esc(c.s)+'</p>').join(''):'')+
      (S.quotes?'<h4>💬 金句</h4>'+L(S.quotes):'')+(S.actions?'<h4>🛠️ 可以怎麼用</h4>'+L(S.actions):'')+'<p style="opacity:.6;font-size:.8em">AI 依書的內容整理，僅供參考・'+esc(S.at||'')+'</p>';
  }catch(e){body.innerHTML=close+'<div class="msg">讀取失敗：'+esc(e)+'</div>'}};
$('rClose').onclick=()=>{saveProg();document.querySelectorAll('.leaf,.nextVol').forEach(x=>x.remove());$('stage').onscroll=null;if(VIO)VIO.disconnect();$('reader').classList.remove('on');$('page').innerHTML='';PDF=null;IMGS=null;B=null;render()};
document.addEventListener('keydown',e=>{if(!$('reader').classList.contains('on'))return;if(e.key===' '||e.key==='ArrowDown')go(1);if(e.key==='ArrowUp')go(-1);if(e.key==='ArrowRight')go(side(1));if(e.key==='ArrowLeft')go(side(-1));if(e.key==='Escape')$('rClose').click()});
let tx=0,ty=0;
[$('stage')].forEach(el=>{
  el.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(SET.flip!=='v'&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){lastSwipe=Date.now();go(side(dx<0?1:-1))}})});
let rzT=null;window.addEventListener('resize',()=>{if(!$('reader').classList.contains('on')||SET.flip==='v')return;clearTimeout(rzT);rzT=setTimeout(()=>draw(0),300)});
start();
