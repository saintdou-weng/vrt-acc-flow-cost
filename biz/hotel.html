function loadState(){try{const raw=localStorage.getItem(STORAGE);if(raw){const d=JSON.parse(raw);if(d.schema===BACKUP_SCHEMA&&Array.isArray(d.rooms)&&Array.isArray(d.events))return d}}catch(e){console.warn('Hotel local storage:',e)}return seedDemo(defaultState())}
function persist(d){const raw=JSON.stringify(d);localStorage.setItem(STORAGE,raw);DB=d;UI.lang=d.settings.lang||'zh';return true}

function patchBetween(old,next){const patch={};for(const key of COLLECTIONS){const a=old[key]||[],b=next[key]||[],map=new Map(a.map(v=>[v.id,JSON.stringify(v)]));const put=b.filter(v=>map.get(v.id)!==JSON.stringify(v));const removed=new Set(b.map(v=>v.id));const del=a.filter(v=>!removed.has(v.id)).map(v=>v.id);if(put.length||del.length)patch[key]={put,del}}
 if(JSON.stringify(old.model)!==JSON.stringify(next.model))patch.model=clone(next.model);return patch}
function mutate(type,payload,apply,{silent=false}={}){const old=DB,d=clone(DB);const out=apply(d);const at=new Date().toISOString();const event={eventId:uid('EV'),type,at,propertyId:d.propertyId,actor:d.settings.actor||'Manager',payload:{meta:payload||{},patch:patchBetween(old,d)}};d.events.push(event);d.knownEventIds.push(event.eventId);d.syncQueue.push(event.eventId);try{persist(d)}catch(e){DB=old;throw Error(lab('本機儲存失敗，可能是照片過大或容量已滿；交易沒有寫入。','Local storage full or unavailable. Transaction was NOT saved.')+' '+e.message)}if(!silent){render();toast(lab('已儲存，稽核事件 '+event.eventId.slice(-6),'Saved; audit event '+event.eventId.slice(-6)))}return out}
function requireOk(cond,msg){if(!cond)throw Error(msg)}
function add(d,key,row){row.id=row.id||uid(key.slice(0,3).toUpperCase());row.createdAt=row.createdAt||new Date().toISOString();row.updatedAt=new Date().toISOString();d[key].push(row);return row}
function setRoom(d,roomId,status){const r=pick(d.rooms,roomId);requireOk(r,lab('房號不存在','Room not found'));r.status=status;r.updatedAt=new Date().toISOString()}
function bookRoom(data){const dateIn=data.checkIn,dateOut=data.checkOut;requireOk(dayDiff(dateIn,dateOut)>0,lab('退房日期必須晚於入住日','Check-out must be after check-in'));const room=pick(DB.rooms,data.roomId);requireOk(room,lab('請選擇房間','Select a room'));requireOk(room.status!=='OOO',lab('該房間已停售維修','Room is out of order'));requireOk(!DB.reservations.some(r=>r.roomId===room.id&&!['cancelled','noShow'].includes(r.status)&&intervals(r.checkIn,r.checkOut,dateIn,dateOut)),lab('日期與其他訂房重疊','Booking overlaps existing reservation'));
 requireOk(Number(data.rate)>0,lab('房價必須大於零','Rate must be positive'));return mutate('RESERVATION_CREATED',{room:room.number},d=>add(d,'reservations',{roomId:room.id,guest:String(data.guest||'Walk-in').trim(),source:data.source||'Direct',checkIn:dateIn,checkOut:dateOut,rate:round(data.rate),status:'confirmed',deposit:0,notes:data.notes||'',photos:[],demo:false}));}
function guestFolio(db,resId){const lines=db.folios.filter(x=>x.reservationId===resId);const payments=db.payments.filter(x=>x.reservationId===resId);return {lines,payments,charges:round(sum(lines,x=>x.amount)),paid:round(sum(payments,x=>x.amount)),balance:round(sum(lines,x=>x.amount)-sum(payments,x=>x.amount))}}
function roomActive(d,roomId){return d.reservations.find(r=>r.roomId===roomId&&r.status==='checkedIn')}
function checkIn(resId){const r=pick(DB.reservations,resId);requireOk(r&&r.status==='confirmed',lab('只能辦理已確認訂房入住','Only confirmed bookings can check in'));const room=pick(DB.rooms,r.roomId);requireOk(room&&room.status==='VC',lab('房間不是空淨 VC，不能入住','Room must be VC to check in'));requireOk(!roomActive(DB,room.id),lab('房間已有住客','Room occupied'));return mutate('CHECKIN',{reservationId:resId},d=>{pick(d.reservations,resId).status='checkedIn';setRoom(d,r.roomId,'OC')})}
function postDeposit(resId,amount,method='Cash'){requireOk(Number(amount)>0,'Deposit must be positive');return mutate('DEPOSIT',{resId,amount},d=>{add(d,'payments',{reservationId:resId,amount:round(amount),method,kind:'deposit',date:today(),demo:false})})}
function postRoomNights(d,night,ids=null){let n=0;for(const r of d.reservations){if(ids&&!ids.includes(r.id))continue;if(['cancelled','noShow'].includes(r.status)||r.checkIn>night||r.checkOut<=night)continue;if(r.status!=='checkedIn'&&r.status!=='checkedOut')continue;const exists=d.folios.some(f=>f.reservationId===r.id&&f.kind==='room'&&f.serviceDate===night&&f.amount>0);if(exists)continue;add(d,'folios',{reservationId:r.id,kind:'room',serviceDate:night,description:'Room night · '+night,amount:round(r.rate),category:'Rooms',demo:false});n++}return n}
function createCharge(resId,kind,amount,description,date=today()){requireOk(pick(DB.reservations,resId),'Reservation not found');requireOk(Number(amount)>0,'Amount must be positive');return mutate('FOLIO_CHARGE',{resId,kind,amount},d=>add(d,'folios',{reservationId:resId,kind,serviceDate:date,description,amount:round(amount),category:kind==='fb'?'F&B':'Other',demo:false}))}
function checkout(resId,paymentMethod='Cash',amount=0,tender=0){const r=pick(DB.reservations,resId);requireOk(r&&r.status==='checkedIn',lab('該訂單尚未入住或已退房','Booking is not checked in'));const method=paymentMethod;const endDate=today();return mutate('CHECKOUT',{resId,method},d=>{let serviceEnd=r.checkOut<endDate?r.checkOut:endDate;for(let date=r.checkIn;date<serviceEnd;date=dayAdd(date,1)){const closed=d.nightAudits.some(a=>a.date===date&&a.status==='posted');const already=d.folios.some(f=>f.reservationId===r.id&&(f.stayNight===date||(f.kind==='room'&&f.serviceDate===date&&f.amount>0)));if(already)continue;if(closed)add(d,'folios',{reservationId:r.id,kind:'room-adjustment',stayNight:date,serviceDate:today(),description:'Post-closed-date room adjustment · '+date,amount:round(r.rate),category:'Rooms',demo:false});else postRoomNights(d,date,[r.id])}const f=guestFolio(d,resId);requireOk(f.balance>=-.01,lab('房帳有溢付請先處理','Folio overpaid; review first'));const due=f.balance;if(due>.001){if(method==='AR'){requireOk(['Corporate','Booking','Agoda'].includes(r.source),lab('僅企業或 OTA 可掛月結','AR available to corporate / OTA bookings'));add(d,'ar',{reservationId:resId,debtor:r.source+' · '+r.guest,amount:due,paid:0,date:endDate,status:'open',demo:false});add(d,'payments',{reservationId:resId,kind:'AR-transfer',method:'AR',amount:due,date:endDate,demo:false})}else{requireOk(Number(amount)>=due-.001,lab('付款金額不足','Payment insufficient'));if(method==='Cash')requireOk(Number(tender)>=due-.001,lab('收現金不足','Cash tendered too low'));add(d,'payments',{reservationId:resId,kind:'checkout',method,amount:due,date:endDate,tender:method==='Cash'?round(tender):null,change:method==='Cash'?round(tender-due):0,demo:false})}}
 pick(d.reservations,resId).status='checkedOut';pick(d.reservations,resId).actualCheckOutAt=new Date().toISOString();setRoom(d,r.roomId,'VD');add(d,'hkTasks',{roomId:r.roomId,reservationId:resId,status:'pending',kind:'checkout',priority:'high',date:endDate,assignee:'',supplies:[],demo:false});return {due,change:method==='Cash'?round(tender-due):0}})}
function reverseFolio(lineId,reason){const l=pick(DB.folios,lineId);requireOk(l,'Entry not found');requireOk(!DB.folios.some(x=>x.reversalOf===lineId),'Already reversed');requireOk(reason?.trim(),'A reversal reason is required');return mutate('FOLIO_REVERSAL',{lineId,reason},d=>add(d,'folios',{reservationId:l.reservationId,kind:'reversal',reversalOf:lineId,serviceDate:today(),description:'Reversal: '+reason,amount:-l.amount,category:l.category,demo:false}))}
function refundPayment(id,amount,reason){const original=pick(DB.payments,id);requireOk(original&&original.amount>0&&original.method!=='AR','Only collected payments may be refunded');amount=Number(amount);const refunded=-sum(DB.payments.filter(p=>p.refundOf===id),p=>p.amount);requireOk(amount>0&&amount<=round(original.amount-refunded),'Refund exceeds original net payment');requireOk(reason?.trim(),'Refund reason required');return mutate('PAYMENT_REFUND',{paymentId:id,amount,reason},d=>add(d,'payments',{reservationId:original.reservationId||null,orderId:original.orderId||null,method:original.method,kind:'refund',refundOf:id,reason,amount:-round(amount),date:today(),demo:false}))}
function voidOrder(id,reason){const o=pick(DB.orders,id);requireOk(o&&['new','preparing','ready'].includes(o.status),'Only unserved POS orders may be voided');requireOk(reason?.trim(),'Void reason required');return mutate('POS_VOID',{orderId:id,reason},d=>{pick(d.orders,id).status='void';const original=d.folios.find(f=>f.orderId===id&&f.amount>0);requireOk(original,'Original order journal missing');add(d,'folios',{reservationId:original.reservationId,orderId:id,kind:'reversal',reversalOf:original.id,serviceDate:today(),description:'POS void: '+reason,amount:-original.amount,category:'F&B',demo:false});for(const line of o.lines){const m=pick(d.menu,line.menuId);for(const part of m.recipe||[])stockMove(d,part.itemId,null,'KITCHEN',round(part.qty*line.qty),'void-restock',id,reason)}const paid=d.payments.filter(p=>p.orderId===id&&p.amount>0);for(const p of paid)add(d,'payments',{reservationId:null,orderId:id,method:p.method,kind:'refund',refundOf:p.id,amount:-p.amount,date:today(),reason,demo:false});const cost=sum(o.lines,line=>{const m=pick(d.menu,line.menuId);return sum(m.recipe||[],z=>Number(pick(d.inventory,z.itemId)?.cost||0)*z.qty*line.qty)});if(cost>0)add(d,'expenses',{date:today(),dept:'F&B COGS',description:'POS void: '+id,amount:-round(cost),demo:false})})}
function cancelReservation(id){const r=pick(DB.reservations,id);requireOk(r?.status==='confirmed','Only confirmed bookings may be cancelled');return mutate('RESERVATION_CANCELLED',{id},d=>{pick(d.reservations,id).status='cancelled'})}
function nightAudit(date,countedCash){requireOk(date<=today(),lab('不能提前夜審未來日期','Cannot audit future date'));requireOk(!DB.nightAudits.some(a=>a.date===date&&a.status==='posted'),lab('此日期已結帳，不可重複過帳','This date was already audited'));return mutate('NIGHT_AUDIT',{date},d=>{const roomsPosted=postRoomNights(d,date);const snap=operational(d,date,date);const cash=round(sum(d.payments.filter(p=>p.date===date&&p.method==='Cash'),p=>p.amount));const difference=round(Number(countedCash)-cash);add(d,'nightAudits',{date,postedAt:new Date().toISOString(),status:'posted',roomsPosted,cashExpected:cash,cashCounted:Number(countedCash),cashDifference:difference,snapshot:snap,demo:false});return {roomsPosted,cash,difference}})}
function stockOf(item,loc){return round(Number(item.stock?.[loc]||0))}
function stockMove(d,itemId,from,to,qty,type,ref='',notes=''){const it=pick(d.inventory,itemId);requireOk(it,lab('庫存品項不存在','Item not found'));qty=Number(qty);requireOk(Number.isFinite(qty)&&qty>0,'Quantity must be positive');if(from){requireOk(stockOf(it,from)>=qty-1e-8,lab('庫存不足，禁止負庫存','Insufficient stock; negative balance blocked'));it.stock[from]=round(stockOf(it,from)-qty)}if(to){it.stock[to]=round(stockOf(it,to)+qty)}it.updatedAt=new Date().toISOString();add(d,'movements',{itemId,from:from||'EXTERNAL',to:to||'CONSUMED',qty,unit:it.unit,type,ref,notes,date:today(),demo:false});}
function moveStock(itemId,from,to,qty,type='transfer',notes=''){requireOk(from!==to,'Locations must be different');return mutate('STOCK_'+type.toUpperCase(),{itemId,qty,from,to},d=>stockMove(d,itemId,from,to,qty,type,'',notes))}
function consumeRecipe(d,menuId,qty,ref){const m=pick(d.menu,menuId);requireOk(m,'Menu item not found');let cost=0;for(const ingredient of m.recipe||[]){const inv=pick(d.inventory,ingredient.itemId);requireOk(inv,'BOM item missing');const needed=round(ingredient.qty*qty);requireOk(stockOf(inv,'KITCHEN')>=needed-1e-8,lab('廚房原料不足：','Insufficient ingredient: ')+(inv.name||inv.id));cost+=needed*Number(inv.cost||0)}for(const ingredient of m.recipe||[]){const inv=pick(d.inventory,ingredient.itemId);stockMove(d,inv.id,'KITCHEN',null,round(ingredient.qty*qty),'bom',ref,'POS recipe')}return round(cost)}
function makeOrder(payload){requireOk(Array.isArray(payload.lines)&&payload.lines.length>0,'Cart is empty');const source=payload.method||'Cash';if(source==='ROOM'){const r=pick(DB.reservations,payload.reservationId);requireOk(r?.status==='checkedIn','A checked-in room must be selected')}return mutate('POS_ORDER',{method:source,lines:payload.lines.length},d=>{const lines=payload.lines.map(x=>{const m=pick(d.menu,x.menuId);requireOk(m&&Number(x.qty)>0,'Invalid item');return {menuId:m.id,name:m.name,qty:Number(x.qty),price:round(m.price),custom:String(x.custom||'').slice(0,200),station:m.station||'Kitchen'}});const total=round(sum(lines,x=>x.qty*x.price));const order=add(d,'orders',{date:today(),status:'new',method:source,reservationId:payload.reservationId||null,lines,total,station:lines.some(x=>x.station==='Kitchen')?'Kitchen':'Bar',demo:false});let cost=0;for(const x of lines)cost+=consumeRecipe(d,x.menuId,x.qty,order.id);cost=round(cost);if(source==='ROOM'){add(d,'folios',{reservationId:order.reservationId,kind:'fb',orderId:order.id,serviceDate:today(),description:'POS '+order.id+' · '+lines.map(z=>z.name).join(', '),amount:total,category:'F&B',demo:false})}else{add(d,'folios',{reservationId:null,kind:'fb',orderId:order.id,serviceDate:today(),description:'POS '+order.id,amount:total,category:'F&B',demo:false});add(d,'payments',{reservationId:null,orderId:order.id,kind:'pos',method:source,amount:total,date:today(),demo:false})}if(cost>0)add(d,'expenses',{date:today(),dept:'F&B COGS',description:'BOM consumption '+order.id,amount:cost,demo:false});return {id:order.id,total,cost}})}
function setOrderStatus(id,status){const o=pick(DB.orders,id);requireOk(o,'Order not found');const next={new:['preparing'],preparing:['ready'],ready:['served'],served:[],void:[]};requireOk((next[o.status]||[]).includes(status),'KDS status cannot move backwards or change a served ticket');return mutate('KDS_STATUS',{id,status},d=>{pick(d.orders,id).status=status})}
function hkStart(id,assignee){const h=pick(DB.hkTasks,id);requireOk(h&&h.status==='pending','Task must be pending');return mutate('HK_STARTED',{id},d=>{let a=pick(d.hkTasks,id);a.status='cleaning';a.assignee=assignee||'HK';setRoom(d,a.roomId,a.kind==='checkout'?'VD':'OD')})}
function hkFinish(id){const h=pick(DB.hkTasks,id);requireOk(h&&h.status==='cleaning','Task must be in cleaning');return mutate('HK_READY_INSPECTION',{id},d=>{pick(d.hkTasks,id).status='inspection';const r=pick(d.rooms,h.roomId);setRoom(d,r.id,h.kind==='checkout'?'VI':'OD')})}
function hkApprove(id,supplies=[]){const h=pick(DB.hkTasks,id);requireOk(h&&h.status==='inspection','Task must await inspection');return mutate('HK_APPROVED',{id},d=>{for(const x of supplies){if(Number(x.qty)>0)stockMove(d,x.itemId,'FLOOR',null,Number(x.qty),'housekeeping',id)}pick(d.hkTasks,id).status='done';pick(d.hkTasks,id).completedAt=new Date().toISOString();setRoom(d,h.roomId,roomActive(d,h.roomId)?'OC':'VC')})}
function postMinibar(roomId,itemId,qty,unitPrice){const r=roomActive(DB,roomId);requireOk(r,'No occupied room to charge');requireOk(Number(qty)>0&&Number(unitPrice)>0,'Invalid qty or price');return mutate('MINIBAR_CONSUME',{roomId,itemId,qty},d=>{const it=pick(d.inventory,itemId);stockMove(d,itemId,'FLOOR',null,qty,'minibar',r.id);add(d,'folios',{reservationId:r.id,kind:'minibar',serviceDate:today(),description:'MiniBar: '+it.name,amount:round(qty*unitPrice),category:'Other',demo:false})})}
function createRepair(data){requireOk(data.location||data.roomId,'Location required');return mutate('WORK_ORDER_CREATED',{location:data.location},d=>{const m=add(d,'repairs',{roomId:data.roomId||null,location:data.location||'',issue:data.issue||'General repair',priority:data.priority||'normal',assignee:data.assignee||'',status:'open',cost:0,lockRoom:!!data.lockRoom,date:today(),photos:[],demo:false});if(m.lockRoom&&m.roomId)setRoom(d,m.roomId,'OOO');return m})}
function closeRepair(id,cost,notes){const r=pick(DB.repairs,id);requireOk(r&&r.status!=='done','Repair already closed or missing');requireOk(Number(cost)>=0,'Invalid cost');return mutate('WORK_ORDER_CLOSED',{id,cost},d=>{const x=pick(d.repairs,id);x.status='done';x.cost=round(cost);x.resolution=notes||'';x.closedAt=new Date().toISOString();if(x.lockRoom&&x.roomId){const room=pick(d.rooms,x.roomId);setRoom(d,x.roomId,roomActive(d,room.id)?'OC':'VD')}if(x.cost>0)add(d,'expenses',{date:today(),dept:'POM',description:'Repair '+id,amount:x.cost,demo:false})})}
function createPO(data){const it=pick(DB.inventory,data.itemId);requireOk(it,'Item not found');requireOk(Number(data.qty)>0&&Number(data.unitCost)>=0,'Invalid PO qty or price');return mutate('PO_CREATED',{itemId:data.itemId},d=>add(d,'purchaseOrders',{itemId:data.itemId,qty:Number(data.qty),receivedQty:0,unitCost:Number(data.unitCost),supplier:data.supplier||'Supplier',status:'ordered',date:today(),demo:false}))}
function receivePO(id,qty,temp,expiry,invoice){const po=pick(DB.purchaseOrders,id);requireOk(po&&po.status!=='closed','PO not active');qty=Number(qty);requireOk(qty>0&&qty<=round(po.qty-po.receivedQty),'Receipt exceeds remaining PO');const it=pick(DB.inventory,po.itemId);if(it.category==='Food'){requireOk(expiry&&expiry>=today(),'Food expiry must be valid');if(temp!==''&&temp!=null)requireOk(Number(temp)<=8&&Number(temp)>=-25,'Cold-chain temperature outside acceptable configured sample range (-25 to 8 C)')}return mutate('PO_RECEIPT',{id,qty},d=>{const p=pick(d.purchaseOrders,id);const received=add(d,'receipts',{poId:id,itemId:po.itemId,qty,temp:temp===''?null:Number(temp),expiry:expiry||'',invoiceRef:invoice||'',unitCost:p.unitCost,date:today(),iqc:'accepted',demo:false});stockMove(d,po.itemId,null,'MAIN',qty,'receiving',received.id);p.receivedQty=round(p.receivedQty+qty);p.status=p.receivedQty>=p.qty?'received':'partial';add(d,'ap',{poId:id,receiptId:received.id,supplier:p.supplier,invoiceRef:invoice||'',amount:round(qty*p.unitCost),paid:0,status:'pending-match',date:today(),demo:false});return received})}
function approveAP(id){const a=pick(DB.ap,id);requireOk(a?.status==='pending-match','AP cannot be approved');requireOk(pick(DB.receipts,a.receiptId)&&pick(DB.purchaseOrders,a.poId),'Missing PO or receipt');requireOk(!!a.invoiceRef?.trim(),'Invoice required for 3-way match');return mutate('AP_APPROVED',{id},d=>{pick(d.ap,id).status='approved'})}
function payAP(id,amt,method){const a=pick(DB.ap,id);amt=Number(amt);requireOk(a&&['approved','partial'].includes(a.status),'AP not approved');requireOk(amt>0&&amt<=round(a.amount-a.paid),'Payment exceeds outstanding');return mutate('AP_PAYMENT',{id,amt},d=>{const x=pick(d.ap,id);x.paid=round(x.paid+amt);x.status=x.paid>=x.amount?'paid':'partial';x.lastPaymentMethod=method;x.lastPaymentAt=new Date().toISOString();add(d,'payments',{reservationId:null,apId:id,method,kind:'ap-payment',amount:-amt,date:today(),demo:false})})}
function collectAR(id,amt,method){const a=pick(DB.ar,id);amt=Number(amt);requireOk(a&&a.status!=='paid','AR missing or paid');requireOk(amt>0&&amt<=round(a.amount-a.paid),'Collection exceeds outstanding');return mutate('AR_COLLECTION',{id,amt},d=>{const x=pick(d.ar,id);x.paid=round(x.paid+amt);x.status=x.paid>=x.amount?'paid':'partial';x.method=method;x.lastCollectionAt=new Date().toISOString();add(d,'payments',{reservationId:null,arId:id,method,kind:'ar-collection',amount:amt,date:today(),demo:false})})}
function punch(staffId,mode){const s=pick(DB.staff,staffId);requireOk(s,'Staff not found');if(mode==='in')requireOk(!DB.punches.some(p=>p.staffId===staffId&&p.date===today()&&!p.out),'Already clocked in');if(mode==='out')requireOk(DB.punches.some(p=>p.staffId===staffId&&p.date===today()&&!p.out),'Not clocked in');return mutate('CLOCK_'+mode.toUpperCase(),{staffId},d=>{if(mode==='in')add(d,'punches',{staffId,date:today(),in:new Date().toISOString(),out:null,hours:0,demo:false});else{const p=d.punches.filter(p=>p.staffId===staffId&&p.date===today()&&!p.out).at(-1);p.out=new Date().toISOString();p.hours=round(Math.max(0,(new Date(p.out)-new Date(p.in))/3600000))}})}
function periodRange(mode=UI.period,date=UI.date){const year=Number(date.slice(0,4)),month=Number(date.slice(5,7));if(mode==='D')return {start:date,end:dayAdd(date,1),label:date};if(mode==='W'){const dow=(new Date(date+'T12:00:00').getDay()+6)%7,start=dayAdd(date,-dow);return {start,end:dayAdd(start,7),label:start+' ~ '+dayAdd(start,6)}}if(mode==='M'){const start=year+'-'+String(month).padStart(2,'0')+'-01';return {start,end:month===12?(year+1)+'-01-01':year+'-'+String(month+1).padStart(2,'0')+'-01',label:date.slice(0,7)}}return {start:year+'-01-01',end:(year+1)+'-01-01',label:String(year)}}

function operational(d,start,end){let charges=d.folios.filter(x=>x.serviceDate>=start&&x.serviceDate<end);let roomRevenue=round(sum(charges.filter(x=>x.category==='Rooms'),x=>x.amount));let fbRevenue=round(sum(charges.filter(x=>x.category==='F&B'),x=>x.amount));let otherRevenue=round(sum(charges.filter(x=>x.category==='Other'),x=>x.amount));let roomNights=sum(charges.filter(x=>x.kind==='room'&&x.amount>0),()=>1);let dcount=dayDiff(start,end),rooms=d.rooms.length;const unavailable=d.rooms.filter(r=>r.status==='OOO').length;const avail=Math.max(0,rooms*dcount-(end>today()&&start<=today()?unavailable:0));const occ=avail?roomNights/avail:0;const adr=roomNights?roomRevenue/roomNights:0;const revpar=avail?roomRevenue/avail:0;const expenses=d.expenses.filter(x=>inRange(x.date,{start,end}));const roomsCost=round(sum(expenses.filter(x=>x.dept==='Rooms'),x=>x.amount));const foodCost=round(sum(expenses.filter(x=>x.dept==='F&B COGS'),x=>x.amount));const foodOps=round(sum(expenses.filter(x=>x.dept==='F&B Ops'),x=>x.amount));const pom=round(sum(expenses.filter(x=>x.dept==='POM'),x=>x.amount));const admin=round(sum(expenses.filter(x=>x.dept==='Admin'),x=>x.amount));const utility=round(sum(expenses.filter(x=>x.dept==='Utilities'),x=>x.amount));const gop=round(roomRevenue+fbRevenue+otherRevenue-roomsCost-foodCost-foodOps-pom-admin-utility);return {roomRevenue,fbRevenue,otherRevenue,roomNights,avail,occ,adr,revpar,roomsCost,foodCost,foodOps,pom,admin,utility,gop,totalRevenue:round(roomRevenue+fbRevenue+otherRevenue)}}
function kpi(){const p=periodRange();return operational(DB,p.start,p.end)}
function hotelModel(m){const rooms=Number(m.rooms||0),occ=Number(m.occ||0),adr=Number(m.adr||0),ratio=Number(m.fnbRatio||0),margin=Number(m.fnbMargin||0);const roomSales=rooms*30*occ*adr,fbSales=roomSales*ratio,fbProfit=fbSales*margin,fixed=Number(m.staff||0)+Number(m.utilities||0)+Number(m.rent||0)+Number(m.other||0),gop=roomSales+fbProfit-fixed,occupancyBE=(rooms*30*adr*(1+ratio*margin))?fixed/(rooms*30*adr*(1+ratio*margin)):Infinity;return {roomSales:round(roomSales),fbSales:round(fbSales),gop:round(gop),fixed:round(fixed),occupancyBE,payback:gop>0?Number(m.capex||0)/gop:Infinity}}

function applyRemoteEvents(events){requireOk(Array.isArray(events),'Invalid cloud response');const d=clone(DB);const known=new Set(d.knownEventIds);let count=0;for(const ev of events){if(!ev?.eventId||known.has(ev.eventId)||ev.propertyId!==d.propertyId)continue;const patch=ev.payload?.patch||{};for(const key of COLLECTIONS){const p=patch[key];if(!p)continue;for(const id of p.del||[])d[key]=d[key].filter(x=>x.id!==id);for(const row of p.put||[]){const current=pick(d[key],row.id);if(current){if((row.updatedAt||row.createdAt||ev.at)>=(current.updatedAt||current.createdAt||''))Object.assign(current,row)}else d[key].push(row)}}if(patch.model)d.model=patch.model;known.add(ev.eventId);d.knownEventIds.push(ev.eventId);d.events.push(ev);count++}persist(d);render();return count}

function toCSV(rows){if(!rows.length)return 'id\n';const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];return '\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>csvCell(r[k])).join(','))].join('\r\n')}
function parseCSV(csv){const rows=[];let q=false,cell='',row=[];csv=csv.replace(/^\ufeff/,'');for(let i=0;i<csv.length;i++){const ch=csv[i];if(ch==='"'){if(q&&csv[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\r'||ch==='\n')&&!q){if(ch==='\n'&&csv[i-1]==='\r')continue;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(q)throw Error('Unclosed CSV quotation');const header=rows.shift()||[];return rows.map(a=>Object.fromEntries(header.map((h,j)=>[h,a[j]??''])))}

function updateDetailScroll(){const d=UI.details;if(!d)return;const body=$('detailBody'),children=[...body.querySelectorAll('.record-slide')];const pos=body.getBoundingClientRect().top+40;let curr=d.index;for(const x of children){if(x.getBoundingClientRect().top<=pos)curr=Number(x.dataset.slide)}if(curr!==d.index){d.index=curr;const r=pick(DB[d.collection],d.ids[curr]);$('detailTitle').textContent=(r.number||r.guest||r.name||r.id)+(r.demo?' · DEMO':'');$('detailCount').textContent=curr+1+' / '+d.ids.length;$('detailPrev').disabled=curr===0;$('detailNext').disabled=curr===d.ids.length-1}const end=Number(children.at(-1)?.dataset.slide||0),start=Number(children[0]?.dataset.slide||0);if(d.index>=end-3&&end<d.ids.length-1){let html='';for(let j=end+1;j<Math.min(d.ids.length,end+16);j++){const r=pick(DB[d.collection],d.ids[j]);html+='<article class="record-slide" data-slide="'+j+'"><div class="panel-head"><h3>'+xss(r.number||r.guest||r.name||r.id)+' '+demoMarker(r)+'</h3><small>'+(j+1)+' / '+d.ids.length+'</small></div>'+detailData(d.collection,r,UI.detailTab)+'</article>'}body.insertAdjacentHTML('beforeend',html)}if(d.index<=start+2&&start>0){const oldHeight=body.scrollHeight;let html='';for(let j=Math.max(0,start-14);j<start;j++){const r=pick(DB[d.collection],d.ids[j]);html+='<article class="record-slide" data-slide="'+j+'"><div class="panel-head"><h3>'+xss(r.number||r.guest||r.name||r.id)+' '+demoMarker(r)+'</h3><small>'+(j+1)+' / '+d.ids.length+'</small></div>'+detailData(d.collection,r,UI.detailTab)+'</article>'}body.insertAdjacentHTML('afterbegin',html);body.scrollTop+=body.scrollHeight-oldHeight}}
function renderCAP100(){const budget=sum(DB.capex,x=>x.budget),actual=sum(DB.capex,x=>x.actual);const gap=round(actual-budget);const actions=btn('＋ '+lab('新增成本項目','Add expense budget'),'newCapex',null,'primary');let body=`<div class="grid g3">${metric(lab('預算','Budget'),money(budget))}${metric(lab('實支','Actual'),money(actual))}${metric(lab('差異','Variance'),money(gap)+' ('+(budget?num(gap/budget*100):0)+'%)')}</div><div class="note" style="margin:12px 0">${lab('CAPEX 為投資與開辦費追蹤，不直接當成當期 GOP 費用。','CAPEX is an investment tracker; it is not automatically deducted from period GOP.')}</div>`+listData('capex',DB.capex,{toolbar:actions,title:r=>r.name,subtitle:r=>r.category+' · '+money(r.actual)+' / '+money(r.budget),extra:r=>`<span class="badge ${r.actual>r.budget?'red':'green'}">${r.actual>r.budget?'Over':'Within'}</span>`,columns:[['name','項目','Description'],['category','分類','Category'],[x=>money(x.budget),'預算','Budget'],[x=>money(x.actual),'實支','Actual'],[x=>x.budget?num(100*(x.actual-x.budget)/x.budget)+'%':'—','差異率','Variance']]});return panel('W_CAP100 · '+lab('開辦預算與實支追蹤','Opening Budget & Actual'),body)}
function renderCAP110(){const m=DB.model,x=hotelModel(m),pct=v=>num(v*100)+'%';return panel('W_CAP110 · '+lab('酒店開辦／營運財務模型','Hotel Financial Model'),`<div class="note">${lab('模型使用輸入假設推估，與實際帳務 KPI 分開。GOP = 房費收入 + 餐飲毛利 − 經常性固定費；不含融資與稅負。','Scenario simulation, separate from posted transactions. GOP = room revenue + F&B gross profit - operating fixed cost, before finance/taxes.')}</div><div class="grid g4" style="margin:12px 0">${metric('Room sales / 月',money(x.roomSales))}${metric('F&B sales / 月',money(x.fbSales))}${metric('GOP / 月',money(x.gop))}${metric(lab('損益兩平住房率','Break-even OCC'),Number.isFinite(x.occupancyBE)?pct(x.occupancyBE):'—')}${metric(lab('預估回本月數','Payback (months)'),Number.isFinite(x.payback)?num(x.payback):'—')}${metric(lab('每月固定費','Fixed overhead'),money(x.fixed))}</div><form id="modelForm" class="form-grid">${[['rooms','房數','Rooms',1],['occ','住房率 0~1','OCC 0-1',.01],['adr','日均房價','ADR',.01],['fnbRatio','餐飲／房費營收比例','F&B/room revenue',.01],['fnbMargin','餐飲毛利率 0~1','F&B gross margin',.01],['staff','月人事成本','Monthly payroll',.01],['utilities','月水電','Monthly utilities',.01],['rent','月租金','Monthly rent',.01],['other','其他固定費','Other fixed costs',.01],['capex','總投資','Total investment',.01]].map(([k,zh,en,step])=>`<label class="field"><span>${xss(lab(zh,en))}</span><input type="number" name="${k}" value="${xss(m[k])}" step="${step}" min="0" required></label>`).join('')}<div class="field wide"><button class="btn primary" type="submit">${lab('更新模型試算','Recalculate model')}</button></div></form>`)}
function renderRoomRack(){const labels={VC:['空淨','Vacant Clean'],VD:['空髒','Vacant Dirty'],VI:['待查','Inspection'],OC:['住淨','Occupied Clean'],OD:['住髒','Occupied Dirty'],OOO:['停售','Out of Order']},counts={};for(const r of DB.rooms)counts[r.status]=(counts[r.status]||0)+1;const grid=`<div class="rack">${DB.rooms.map(r=>`<button class="room ${r.status}" data-open="rooms" data-id="${r.id}"><strong>${xss(r.number)}</strong><small>${xss(r.type)}</small><b>${xss(lab(...(labels[r.status]||[r.status,r.status])))}</b></button>`).join('')}</div>`;return panel('W_PMS200 · '+lab('即時房態矩陣','Live Room Rack'),`<div class="toolbar">${Object.entries(labels).map(([k,v])=>`<span class="badge ${['OOO','VD','OD'].includes(k)?'red':'green'}">${k} ${xss(lab(...v))} ${counts[k]||0}</span>`).join('')}${btn('＋ '+lab('新增房間','New room'),'newRoom',null,'primary')}</div>${grid}<p class="sub" style="margin:10px 0">${lab('點擊房間，可訂房／入住、查看住客及房帳、派房務或報修。','Tap a room to book/check in, view folio, dispatch housekeeping or open repair.')}</p>${listData('rooms',DB.rooms,{title:r=>'Room '+r.number,subtitle:r=>r.type+' · '+r.status+' · '+money(r.rate),icon:r=>r.status==='OOO'?'🔧':'🚪',columns:[['number','房號','Room'],['type','房型','Type'],['status','狀態','State'],[r=>money(r.rate),'房價','Rate']]})}`)}

function renderFIN(){const p=periodRange(),x=kpi(),r=(name,value,strong=false)=>`<div class="listrow"><span>${xss(name)}</span><b class="amount" style="${strong?'color:#176c61;font-size:16px':''}">${money(value)}</b></div>`;const ar=DB.ar.filter(a=>a.status!=='paid'||inRange(a.date,p));const ap=DB.ap.filter(a=>a.status!=='paid'||inRange(a.date,p));const months=UI.period==='M'?1:UI.period==='Y'?12:Math.max(1,dayDiff(p.start,p.end)/30),depreciation=round(sum(DB.assets,a=>a.cost/(Math.max(.1,a.lifeYears||5)*12)*months));return panel('W_FIN700 · '+lab('USALI 部門報表／AR／AP／固定資產','USALI-style Finance, AR, AP & Assets'),`<div class="note">${lab('此報表為 USALI 部門損益架構的管理版，不是經審計的正式財報。收入以已過帳房帳／POS 為準，押金與 AR 收款不重複計收入；折舊列 GOP 下方。','Management P&L using USALI departmental layout, not audited statements. Posted folio/POS charges are revenues; deposits and AR collections are not recognized again. Depreciation is below GOP.')}</div><div class="grid g4" style="margin-top:12px">${metric('OCC',num(x.occ*100)+'%')}${metric('ADR',money(x.adr))}${metric('RevPAR',money(x.revpar))}${metric('GOP',money(x.gop))}</div><div class="grid g2" style="margin-top:12px"><section class="panel"><h3>${lab('USALI 風格損益表','USALI-style Operating Statement')}</h3>${r(lab('客房收入','Rooms Revenue'),x.roomRevenue)}${r(lab('客房部費用','Rooms Expenses'),-x.roomsCost)}${r(lab('客房部門利潤','Rooms Department Profit'),x.roomRevenue-x.roomsCost,true)}${r(lab('餐飲收入','F&B Revenue'),x.fbRevenue)}${r(lab('原物料成本','F&B Cost of Sales'),-x.foodCost)}${r(lab('餐飲營運費','F&B Operating Expenses'),-x.foodOps)}${r(lab('餐飲部門利潤','F&B Department Profit'),x.fbRevenue-x.foodCost-x.foodOps,true)}${r(lab('其他收入','Other Revenue'),x.otherRevenue)}${r(lab('行政管理','Admin'),-x.admin)}${r(lab('工程維修','Property Operations'),-x.pom)}${r(lab('水電能源','Utilities'),-x.utility)}<hr style="border:0;border-top:1px solid #c8d7df;margin:10px 0">${r('GOP',x.gop,true)}${r(lab('折舊估算 (GOP 以下)','Estimated Depreciation below GOP'),-depreciation)}${r(lab('折舊後營業結果（未含稅／利息）','Post-depreciation result before tax/finance'),x.gop-depreciation,true)}</section><section class="panel"><h3>${lab('現金流與應收應付','Collections & Outstanding')}</h3>${r('AR '+lab('尚未收回','Outstanding'),sum(DB.ar,a=>a.amount-a.paid))}${r('AP '+lab('尚未支付','Outstanding'),sum(DB.ap,a=>a.amount-a.paid))}${r(lab('當期現金收款','Cash collected'),sum(DB.payments.filter(x=>inRange(x.date,p)&&x.method==='Cash'),x=>x.amount))}${r(lab('當期銀行／電子收款','Bank / Digital collected'),sum(DB.payments.filter(x=>inRange(x.date,p)&&!['Cash','AR'].includes(x.method)),x=>x.amount))}<div class="toolbar" style="margin-top:16px">${btn('＋ '+lab('記錄營業費用','Post operating expense'),'newExpense',null,'primary')}${btn('＋ FF&E '+lab('資產','Asset'),'newAsset')}</div><p class="sub">${lab('採購驗收進 AP，不自動等同期間費用；實際成本依耗用或分攤費用分錄認列。','PO/receipt accrues AP, not automatically a period expense. Operating costs are recognized on use or allocation.')}</p></section></div><div class="grid g2"><section class="panel"><div class="panel-head"><h3>AR · ${lab('企業／OTA 月結','Corporate / OTA')}</h3>${btn('CSV','csvExport','ar','small')}</div>${ar.slice(-30).reverse().map(a=>`<div class="listrow"><span><b>${xss(a.debtor)} ${demoMarker(a)}</b><small>${xss(a.status)} · ${xss(a.date)}</small></span><div class="text-right"><b class="amount">${money(a.amount-a.paid)}</b><div>${a.status!=='paid'?btn(lab('收款','Collect'),'arCollect',a.id,'small'):''}</div></div></div>`).join('')||'<p class="note">'+t('empty')+'</p>'}</section><section class="panel"><div class="panel-head"><h3>AP · ${lab('供應商三方核對','Three-way match')}</h3>${btn('CSV','csvExport','ap','small')}</div>${ap.slice(-30).reverse().map(a=>`<div class="listrow"><span><b>${xss(a.supplier)} ${demoMarker(a)}</b><small>${xss(a.status)} · ${xss(a.invoiceRef||'No invoice')}</small></span><div class="text-right"><b class="amount">${money(a.amount-a.paid)}</b><div>${a.status==='pending-match'?btn(lab('核對','Match'),'apApprove',a.id,'small'):a.status!=='paid'?btn(lab('付款','Pay'),'apPay',a.id,'small'):''}</div></div></div>`).join('')||'<p class="note">'+t('empty')+'</p>'}</section></div><section class="panel"><div class="panel-head"><h3>FF&E · ${lab('固定資產清冊','Fixed Asset Register')}</h3>${btn('CSV','csvExport','assets','small')} ${btn(lab('新增','Add'),'newAsset',null,'small primary')}</div>${listData('assets',DB.assets,{title:x=>x.name,subtitle:x=>x.location+' · '+money(x.cost),extra:x=>num(x.lifeYears)+' '+lab('年','years'),icon:()=>'🪑',columns:[['name','資產名稱','Asset'],['category','分類','Category'],[x=>money(x.cost),'取得成本','Cost'],['purchaseDate','日期','Date'],['lifeYears','年限','Useful life']]})}</section><section class="panel"><h3>${lab('本期費用流水','Expense Journal')}</h3>${DB.expenses.filter(x=>inRange(x.date,p)).slice(-20).reverse().map(x=>`<div class="listrow"><span><b>${xss(x.description)} ${demoMarker(x)}</b><small>${xss(x.date)} · ${xss(x.dept)}</small></span><b>${money(x.amount)}</b></div>`).join('')}${btn('CSV '+lab('費用匯出','Expenses CSV'),'csvExport','expenses')}</section>`)}
function renderCFG(){const s=DB.settings;return panel('W_CFG900 · '+lab('系統設定／備份／雲端／稽核','Configuration, Backup, Cloud & Audit'),`<div class="note warn">${lab('第一階段為單檔離線優先。雲端按鈕已有事件佇列與請求引擎，但第二階段 GAS 尚未提供前，不會宣稱同步成功。請勿在共用電腦儲存真實護照、證件或銀行卡資料。','Phase 1 is offline-first. Sync events and requests are implemented, but no cloud sync is claimed until the Phase 2 GAS backend exists. Do not keep real ID documents or payment cards on shared devices.')}</div><div class="grid g2" style="margin-top:12px"><section class="panel"><h3>${lab('酒店與前端設定','Property & client settings')}</h3><form id="configForm" class="form-grid">${[['propertyName','物業名稱','Property name',DB.propertyName],['propertyId','物業 ID','Property ID',DB.propertyId],['actor','操作員','Actor name',s.actor],['gasUrl','GAS Web App URL','GAS Web App URL',s.gasUrl],['syncKey','Sync Key（本機儲存）','Sync key (local only)',s.syncKey],['photoLabel','圖片浮水印','Photo watermark',s.photoLabel]].map(x=>`<label class="field ${['gasUrl','syncKey'].includes(x[0])?'wide':''}"><span>${xss(lab(x[1],x[2]))}</span><input type="${x[0]==='syncKey'?'password':'text'}" name="${x[0]}" value="${xss(x[3])}" autocomplete="off"></label>`).join('')}<div class="field wide"><button type="submit" class="btn primary">${t('save')}</button></div></form></section><section class="panel"><h3>${lab('雲端事件佇列','Cloud event sync')}</h3><div class="grid g2" style="margin:12px 0">${metric(lab('待上傳事件','Queue'),DB.syncQueue.length)}${metric(lab('本機稽核事件','Audit events'),DB.events.length)}</div><p class="sub">${lab('最後成功同步','Last confirmed sync')}: ${xss(DB.lastSyncAt||'—')}</p><div class="toolbar" style="margin-top:12px">${btn(t('syncUp'),'cloudUp',null,'primary')}${btn(t('syncDown'),'cloudDown')}</div><p class="note">${lab('後端預定使用 POST JSON：push 回覆 acknowledged IDs，pull 回覆 events。所有新增／修改產生 eventId，可離線累積並避免重複套用。','Expected GAS POST JSON: push returns acknowledged IDs, pull returns events. Mutations queue eventId; pull de-duplicates.')} </p></section></div><div class="grid g2"><section class="panel"><h3>${lab('完整備份／還原','Full JSON backup & restore')}</h3><div class="toolbar" style="margin:12px 0">${btn('🧪 '+lab('一條龍測試腳本','Core E2E test guide'),'testGuide')} ${btn('⬇ JSON '+lab('完整備份','Full backup'),'backup',null,'primary')}${btn('⬆ JSON '+lab('還原','Restore'),'restore')}</div><p class="note">${lab('照片、全部交易、庫存、Demo、稽核事件一併備份。還原前會下載舊版備份。','Photos, every transaction, stock, demo and audit events are included. A pre-restore backup is saved first.')}</p></section><section class="panel"><h3>${lab('示範資料與稽核','Demo data & audit trail')}</h3><div class="grid g2">${metric('DEMO '+lab('客房','rooms'),DB.rooms.filter(x=>x.demo).length)}${metric(lab('資料總筆數','Records'),sum(COLLECTIONS,k=>DB[k]?.length||0))}</div><div class="toolbar" style="margin-top:12px">${btn('🧽 '+lab('安全清除 DEMO','Safely clear DEMO'),'clearDemo',null,'danger')}${btn('CSV '+lab('稽核匯出','Audit CSV'),'auditExport')}</div><p class="sub">${lab('已被正式紀錄引用的 DEMO 主檔不能直接刪除。','Demo records linked to live transactions are protected.')}</p></section></div><section class="panel"><div class="panel-head"><h3>${lab('CSV 匯入待覆核','CSV import staging')}</h3>${btn('CSV '+lab('清單匯出','Export staging'),'csvExport','importBatches','small')}</div>${DB.importBatches.slice(-20).reverse().map(x=>`<div class="listrow"><span><b>${xss(x.collection)} · ${xss(x.filename)} ${demoMarker(x)}</b><small>${xss(x.date)} · ${x.rows.length} rows · ${xss(x.status)}</small></span>${btn(lab('查看','Preview'),'showImport',x.id,'small')}</div>`).join('')||'<p class="note">'+t('empty')+'</p>'}<p class="note" style="margin-top:10px">${lab('可直接匯入安全主檔；交易類 CSV 只進待覆核區，不會繞過結帳、庫存或會計過帳規則。','Safe master records can import directly; transaction CSV goes to staging, not bypassing cash, stock or ledger posting rules.')}</p></section><section class="panel"><h3>${lab('最近稽核事件','Recent audit events')}</h3>${DB.events.slice(-15).reverse().map(x=>`<div class="listrow"><span><b>${xss(x.type)}</b><small>${xss(x.actor)} · ${xss(x.at)}</small></span><small>${xss(x.eventId.slice(-10))}</small></div>`).join('')||'<p class="note">'+t('empty')+'</p>'}</section>`)}
const RENDERERS={W_CAP100:renderCAP100,W_CAP110:renderCAP110,W_PMS200:renderRoomRack,W_PMS210:renderReservations,W_PMS220:renderFolio,W_PMS230:renderNightAudit,W_HKE300:renderHousekeeping,W_HKE310:renderMaintenance,W_FNB400:renderPOS,W_FNB410:renderKDS,W_SCM500:renderInventory,W_SCM510:renderSCM,W_HR600:renderHR,W_FIN700:renderFIN,W_CFG900:renderCFG};
function render(){renderHeader();hero();$('workspace').innerHTML=(RENDERERS[UI.module]||renderRoomRack)();renderDrawer();const ms=$('modelForm');if(ms)ms.onsubmit=e=>{e.preventDefault();guarded(()=>{const values=Object.fromEntries(new FormData(ms).entries());for(const k of Object.keys(values))values[k]=Number(values[k]);requireOk(values.occ<=1&&values.occ>=0&&values.fnbMargin>=0&&values.fnbMargin<=1,'Rates must be between 0 and 1');mutate('HOTEL_MODEL_UPDATED',{model:values},d=>{d.model=values})})};const cf=$('configForm');if(cf)cf.onsubmit=e=>{e.preventDefault();guarded(()=>{const raw=Object.fromEntries(new FormData(cf).entries());requireOk(/^[A-Za-z0-9_-]{2,50}$/.test(raw.propertyId),'Property ID: 2-50 ASCII letters, digits, _ or -');if(raw.gasUrl)requireOk(/^https:\/\/script\.google\.com\/macros\/s\//.test(raw.gasUrl),'Only Google Apps Script Web App URLs accepted');const d=clone(DB);d.propertyName=raw.propertyName||'Boutique Hotel';d.propertyId=raw.propertyId;Object.assign(d.settings,{actor:raw.actor,gasUrl:raw.gasUrl,syncKey:raw.syncKey,photoLabel:raw.photoLabel});persist(d);render();toast(lab('設定已儲存於本機','Settings saved locally'))})};const s=$('activeSearch');if(s)s.oninput=e=>{UI.search=e.target.value;const pos=e.target.selectionStart;render();const x=$('activeSearch');x?.focus();x?.setSelectionRange(pos,pos)}}
function safeMasterImport(col,rows){requireOk(rows.length<=1000,'Max 1000 CSV rows');if(!CAN_IMPORT.has(col)||['reservations','repairs','hkTasks','purchaseOrders','shifts'].includes(col))return mutate('CSV_STAGED',{collection:col,count:rows.length},d=>add(d,'importBatches',{collection:col,rows:rows.slice(0,1000),filename:UI.importTarget?.filename||'import.csv',date:today(),status:'awaiting-review',demo:false}));
 return mutate('CSV_MASTER_IMPORT',{collection:col,count:rows.length},d=>{const known=new Set(d[col].map(x=>x.id));for(const raw of rows){const obj={};for(const [k,v] of Object.entries(raw)){if(['id','demo','createdAt','updatedAt'].includes(k))continue;try{obj[k]=v?.trim()?.startsWith('{')||v?.trim()?.startsWith('[')?JSON.parse(v):v}catch(e){obj[k]=v}}obj.id=uid(col.slice(0,3));obj.demo=false;if(col==='rooms'){requireOk(/^\d{3,4}$/.test(obj.number),'Invalid room number');requireOk(!d.rooms.some(x=>x.number===obj.number),'Duplicate room number');obj.rate=Number(obj.rate);requireOk(obj.rate>0,'Invalid room rate');obj.status='VC';obj.photos=[]}if(col==='menu'){requireOk(obj.name&&Number(obj.price)>0,'Invalid menu row');obj.price=Number(obj.price);obj.recipe=Array.isArray(obj.recipe)?obj.recipe:[];obj.photos=[]}if(col==='inventory'){requireOk(obj.name&&obj.unit,'Invalid inventory row');obj.cost=Number(obj.cost||0);obj.reorder=Number(obj.reorder||0);obj.stock={MAIN:Number(obj.MAIN||obj.stock?.MAIN||0),FLOOR:Number(obj.FLOOR||obj.stock?.FLOOR||0),KITCHEN:Number(obj.KITCHEN||obj.stock?.KITCHEN||0)};requireOk(Object.values(obj.stock).every(x=>x>=0),'Negative inventory');obj.photos=[]}if(col==='staff'){requireOk(obj.name&&obj.dept,'Invalid employee');obj.rate=Number(obj.rate||0);obj.photos=[]}if(col==='assets'){requireOk(obj.name&&Number(obj.cost)>=0,'Invalid asset');obj.cost=Number(obj.cost);obj.lifeYears=Number(obj.lifeYears||5);obj.photos=[]}if(col==='capex'){requireOk(obj.name,'Capex name required');obj.budget=Number(obj.budget||0);obj.actual=Number(obj.actual||0);requireOk(obj.budget>=0&&obj.actual>=0,'Negative CAPEX')}add(d,col,obj)}return rows.length})}

function photoCompression(file,label){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);ctx.font='bold '+Math.max(12,Math.round(w/48))+'px system-ui';const stamp=label+' · '+new Date().toLocaleDateString();const th=Math.max(30,Math.round(h*.065));ctx.fillStyle='rgba(8,29,40,.68)';ctx.fillRect(0,h-th,w,th);ctx.fillStyle='#fff';ctx.fillText(stamp.slice(0,80),10,h-10,w-20);const data=c.toDataURL('image/jpeg',.7);if(data.length>1000000)reject(Error('Photo too large after compression'));else resolve(data)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Photo not readable'))};img.src=url})}

 if(act==='newSKU'){showForm(lab('新增庫存品項','New SKU'),[{name:'name',label:lab('品名','Name'),wide:true,required:true},{name:'category',label:lab('分類','Category'),type:'select',options:['Food','OS&E','Linen','Cleaning','MiniBar','Other']},{name:'unit',label:lab('單位','Unit'),value:'pc',required:true},{name:'cost',label:lab('成本 USD','Unit cost'),type:'number',step:.01,min:0,value:1},{name:'reorder',label:lab('安全庫存','Minimum balance'),type:'number',step:.01,min:0,value:10}],x=>mutate('STOCK_ITEM_CREATED',{name:x.name},d=>add(d,'inventory',{name:x.name,category:x.category,unit:x.unit,cost:x.cost,reorder:x.reorder,stock:{MAIN:0,FLOOR:0,KITCHEN:0},photos:[],demo:false})));return}
 if(act==='stockMove'){const opts=id?[[id,pick(DB.inventory,id)?.name]]:inventoryOpts;showForm(lab('庫存撥補、報廢與盤點調整','Stock transfer / waste / stocktake'),[{name:'itemId',label:lab('庫存品項','SKU'),type:'select',options:opts},{name:'from',label:lab('來源','From'),type:'select',options:[['MAIN','總倉 MAIN'],['FLOOR','樓層 FLOOR'],['KITCHEN','廚房 KITCHEN'],['','盤盈增加（外部）']]},{name:'to',label:lab('去向','To'),type:'select',options:[['FLOOR','樓層 FLOOR'],['KITCHEN','廚房 KITCHEN'],['MAIN','總倉 MAIN'],['','耗用／報廢']]},{name:'qty',label:lab('數量','Quantity'),type:'number',min:.01,step:.01,value:1},{name:'notes',label:lab('異動原因','Reason'),required:true,wide:true}],x=>{requireOk(x.from||x.to,'Source or destination required');moveStock(x.itemId,x.from,x.to,x.qty,x.from&&x.to?'transfer':x.to?'count-gain':'write-off',x.notes)},{note:lab('盤差、報廢均保留流水帳；不足庫存不能扣成負數。','Every stocktake/write-off creates an audit trail. Negative balances blocked.')});return}
 if(act==='reorder'){const low=lowStock();showInfo(lab('依安全庫存自動建議採購','Replenishment suggestions'),low.length?low.map(x=>{const qty=Math.max(1,Math.ceil(x.reorder*2-sum(Object.values(x.stock))));return `<div class="listrow"><span><b>${xss(x.name)}</b><small>${lab('目前','On hand')} ${num(sum(Object.values(x.stock)))} / ${lab('安全值','Min')} ${num(x.reorder)}</small></span>${btn('＋ PO '+qty,'suggestPO',x.id,'small primary')}</div>`}).join(''):'<p class="note">'+lab('目前沒有低庫存品項','No items below minimum')+'</p>');return}
 if(act==='suggestPO'){const x=pick(DB.inventory,id);const qty=Math.max(1,Math.ceil(x.reorder*2-sum(Object.values(x.stock))));showForm(lab('建議採購單','Suggested purchase order'),[{name:'itemId',label:'SKU',type:'select',options:[[id,x.name]]},{name:'qty',label:lab('建議數量','Suggested qty'),type:'number',min:.01,step:.01,value:qty},{name:'unitCost',label:lab('單價','Unit cost'),type:'number',min:0,step:.01,value:x.cost},{name:'supplier',label:lab('供應商','Supplier'),value:'Local Supplier'}],v=>createPO(v));return}
 if(act==='newPO'){showForm(lab('建立採購單 PO','Create Purchase Order'),[{name:'itemId',label:lab('庫存品項','Item'),type:'select',options:inventoryOpts},{name:'qty',label:lab('訂購量','Ordered quantity'),type:'number',min:.01,step:.01,required:true},{name:'unitCost',label:lab('單價 USD','Unit cost'),type:'number',min:0,step:.01,value:1},{name:'supplier',label:lab('供應商','Supplier'),required:true,wide:true}],x=>createPO(x));return}
 if(act==='receivePO'){const po=pick(DB.purchaseOrders,id);const it=pick(DB.inventory,po?.itemId);showForm(lab('採購驗收 IQC（可分批）','Receive and inspect PO'),[{name:'qty',label:lab('本批驗收數量','Received quantity'),type:'number',min:.01,max:round(po.qty-po.receivedQty),step:.01,value:round(po.qty-po.receivedQty),required:true},{name:'temp',label:lab('冷鏈溫度 °C（食材）','Cold chain temperature °C'),type:'number',step:.1,value:4},{name:'expiry',label:lab('有效期限','Expiry date'),type:'date',value:dayAdd(today(),30)},{name:'invoice',label:lab('發票號碼（三方核對）','Supplier invoice number'),wide:true}],x=>receivePO(id,x.qty,x.temp,x.expiry,x.invoice),{note:lab('本批驗收不會超過 PO 剩餘量，入庫至總倉並建立待核 AP。','Receipt cannot exceed PO balance; accepted qty moves to MAIN warehouse and creates AP for matching.')});return}
 if(act==='apApprove'){const a=pick(DB.ap,id);showForm(lab('PO / 驗收 / Invoice 三方核對','AP three-way match'),[{name:'invoice',label:lab('發票號碼','Invoice number'),value:a.invoiceRef||'',required:true,wide:true}],x=>mutate('AP_APPROVED',{id},d=>{const z=pick(d.ap,id),po=pick(d.purchaseOrders,z.poId),receipt=pick(d.receipts,z.receiptId);requireOk(z.status==='pending-match'&&po&&receipt,'Missing PO / receipt');requireOk(z.amount===round(receipt.qty*po.unitCost),'Price / quantity mismatch');z.invoiceRef=x.invoice;z.status='approved'}));return}
 if(act==='apPay'){const a=pick(DB.ap,id);showForm(lab('應付分批付款','Partial AP payment'),[{name:'amount',label:lab('本次支付 USD','Pay now USD'),type:'number',min:.01,max:round(a.amount-a.paid),step:.01,value:round(a.amount-a.paid)},{name:'method',label:lab('方式','Method'),type:'select',options:['Bank','Cash','KHQR']}],x=>payAP(id,x.amount,x.method));return}
 if(act==='arCollect'){const a=pick(DB.ar,id);showForm(lab('應收沖銷收款','Collect outstanding AR'),[{name:'amount',label:lab('本次收款 USD','Collect USD'),type:'number',min:.01,max:round(a.amount-a.paid),step:.01,value:round(a.amount-a.paid)},{name:'method',label:lab('方式','Method'),type:'select',options:['Bank','Cash','KHQR','Card']}],x=>collectAR(id,x.amount,x.method));return}
 if(act==='newStaff'){showForm(lab('新增員工','Add employee'),[{name:'name',label:lab('姓名','Name'),required:true,wide:true},{name:'dept',label:lab('部門','Department'),type:'select',options:['FO','HK','F&B','ENG','SEC','ADMIN']},{name:'role',label:lab('職位','Role'),required:true},{name:'payType',label:lab('計薪類型','Pay type'),type:'select',options:[['monthly','Monthly'],['hourly','Hourly']]},{name:'rate',label:lab('月薪或時薪 USD','Pay rate USD'),type:'number',min:0,step:.01,required:true},{name:'shift',label:lab('班別','Shift'),type:'select',options:[['A','A (07-15)'],['B','B (15-23)'],['C','C (23-07)']]}],x=>mutate('STAFF_CREATED',{name:x.name},d=>add(d,'staff',{...x,photos:[],demo:false})));return}
 if(act==='newShift'){showForm(lab('安排三班制班表','Assign a shift'),[{name:'staffId',label:lab('員工','Employee'),type:'select',options:staffOpts},{name:'date',label:lab('日期','Date'),type:'date',value:today()},{name:'shift',label:lab('班別','Shift'),type:'select',options:[['A','A 07:00-15:00'],['B','B 15:00-23:00'],['C','C 23:00-07:00']]},{name:'notes',label:lab('備註','Notes')}],x=>mutate('SHIFT_ASSIGNED',{staffId:x.staffId,date:x.date},d=>add(d,'shifts',{...x,demo:false})));return}
 if(act==='clockin'||act==='clockout'){punch(id,act==='clockin'?'in':'out');return}
 if(act==='newExpense'){showForm(lab('新增當期營運費用','Post an operating expense'),[{name:'date',label:lab('發生日','Expense date'),type:'date',value:today()},{name:'dept',label:lab('USALI 部門','Department'),type:'select',options:[['Rooms','Rooms Department'],['F&B COGS','F&B Cost of Sales'],['F&B Ops','F&B Operating'],['Admin','Administrative'],['POM','Property Operations & Maintenance'],['Utilities','Utilities']]},{name:'description',label:lab('用途','Description'),wide:true,required:true},{name:'amount',label:'USD',type:'number',min:.01,step:.01,required:true}],x=>mutate('OPERATING_EXPENSE',{amount:x.amount},d=>add(d,'expenses',{...x,demo:false})));return}
 if(act==='newAsset'){showForm('FF&E '+lab('新增固定資產','New fixed asset'),[{name:'name',label:lab('資產名稱','Asset name'),wide:true,required:true},{name:'category',label:lab('分類','Type'),type:'select',options:['FF&E','Equipment','Furniture','IT','Kitchen','Other']},{name:'cost',label:lab('取得金額','Acquisition cost'),type:'number',step:.01,min:0,required:true},{name:'purchaseDate',label:lab('購置日期','Purchase date'),type:'date',value:today()},{name:'lifeYears',label:lab('估計折舊年限','Useful life years'),type:'number',step:1,min:1,value:5},{name:'location',label:lab('位置','Location'),required:true}],x=>mutate('FIXED_ASSET_ADDED',{name:x.name},d=>add(d,'assets',{...x,photos:[],demo:false})));return}
 if(act==='newCapex'){showForm(lab('開辦預算與支出','Capex budget item'),[{name:'name',label:lab('支出項目','Description'),required:true,wide:true},{name:'category',label:lab('類別','Category'),type:'select',options:['Renovation','FF&E','OS&E','Permits','Preopening','Other']},{name:'budget',label:lab('預算 USD','Budget'),type:'number',min:0,step:.01,value:1000},{name:'actual',label:lab('實支 USD','Actual'),type:'number',min:0,step:.01,value:0}],x=>mutate('CAPEX_CREATED',{name:x.name},d=>add(d,'capex',{...x,date:today(),demo:false})));return}
 if(act==='editMaster'){const [col,rid]=id.split(':'),r=pick(DB[col],rid);requireOk(r,'Master record not found');const fields=col==='rooms'?[['type','Room type'],['rate','Rate']]:col==='menu'?[['name','Name'],['price','Price'],['station','Station']]:col==='inventory'?[['name','Name'],['cost','Unit cost'],['reorder','Minimum stock']]:col==='staff'?[['name','Name'],['role','Role'],['rate','Pay rate'],['shift','Shift']]:col==='assets'?[['name','Name'],['location','Location'],['lifeYears','Life years']]:[['name','Name'],['budget','Budget'],['actual','Actual']];showForm(lab('編輯主檔（交易不可改）','Edit master record, not posted transactions'),fields.map(z=>({name:z[0],label:z[1],type:typeof r[z[0]]==='number'?'number':'text',step:.01,value:r[z[0]],required:true})),x=>mutate('MASTER_UPDATED',{collection:col,id:rid},d=>{const dest=pick(d[col],rid);Object.assign(dest,x);dest.updatedAt=new Date().toISOString()}));return}
 if(act==='photoRecord'){const [col,...parts]=id.split(':');requestPhoto(col,parts.join(':'));return}
 if(act==='csvExport'){exportCSV(id);return}if(act==='csvImport'){importCSV(id);return}
 if(act==='testGuide'){showInfo(lab('精品酒店一條龍測試腳本','Hotel OS end-to-end test'),`<div class="note">${lab('請只使用 DEMO／測試資料，操作會真的寫入這個瀏覽器的本機資料。','Use demo/test data only. These actions do write to this browser local database.')}</div><ol style="line-height:1.9"><li>${lab('W_PMS200 新增 VC 房號 901。','Add a new VC room 901 in W_PMS200.')}</li><li>${lab('W_PMS210 建立昨天入住、今天退房的訂房，房價 $80。','Book room 901, check-in yesterday, check-out today, rate $80.')}</li><li>${lab('從訂房詳細頁辦理入住，房態應為 OC。','Check in: room becomes OC.')}</li><li>${lab('W_FNB400 點 Espresso×2，支付選 ROOM 掛 901，確認送單。','POS Espresso x2, method ROOM, post to room 901.')}</li><li>${lab('W_FNB410 查看 KDS，並測試新→製作中→就緒→送達。','Check KDS new → preparing → ready → served.')}</li><li>${lab('W_PMS220 查看 Folio，餐飲已掛帳；確認付款退房、現金找零。','Review folio, settle by cash and check out with change.')}</li><li>${lab('退房後 901 應轉 VD，W_HKE300 自動新增高優先清潔單。','Room 901 becomes VD and gets a high-priority HK task.')}</li><li>${lab('房務開始→完成→主管查房，房態回 VC。','HK starts → inspection → approved, room becomes VC.')}</li><li>${lab('W_PMS230 選今天夜審，核對抽屜；同日重複夜審應被阻擋。','Night audit today; duplicate posting must be blocked.')}</li><li>${lab('W_FIN700 查看實際營收、部門成本及 GOP；W_CFG900 JSON 備份。','Review posted USALI-style P&L and back up JSON.')}</li></ol>`);return}
 if(act==='backup'){backupFile();return}if(act==='restore'){restoreBackup();return}
 if(act==='clearDemo'){confirmAction(lab('這將永久移除全部無正式交易引用的 DEMO 紀錄。請先備份；若 DEMO 已被正式紀錄引用，系統會拒絕清除。','This permanently removes unreferenced DEMO records. Back up first. Live references block deletion.'),()=>{backupFile();clearDemo()});return}
 if(act==='auditExport'){download('Hotel_OS_Audit_'+today()+'.csv',toCSV(DB.events.map(x=>({eventId:x.eventId,type:x.type,at:x.at,propertyId:x.propertyId,actor:x.actor,payload:JSON.stringify(x.payload?.meta||{})}))),'text/csv;charset=utf-8');return}
 if(act==='showImport'){const b=pick(DB.importBatches,id);showInfo('CSV '+lab('待覆核資料','Staged rows')+' · '+b.filename,`<p class="note">${lab('此批資料未過帳、不更改正式交易。','This CSV has not posted any financial or inventory transaction.')}</p><pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:50vh;overflow:auto">${xss(JSON.stringify(b.rows.slice(0,8),null,2))}</pre>`);return}
 if(act==='themeColor'){const d=clone(DB);d.settings.bg=value;persist(d);updateTheme();toast(lab('背景顏色已更新','Background updated'));return}
 if(act==='bgImport'){$('hiddenBg').value='';$('hiddenBg').click();return}
 if(act==='bgRemove'){const d=clone(DB);d.settings.bgImage='';persist(d);updateTheme();toast(lab('背景圖已清除','Background removed'));return}
 throw Error('Unknown action: '+act)
}
function init(){try{DB=loadState();if(!localStorage.getItem(STORAGE))persist(DB);UI.lang=DB.settings.lang||'zh';render()}catch(e){console.error(e);showInfo('Hotel OS',`<p class="note bad">${xss(e.message)}</p>`)}}
$('menuButton').onclick=openDrawer;$('drawerClose').onclick=closeDrawer;$('drawerMask').onclick=closeDrawer;$('drawerSearch').oninput=renderDrawer;
$('langBtn').onclick=()=>{UI.lang=UI.lang==='zh'?'en':'zh';const d=clone(DB);d.settings.lang=UI.lang;persist(d);render()};$('themeBtn').onclick=themeDialog;$('quickBtn').onclick=()=>onAction('newBook');
$('periodPrev').onclick=()=>stepPeriod(-1);$('periodNext').onclick=()=>stepPeriod(1);$('periodDate').onchange=e=>{if(e.target.value){UI.date=e.target.value;render()}};
$('detailClose').onclick=closeDetails;$('sheetMask').onclick=closeDetails;$('detailPrev').onclick=()=>switchDetail(-1);$('detailNext').onclick=()=>switchDetail(1);$('detailPhotoBtn').onclick=()=>{const d=UI.details;if(d)requestPhoto(d.collection,d.ids[d.index])};
$('detailBody').addEventListener('scroll',()=>{clearTimeout(window.__detailScrollTimer);window.__detailScrollTimer=setTimeout(updateDetailScroll,90)});
let detTouch={x:0,y:0};$('detailBody').addEventListener('touchstart',e=>{detTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('detailBody').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-detTouch.x,dy=e.changedTouches[0].clientY-detTouch.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5){UI.detailTab=Math.max(0,Math.min(3,UI.detailTab+(dx<0?1:-1)));buildDetails()}},{passive:true});
$('hiddenCSV').onchange=async e=>{const file=e.target.files[0];if(!file)return;guarded(async()=>{requireOk(file.size<2*1024*1024,'CSV max 2 MB');const rows=parseCSV(await file.text()),col=UI.importTarget.collection;requireOk(rows.length>0,'CSV empty');UI.importTarget.filename=file.name;confirmAction(lab('已解析 '+rows.length+' 筆 '+col+'；安全主檔直接新增，財務交易只暫存待覆核。確定？','Parsed '+rows.length+' '+col+' rows. Safe master imports create records; financial data is staged. Continue?'),()=>safeMasterImport(col,rows),false)})};
$('hiddenBackup').onchange=async e=>{const file=e.target.files[0];if(!file)return;guarded(async()=>{const content=await file.text(),d=JSON.parse(content);requireOk(d.schema===BACKUP_SCHEMA&&Array.isArray(d.rooms)&&Array.isArray(d.events),'Invalid Hotel OS backup');requireOk(d.propertyId&&d.settings&&d.model,'Backup missing fields');backupFile();persist(d);UI.date=today();UI.group='PMS';UI.module='W_PMS200';closeModal();render();toast(lab('備份還原完成','Backup restored'))})};
$('hiddenPhoto').onchange=async e=>{const file=e.target.files[0],ref=UI.photoTarget;if(!file||!ref)return;guarded(async()=>{requireOk(file.type.startsWith('image/'),'Please select an image');requireOk(file.size<20*1024*1024,'Photo max 20MB input');const data=await photoCompression(file,ref.label);mutate('PHOTO_ATTACHED',{collection:ref.col,id:ref.id},d=>{const row=pick(d[ref.col],ref.id);requireOk(row,'Photo record missing');(row.photos??=[]).push({id:uid('PIC'),data,label:ref.label,at:new Date().toISOString()})});if(UI.details)buildDetails();toast(lab('照片已壓縮保存','Photo compressed and saved'))})};
$('hiddenBg').onchange=async e=>{const file=e.target.files[0];if(!file)return;guarded(async()=>{const data=await photoCompression(file,'SAINTDOU HOTEL · BACKGROUND');const d=clone(DB);d.settings.bgImage=data;persist(d);updateTheme();toast(lab('背景照片已更新','Background photo updated'))})};
document.addEventListener('click',e=>{const button=e.target.closest('[data-act],[data-period],[data-group],[data-mod],[data-detail-tab],[data-open]');if(!button)return;guarded(()=>{if(button.dataset.period){UI.period=button.dataset.period;render();return}if(button.dataset.group){selectGroup(button.dataset.group);return}if(button.dataset.mod){goModule(button.dataset.mod);return}if(button.dataset.detailTab!==undefined){UI.detailTab=Number(button.dataset.detailTab);buildDetails();return}if(button.dataset.open){detailsFor(button.dataset.open,button.dataset.id);return}if(button.dataset.act)onAction(button.dataset.act,button.dataset.id,button.dataset.value)})});
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{const d=JSON.parse(e.newValue);if(d.schema!==BACKUP_SCHEMA)return;DB=d;UI.lang=d.settings.lang||'zh';render();toast(lab('已同步其他分頁的本機變更','Updated from another tab'))}catch(err){console.warn(err)}}});
init();

</script>
