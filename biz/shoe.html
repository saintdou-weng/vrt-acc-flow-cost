const masters={customers:{title:'客戶與品牌主檔',fields:[['name','客戶名稱','text'],['brand','品牌/客戶組別','text'],['term','付款天數','number'],['currency','交易幣別','text']]},suppliers:{title:'供應商主檔',fields:[['name','供應商名稱','text'],['term','月結天數','number'],['phone','電話/聯絡方式','text']]},styles:{title:'鞋型與開發資料',fields:[['article','型體編號 Article','text'],['name','鞋款名稱','text'],['color','顏色 Color','text'],['lastNo','楦頭 Last','text'],['dieNo','裁斷刀模 Die','text'],['soleMold','大底模號','text'],['smv','標準工時 SMV (分鐘/雙)','number']]},materials:{title:'物料主檔',fields:[['code','料號','text'],['name','材料名稱','text'],['unit','採購/庫存單位','text'],['sizeAware','是否分尺碼','select',[['false','否'],['true','是']]],['supplierId','預設供應商','ref','suppliers'],['price','參考單價 USD','number']]},employees:{title:'員工檔案',fields:[['name','姓名','text'],['empNo','工號','text'],['dept','工段/部門','text'],['role','職務','text'],['rate','基本時薪/計件基準','number']]},attendance:{title:'出勤登記',fields:[['empNo','員工工號','text'],['workDate','工作日期','date'],['hours','正常工時','number'],['ot','加班工時','number'],['note','備註','text']]},expenses:{title:'費用／零用金登記',fields:[['date','日期','date'],['category','分類','text'],['description','事由','text'],['amount','金額 USD','number'],['approvedBy','核准者','text']]},tooling:{title:'楦頭／刀模／機具',fields:[['toolNo','工具編號','text'],['type','種類','text'],['article','適用型體','text'],['size','尺碼','text'],['location','存放/領用位置','text'],['status','狀態','text']]},maintenance:{title:'設備維修與保養',fields:[['equipment','設備名稱','text'],['date','報修日期','date'],['problem','故障/保養內容','text'],['responsible','負責人','text'],['cost','費用 USD','number'],['status','狀態','text']]},security:{title:'保全巡邏／門禁登記',fields:[['date','日期','date'],['location','地點/門口','text'],['type','巡邏/車輛/訪客','text'],['responsible','登記人','text'],['note','狀況說明','text']]},chemical:{title:'化學品與環安衛記錄',fields:[['date','日期','date'],['chemical','化學品/檢查項目','text'],['lot','批號','text'],['expires','SDS/材料有效日期','date'],['result','檢查結果','text'],['responsible','負責人','text']]}};
function useGroup(page){const g=groupList.find(g=>g.menus.some(m=>m[0]===page));if(g)currentGroup=g.id}
function nav(page){active=page;useGroup(page);toggleDrawer(false);render();window.scrollTo({top:0,behavior:'instant'})}
function toggleDrawer(show){document.getElementById('drawer').classList.toggle('show',show);document.getElementById('drawerbg').classList.toggle('show',show);if(show)renderNav()}
function renderNav(){const term=(document.getElementById('navSearch').value||'').trim().toLowerCase();document.getElementById('navList').innerHTML=groupList.map(g=>{const a=g.menus.filter(m=>(m[1]+m[0]).toLowerCase().includes(term));if(!a.length)return '';return `<div class="dgroup">${g.name}</div>`+a.map(m=>`<button class="dlink ${active===m[0]?'active':''}" onclick="nav('${m[0]}')"><span>${m[2]}</span>${m[1]}<small>›</small></button>`).join('')}).join('')}
function groupButtons(){return `<p class="intro">${new Date().toLocaleDateString('zh-TW',{timeZone:'Asia/Phnom_Penh',year:'numeric',month:'long',day:'numeric',weekday:'long'})} · 四套系統，一個工作台</p><div class="period">${['日','週','月','年'].map(x=>`<button class="${period===x?'active':''}" onclick="period='${x}';render()">${x}</button>`).join('')}</div><div class="pills">${groupList.map(g=>`<button class="${currentGroup===g.id?'active':''}" style="--tone:${g.tone}" onclick="currentGroup='${g.id}';active='${g.id==='ops'?'dashboard':g.id==='finance'?'financehome':g.id==='hr'?'hrhome':'gahome'}';render()">${g.name}　●</button>`).join('')}</div>`}
function inPeriod(date){if(!date)return false;const raw=String(date).slice(0,10),d=today();if(period==='日')return raw===d;if(period==='年')return raw.slice(0,4)===d.slice(0,4);if(period==='月')return raw.slice(0,7)===d.slice(0,7);const day=Date.parse(d+'T00:00:00'),dt=Date.parse(raw+'T00:00:00');return dt>=day-6*864e5&&dt<=day}
function qtyOrder(o){return Object.values(o.sizes||{}).reduce((a,b)=>a+n(b),0)}
function stockQty(matId,size=''){return round(db.stockMovements.filter(x=>x.materialId===matId&&String(x.size||'')===String(size||'')).reduce((s,x)=>s+n(x.qty),0),3)}
function fgQty(orderId,size){return db.fgMovements.filter(x=>x.orderId===orderId&&x.size===size).reduce((s,x)=>s+n(x.qty),0)}
function stageQty(wo,stage,size){return db.production.filter(x=>x.woId===wo.id&&x.stage===stage&&x.size===size).reduce((s,x)=>s+n(x.qty),0)}
function qcQty(wo,size,kind){return db.qc.filter(x=>x.woId===wo.id&&x.size===size).reduce((s,x)=>s+n(x[kind]),0)}
function packedQty(wo,size){return db.fgMovements.filter(x=>x.woId===wo.id&&x.reason==='包裝合格入庫'&&x.size===size).reduce((s,x)=>s+n(x.qty),0)}
function paid(docId,type){return round(db.settlements.filter(x=>x.docId===docId&&x.type===type).reduce((s,x)=>s+n(x.amount),0))}
function totalOpen(type){return db[type].reduce((s,x)=>s+Math.max(0,n(x.amount)-paid(x.id,type)),0)}
function kpi(name,num,code,page,alarm=false){return `<button class="kpi ${alarm?'alarm':''}" onclick="nav('${page}')"><span class="kname">${name}</span><strong class="num">${num}</strong><div class="kcode">${code}</div></button>`}
function home(which){let g=groupList.find(x=>x.id===which),content='';const ordersIn=db.orders.filter(x=>inPeriod(x.createdAt));const prodIn=db.production.filter(x=>inPeriod(x.createdAt));const shippingIn=db.shipments.filter(x=>inPeriod(x.createdAt));const insIn=db.fgMovements.filter(x=>x.qty>0&&inPeriod(x.createdAt));const apIn=db.settlements.filter(x=>x.type==='ap'&&inPeriod(x.createdAt));const arIn=db.settlements.filter(x=>x.type==='ar'&&inPeriod(x.createdAt));let alerts=db.orders.filter(x=>x.etd<today()&&db.shipments.filter(s=>s.orderId===x.id).reduce((a,b)=>a+n(b.qty),0)<x.qty).length;
if(which==='ops')content=kpi('接單雙數',fmt(ordersIn.reduce((a,x)=>a+x.qty,0)),'S-ORD150','orders')+kpi('成型完成',fmt(prodIn.filter(x=>x.stage==='last').reduce((a,x)=>a+x.qty,0)),'S-LAS340','production')+kpi('成品入庫',fmt(insIn.reduce((a,x)=>a+x.qty,0)),'S-PKG360','finished')+kpi('已出貨雙數',fmt(shippingIn.reduce((a,x)=>a+x.qty,0)),'S-SHP380','shipping')+kpi('出貨金額',money(shippingIn.reduce((a,x)=>a+x.amount,0)),'USD · S-SHP380','shipping')+kpi('目前製令',fmt(db.workOrders.length),'所有未作廢','workorders')+kpi('異常／逾期',fmt(alerts),'逾期未出貨 PO','costing',true);
else if(which==='finance')content=kpi('本期已收款',money(arIn.reduce((a,x)=>a+x.amount,0)),'AR','ar')+kpi('本期已付款',money(apIn.reduce((a,x)=>a+x.amount,0)),'AP','ap')+kpi('目前應收餘額',money(totalOpen('ar')),'未收/部分收','ar')+kpi('目前應付餘額',money(totalOpen('ap')),'未付/部分付','ap')+kpi('待核對 AP',fmt(db.ap.filter(x=>!x.approved).length),'尚不得付款','ap',true);
else if(which==='hr')content=kpi('在職員工',fmt(db.employees.filter(x=>!x.archived).length),'人員主檔','employees')+kpi('本期出勤筆數',fmt(db.attendance.filter(x=>inPeriod(x.workDate)).length),'出勤記錄','attendance')+kpi('本期正常工時',fmt(db.attendance.filter(x=>inPeriod(x.workDate)).reduce((a,x)=>a+n(x.hours),0)),'小時','attendance')+kpi('本期加班工時',fmt(db.attendance.filter(x=>inPeriod(x.workDate)).reduce((a,x)=>a+n(x.ot),0)),'小時','attendance');
else content=kpi('登記模具工具',fmt(db.tooling.filter(x=>!x.archived).length),'楦頭/刀模','tooling')+kpi('未結維修',fmt(db.maintenance.filter(x=>x.status!=='完成'&&!x.archived).length),'維修保養','maintenance')+kpi('本期門禁/巡邏',fmt(db.security.filter(x=>inPeriod(x.date)).length),'保全記錄','security')+kpi('化學品點檢',fmt(db.chemical.filter(x=>inPeriod(x.date)).length),'SDS / 防護','chemical');
let entry=which==='ops'?'orders':which==='finance'?'ap':which==='hr'?'employees':'maintenance';return `${groupButtons()}<section class="hero" style="--tone:${g.tone};--tone2:${g.tone2}"><div class="herohead"><div class="herotitle">${g.name}</div><button class="lightbtn" onclick="nav('${entry}')">進入 →</button></div><div class="kpis">${content}</div><div class="statusline">🟢 本機離線儲存 · v1.0 · ${period}統計 · 未連接雲端</div></section><div class="panel" style="margin-top:16px"><h3>一條龍關鍵流程</h3><div class="flowsteps">${['接單','BOM','MRP','採購','IQC','領料','裁斷','針車','成型','QC','入庫','出貨','收付款'].map(x=>`<span>${x}</span>`).join('')}</div><div class="notice oknote">目前是<strong>單裝置離線初版</strong>，所有數字由本機單據計算。系統自帶三筆標示「示範」的客戶訂單；可在「備份設定」切換成空白工廠。尚未提供安全的多人登入、雲端同步或正式財務總帳。</div><button class="btn" onclick="nav('guide')">查看操作說明與測試路徑</button>　<button class="btn" onclick="exportJSON()">⬇ 匯出完整備份</button></div>`}
function head(title,desc){return `<div class="viewhead"><div><h2>${title}</h2><div class="hint">${desc}</div></div><button class="btn sm" onclick="nav('${currentGroup==='ops'?'dashboard':currentGroup==='finance'?'financehome':currentGroup==='hr'?'hrhome':'gahome'}')">⌂ 總覽</button></div>`}
function tag(s){const warn=/待|部分|尚|未|欠|中|測試/.test(s),red=/錯|缺|逾|退|拒/.test(s);return `<span class="tag ${red?'red':warn?'warn':''}">${esc(s)}</span>`}
function table(headers,rows){return `<div class="panel"><div class="tablewrap"><table class="data"><thead><tr>${headers.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">尚無資料。可從右上新增，或先完成上一個作業關卡。</td></tr>`}</tbody></table></div></div>`}
function masterPage(kind){const c=masters[kind],data=db[kind].filter(x=>!x.archived);return head(c.title,'共 '+data.length+' 筆 · 可新增／修改；已建立的交易單據不會因主檔變更而自動重算')+`<div class="toolbar"><button class="btn primary" onclick="editMaster('${kind}')">＋ 新增資料</button><input class="filter" id="localFilter" placeholder="搜尋目前分頁..." oninput="filterTable(this.value)"><button class="btn" onclick="exportCSV('${kind}')">⬇ CSV</button></div>`+table([...c.fields.map(f=>f[1]),'操作'],data.map(x=>[...c.fields.map(f=>esc(f[2]==='ref'?nameOf(f[3],x[f[0]]):f[0]==='sizeAware'?(x.sizeAware?'是':'否'):x[f[0]])),`<button class="btn sm" onclick="editMaster('${kind}','${x.id}')">編輯</button> <button class="btn sm red" onclick="archiveMaster('${kind}','${x.id}')">封存</button>`]));}
function filterTable(s){document.querySelectorAll('.data tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(s.toLowerCase())?'':'none')}
function editMaster(kind,key=''){const cfg=masters[kind],x=key?byId(kind,key):{},fields=cfg.fields.map(f=>field(f[0],f[1],f[2]==='ref'||f[2]==='select'?'text':f[2],f[2]==='select'?String(x[f[0]]??'false'):x[f[0]]??(f[2]==='date'?today():''),f[2]==='ref'?opts(f[3]):f[2]==='select'?f[3]:null,` ${f[2]==='number'?'step="any" min="0"':''} ${f[0]==='name'||f[0]==='code'||f[0]==='article'?'required':''}`)).join('');openModal((key?'編輯':'新增')+cfg.title,fields,d=>{if(['materials','styles','customers','suppliers'].includes(kind)){const main=d.code||d.article||d.name;if(db[kind].some(r=>!r.archived&&r.id!==key&&(r.code||r.article||r.name)===main)){toast('主要編號/名稱已存在');return false}}let v={...x,...d,id:key||id(kind),createdAt:x.createdAt||now()};for(let f of cfg.fields){if(f[2]==='number')v[f[0]]=n(v[f[0]]);if(f[0]==='sizeAware')v.sizeAware=v.sizeAware==='true'}if(key){db[kind][db[kind].findIndex(z=>z.id===key)]=v}else db[kind].push(v);save('主檔儲存',cfg.title);return true})}
function archiveMaster(kind,key){if(['styles','materials','customers','suppliers'].includes(kind)){let used=kind==='styles'?db.orders.some(x=>x.styleId===key)||db.boms.some(x=>x.styleId===key):kind==='materials'?db.boms.some(x=>x.materialId===key)||db.stockMovements.some(x=>x.materialId===key):kind==='customers'?db.orders.some(x=>x.customerId===key):db.purchaseOrders.some(x=>x.supplierId===key);if(used)return toast('此主檔已有交易或 BOM 使用，禁止封存')}if(confirm('確認封存此筆主檔？')){byId(kind,key).archived=true;save('封存主檔',kind+' '+key)}}
function bomPage(){return head('鞋型 BOM · 部位用量','BOM = Bill of Materials（物料清單），每雙用料＋耗損百分比。分碼材料會在 MRP 按各尺碼展開。')+`<div class="toolbar"><button class="btn primary" onclick="bomEdit()">＋ 新增 BOM 明細</button><span class="smalltxt">現場版示範使用已核可 v1。製令發料後不可直接改舊配方。</span></div>`+table(['鞋型 Article','材料/部位','用量/雙','損耗率','尺碼區分','版本','操作'],db.boms.map(x=>[esc(nameOf('styles',x.styleId,'article')),esc(nameOf('materials',x.materialId)),`${fmt(x.perPair,3)} ${esc(nameOf('materials',x.materialId,'unit'))}`,fmt(x.waste,1)+'%',byId('materials',x.materialId)?.sizeAware?'逐碼':'通用','v'+x.version,`<button class="btn sm" onclick="bomEdit('${x.id}')">編輯</button>`]));}
function bomEdit(key=''){if(!db.styles.length||!db.materials.length)return toast('請先建立鞋型與材料主檔');const x=key?byId('boms',key):{};openModal(key?'修改 BOM 明細':'新增 BOM 明細',field('styleId','鞋型','text',x.styleId||db.styles[0].id,opts('styles','article'))+field('materialId','材料','text',x.materialId||db.materials[0].id,opts('materials'))+field('perPair','每雙使用量','number',x.perPair??1,null,'required min="0.001" step="0.001"')+field('waste','標準損耗 %','number',x.waste??2,null,'required min="0" max="100" step="0.1"'),d=>{if(db.workOrders.some(w=>byId('orders',w.orderId)?.styleId===d.styleId&&w.issued)){toast('該鞋型已有製令發料，請新建 BOM 版本；此版禁止直接修改');return false}let v={id:key||id('bom'),styleId:d.styleId,materialId:d.materialId,perPair:n(d.perPair),waste:n(d.waste),version:1,approved:true};if(v.perPair<=0)throw Error('用量需大於零');if(key)db.boms[db.boms.findIndex(z=>z.id===key)]=v;else db.boms.push(v);save('BOM 更新',esc(nameOf('styles',v.styleId,'article')));return true})}
function orderPage(){const rows=db.orders.map(o=>{const wo=db.workOrders.find(x=>x.orderId===o.id),shipped=db.shipments.filter(x=>x.orderId===o.id).reduce((a,x)=>a+n(x.qty),0);return [esc(o.po),`${esc(nameOf('styles',o.styleId,'article'))}<div class="smalltxt">${esc(nameOf('customers',o.customerId))}</div>`,Object.entries(o.sizes).filter(([k,v])=>v>0).map(([k,v])=>k+':'+v).join(' · '),fmt(o.qty),money(o.fob),esc(o.etd),tag(shipped>=o.qty?'已出完':wo?'生產中':'待排產'),`<button class="btn sm" onclick="nav('mrp');document.getElementById('mrpSelect').value='${o.id}';updateMRP()">算料</button> <button class="btn sm primary" onclick="makeWO('${o.id}')">轉製令</button>`]});return head('客戶訂單｜款色碼與交期','每張 PO 綁定鞋型與每個尺碼雙數；FOB 單價按雙計，客戶訂單可多次出貨與開票。')+`<div class="toolbar"><button class="btn primary" onclick="addOrder()">＋ 新增客戶訂單</button><button class="btn" onclick="exportCSV('orders')">⬇ CSV</button></div>`+table(['PO/訂單','鞋型 / 客戶','Size Run 尺碼配比','總雙數','單雙 FOB','ETD','狀態','流程'],rows)}
function sizeFields(prefix='size',values={}){return `<div class="field full"><label>每碼訂單雙數（US 尺碼，測試範例）</label><div class="sizegrid">${SIZES.map(s=>field(prefix+s,'US '+s,'number',values[s]??0,null,'min="0" step="1" required')).join('')}</div></div>`}
function addOrder(){if(!db.customers.length||!db.styles.length)return toast('先建立客戶和鞋型');openModal('新增正式客戶訂單',field('po','客戶 PO 編號','text','',null,'required')+field('customerId','客戶','text',db.customers[0].id,opts('customers'))+field('styleId','鞋型 Article','text',db.styles[0].id,opts('styles','article'))+field('fob','單雙 FOB 美金','number',18,null,'required min="0.01" step="0.01"')+field('etd','預計出貨日期 ETD','date',dayPlus(today(),35),null,'required')+sizeFields('size'),d=>{if(db.orders.some(x=>x.po===d.po))throw Error('PO 編號重複');const sizes=Object.fromEntries(SIZES.map(s=>[s,n(d['size'+s])]));const qty=Object.values(sizes).reduce((a,b)=>a+b,0);if(!qty||SIZES.some(s=>sizes[s]<0||!Number.isInteger(sizes[s])))throw Error('尺碼雙數需是非負整數且合計>0');const o={id:id('ord'),po:d.po,customerId:d.customerId,styleId:d.styleId,sizes,qty,fob:n(d.fob),etd:d.etd,createdAt:now(),status:'待排產'};db.orders.push(o);save('新增訂單',d.po+'｜'+qty+'雙');return true})}
function needsForOrder(o){const bs=db.boms.filter(x=>x.styleId===o.styleId&&x.approved);let arr=[];for(let b of bs){let mat=byId('materials',b.materialId);if(!mat)continue;const required=(pairs)=>{const qty=pairs*b.perPair*(1+b.waste/100);return ['雙','隻','個','片','組','箱'].includes(mat.unit)?Math.ceil(qty-1e-9):round(qty,3)};if(mat.sizeAware){for(let [sz,pairs] of Object.entries(o.sizes))if(pairs>0)arr.push({matId:mat.id,size:sz,required:required(pairs),unit:mat.unit,price:n(mat.price),supplierId:mat.supplierId})}else arr.push({matId:mat.id,size:'',required:required(o.qty),unit:mat.unit,price:n(mat.price),supplierId:mat.supplierId})}return arr}
function qtyIncoming(matId,size){return round(db.purchaseOrders.reduce((acc,po)=>acc+po.lines.filter(l=>l.matId===matId&&l.size===size).reduce((s,l)=>s+Math.max(0,n(l.qty)-n(l.received)),0),0),3)}
function mrpCalculations(o){return needsForOrder(o).map(x=>({...x,stock:stockQty(x.matId,x.size),incoming:qtyIncoming(x.matId,x.size),short:Math.max(0,round(x.required-stockQty(x.matId,x.size)-qtyIncoming(x.matId,x.size),3))}))}
function mrpPage(){return head('MRP 自動算料與採購建議','MRP = 依尺碼用量推算物料需求。首版按單計算現貨與在途，尚未做多訂單庫存預留，正式版需增加集中分配避免重複占用。')+`<div class="panel"><div class="toolbar"><select class="filter" id="mrpSelect" onchange="updateMRP()">${db.orders.map(x=>`<option value="${x.id}">${esc(x.po)} · ${esc(nameOf('styles',x.styleId,'article'))}</option>`).join('')}</select><button class="btn primary" onclick="createPurchaseMRP()">＋ 缺料轉採購 PO</button></div><div id="mrpRows"></div></div>`}
function updateMRP(){const el=document.getElementById('mrpSelect');if(!el)return;const o=byId('orders',el.value);if(!o){document.getElementById('mrpRows').textContent='請先建立訂單';return}let arr=mrpCalculations(o);document.getElementById('mrpRows').innerHTML=`<div class="metricline" style="margin-bottom:12px"><div class="mini">訂單量<strong>${fmt(o.qty)} 雙</strong></div><div class="mini">缺料項目<strong>${arr.filter(x=>x.short>0).length}</strong></div><div class="mini">缺料預估金額<strong>${money(arr.reduce((a,x)=>a+x.short*x.price,0))}</strong></div></div><div class="tablewrap"><table class="data"><thead><tr><th>料號／材料</th><th>尺碼</th><th>需求</th><th>現貨</th><th>在途未驗</th><th>建議採購</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(nameOf('materials',x.matId,'code'))} · ${esc(nameOf('materials',x.matId))}</td><td>${x.size||'通用'}</td><td>${fmt(x.required,3)} ${esc(x.unit)}</td><td>${fmt(x.stock,3)}</td><td>${fmt(x.incoming,3)}</td><td>${x.short>0?tag('缺 '+fmt(x.short,3)):'✓ 已足夠'}</td></tr>`).join('')}</tbody></table></div>`}
function createPurchaseMRP(){let o=byId('orders',document.getElementById('mrpSelect')?.value);if(!o)return toast('請先選擇訂單');let need=mrpCalculations(o).filter(x=>x.short>.0001),bySupplier={};if(!need.length)return toast('所有材料現貨及在途已能覆蓋本張訂單');for(let x of need){if(!x.supplierId)return toast(nameOf('materials',x.matId)+' 尚未指定預設供應商');(bySupplier[x.supplierId]??=[]).push({matId:x.matId,size:x.size,qty:x.short,unitPrice:x.price,received:0})}if(!confirm('建立 '+Object.keys(bySupplier).length+' 張採購單？採購只增加在途數量，不會直接入庫。'))return;for(let [supplierId,lines] of Object.entries(bySupplier))db.purchaseOrders.push({id:id('po'),no:nextNo('SPO'),orderId:o.id,supplierId,lines,status:'已下單',date:today(),eta:dayPlus(today(),14),createdAt:now()});save('MRP 轉採購',o.po);nav('purchases')}
function purchasePage(){return head('採購 PO 與追料','採購只記錄在途。需在收料/IQC 確認合格後，物料才會成為可用庫存。')+`<div class="toolbar"><button class="btn primary" onclick="nav('mrp')">＋ 從 MRP 生成採購</button></div>`+table(['採購單','供應商／來源訂單','品項／尺碼','訂購／已收','預計到料','狀態','下一步'],db.purchaseOrders.map(p=>[esc(p.no),`${esc(nameOf('suppliers',p.supplierId))}<div class="smalltxt">${esc(nameOf('orders',p.orderId,'po'))}</div>`,p.lines.map(l=>esc(nameOf('materials',l.matId))+(l.size?'/'+l.size:'')).join('<br>'),p.lines.map(l=>`${fmt(l.qty,3)} / ${fmt(l.received,3)}`).join('<br>'),esc(p.eta),tag(p.status),`<button class="btn sm primary" onclick="receiptForm('${p.id}')">收料 IQC</button>`]));}
function receiptPage(){return head('收料驗收與 IQC','IQC = Incoming Quality Control（進料品檢）。只有合格量才能增加原料庫存，並生成待核對應付憑據。')+`<div class="toolbar"><button class="btn primary" onclick="pickReceipt()">＋ 依採購單收料</button></div>`+table(['收料單','採購單','材料／尺碼','合格量','批號','應付狀態'],db.receipts.map(r=>[esc(r.no),esc(byId('purchaseOrders',r.purchaseId)?.no),esc(nameOf('materials',r.matId))+' '+esc(r.size||''),fmt(r.qty,3),esc(r.lot),tag('待三方對帳')]));}
function pickReceipt(){let arr=db.purchaseOrders.filter(p=>p.lines.some(l=>n(l.qty)>n(l.received)));if(!arr.length)return toast('沒有未收完的採購單，先到 MRP 生成採購');openModal('選擇待收採購單',field('purchaseId','採購單','text',arr[0].id,arr.map(x=>[x.id,x.no+' · '+nameOf('suppliers',x.supplierId)])),d=>{receiptForm(d.purchaseId);return false})}
function receiptForm(poId){let p=byId('purchaseOrders',poId);if(!p)return toast('找不到採購單');const remaining=p.lines.map((l,i)=>({l,i,left:round(n(l.qty)-n(l.received),3)})).filter(x=>x.left>0);if(!remaining.length)return toast('採購已全數收貨');openModal('IQC 收料｜'+p.no,field('lineIndex','材料／尺碼','text',remaining[0].i,remaining.map(x=>[x.i,nameOf('materials',x.l.matId)+' '+(x.l.size||'通用')+'｜未收'+fmt(x.left,3)]))+field('qty','本次檢驗合格數量','number',remaining[0].left,null,'min="0.001" step="0.001" required')+field('lot','供應商批號/箱號','text','LOT-'+today().replaceAll('-',''),null,'required')+field('supplierInvoice','供應商發票號（可後補）','text',''),d=>{const line=p.lines[n(d.lineIndex)],qty=n(d.qty),left=n(line.qty)-n(line.received);if(!Number.isFinite(qty)||qty<=0||qty>left+.00001)throw Error('合格數量必須 >0 且不能超過未收數');if(['雙','隻','個','片','組','箱'].includes(byId('materials',line.matId)?.unit)&&!Number.isInteger(qty))throw Error('此材料單位不得填小數');let r={id:id('rc'),no:nextNo('RCV'),purchaseId:p.id,matId:line.matId,size:line.size,qty,lot:d.lot,createdAt:now(),status:'IQC合格'};db.receipts.push(r);db.stockMovements.push({id:id('mv'),materialId:line.matId,size:line.size,qty,reason:'IQC 合格入庫',sourceId:r.id,lot:d.lot,createdAt:now()});line.received=round(n(line.received)+qty,3);p.status=p.lines.every(l=>n(l.received)>=n(l.qty)-.00001)?'已到齊':'部分到料';db.ap.push({id:id('ap'),no:nextNo('AP'),receiptId:r.id,purchaseId:p.id,supplierId:p.supplierId,amount:round(qty*n(line.unitPrice),2),approved:false,invoiceNo:d.supplierInvoice||'',dueDate:dayPlus(today(),Number(byId('suppliers',p.supplierId)?.term)||30),createdAt:now()});save('IQC 驗收入庫',r.no);return true})}
function stockPage(){let arr=[];for(let m of db.materials.filter(x=>!x.archived)){let sz=m.sizeAware?SIZES:[''];for(let s of sz)arr.push([esc(m.code),esc(m.name),s||'通用',fmt(stockQty(m.id,s),3),esc(m.unit),fmt(qtyIncoming(m.id,s),3),stockQty(m.id,s)<0?tag('異常負庫存'):'—'])}return head('原料庫存／即時結餘','結餘 = 期初與驗收入庫－製令發料，逐料號+尺碼計算；正式版可加批號、庫位、保留量與盤點。')+`<div class="toolbar"><button class="btn primary" onclick="adjustStock()">＋ 盤點差異調整</button><button class="btn" onclick="exportCSV('stockMovements')">⬇ 異動明細 CSV</button></div>`+table(['料號','材料','尺碼','可用結餘','單位','採購在途','異常'],arr)}
function adjustStock(){openModal('庫存盤點調整（需留原因）',field('matId','料號材料','text',db.materials[0]?.id||'',opts('materials'))+field('size','尺碼（分碼物料填 US 碼）','text','')+field('qty','調整量：正加負減','number',0,null,'step="0.001" required')+field('reason','盤點差異原因','text','盤點更正',null,'required'),d=>{let m=byId('materials',d.matId);if(!m)throw Error('材料不存在');let sz=m.sizeAware?d.size:'';if(m.sizeAware&&!SIZES.includes(sz))throw Error('分碼材料須填 7/8/9/10/11');const q=n(d.qty);if(['雙','隻','個','片','組','箱'].includes(m.unit)&&!Number.isInteger(q))throw Error('此材料只能以整數盤點');if(!q||stockQty(m.id,sz)+q<-.00001)throw Error('調整後不可形成負庫存');db.stockMovements.push({id:id('mv'),materialId:m.id,size:sz,qty:q,reason:d.reason,createdAt:now()});save('盤點調整',m.code+' '+q);return true})}
function makeWO(orderId){let o=byId('orders',orderId);if(!o)return;if(db.workOrders.some(x=>x.orderId===orderId))return toast('已有製令，不能重複生成');if(!needsForOrder(o).length)return toast('鞋型 BOM 尚未建立');let wo={id:id('wo'),no:nextNo('WO'),orderId:o.id,issued:false,createdAt:now(),status:'待發料'};db.workOrders.push(wo);o.status='生產中';save('生成製令',wo.no);nav('workorders')}
function workPage(){return head('製令派工／材料齊套／領料','同一張訂單建立一張製令（初版），按全尺碼 BOM 檢查材料是否齊套；不足時禁止一次性發料。')+table(['製令單','客戶 PO／鞋型','訂單雙數','材料狀態','生產進度','動作'],db.workOrders.map(w=>{let o=byId('orders',w.orderId),needs=mrpCalculations(o),short=needs.filter(x=>x.required>stockQty(x.matId,x.size)+.00001),total=db.production.filter(x=>x.woId===w.id&&x.stage==='last').reduce((s,x)=>s+x.qty,0);return [esc(w.no),esc(o.po)+'<div class="smalltxt">'+esc(nameOf('styles',o.styleId,'article'))+'</div>',fmt(o.qty)+' 雙',w.issued?tag('已領料'):short.length?tag('缺 '+short.length+' 項'):tag('可發料'),fmt(total)+' / '+fmt(o.qty),w.issued?`<button class="btn sm" onclick="nav('production')">現場報工 →</button>`:`<button class="btn sm primary" onclick="issueWO('${w.id}')">核對並領料</button>`]}));}
function issueWO(woId){let w=byId('workOrders',woId);if(!w||w.issued)return toast('已發料，禁止重複扣庫');const o=byId('orders',w.orderId),need=needsForOrder(o);const missing=need.filter(x=>x.required>stockQty(x.matId,x.size)+.00001);if(missing.length)return toast('領料阻擋：欠 '+missing.length+' 項。請先到 MRP 採購並 IQC 收料');if(!confirm('確認製令 '+w.no+' 一次領用全部 BOM 原料？會扣減原料庫存。'))return;for(let x of need)db.stockMovements.push({id:id('mv'),materialId:x.matId,size:x.size,qty:-x.required,reason:'製令領料',sourceId:w.id,createdAt:now()});w.issued=true;w.status='已發料';save('製令發料',w.no)}
function productionPage(){let wos=db.workOrders.filter(x=>x.issued);let out=head('裁斷／針車／成型現場報工','按「製令＋工段＋尺碼」報工。上一站可用餘量不足時，系統阻擋超報、跳站。');if(!wos.length)return out+`<div class="notice">需先從客戶訂單建立製令，再完成原料齊套與領料，才會開放現場報工。</div><button class="btn primary" onclick="nav('workorders')">前往製令發料</button>`;out+=`<div class="panel"><div class="formgrid">${field('reportWo','選擇製令','text',wos[0].id,wos.map(w=>[w.id,w.no+' / '+nameOf('orders',w.orderId,'po')])).replace('name="reportWo"','id="reportWo" onchange="refreshReport()"')}${field('reportStage','工段','text','cut',STAGES).replace('name="reportStage"','id="reportStage" onchange="refreshReport()"')}${field('reportSize','尺碼','text','7',SIZES.map(s=>[s,'US '+s])).replace('name="reportSize"','id="reportSize" onchange="refreshReport()"')}</div><div id="reportStats" style="margin-top:17px"></div><div class="toolbar"><button class="btn primary" onclick="quickReport(1)">＋1 雙</button><button class="btn primary" onclick="quickReport(6)">＋6 雙</button><button class="btn primary" onclick="quickReport(12)">＋12 雙</button><button class="btn" onclick="customReport()">自訂雙數</button></div></div>`;out+=table(['報工時間','製令','工段','尺碼','良品雙數'],db.production.slice().reverse().slice(0,50).map(p=>[esc(p.createdAt.slice(0,16).replace('T',' ')),esc(byId('workOrders',p.woId)?.no),esc(STAGES.find(x=>x[0]===p.stage)?.[1]),esc(p.size),fmt(p.qty)]));return out}
function reportLimit(w,stage,size){const o=byId('orders',w.orderId),max=stage==='cut'?n(o.sizes[size]):stage==='sew'?stageQty(w,'cut',size):stageQty(w,'sew',size);return Math.max(0,max-stageQty(w,stage,size))}
function refreshReport(){let w=byId('workOrders',document.getElementById('reportWo')?.value),stage=document.getElementById('reportStage')?.value,size=document.getElementById('reportSize')?.value;if(!w)return;const o=byId('orders',w.orderId),max=reportLimit(w,stage,size),done=stageQty(w,stage,size);document.getElementById('reportStats').innerHTML=`<div class="metricline"><div class="mini">訂單目標<strong>${fmt(o.sizes[size])} 雙</strong></div><div class="mini">本站已完成<strong>${fmt(done)} 雙</strong></div><div class="mini">目前可報上限<strong style="color:${max?'#137b71':'#a34b2a'}">${fmt(max)} 雙</strong></div></div>`}
function addReport(woId,stage,size,qty){let w=byId('workOrders',woId);if(!w?.issued)throw Error('製令尚未發料');if(qty<=0||!Number.isInteger(qty)||qty>reportLimit(w,stage,size))throw Error('超過上一站可用量；目前最多 '+reportLimit(w,stage,size)+' 雙');db.production.push({id:id('prd'),woId,stage,size,qty,createdAt:now()});record('現場報工',w.no+' '+stage+' US'+size+' '+qty+' 雙');refreshReport();toast('已報工 '+qty+' 雙')}
function quickReport(qty){try{addReport(document.getElementById('reportWo').value,document.getElementById('reportStage').value,document.getElementById('reportSize').value,qty)}catch(e){toast(e.message)}}
function customReport(){const w=document.getElementById('reportWo').value,stage=document.getElementById('reportStage').value,size=document.getElementById('reportSize').value,limit=reportLimit(byId('workOrders',w),stage,size);openModal('自訂報工雙數（最多 '+limit+'）',field('qty','合格完成雙數','number',limit,null,'required min="1" step="1"'),d=>{addReport(w,stage,size,n(d.qty));return true})}
function qcPage(){return head('成品品管 QC／合格放行','成型後需 QC 品檢，合格雙數才允許進入包裝與成品倉。不良品此版先記錄隔離；返工重驗為後續擴充。')+`<div class="toolbar"><button class="btn primary" onclick="addQC()">＋ 新增 QC 檢驗</button></div>`+table(['時間','製令','尺碼','合格','不良','問題備註'],db.qc.slice().reverse().map(q=>[esc(q.createdAt.slice(0,16).replace('T',' ')),esc(byId('workOrders',q.woId)?.no),esc(q.size),fmt(q.pass),fmt(q.reject),esc(q.reason)]));}
function addQC(){let wos=db.workOrders.filter(w=>SIZES.some(s=>stageQty(w,'last',s)>qcQty(w,s,'pass')+qcQty(w,s,'reject')));if(!wos.length)return toast('沒有成型後未驗的雙數，請先進行成型報工');openModal('成品檢驗（FQC）',field('woId','製令','text',wos[0].id,wos.map(w=>[w.id,w.no]))+field('size','尺碼','text','7',SIZES.map(s=>[s,'US '+s]))+field('pass','合格雙數','number',0,null,'min="0" step="1" required')+field('reject','不良雙數','number',0,null,'min="0" step="1" required')+field('reason','不良原因：開膠/溢膠/跳針/色差等','text',''),d=>{let w=byId('workOrders',d.woId),pass=n(d.pass),reject=n(d.reject),limit=stageQty(w,'last',d.size)-qcQty(w,d.size,'pass')-qcQty(w,d.size,'reject');if(!Number.isInteger(pass)||!Number.isInteger(reject)||pass<0||reject<0||pass+reject<=0||pass+reject>limit)throw Error('此尺碼最多可檢驗 '+limit+' 雙');if(reject>0&&!d.reason.trim())throw Error('不良雙數須填原因');db.qc.push({id:id('qc'),woId:w.id,size:d.size,pass,reject,reason:d.reason,createdAt:now()});save('QC 成品檢驗',w.no+' 合格'+pass+' 不良'+reject);return true})}
function packingPage(){return head('包裝放行／成品入庫','只有 QC 合格且尚未入庫的雙數可包裝；每次按尺碼入成品庫，避免跳過品檢。')+`<div class="toolbar"><button class="btn primary" onclick="packForm()">＋ 合格品包裝入庫</button></div>`+table(['製令','鞋型 / 尺碼','包裝入庫','時間'],db.fgMovements.filter(x=>x.qty>0).slice().reverse().map(x=>[esc(byId('workOrders',x.woId)?.no),esc(nameOf('styles',byId('orders',x.orderId)?.styleId,'article'))+' / US'+esc(x.size),fmt(x.qty)+' 雙',esc(x.createdAt.slice(0,16).replace('T',' '))]));}
function packForm(){let wos=db.workOrders.filter(w=>SIZES.some(s=>qcQty(w,s,'pass')>packedQty(w,s)));if(!wos.length)return toast('沒有 QC 放行待入庫的雙數');openModal('包裝成品入庫',field('woId','製令','text',wos[0].id,wos.map(w=>[w.id,w.no]))+field('size','尺碼','text','7',SIZES.map(s=>[s,'US '+s]))+field('qty','入庫良品雙數','number',1,null,'required min="1" step="1"')+field('boxNo','包裝箱號/批次','text','BOX-'+today().replaceAll('-','')),d=>{let w=byId('workOrders',d.woId),q=n(d.qty),allow=qcQty(w,d.size,'pass')-packedQty(w,d.size);if(!Number.isInteger(q)||q<=0||q>allow)throw Error('此尺碼 QC 可入庫剩餘 '+allow+' 雙');db.fgMovements.push({id:id('fg'),woId:w.id,orderId:w.orderId,size:d.size,qty:q,reason:'包裝合格入庫',boxNo:d.boxNo,createdAt:now()});save('包裝成品入庫',w.no+' '+q+'雙');return true})}
function fgPage(){let rows=db.orders.flatMap(o=>SIZES.filter(s=>n(o.sizes[s])>0).map(s=>[esc(o.po),esc(nameOf('styles',o.styleId,'article')),esc(s),fmt(fgQty(o.id,s)),fmt(db.fgMovements.filter(x=>x.orderId===o.id&&x.size===s&&x.qty>0).reduce((a,x)=>a+x.qty,0)),fgQty(o.id,s)>0?tag('可出貨'):tag('無現貨')]));return head('成品倉｜鞋型／尺碼結餘','成品結餘 = QC 放行包裝入庫－實際出貨。不同客戶 PO 的成品在初版分開管理。')+table(['客戶 PO','Article','尺碼 US','目前現貨','累計入庫','狀態'],rows)}
function shippingPage(){return head('裝箱與正式出貨','只能出貨已 QC 放行入庫的成品。可同時填多個尺碼，裝箱後才扣成品庫並產生 AR 應收發票。')+`<div class="toolbar"><button class="btn primary" onclick="shipmentForm()">＋ 建立出貨與 Invoice</button></div>`+table(['出貨單/發票','訂單與客戶','尺碼明細','出貨雙數','金額 USD','櫃號/日期'],db.shipments.slice().reverse().map(x=>[esc(x.no)+'<div class="smalltxt">'+esc(x.invoiceNo)+'</div>',esc(nameOf('orders',x.orderId,'po'))+'<div class="smalltxt">'+esc(nameOf('customers',byId('orders',x.orderId)?.customerId))+'</div>',Object.entries(x.sizes).filter(([s,q])=>q).map(([s,q])=>'US'+s+':'+q).join(' · '),fmt(x.qty),money(x.amount),esc(x.container||'—')+'<div class="smalltxt">'+esc(x.shipDate)+'</div>']));}

function isEnglish(){return (db?.settings?.lang||'zh')==='en'}
function t(zh,en){return isEnglish()?(en||termEnglish[zh]||pageEnglish[zh]||zh):zh}
function xDate(v){if(!v)return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(s.includes('T')){const d=new Date(s);if(!Number.isNaN(+d))return d.toLocaleDateString('en-CA',{timeZone:'Asia/Phnom_Penh'})}return s.slice(0,10)}
function isoDate(d){return d.toISOString().slice(0,10)}
function shiftDate(str,n,unit){let d=new Date(str+'T12:00:00Z');if(unit==='年'){const day=d.getUTCDate();d.setUTCDate(1);d.setUTCFullYear(d.getUTCFullYear()+n);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()))}else if(unit==='月'){const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()))}else d.setUTCDate(d.getUTCDate()+n*(unit==='週'?7:1));return isoDate(d)}
function anchor(){return db.settings.periodAnchor||today()}
function periodRange(){let d=new Date(anchor()+'T12:00:00Z'),s=new Date(d),e=new Date(d);if(period==='週'){const diff=(d.getUTCDay()+6)%7;s.setUTCDate(d.getUTCDate()-diff);e.setUTCDate(s.getUTCDate()+6)}else if(period==='月'){s.setUTCDate(1);e=new Date(Date.UTC(s.getUTCFullYear(),s.getUTCMonth()+1,0,12))}else if(period==='年'){s=new Date(Date.UTC(d.getUTCFullYear(),0,1,12));e=new Date(Date.UTC(d.getUTCFullYear(),11,31,12))}return {from:isoDate(s),to:isoDate(e)}}
inPeriod=function(date){const v=xDate(date),r=periodRange();return !!v&&v>=r.from&&v<=r.to};
function setPeriod(p){period=p;db.settings.period=p;persist();render()}
function slidePeriod(direction){db.settings.periodAnchor=shiftDate(anchor(),direction,period);persist();render()}
function pickPeriodDate(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v)){db.settings.periodAnchor=v;persist();render()}}
function changeLang(){db.settings.lang=isEnglish()?'zh':'en';persist();render();document.documentElement.lang=isEnglish()?'en':'zh-Hant'}
function resetAnchor(){db.settings.periodAnchor=today();persist();render()}
function groupHome(g){return g==='ops'?'dashboard':g==='finance'?'financehome':g==='hr'?'hrhome':'gahome'}
function openGroup(id){currentGroup=id;active=groupHome(id);render();window.scrollTo({top:0,behavior:'instant'})}
function globalChrome(){const r=periodRange(),g=groupList.find(x=>x.id===currentGroup)||groupList[0];return `<section class="s2-nav"><div class="s2-topline"><span>👟 <b>ShoeOS</b> <span class="s2-muted">· ${t('四套系統，一個工作台','Four systems, one workspace')}</span></span><button class="btn sm s2-lang" onclick="changeLang()">🌐 ${isEnglish()?'中文':'EN'}</button></div><div class="s2-periodrow"><div class="period s2-period">${['日','週','月','年'].map(x=>`<button class="${period===x?'active':''}" onclick="setPeriod('${x}')">${t(x)}</button>`).join('')}</div><div class="s2-range"><button class="s2-arrow" onclick="slidePeriod(-1)" aria-label="Previous period">❮</button><label class="s2-date"><input aria-label="Choose date" type="date" value="${anchor()}" onchange="pickPeriodDate(this.value)"><span>${r.from===r.to?r.from:r.from+' ～ '+r.to}</span></label><button class="s2-arrow" onclick="slidePeriod(1)" aria-label="Next period">❯</button><button class="s2-now" onclick="resetAnchor()">${t('今天','Today')}</button></div></div><div class="s2-groups">${groupList.map(x=>`<button class="s2-group ${currentGroup===x.id?'selected':''}" style="--tone:${x.tone}" onclick="openGroup('${x.id}')">${isEnglish()?groupEnglish[x.id]:x.name}</button>`).join('')}</div><div class="s2-sub" id="s2sub" aria-label="${t('左右滑動切換分頁','Swipe for other modules')}">${g.menus.map(x=>`<button class="s2-tab ${active===x[0]?'selected':''}" data-page="${x[0]}" onclick="nav('${x[0]}')">${x[2]} ${esc(isEnglish()?(pageEnglish[x[0]]||x[1]):x[1])}</button>`).join('')}</div><div class="s2-swipehint">⇆ ${t('上方可左右滑動選項，內容頁也可左右切換','Swipe tabs above, or swipe the page to change modules')} · ${t('點資料列查看詳情','Tap a row for details')}</div></section>`}

function translateUI(root){if(!isEnglish()||!root)return;const blocks='SCRIPT,STYLE,INPUT,TEXTAREA,OPTION,PRE,CODE';const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let el,arr=[];while(el=walker.nextNode())arr.push(el);for(const node of arr){const parent=node.parentElement;if(!parent||parent.closest(blocks)||parent.closest('tbody')||parent.closest('.s2-nav')||parent.closest('.s2-sheet'))continue;const raw=node.nodeValue;const trimmed=raw.trim();if(!trimmed)continue;let replacement=termEnglish[trimmed]||pageEnglish[trimmed];if(!replacement){for(const [zh,en] of Object.entries(pageEnglish)){const cn=groupList.flatMap(x=>x.menus).find(m=>m[0]===zh)?.[1];if(cn===trimmed){replacement=en;break}}}if(!replacement&&trimmed.startsWith('共 ')&&trimmed.includes(' 筆'))replacement=trimmed.replace('共 ','Total ').replace(' 筆',' records');if(replacement)node.nodeValue=raw.replace(trimmed,replacement)}}
function dateOf(it){if(!it)return '';return it.createdAt||it.workDate||it.shipDate||it.date||it.updatedAt||it.acquired||it.eta||it.etd||''}
function viewRecords(page){switch(page){
 case 'stock':{let a=[];for(const m of db.materials.filter(x=>!x.archived))for(const sz of m.sizeAware?SIZES:[''])a.push({kind:'raw',item:m,size:sz});return a}
 case 'finished':return db.orders.flatMap(o=>SIZES.filter(s=>n(o.sizes?.[s])>0).map(s=>({kind:'fg',item:o,size:s})));
 case 'packing':return db.fgMovements.filter(x=>x.qty>0).slice().reverse().map(x=>({kind:'fgmove',item:x}));
 case 'production':return db.production.slice().reverse().slice(0,50).map(x=>({kind:'production',item:x}));
 case 'quality':return db.qc.slice().reverse().map(x=>({kind:'qc',item:x}));
 case 'shipping':return db.shipments.slice().reverse().map(x=>({kind:'shipments',item:x}));
 case 'ap':return db.ap.slice().reverse().map(x=>({kind:'ap',item:x}));
 case 'ar':return db.ar.slice().reverse().map(x=>({kind:'ar',item:x}));
 case 'logs':return db.audit.map(x=>({kind:'audit',item:x}));
 case 'rawledger':return rawBalances().map(x=>({kind:'raw',item:x.item,size:x.size}));
 case 'fgledger':return fgBalances().map(x=>({kind:'fg',item:x.item,size:x.size}));
 case 'assetledger':return db.assets.filter(a=>!a.archived).map(a=>({kind:'assets',item:a}));
 case 'payroll':return db.employees.filter(x=>!x.archived).map(x=>({kind:'employees',item:x}));
 case 'costing':return db.orders.map(x=>({kind:'orders',item:x}));
 case 'bom':return db.boms.map(x=>({kind:'boms',item:x}));
 case 'orders':return db.orders.map(x=>({kind:'orders',item:x}));
 case 'purchases':return db.purchaseOrders.map(x=>({kind:'purchaseOrders',item:x}));
 case 'receipts':return db.receipts.map(x=>({kind:'receipts',item:x}));
 case 'workorders':return db.workOrders.map(x=>({kind:'workOrders',item:x}));
 default:if(masters[page])return db[page].filter(x=>!x.archived).map(x=>({kind:page,item:x}));return [];
}}
const timelessPages=new Set(['customers','suppliers','styles','materials','bom','stock','finished','costing','employees','tooling','assets','rawledger','fgledger','assetledger','payroll']);
function enhanceTables(){const entries=viewRecords(active),tables=[...document.querySelectorAll('#app .data')];let ix=0,visible=0,filtered=0;for(const tab of tables){const rows=[...tab.querySelectorAll('tbody tr')];for(const row of rows){if(row.querySelector('td[colspan]'))continue;const ent=entries[ix++];if(!ent)continue;row.classList.add('s2-row');row.setAttribute('tabindex','0');row.setAttribute('role','button');row.setAttribute('aria-label',t('查看詳細資料','Open record details'));if(ent.item?._demo||isDemo(ent.kind,ent.item))row.classList.add('s2-demo-row');if(ent.item?.photoData&&/^data:image\/(jpeg|png|webp);base64,/.test(ent.item.photoData)){const first=row.querySelector('td');if(first)first.insertAdjacentHTML('afterbegin',`<img class="s2-thumb" src="${esc(ent.item.photoData)}" alt="" loading="lazy">`)}if(!timelessPages.has(active)){const dt=dateOf(ent.item);if(dt&&!inPeriod(dt)){row.classList.add('s2-outperiod');row.hidden=true;filtered++;continue}}visible++;const open=()=>showRecord(ent);row.addEventListener('click',e=>{if(e.target.closest('button,input,select,a,label'))return;open()});row.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.target.closest('button,input,select'))open()})}
 if(rows.length&&visible===0&&filtered){const tr=document.createElement('tr');tr.className='s2-none';tr.innerHTML=`<td colspan="${tab.querySelectorAll('thead th').length}"><div class="empty">${t('選取期間內無紀錄，可切換日期或查看全部資料','No records for selected period. Change the date to view others.')}</div></td>`;tab.querySelector('tbody').appendChild(tr)}}

function linkedRecords(ent){const x=ent.item,k=ent.kind,rows=[];function add(label,items,mapper){if(items.length)rows.push(`<div class="s2-linkgroup"><h4>${t(label,({採購單:'Purchase orders',製令:'Work orders',出貨單:'Shipments',應收帳款:'Accounts receivable',收料單:'Receipts',應付帳款:'Accounts payable',BOM明細:'BOM items',材料異動:'Material moves',生產報工:'Production updates',成品異動:'FG movements',資產異動:'Asset movements',相關訂單:'Sales orders'})[label])}</h4>${items.slice(-70).map(a=>`<div class="s2-related">${esc(mapper(a))}</div>`).join('')}</div>`)}

 return rows.join('')||`<div class="empty">${t('尚無關聯單據','No linked documents')}</div>`;

function entryMovements(ent){const k=ent.kind,x=ent.item;let arr=[];if(k==='raw'||k==='materials')arr=db.stockMovements.filter(y=>y.materialId===x.id&&(ent.size?y.size===ent.size:true));else if(k==='fg'||k==='orders')arr=db.fgMovements.filter(y=>y.orderId===x.id&&(ent.size?y.size===ent.size:true));else if(k==='assets')arr=db.assetMovements.filter(y=>y.assetId===x.id);else if(k==='ap'||k==='ar')arr=db.settlements.filter(y=>y.docId===x.id&&y.type===k);else if(k==='workOrders')arr=db.production.filter(y=>y.woId===x.id);else if(k==='purchaseOrders')arr=db.receipts.filter(y=>y.purchaseId===x.id);else arr=db.audit.filter(y=>String(y.details||'').includes(x.no||x.po||x.code||x.assetNo||'§§§'));return arr.length?arr.slice().reverse().map(y=>`<div class="s2-move"><b>${esc(xDate(y.createdAt||y.date))}</b><span>${esc(y.reason||y.stage||y.no||y.action||y.type||'')}</span><strong>${esc(String(y.qty??y.amount??''))}</strong></div>`).join(''):`<div class="empty">${t('尚無異動紀錄','No movements yet')}</div>`}

function sheetContent(ent){const k=ent.kind,x=ent.item;let data={...x};const art=(k==='fg'||k==='orders')?byId('styles',x.styleId):null;const photo=x.photoData||art?.photoData;const photoPreview=photo&&/^data:image\/(jpeg|png|webp);base64,/.test(photo)?`<div class="s2-photo"><img src="${esc(photo)}" alt="Item photo"></div>`:'';if(k==='raw')data={...x,size:ent.size||t('通用','General'),currentStock:stockQty(x.id,ent.size||''),incoming:qtyIncoming(x.id,ent.size||'')};if(k==='fg')data={...x,size:ent.size,availablePairs:fgQty(x.id,ent.size),receivedPairs:db.fgMovements.filter(y=>y.orderId===x.id&&y.size===ent.size&&y.qty>0).reduce((a,y)=>a+y.qty,0)};if(k==='assets')data={...x,availableQty:assetQty(x.id)};if(sheetTab===0)return photoPreview+`<div class="s2-kvwrap">${kvRows(data)}</div>`;if(sheetTab===1)return entryMovements(ent);if(sheetTab===2)return linkedRecords(ent);return `<div class="s2-actions">${actionButtons(ent)}</div>`}

function renderSheet(){if(!sheetEntry)return;document.getElementById('s2sheet')?.remove();const ent=sheetEntry,labels=isEnglish()?['Overview','Movements','Related','Actions']:['基本資訊','出入紀錄','關聯單據','操作選項'];document.body.insertAdjacentHTML('beforeend',`<div id="s2sheet" class="s2-sheetbg" role="presentation"><div class="s2-sheet" role="dialog" aria-modal="true" aria-label="${esc(t('詳細資料','Item details'))}"><div class="s2-sheethead"><div><div class="s2-muted">${esc(pageEnglish[active]||active)} · ${t('詳細資料','Item details')}</div><strong>${esc(detailTitle(ent))}</strong></div><button class="s2-close" onclick="closeSheet()">✕</button></div><div class="s2-sheet-tabs">${labels.map((x,i)=>`<button onclick="detailChange(${i})" class="${i===sheetTab?'selected':''}">${x}</button>`).join('')}</div><div class="s2-sheetbody" id="s2sheetBody">${sheetContent(ent)}</div><div class="s2-sheetfoot"><button class="btn" onclick="detailChange(${sheetTab-1})">❮</button><span>${sheetTab+1} / 4 · ${t('左右滑動切換內容，上下滑看明細','Swipe left/right for tabs; scroll for more')}</span><button class="btn" onclick="detailChange(${sheetTab+1})">❯</button></div></div></div>`);document.body.classList.add('s2-sheetopen');const bg=document.getElementById('s2sheet');bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});let touch=null;bg.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});bg.addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.45)detailChange(sheetTab+(dx<0?1:-1));touch=null},{passive:true})}
function uploadItemPhoto(k,key){const item=byId(k,key);if(!item)return;const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp';input.style.display='none';input.addEventListener('change',()=>{const file=input.files?.[0];if(!file){input.remove();return}if(file.size>8*1024*1024){toast(t('圖片原檔須小於 8MB','Photo source must be below 8MB'));input.remove();return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,720/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const uri=canvas.toDataURL('image/jpeg',.58);const old=item.photoData;item.photoData=uri;if(!persist()){item.photoData=old;persist();toast(t('照片無法存入瀏覽器，請先備份並釋放空間','Cannot store image; free space or export a backup.'))}else{record('物品照片','更新 '+(item.name||item.article||item.code||key));renderSheet();render()}input.remove()};img.onerror=()=>{toast(t('照片無法讀取','Invalid image file'));input.remove()};img.src=reader.result};reader.readAsDataURL(file)},{once:true});document.body.appendChild(input);input.click()}

function masterDependants(k,key){if(k==='styles')return db.orders.some(x=>x.styleId===key)||db.boms.some(x=>x.styleId===key);if(k==='materials')return db.boms.some(x=>x.materialId===key)||db.stockMovements.some(x=>x.materialId===key)||db.purchaseOrders.some(x=>x.lines.some(y=>y.matId===key));if(k==='customers')return db.orders.some(x=>x.customerId===key);if(k==='suppliers')return db.purchaseOrders.some(x=>x.supplierId===key)||db.materials.some(x=>x.supplierId===key);if(k==='employees')return db.attendance.some(x=>x.empNo===byId('employees',key)?.empNo);if(k==='assets')return db.assetMovements.some(x=>x.assetId===key);return false}

function normalizeDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:today()}
function migrateExt(){db.settings=db.settings||{};db.settings.lang=db.settings.lang||'zh';db.settings.period=db.settings.period||'月';db.settings.periodAnchor=db.settings.periodAnchor||today();db.assets=db.assets||[];db.assetMovements=db.assetMovements||[];db.closures=db.closures||[];db.importHistory=db.importHistory||[];if(db.assets.length===0&&db.orders.some(x=>String(x.po).startsWith('DEMO-'))&&db.audit.length===0){db.assets.push({id:'asset_demo_1',assetNo:'DEMO-AST001',name:'針車設備（示範）',category:'機器設備',department:'針車',location:'A 區',keeper:'組長',qtyOpening:3,cost:450,acquired:today(),status:'使用中',createdAt:now(),_demo:true},{id:'asset_demo_2',assetNo:'DEMO-AST002',name:'裁斷機（示範）',category:'機器設備',department:'裁斷',location:'B 區',keeper:'主管',qtyOpening:1,cost:1300,acquired:today(),status:'使用中',createdAt:now(),_demo:true})}period=db.settings.period;document.documentElement.lang=isEnglish()?'en':'zh-Hant';persist()}

function assetMoveForm(key=''){const selected=key||db.assets.find(x=>!x.archived)?.id;if(!selected)return toast(t('請先建立資產資料','Create an asset first'));openModal(t('資產出入／盤點登記','Record asset movement'),field('assetId','資產','text',selected,opts('assets'))+field('moveType','異動類型','text','IN',[['IN',t('入庫／購入','Receipt')],['OUT',t('領出／報廢','Issue / disposal')],['RETURN',t('退回入庫','Return')],['ADJPLUS',t('盤點盤盈（增加）','Stocktake gain (+)')],['ADJMINUS',t('盤點盤虧（減少）','Stocktake loss (-)')],['TRANSFER',t('位置調撥（不改數量）','Transfer location')]])+field('qty','數量（正數）','number',1,null,'min="0.001" step="0.001" required')+field('date','日期','date',today(),null,'required')+field('location','去向／庫位','text','')+field('reason','異動事由','text','',null,'required'),d=>{const a=byId('assets',d.assetId),q=n(d.qty);if(!a||q<=0)throw Error('資產或數量錯誤');let signed=['OUT','ADJMINUS'].includes(d.moveType)?-q:d.moveType==='TRANSFER'?0:q;if(assetQty(a.id)+signed<0)throw Error('庫存不足，不能超領');const v={id:id('amv'),assetId:a.id,qty:signed,units:q,moveType:d.moveType,reason:d.reason,date:d.date,location:d.location,createdAt:now()};db.assetMovements.push(v);save('資產異動',a.assetNo+' / '+signed);return true})}
function fgAdjust(orderId,size){const o=byId('orders',orderId);if(!o)return;openModal(t('成品盤點差異調整','Finished goods stock adjustment'),`<div class="field full"><div class="notice">${esc(o.po)} / US ${esc(size)} · ${t('此為盤點更正，並非 QC 合格入庫；請填寫原因並留存稽核紀錄。','This is a stocktake correction, not a QC release. State the reason clearly.')}</div></div>`+field('qty','調整量（+增加 / -減少）','number',0,null,'step="1" required')+field('reason','盤點差異原因','text','',null,'required'),d=>{const q=Number(d.qty);if(!Number.isInteger(q)||q===0||fgQty(o.id,size)+q<0)throw Error('須輸入非零整數，且不得使庫存變負');db.fgMovements.push({id:id('fgmv'),orderId,woId:'',size,qty:q,reason:'盤點差異調整：'+d.reason,createdAt:now(),sourceType:'stocktake'});save('成品盤點更正',o.po+'/US'+size+' '+q);return true})}
function rawBalances(){let out=[];for(const item of db.materials){for(const size of item.sizeAware?SIZES:['']){const a=db.stockMovements.filter(x=>x.materialId===item.id&&(x.size||'')===size),r=periodRange(),opening=a.filter(x=>xDate(x.createdAt)<r.from).reduce((s,x)=>s+n(x.qty),0),current=a.filter(x=>inPeriod(x.createdAt)),inc=current.filter(x=>x.qty>0).reduce((s,x)=>s+n(x.qty),0),outQty=-current.filter(x=>x.qty<0).reduce((s,x)=>s+n(x.qty),0);out.push({item,size,opening,inc,out:outQty,closing:opening+inc-outQty,unit:item.unit,hasMovement:a.length>0})}}return out.filter(x=>x.hasMovement||!x.item.archived)}
function fgBalances(){return db.orders.flatMap(item=>SIZES.filter(s=>n(item.sizes?.[s])>0).map(size=>{const a=db.fgMovements.filter(x=>x.orderId===item.id&&x.size===size),r=periodRange(),opening=a.filter(x=>xDate(x.createdAt)<r.from).reduce((s,x)=>s+n(x.qty),0),current=a.filter(x=>inPeriod(x.createdAt)),inc=current.filter(x=>x.qty>0).reduce((s,x)=>s+n(x.qty),0),outQty=-current.filter(x=>x.qty<0).reduce((s,x)=>s+n(x.qty),0);return {item,size,opening,inc,out:outQty,closing:opening+inc-outQty,unit:'雙',hasMovement:a.length>0}}))}

function csvParse(str){str=str.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='"'){if(quoted&&str[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('CSV 引號格式不完整');row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);if(!rows.length)return [];const headers=rows.shift().map(x=>x.trim());return rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??''])))}
async function importPageCSV(kind,input){const file=input.files?.[0];if(!file)return;try{if(!(masters[kind]||kind==='orders'))throw Error('僅可匯入主檔和未開始的訂單');const rows=csvParse(await file.text());if(!rows.length)throw Error('CSV 沒有資料列');if(rows.length>2000)throw Error('每次最多 2000 筆');const keyField=kind==='orders'?'po':kind==='materials'?'code':kind==='styles'?'article':kind==='assets'?'assetNo':kind==='employees'?'empNo':kind==='tooling'?'toolNo':'name';if(!rows[0].hasOwnProperty(keyField))throw Error('缺少欄位 '+keyField+'；請先從系統匯出 CSV 範本');let errors=[],prepared=[];for(let i=0;i<rows.length;i++){const r=rows[i],key=String(r[keyField]||'').trim();if(!key){errors.push('第 '+(i+2)+' 列：缺 '+keyField);continue}const existing=db[kind].find(x=>String(x[keyField]||'')===key);if(kind==='orders'){let sizes={};try{sizes=r.sizes?JSON.parse(r.sizes):Object.fromEntries(SIZES.map(s=>[s,n(r['size'+s])]))}catch{errors.push('第 '+(i+2)+' 列尺碼 JSON 錯誤');continue}let qty=SIZES.reduce((s,x)=>s+n(sizes[x]),0);if(!Number.isInteger(qty)||qty<1||!db.customers.some(x=>x.id===r.customerId)||!db.styles.some(x=>x.id===r.styleId)){errors.push('第 '+(i+2)+' 列：需正確 customerId/styleId/尺碼');continue}if(existing&&hasOrderLinks(existing)){errors.push('第 '+(i+2)+' 列：訂單已有後續作業');continue}prepared.push({existing,value:{...existing,id:existing?.id||id('ord'),po:key,customerId:r.customerId,styleId:r.styleId,fob:n(r.fob),etd:r.etd||today(),sizes,qty,createdAt:existing?.createdAt||now(),status:existing?.status||'待排產'}})}else{let cfg=masters[kind],v={...existing,id:existing?.id||id(kind),createdAt:existing?.createdAt||now()};for(const [fieldName,,type,extra] of cfg.fields){const raw=r[fieldName];if(raw===undefined)continue;v[fieldName]=type==='number'?n(raw):type==='select'?raw==='true':raw;if(type==='ref'&&raw&&!db[extra].some(x=>x.id===raw)){errors.push('第 '+(i+2)+' 列：關聯 '+fieldName+' 不存在')} }if(kind==='assets'&&n(v.qtyOpening)<0)errors.push('第 '+(i+2)+' 列：資產期初不能負數');prepared.push({existing,value:v})}}if(errors.length) function v4AlbumOpen(kind,key){const r=byId(kind,key);if(!r)return toast(v4Bilingual('找不到物品','Item not found'));document.getElementById('v4AlbumUpload')?.remove();const labels=isEnglish()?['Front / upper','Side view','Outsole','Size label / tag','Packaging','Other']:['正面／鞋面','側面','大底','尺碼標／物料標示','包裝','其他'];document.body.insertAdjacentHTML('beforeend',`<div class="v4-keynote-shade" id="v4AlbumUpload" onclick="if(event.target.id==='v4AlbumUpload')v4AlbumClose()"><div class="v4-keynote-panel" role="dialog" aria-modal="true"><div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">📷 ${v4Bilingual('匯入並標示照片','Upload & label photo')}</h2><button class="v3-navbtn" onclick="v4AlbumClose()">✕</button></div><p>${esc(r.name||r.article||r.code||r.assetNo||r.id)} · ${v4Bilingual('每筆最多 8 張，照片儲存於本機','Max 8 photos per item, saved locally')}</p><div class="v4-album-import"><label>${v4Bilingual('照片內容','Photo category')}<select id="v4PicLabel">${labels.map((v,i)=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></label><label>${v4Bilingual('選擇手機圖片（JPG / PNG / WebP）','Choose mobile photo (JPG / PNG / WebP)')}<input id="v4PicFile" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn primary" onclick="v4AlbumSave('${kind}','${key}')">${v4Bilingual('儲存照片與標示','Save photo & label')}</button></div><div class="notice">${v4Bilingual('離線瀏覽器有容量限制；多張照片會壓縮。需跨手機使用時請匯出 JSON 備份。','Browser storage is limited. Images will be compressed. Export a JSON backup to move between devices.')}</div></div></div>`)}
function v4AlbumClose(){document.getElementById('v4AlbumUpload')?.remove()}
function v4AlbumSave(kind,key){const rec=byId(kind,key),f=document.getElementById('v4PicFile')?.files?.[0],label=document.getElementById('v4PicLabel')?.value;if(!rec||!f)return toast(v4Bilingual('請選擇照片','Choose a photo'));if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>10e6)return toast(v4Bilingual('僅支援 JPG、PNG、WebP，小於 10MB','Use JPG/PNG/WebP under 10 MB'));if((rec.photoAlbum||[]).length>=8)return toast(v4Bilingual('每筆最多 8 張照片','Max 8 photos per item'));
 const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const base64=c.toDataURL('image/jpeg',.6),oldPhoto=rec.photoData,oldAlbum=(rec.photoAlbum||[]).slice();rec.photoAlbum=(rec.photoAlbum||[]).concat([{id:id('pic'),label,src:base64,addedAt:now()}]);if(!rec.photoData)rec.photoData=base64;
 if(!persist()){rec.photoData=oldPhoto;rec.photoAlbum=oldAlbum;persist();return toast(v4Bilingual('儲存空間不足，請先匯出備份','Not enough browser storage. Export a backup.'))}
 v4AlbumClose();record('照片新增',`${kind}/${key} ${label}`);renderSheet();render();toast(v4Bilingual('已新增照片與標示','Photo and label saved'))};img.onerror=()=>toast(v4Bilingual('圖片無法解碼','Cannot read photo'));img.src=fr.result};fr.readAsDataURL(f)}
function v4PhotoButtons(e){const own=v4PhotoOwner(e);if(!own?.record)return '';const k=own.kind,r=own.record;
 return `<span class="v4-photo-actions"><button onclick="v4AlbumOpen('${k}','${r.id}')">📷 ${v4Bilingual('新增標示照片','Add tagged photo')}</button>${r.photoData?`<button onclick="removeItemPhoto('${k}','${r.id}')">✕</button>`:''}</span>`}
function v4AlbumViewer(kind,key,index){const rec=byId(kind,key);if(!rec?.photoAlbum?.[index])return;const x=rec.photoAlbum[index];document.getElementById('v4ImageBox')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="v4ImageBox" class="v4-image-lightbox" onclick="if(event.target.id==='v4ImageBox')v4ClosePhotoViewer()"><div style="color:#fff;margin-bottom:9px">${esc(x.label||'Photo')}</div><img src="${esc(x.src)}" alt="${esc(x.label)}"><div style="display:flex;gap:8px"><button class="btn" onclick="v4SetCover('${kind}','${key}',${index})">${v4Bilingual('設為封面','Set cover')}</button><button class="btn red" onclick="v4DeleteAlbumImage('${kind}','${key}',${index})">${v4Bilingual('刪除照片','Delete photo')}</button><button class="btn" onclick="v4ClosePhotoViewer()">✕</button></div></div>`)}
function v4ClosePhotoViewer(){document.getElementById('v4ImageBox')?.remove()}
function v4SetCover(kind,key,i){const rec=byId(kind,key);if(!rec?.photoAlbum?.[i])return;rec.photoData=rec.photoAlbum[i].src;persist();v4ClosePhotoViewer();renderSheet();render()}
function v4DeleteAlbumImage(kind,key,i){const rec=byId(kind,key);if(!rec?.photoAlbum?.[i])return;if(!confirm(v4Bilingual('刪除此張照片嗎？','Delete this photo?')))return;const deleted=rec.photoAlbum.splice(i,1)[0];if(deleted.src===rec.photoData)rec.photoData=rec.photoAlbum[0]?.src||'';persist();v4ClosePhotoViewer();renderSheet();render()}
const v4OldPhotoFigure=v4PhotoFigure;
v4PhotoFigure=function(e){const html=v4OldPhotoFigure(e),own=v4PhotoOwner(e),rec=own?.record;if(!rec?.photoAlbum?.length)return html;
 const album=`<div class="v4-album-strip">${rec.photoAlbum.map((photo,i)=>`<button class="v4-album-tile" onclick="v4AlbumViewer('${own.kind}','${rec.id}',${i})" title="${esc(photo.label)}"><img src="${esc(photo.src)}" alt="${esc(photo.label)}"><span>${esc(photo.label)}</span></button>`).join('')}</div>`;return html+album};
// All new card camera icons enter the tagged importer; older quick photo action remains available as fallback.
v4PhotoClick=function(i){const e=v3BookFiltered()[i],owner=v4PhotoOwner(e);if(owner?.record)v4AlbumOpen(owner.kind,owner.record.id)};
function v4MoveKpi(dir){const el=document.querySelector('#app .hero .kpis');if(!el)return;el.scrollBy({left:dir*el.clientWidth*.95,behavior:'smooth'})}
const v4PriorAddDemoTools=v4AddDemoTools;
v4AddDemoTools=function(){v4PriorAddDemoTools();const hero=document.querySelector('#app .hero'),kpi=hero?.querySelector('.kpis');if(kpi&&!hero.querySelector('.v4-kpi-controls'))kpi.insertAdjacentHTML('afterend',`<div class="v4-kpi-controls"><button onclick="v4MoveKpi(-1)">◀</button><span>${v4Bilingual('左右滑動查看所有指標','Swipe for all KPIs')}</span><button onclick="v4MoveKpi(1)">▶</button></div>`)};
render();
// Context-rich summary for each record, calculated from linked local documents rather than fake dashboard figures.
const v4LabelOld=v3Label;
v3Label=function(e){if(e.kind==='styles')return [e.item.article,e.item.name].filter(Boolean).join(' · ');return v4LabelOld(e)};
function v4SummaryPair(title,value){return `<div class="v4-miniStat">${esc(title)}<b>${esc(String(value))}</b></div>`}
function v4RecordSummary(e){const o=e.item||{},k=e.kind;let values=[];
 if(k==='styles'){const orders=db.orders.filter(x=>x.styleId===o.id);const bom=db.boms.filter(x=>x.styleId===o.id);const purchased=orders.reduce((s,x)=>s+n(x.qty),0);values=[[v4Bilingual('客戶訂單','Sales orders'),orders.length],[v4Bilingual('累計雙數','Ordered pairs'),fmt(purchased)],[v4Bilingual('BOM 料項','BOM lines'),bom.length],[v4Bilingual('標準工時／雙','SMV / pair'),fmt(o.smv,1)+' min']]}
 else if(k==='orders'||k==='fg'){const sh=db.shipments.filter(x=>x.orderId===o.id).reduce((s,x)=>s+n(x.qty),0),fg=Object.keys(o.sizes||{}).reduce((s,sz)=>s+fgQty(o.id,sz),0);values=[[v4Bilingual('訂單雙數','Order pairs'),fmt(o.qty)],[v4Bilingual('已出貨','Shipped'),fmt(sh)],[v4Bilingual('成品庫存','Finished stock'),fmt(fg)],[v4Bilingual('尚未交貨','Pending delivery'),fmt(Math.max(0,n(o.qty)-sh))]]}
 else if(['materials','raw'].includes(k)){const all=o.sizeAware?SIZES:[''],size=e.size||'',q=(k==='raw'&&size)?stockQty(o.id,size):all.reduce((s,z)=>s+stockQty(o.id,z),0),pending=(k==='raw'&&size)?qtyIncoming(o.id,size):all.reduce((s,z)=>s+qtyIncoming(o.id,z),0);const movements=db.stockMovements.filter(x=>x.materialId===o.id);values=[[v4Bilingual('可用結存','Available'),fmt(q,2)+' '+(o.unit||'')],[v4Bilingual('採購在途','Incoming'),fmt(pending,2)],[v4Bilingual('收發筆數','Movements'),movements.length],[v4Bilingual('參考單價','Reference price'),money(o.price)]]}
 else if(k==='purchaseOrders'){const lines=o.lines||[],ordered=lines.reduce((s,x)=>s+n(x.qty),0),received=lines.reduce((s,x)=>s+n(x.received),0);values=[[v4Bilingual('物料項數','Material lines'),lines.length],[v4Bilingual('訂購數量','Ordered units'),fmt(ordered)],[v4Bilingual('已到料','Received units'),fmt(received)],[v4Bilingual('尚未到料','Pending units'),fmt(Math.max(0,ordered-received))]]}
 else if(k==='assets'){values=[[v4Bilingual('期初數量','Opening quantity'),fmt(o.qtyOpening)],[v4Bilingual('可用數量','Available'),fmt(assetQty(o.id))],[v4Bilingual('異動筆數','Movements'),db.assetMovements.filter(x=>x.assetId===o.id).length],[v4Bilingual('參考原值','Original cost'),money(o.cost)]]}
 else if(k==='employees'){const at=db.attendance.filter(x=>x.empNo===o.empNo&&inPeriod(x.workDate));values=[[v4Bilingual('本期出勤','Attendance entries'),at.length],[v4Bilingual('正常工時','Regular hours'),fmt(at.reduce((s,x)=>s+n(x.hours),0))],[v4Bilingual('加班工時','Overtime hours'),fmt(at.reduce((s,x)=>s+n(x.ot),0))],[v4Bilingual('工段','Department'),o.dept||'—']]}
 return values.length?`<div class="v4-record-banner">${values.map(([a,b])=>v4SummaryPair(a,b)).join('')}</div>`:''}
const v4OldBookContent=v3BookContent;
v3BookContent=function(ent){const html=v4OldBookContent(ent);if(sheetTab===0)return v4RecordSummary(ent)+html;return html};
const v4OldKeynote=v4OpenKeynote;
v4OpenKeynote=function(page=active){v4OldKeynote(page);const section=document.querySelector('#v4Keynote p');if(section&&['dashboard','financehome','hrhome','gahome'].includes(page)){const counts={dashboard:db.orders.length+db.purchaseOrders.length+db.shipments.length,financehome:db.ap.length+db.ar.length,hrhome:db.employees.length+db.attendance.length,gahome:db.assets.length+db.tooling.length+db.maintenance.length};section.innerHTML=`${v4Bilingual('相關單據合計','Linked record count')}: <b>${counts[page]}</b> ${v4Bilingual('筆（含 DEMO）','records, DEMO included')}`}};
// One-click cleanup of ALL unopened sample records, including original v1/V3 baseline examples.
function v4ClearAllSamples(){const ks=['customers','suppliers','styles','materials','orders','assets','employees','attendance','expenses','tooling','maintenance','security','chemical'];const ds={};for(const k of ks)ds[k]=new Set((db[k]||[]).filter(x=>isDemo(k,x)).map(x=>x.id));
 const empNos=new Set(db.employees.filter(x=>isDemo('employees',x)).map(x=>x.empNo));
 const dPurchase=new Set(db.purchaseOrders.filter(x=>x._v4Demo).map(x=>x.id));const dWork=new Set(db.workOrders.filter(x=>x._v4Demo).map(x=>x.id));const dShip=new Set(db.shipments.filter(x=>x._v4Demo).map(x=>x.id));const dAr=new Set(db.ar.filter(x=>x._v4Demo).map(x=>x.id));const dAp=new Set(db.ap.filter(x=>x._v4Demo).map(x=>x.id));
 const realLinks=[];
 for(const [kind,arr] of Object.entries(db))if(Array.isArray(arr))for(const x of arr){if(!x||x._v4Demo||isDemo(kind,x)||((kind==='boms')&&ds.styles.has(x.styleId))||((kind==='stockMovements')&&x.reason==='示範期初庫存')||((kind==='assetMovements')&&x._demo))continue;
 if(kind==='attendance'&&empNos.has(x.empNo))realLinks.push(kind);
 if(kind==='stockMovements'&&ds.materials.has(x.materialId))realLinks.push(kind);
 if(kind==='fgMovements'&&ds.orders.has(x.orderId))realLinks.push(kind);
 if(kind==='assetMovements'&&ds.assets.has(x.assetId))realLinks.push(kind);
 if(kind==='purchaseOrders'&&(ds.orders.has(x.orderId)||ds.suppliers.has(x.supplierId)||x.lines?.some(l=>ds.materials.has(l.matId))))realLinks.push(kind);
 if(kind==='receipts'&&(dPurchase.has(x.purchaseId)||ds.materials.has(x.matId)))realLinks.push(kind);
 if(kind==='workOrders'&&ds.orders.has(x.orderId))realLinks.push(kind);
 if(kind==='production'&&dWork.has(x.woId))realLinks.push(kind);
 if(kind==='qc'&&dWork.has(x.woId))realLinks.push(kind);
 if(kind==='shipments'&&ds.orders.has(x.orderId))realLinks.push(kind);
 if(kind==='ar'&&dShip.has(x.shipmentId))realLinks.push(kind);
 if(kind==='ap'&&(dPurchase.has(x.purchaseId)||ds.suppliers.has(x.supplierId)))realLinks.push(kind);
 if(kind==='settlements'&&(dAr.has(x.docId)||dAp.has(x.docId)))realLinks.push(kind);
 if(kind==='orders'&&(ds.customers.has(x.customerId)||ds.styles.has(x.styleId)))realLinks.push(kind);
 if(kind==='boms'&&(ds.styles.has(x.styleId)||ds.materials.has(x.materialId)))realLinks.push(kind)
 }
 if(realLinks.length){toast(v4Bilingual('正式資料已引用示範資料，為避免帳務損壞禁止清除：'+[...new Set(realLinks)].join(' / '),'Real transactions reference DEMO records. Removal blocked: '+[...new Set(realLinks)].join(' / ')));return false}
 if(!confirm(v4Bilingual('一鍵清除全部 DEMO：包含所有示範鞋款、訂單、採購、庫存、成品、出貨、薪資出勤等測試資料。正式資料保留，確定執行？建議先匯出備份。','Clear ALL DEMO documents, inventory, shipments, staff and other samples? Real data remains. Export a backup first. Continue?')))return false;
 let removed=0;for(const [k,arr] of Object.entries(db))if(Array.isArray(arr)){const before=arr.length;db[k]=arr.filter(x=>{if(!x)return true;if(x._v4Demo)return false;if(ks.includes(k)&&isDemo(k,x))return false;if(k==='boms'&&ds.styles.has(x.styleId))return false;if(k==='stockMovements'&&x.reason==='示範期初庫存')return false;if(k==='assetMovements'&&x._demo)return false;return true});removed+=before-db[k].length}
 db.settings.v4FullDemo=false;db.settings.v3SampleBootstrapped=true;record('DEMO 清除','共清除 '+removed+' 筆示範資料');closeSheet();render();toast(v4Bilingual('已清除 '+removed+' 筆 DEMO，正式資料保留','Removed '+removed+' DEMO records. Real data preserved.'));return true}
const v4PriorAddToolsAgain=v4AddDemoTools;
v4AddDemoTools=function(){v4PriorAddToolsAgain();document.querySelectorAll('#app .v4-demo-tools button.red').forEach(btn=>{btn.setAttribute('onclick','v4ClearAllSamples()');btn.textContent='✕ '+v4Bilingual('一鍵清除全部 DEMO','Clear ALL DEMO')})};
render();
