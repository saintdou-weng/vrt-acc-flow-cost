<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183247">
<title>聖道開業 SOP 學院</title>
<style>
:root{--bg:#eef3f7;--ink:#182d40;--muted:#627487;--line:#dbe4ec;--card:#fff;--tone:#13786d;--soft:#e7f4f1;--good:#17845f;--bad:#c0392b;--warn:#b7791f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:#ffffffef;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header .logo{width:38px;height:38px;border-radius:11px;background:#183247;color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
header b{display:block;font-size:16px;line-height:1.2}header small{display:block;color:var(--muted);font-size:11px}
header .sp{flex:1}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;font-weight:700;cursor:pointer}
.btn.on{background:var(--tone);border-color:var(--tone);color:#fff}
nav.tabs{position:sticky;top:59px;z-index:15;background:var(--bg);display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:750;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--tone);border-color:var(--tone);color:#fff}
main{max-width:1000px;margin:auto;padding:4px 14px 90px}
.hero{border-radius:20px;padding:20px 18px;color:#fff;background:linear-gradient(135deg,var(--tone),#183247);margin:6px 0 14px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;font-size:24px;line-height:1.3}.hero p{margin:4px 0 0;opacity:.92;font-size:13.5px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.hero .chip{background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:3px 10px;font-size:12px}
.hero .big{position:absolute;right:12px;top:6px;font-size:64px;opacity:.18}
section.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
section.card>h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
section.card>h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tone);color:#fff;font-size:13px;flex:none}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.toc a{font-size:12px;color:var(--tone);background:var(--soft);border-radius:999px;padding:3px 10px;text-decoration:none;font-weight:700}
/* phases */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.flow button{border:2px solid var(--tone);background:#fff;color:var(--tone);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer}
.flow button.on{background:var(--tone);color:#fff}
.flow .ar{color:#9aabba;font-weight:900}
.phase{border:1px solid var(--line);border-left:5px solid var(--tone);border-radius:14px;padding:12px 14px;background:#fbfdfe}
.phase h3{margin:0 0 6px;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.meta span{font-size:12px;background:var(--soft);color:var(--tone);border-radius:8px;padding:2px 8px;font-weight:700}
.phase ul{margin:4px 0 6px;padding-left:20px}.phase li{margin:3px 0}
.tip,.oops{border-radius:11px;padding:8px 11px;margin:8px 0 0;font-size:13.5px}
.tip{background:#eaf7f0;border:1px solid #c5e8d6}.oops{background:#fdf0ee;border:1px solid #f2cbc4}
.sys{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;color:#fff;background:#183247;border-radius:8px;padding:3px 9px;text-decoration:none}
/* tables & bars */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#f3f7fa;font-size:12.5px;color:#41566a}
table tr>td:first-child{min-width:86px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:minmax(92px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .tr{background:#eef2f6;border-radius:8px;height:18px;overflow:hidden}.bar .fl{height:100%;background:var(--tone);border-radius:8px}
.bar .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.total{margin-top:10px;font-weight:800;text-align:right}
/* day timeline */
.day{display:grid;gap:8px}.slot{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start}
.slot .t{font-weight:900;color:var(--tone);font-variant-numeric:tabular-nums;background:var(--soft);border-radius:9px;text-align:center;padding:4px 0}
.slot .d{border-left:3px solid var(--line);padding-left:10px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fbfdfe}
.kpi b{font-size:15px}.kpi .f{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#f1f5f9;border-radius:8px;padding:5px 8px;margin:6px 0;display:block}
.kpi .ex{font-size:13px}.kpi .good{color:var(--good);font-weight:800}
/* calc */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.calc label{font-size:12.5px;color:#41566a;font-weight:700}.calc input{width:100%;border:1px solid #cdd8e3;border-radius:10px;padding:8px 10px;margin-top:3px;font-variant-numeric:tabular-nums}
.res{margin-top:12px;border-radius:14px;padding:12px 14px;background:#183247;color:#fff}
.res .r1{font-size:22px;font-weight:900}.res small{opacity:.85}
.gauge{height:12px;border-radius:8px;background:#ffffff33;margin:8px 0 4px;overflow:hidden}.gauge i{display:block;height:100%;background:#7ee0b8}
/* pros cons */
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc>div{border-radius:14px;padding:10px 12px}.pc .p{background:#eaf7f0;border:1px solid #c5e8d6}.pc .c{background:#fdf0ee;border:1px solid #f2cbc4}
.pc h4{margin:0 0 4px}.pc ul{margin:0;padding-left:18px}
/* cycle svg */
.cyc{display:block;margin:4px auto;max-width:440px;width:100%}
/* glossary */
abbr.g{text-decoration:none;border-bottom:1.5px dotted var(--tone);cursor:help;color:inherit}
#gpop{position:fixed;z-index:60;max-width:min(340px,92vw);background:#183247;color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
#gpop b{display:block;font-size:14px;margin-bottom:2px}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.gl .it{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff}
.gl .it b{color:var(--tone)}.gl .it small{display:block;color:var(--muted);font-size:11.5px}
.gsearch{width:100%;border:1px solid #cdd8e3;border-radius:12px;padding:10px 12px;margin:4px 0 10px}
.stars{color:#e0a100;letter-spacing:1px;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.note a{color:var(--muted)}
@media(max-width:620px){.pc{grid-template-columns:1fr}.hero h1{font-size:21px}.slot{grid-template-columns:58px 1fr}}
@media print{header,nav.tabs,#accMenuBtn{display:none}section.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="logo">📘</div>
  <div><b id="ttl">聖道開業 SOP 學院</b><small id="stl">Saintdou · 五種生意從無到有</small></div>
  <div class="sp"></div>
  <button class="btn" id="langBtn" type="button">EN</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="gpop"></div>
<script>
'use strict';
/* ───────── 語言與小工具 ───────── */
let L=(()=>{try{return localStorage.getItem('acc_os_hub_lang')==='en'?'en':'zh'}catch(e){return 'zh'}})();
const T=(z,e)=>L==='en'?(e??z):z;
const tx=o=>o==null?'':(typeof o==='string'?o:(L==='en'?(o.e??o.z):o.z));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
/* 文字裡的 [[詞]] 會變成可點的名詞解釋 */
function rich(s){return esc(tx(s)).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,lab)=>`<abbr class="g" data-g="${k}">${lab||(G[k]?tx(G[k].n):k)}</abbr>`)}

/* ───────── 名詞表 ───────── */
const G={
CAPEX:{n:{z:'CAPEX 資本支出',e:'CAPEX'},d:{z:'開店前一次花下去、能用很多年的錢：裝修、設備、家具。會分年攤成「折舊」。',e:'One-off spending on things that last years — fit-out, equipment, furniture. Spread over years as depreciation.'}},
OPEX:{n:{z:'OPEX 營運費用',e:'OPEX'},d:{z:'每個月都要付的錢：房租、薪水、水電、網路。',e:'Recurring monthly costs: rent, wages, utilities, internet.'}},
BEP:{n:{z:'損益兩平點',e:'Break-even point'},d:{z:'賣到這個量剛好不賺不賠。公式：固定成本 ÷（售價 − 變動成本）。',e:'The sales volume where profit is zero. Fixed cost ÷ (price − variable cost).'}},
FC:{n:{z:'固定成本',e:'Fixed cost'},d:{z:'不管賣多少都要付的成本，例如房租、正職薪水。',e:'Costs you pay regardless of sales — rent, salaried staff.'}},
VC:{n:{z:'變動成本',e:'Variable cost'},d:{z:'每多賣一份才多花的成本，例如咖啡豆、牛奶、OTA 佣金。',e:'Cost that rises with each unit sold — beans, milk, OTA commission.'}},
CM:{n:{z:'邊際貢獻',e:'Contribution margin'},d:{z:'售價 − 變動成本。每賣一份能拿去付固定成本的錢。',e:'Price − variable cost: what each sale contributes toward fixed costs.'}},
GM:{n:{z:'毛利率',e:'Gross margin'},d:{z:'（營收 − 進貨或原料成本）÷ 營收。零售業最常看的數字。',e:'(Revenue − cost of goods) ÷ revenue.'}},
WC:{n:{z:'週轉金',e:'Working capital'},d:{z:'開幕後到賺錢前，用來付薪水、進貨的備用現金。一般準備 3–6 個月固定支出。',e:'Cash buffer to pay wages and stock before the business earns enough. Usually 3–6 months of fixed costs.'}},
DEP:{n:{z:'折舊',e:'Depreciation'},d:{z:'把設備、裝修的錢分年攤進成本。例：$60,000 設備用 5 年，每年折舊 $12,000。',e:'Spreading equipment cost over its useful life, e.g. $60,000 over 5 years = $12,000/yr.'}},
CF:{n:{z:'現金流',e:'Cash flow'},d:{z:'實際進出口袋的錢。帳上賺錢但收不到款，一樣會倒。',e:'Money actually coming in and going out. Paper profit without cash can still sink you.'}},
AR:{n:{z:'AR 應收帳款',e:'Accounts receivable'},d:{z:'東西賣了、錢還沒收到，例如企業月結、OTA 每月撥款、承包商賒帳。',e:'Sales made but not yet collected — corporate accounts, OTA payouts, contractor credit.'}},
AP:{n:{z:'AP 應付帳款',e:'Accounts payable'},d:{z:'貨收了、錢還沒付給供應商。',e:'Goods received but not yet paid to suppliers.'}},
SOP:{n:{z:'SOP 標準作業程序',e:'SOP'},d:{z:'Standard Operating Procedure：把「誰、什麼時候、怎麼做、做到什麼程度」寫清楚，換人做結果也一樣。',e:'Standard Operating Procedure: who does what, when, how and to what standard — so results are the same whoever does it.'}},
KPI:{n:{z:'KPI 關鍵指標',e:'KPI'},d:{z:'Key Performance Indicator：用幾個數字判斷生意好不好。',e:'Key Performance Indicator: the few numbers that tell you how the business is doing.'}},
POS:{n:{z:'POS 收銀系統',e:'POS'},d:{z:'Point of Sale：結帳、開發票、記錄每一筆銷售的系統。',e:'Point of Sale: the till system that records every sale.'}},
SKU:{n:{z:'SKU 品項',e:'SKU'},d:{z:'Stock Keeping Unit：每一個可賣的規格算一個，例如 1 吋和 2 吋螺絲是兩個 SKU。',e:'Stock Keeping Unit — each sellable variant, e.g. a 1-inch and a 2-inch screw are two SKUs.'}},
BOM:{n:{z:'BOM 用料表／配方',e:'BOM'},d:{z:'Bill of Materials：做一個產品要用哪些料、各多少。咖啡店叫配方，工廠叫用料表。',e:'Bill of Materials: which materials and how much go into one product — a recipe in a café.'}},
MRP:{n:{z:'MRP 物料需求計畫',e:'MRP'},d:{z:'Material Requirements Planning：訂單 × BOM − 現有庫存 = 要買多少、什麼時候買。',e:'Material Requirements Planning: orders × BOM − stock on hand = what to buy and when.'}},
PO:{n:{z:'PO 採購單',e:'Purchase order'},d:{z:'正式向供應商下訂的單據，寫品項、數量、價格、交期。',e:'Formal order to a supplier with items, quantity, price and delivery date.'}},
GRN:{n:{z:'驗收（GRN／IQC）',e:'Goods receipt (GRN/IQC)'},d:{z:'貨到時點數量、看品質、看效期，合格才入庫並產生應付帳款。',e:'Checking quantity, quality and expiry on arrival before stock-in and creating the payable.'}},
SS:{n:{z:'安全庫存',e:'Safety stock'},d:{z:'為了怕缺貨多放的一點庫存。',e:'Extra stock kept to avoid running out.'}},
ROP:{n:{z:'補貨點',e:'Reorder point'},d:{z:'庫存降到這個數字就該下單。= 每日用量 × 交期天數 + 安全庫存。',e:'Stock level that triggers a new order = daily usage × lead time + safety stock.'}},
FIFO:{n:{z:'FIFO 先進先出',e:'FIFO'},d:{z:'先到的貨先賣，避免過期。上架時新貨放後面。',e:'First In, First Out — sell older stock first; put new stock behind.'}},
STK:{n:{z:'盤點',e:'Stocktake'},d:{z:'實際點庫存，和帳上數字比對，找出差異（盤差）。',e:'Physically counting stock and comparing with the books.'}},
SHR:{n:{z:'損耗／短少',e:'Shrinkage'},d:{z:'帳上有、實際沒有的貨：過期、破損、被偷、記錯。損耗率 = 損耗金額 ÷ 營收。',e:'Stock on the books but missing — expiry, damage, theft, errors. Shrink % = shrink ÷ sales.'}},
VAT:{n:{z:'VAT 加值型營業稅',e:'VAT'},d:{z:'柬埔寨一般稅率 10%；台灣的「營業稅」一般 5%；馬來西亞用 SST（銷售稅與服務稅）。',e:'Cambodia standard rate 10%; Taiwan business tax generally 5%; Malaysia uses SST (sales & service tax).'}},
TIN:{n:{z:'稅籍編號',e:'TIN'},d:{z:'Tax Identification Number，向稅務機關登記後拿到，開發票、報稅都要用。',e:'Tax Identification Number issued after tax registration; needed for invoices and filings.'}},
NSSF:{n:{z:'NSSF 柬埔寨社會保障基金',e:'NSSF (Cambodia)'},d:{z:'National Social Security Fund。雇主要幫員工登記並按月繳職災、健康保險與退休金。',e:'Cambodia\'s social security fund; employers register staff and pay monthly occupational-risk, health and pension contributions.'}},
SinglePortal:{n:{z:'柬埔寨線上單一窗口',e:'Cambodia Online Single Portal'},d:{z:'在同一個網站完成商業部公司登記、稅務總局稅籍登記與勞工部申報。',e:'One website for Ministry of Commerce incorporation, GDT tax registration and labour declaration.'}},
GDT:{n:{z:'GDT 柬埔寨稅務總局',e:'GDT'},d:{z:'General Department of Taxation，負責稅籍、VAT、每月申報。',e:'General Department of Taxation — tax registration, VAT, monthly filings.'}},
PATENT:{n:{z:'營業執照稅（Patent Tax）',e:'Patent tax'},d:{z:'柬埔寨每年都要繳的營業登記稅，金額依營業規模而定。',e:'Cambodia\'s annual business-licence tax; amount depends on business size.'}},
/* hotel */
OCC:{n:{z:'OCC 住房率',e:'OCC (occupancy)'},d:{z:'賣出的房間夜數 ÷ 可賣的房間夜數。20 間房 × 30 天 = 600 間夜。',e:'Rooms sold ÷ rooms available. 20 rooms × 30 nights = 600 room-nights.'}},
ADR:{n:{z:'ADR 平均房價',e:'ADR'},d:{z:'Average Daily Rate：房費收入 ÷ 賣出的間夜。',e:'Average Daily Rate = room revenue ÷ room-nights sold.'}},
RevPAR:{n:{z:'RevPAR 每間可售房收入',e:'RevPAR'},d:{z:'房費收入 ÷ 可售間夜 = OCC × ADR。同時看住房率和房價，最公平的比較數字。',e:'Room revenue ÷ room-nights available = OCC × ADR. The fairest single comparison.'}},
GOP:{n:{z:'GOP 營業毛利',e:'GOP'},d:{z:'Gross Operating Profit：總營收扣掉各部門成本與營運費用、還沒扣租金折舊利息之前的利潤。',e:'Gross Operating Profit: revenue minus departmental and operating expenses, before rent, depreciation and interest.'}},
USALI:{n:{z:'USALI 酒店會計制度',e:'USALI'},d:{z:'Uniform System of Accounts for the Lodging Industry：全世界酒店共用的損益表格式，分客房部、餐飲部、營運費用、GOP。',e:'The standard hotel P&L format: Rooms, F&B, undistributed expenses, GOP.'}},
PMS:{n:{z:'PMS 酒店管理系統',e:'PMS'},d:{z:'Property Management System：訂房、入住、房帳、房態、夜審都在這裡。',e:'Property Management System: reservations, check-in, folios, room status, night audit.'}},
OTA:{n:{z:'OTA 線上旅行社',e:'OTA'},d:{z:'Online Travel Agency，例如 Booking.com、Agoda。帶客人來，但抽佣金（常見 15–20%）。',e:'Online Travel Agency like Booking.com or Agoda — brings guests, takes commission (often 15–20%).'}},
FOLIO:{n:{z:'Folio 客帳',e:'Folio'},d:{z:'一位住客在住期間的所有消費明細：房費、餐飲、MiniBar、洗衣。退房時一次結清。',e:'A guest\'s running bill — room, F&B, minibar, laundry — settled at check-out.'}},
NA:{n:{z:'夜審',e:'Night audit'},d:{z:'每晚把當天房費過帳、核對現金與房態，產出當日營運數字，然後「換日」。',e:'Nightly posting of room charges, cash and status checks, producing the day\'s figures before rolling the date.'}},
RS:{n:{z:'房態代碼',e:'Room status codes'},d:{z:'VC 空淨可賣、VD 空髒待清、VI 待查房、OC 住客房已清、OD 住客房待清、OOO 維修停售。',e:'VC vacant clean, VD vacant dirty, VI awaiting inspection, OC occupied clean, OD occupied dirty, OOO out of order.'}},
FFE:{n:{z:'FF&E 家具設備',e:'FF&E'},d:{z:'Furniture, Fixtures & Equipment：床、衣櫃、冷氣、電視等用多年的資產。',e:'Furniture, Fixtures & Equipment — beds, wardrobes, AC, TVs.'}},
OSE:{n:{z:'OS&E 營運備品',e:'OS&E'},d:{z:'Operating Supplies & Equipment：毛巾、床單、杯子、拖鞋等消耗或短期用品。',e:'Operating Supplies & Equipment — towels, linen, cups, slippers.'}},
NOSHOW:{n:{z:'No-show 未到',e:'No-show'},d:{z:'訂了房卻沒來。要有押金或扣款規則。',e:'Guest booked but didn\'t arrive — needs a deposit or charge policy.'}},
OVB:{n:{z:'超賣',e:'Overbooking'},d:{z:'賣出的房比實際房間多。OTA 沒同步最常發生。',e:'Selling more rooms than exist — usually when OTA calendars aren\'t synced.'}},
ACCTAX:{n:{z:'住宿稅（柬埔寨）',e:'Accommodation tax (KH)'},d:{z:'柬埔寨住宿業者按住宿相關收入繳 2%，次月 20 日前申報。',e:'Cambodian lodging providers pay 2% on accommodation-related income, filed by the 20th of the next month.'}},
/* café */
TICKET:{n:{z:'客單價',e:'Average ticket'},d:{z:'營收 ÷ 來客數（或結帳筆數）。',e:'Revenue ÷ number of customers (or bills).'}},
COGS:{n:{z:'食材成本率',e:'COGS %'},d:{z:'Cost of Goods Sold：原料與包材成本 ÷ 營收。咖啡店常見 25–35%。',e:'Cost of goods sold ÷ revenue. Cafés typically 25–35%.'}},
PRIME:{n:{z:'主要成本',e:'Prime cost'},d:{z:'食材成本 + 人事成本。一般希望不超過營收的 60–65%。',e:'COGS + labour. Usually kept under 60–65% of sales.'}},

function cycleSvg(nodes,tone){
  const n=nodes.length,R=128,cx=210,cy=165,W=420,H=330;
  const pts=nodes.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  let s=`<svg class="cyc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('營運循環','Operating loop'))}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="${tone}"/></marker></defs>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${tone}22" stroke-width="22"/>`;
  for(let i=0;i<n;i++){const a1=-Math.PI/2+(i+.22)*2*Math.PI/n,a2=-Math.PI/2+(i+.78)*2*Math.PI/n;
    s+=`<path d="M${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} A${R},${R} 0 0 1 ${cx+R*Math.cos(a2)},${cy+R*Math.sin(a2)}" fill="none" stroke="${tone}" stroke-width="2.4" marker-end="url(#ah)"/>`}
  pts.forEach((p,i)=>{const lab=tx(nodes[i]);const w=Math.max(64,lab.length*(L==='en'?7.4:14)+18);
    s+=`<g><rect x="${p[0]-w/2}" y="${p[1]-16}" width="${w}" height="32" rx="16" fill="#fff" stroke="${tone}" stroke-width="2"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-size="${L==='en'?12:13.5}" font-weight="700" fill="#182d40">${i+1}. ${esc(lab)}</text></g>`});
  s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="15" font-weight="800" fill="${tone}">${esc(T('每天的循環','Daily loop'))}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="12" fill="#627487">${esc(T('跑完一圈＝一天','one lap = one day'))}</text></svg>`;
  return s;
}

  h+=`<section class="card" id="${b.id}-s7"><h2><span class="n">7</span>${T('到系統練習','Practise in the system')}</h2>
  <p class="sub">${T('系統裡已經有示範資料（標 DEMO），可以放心按。照這個順序走一遍：','The system comes with DEMO data, so feel free to click. Walk through in this order:')}</p>
  <div class="tw"><table><tr><th>#</th><th>${T('階段','Stage')}</th><th>${T('系統裡做什麼','In the system')}</th></tr>${b.phases.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(tx(x.t))}</td><td>${x.code?(/^W_/.test(x.code)?`<b>${x.code}</b>`:esc(sysName(x.code))):`<span style="color:#8a9aaa">${T('系統外作業（文件、現場）','Off-system (paperwork, on-site)')}</span>`}</td></tr>`).join('')}</table></div>
  <a class="sys" style="font-size:14px;padding:9px 14px;margin-top:12px" href="${sysUrl}" target="_blank" rel="noopener">▶ ${T('打開','Open')} ${esc(tx(b.name))} ${T('系統','system')}</a></section>`;
  h+=sources();
  return h;
}
function sysName(code){return tx({BOM:{z:'BOM 用料表頁',e:'BOM page'},MRP:{z:'MRP 物料需求頁',e:'MRP page'},FIN:{z:'應收／財務報表頁',e:'AR / finance report pages'},PO:{z:'採購單頁',e:'Purchase order page'},GRN:{z:'到貨驗收頁',e:'Goods receipt page'},LEDGER:{z:'帳冊與報表頁',e:'Ledger & reports'}}[code]||{z:code,e:code})}

function calcRun(id){
  const box=document.querySelector(`[data-calc="${id}"]`);if(!box)return;const b=BIZ.find(x=>x.id===id);
  const v={};box.querySelectorAll('input').forEach(i=>v[i.dataset.k]=parseFloat(i.value)||0);
  const cm=v.price-v.varc-v.price*v.commission/100;const out=$('res-'+id);
  if(cm<=0){out.innerHTML=`<div class="r1">⚠️ ${T('每賣一份都在虧','Every sale loses money')}</div><small>${T('售價要高於變動成本＋佣金。','Price must exceed variable cost + commission.')}</small>`;return}
  const be=v.fixed/cm,pct=v.cap>0?be/v.cap*100:0;const u=tx(b.calc.unit);
  const money=b.calc.price===1;
  const daily=be/(id==='hotel'?30:26);
  let line=money?`${b.cur}${fmt(be)} ${T('／月','/ month')}`:`${fmt(be)} ${esc(u)} ${T('／月','/ month')}`;
  let sub=money?`${T('約每天','About')} ${b.cur}${fmt(daily)} ${T('營收','per day')}`:`${T('約每天','About')} ${fmt(daily,1)} ${esc(u)}`;
  if(id==='hotel')sub=`${T('住房率要達到','Occupancy needed')} ${pct.toFixed(1)}%`;
  if(id==='cvs')sub+=` · ${T('客單 $4 約','at $4 ticket ≈')} ${fmt(daily/4)} ${T('人／天','customers/day')}`;
  const color=pct<=60?'#7ee0b8':pct<=85?'#f6d36b':'#ff8f8f';
  out.innerHTML=`<small>${T('損益兩平','Break-even')}</small><div class="r1">${line}</div><small>${sub}</small>
   <div class="gauge"><i style="width:${Math.min(100,pct).toFixed(1)}%;background:${color}"></i></div>
   <small>${T('佔產能／上限','of capacity')} ${pct.toFixed(0)}% · ${pct<=60?T('🟢 有餘裕','🟢 comfortable'):pct<=85?T('🟡 要努力','🟡 needs effort'):T('🔴 太緊，改計畫','🔴 too tight — rethink')} · ${T('每份貢獻','contribution/unit')} ${money?(cm*100).toFixed(0)+'%':b.cur+fmt(cm,2)}</small>`;
}

function gloss(){
  document.documentElement.style.setProperty('--tone','#183247');
  const keys=Object.keys(G);
  let h=`<div class="hero"><div class="big">📖</div><h1>${T('名詞表','Glossary')}</h1><p>${T('共','')} ${keys.length} ${T('個名詞，中英對照、白話解釋。','terms with plain-language explanations.')}</p></div>
  <section class="card"><input class="gsearch" id="gq" placeholder="${T('搜尋：例如 ADR、毛利、BOM','Search: e.g. ADR, margin, BOM')}"><div class="gl" id="gl"></div></section>`;
  return h;
}
function glossFill(q){
  q=(q||'').toLowerCase();const el=$('gl');if(!el)return;
  el.innerHTML=Object.keys(G).filter(k=>!q||(k+tx(G[k].n)+G[k].n.z+(G[k].n.e||'')+tx(G[k].d)).toLowerCase().includes(q)).map(k=>`<div class="it"><b>${esc(tx(G[k].n))}</b><small>${esc(L==='en'?G[k].n.z:(G[k].n.e||''))}</small><div>${esc(tx(G[k].d))}</div></div>`).join('')||`<div class="sub">${T('找不到','No match')}</div>`;
}
function sources(){return `<div class="note">${T('數字為教學示意，不是投資建議；法規、稅率、工資常會調整，實際開業前請向當地政府、會計師或律師確認。','Figures are illustrative, not investment advice. Laws, tax rates and wages change — confirm with local authorities, accountants or lawyers before starting.')}
 ${T('參考：','Sources: ')}<a href="https://cambodianess.com/article/register-a-business-in-cambodia-a-practical-guide-for-2026" target="_blank" rel="noopener">Cambodianess 2026</a> ·
 <a href="https://www.vdb-loi.com/wp-content/uploads/2024/06/Cambodia-Tax-Update-Key-Changes-to-Signboard-Rental-Accommodation-and-Public-Lighting-Taxes_June2024.pdf" target="_blank" rel="noopener">VDB Loi</a> ·
 <a href="https://kpmg.com/kh/en/insights/2026/11/New-Minimum-Wage-for-2027.html" target="_blank" rel="noopener">KPMG Cambodia</a> ·
 <a href="https://www.ey.com/en_my/insights/tax/malaysia-budget/sst-expansion-from-1-july-2025-what-has-changed-and-what-to-expect-in-budget-2026" target="_blank" rel="noopener">EY Malaysia</a></div>`}

function render(){
  document.documentElement.lang=L==='en'?'en':'zh-Hant';
  $('langBtn').textContent=L==='en'?'中文':'EN';
  $('ttl').textContent=T('聖道開業 SOP 學院','Saintdou SOP Academy');
  $('stl').textContent=T('Saintdou · 五種生意從無到有','Five businesses from zero');
  document.title=T('聖道開業 SOP 學院','Saintdou SOP Academy');
  drawTabs();
  const b=BIZ.find(x=>x.id===tab);
  $('main').innerHTML=tab==='home'?home():tab==='gloss'?gloss():bizPage(b);
  if(tab==='gloss'){glossFill('');$('gq').oninput=e=>glossFill(e.target.value)}
  if(b){
    $('main').querySelectorAll('[data-ph]').forEach(x=>x.onclick=()=>{phaseSel[b.id]=+x.dataset.ph;render();document.getElementById(b.id+'-s2').scrollIntoView({block:'start'})});
    $('main').querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{phaseSel[b.id]=Math.max(0,Math.min(b.phases.length-1,(phaseSel[b.id]||0)+(+x.dataset.step)));render();document.getElementById(b.id+'-s2').scrollIntoView({block:'start'})});
    const box=document.querySelector(`[data-calc="${b.id}"]`);box.querySelectorAll('input').forEach(i=>i.oninput=()=>calcRun(b.id));calcRun(b.id);
    $('main').querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({behavior:'smooth',block:'start'})});
  }
  $('main').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
}
/* 名詞彈出說明 */
document.addEventListener('click',e=>{
  const a=e.target.closest('abbr.g'),pop=$('gpop');
  if(!a){pop.style.display='none';return}
  const g=G[a.dataset.g];if(!g)return;
  pop.innerHTML=`<b>${esc(tx(g.n))}</b>${esc(tx(g.d))}`;pop.style.display='block';
  const r=a.getBoundingClientRect(),w=pop.offsetWidth,hh=pop.offsetHeight;
  let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;if(y+hh>innerHeight-8)y=r.top-hh-8;
  pop.style.left=x+'px';pop.style.top=Math.max(8,y)+'px';
});
window.addEventListener('scroll',()=>{$('gpop').style.display='none'},{passive:true});
$('langBtn').onclick=()=>{L=L==='en'?'zh':'en';try{localStorage.setItem('acc_os_hub_lang',L)}catch(e){};render()};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==tab&&(['home','gloss'].includes(h)||BIZ.some(b=>b.id===h))){tab=h;render()}});
/* 左右滑換分頁 */
(function(){let x0=0,y0=0;const m=document.getElementById('main');m.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 m.addEventListener('touchend',e=>{if(e.target.closest('.tw,input,.flow'))return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.6){const ids=['home'].concat(BIZ.map(b=>b.id),['gloss']);const i=ids.indexOf(tab);const j=Math.max(0,Math.min(ids.length-1,i+(dx<0?1:-1)));if(j!==i)go(ids[j])}},{passive:true})})();
render();
</script>
