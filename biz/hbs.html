function anomalies(){let low=db.products.filter(p=>reorderInfo(p).need).length,shelf=db.products.filter(needShelf).length,price=db.products.filter(p=>p.retail<p.cost).length,open=db.shifts.filter(s=>!s.close).length;return{low,shelf,price,open,total:low+shelf+price+(!open?1:0)}}
const app=document.getElementById('app'),drawer=document.getElementById('drawer'),mask=document.getElementById('mask');const clickable=(txt,act,cls='btn')=>`<button class="${cls}" data-action="${act}">${txt}</button>`;function options(items,sel='',placeholder='請選擇'){return `<option value="">${placeholder}</option>`+items.map(i=>`<option value="${esc(i.id)}" ${sel===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}function pOptions(sel=''){return options(db.products,sel,'選商品')}function vOptions(sel=''){return options(db.suppliers,sel,'選供應商')}function cOptions(sel=''){return options(db.customers,sel,'選工程行／客戶')}function tb(headers,rows,emptyText='目前沒有資料'){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${emptyText}</div>`}function panel(title,body,action=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${action}</div>${body}</section>`}function input(name,label,type='text',required=false,attrs=''){return `<label>${label}<input name="${name}" type="${type}" ${required?'required':''} ${attrs}></label>`}function showPage(name,content,code=''){return `<div class="page-title"><button class="btn sm" data-page="home">← 總覽</button><span class="iconbox">${icons(name.includes('庫')?'塑膠收納':'其他')}</span><div><h2>${name}</h2><small>${code}</small></div></div>${content}`}
function renderHome(){const m=MODULES[mod],data=moduleKpis(mod),a=anomalies();return `<div class="subhead">${new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})} · 四套系統，一個工作台</div><div class="period">${[['D','日'],['W','週'],['M','月'],['Y','年']].map(([v,t])=>`<button class="${period===v?'active':''}" data-period="${v}">${t}</button>`).join('')}</div><div class="pills">${MODULES.map((x,i)=>`<button class="pill ${mod===i?'active':''}" style="${mod===i&&i?'background:'+['','#365fba','#ae7419','#7251a9'][i]+';border-color:transparent':''}" data-module="${i}">${x.name} <i class="dot"></i></button>`).join('')}</div><div class="module ${m.color}"><div class="module-head"><h2>${m.name}</h2><span class="period-label">${{D:'日',W:'週',M:'月',Y:'年'}[period]}</span><button class="enter" data-page="${m.page}">進入 →</button></div><div class="kpis">${m.kpis.map((k,i)=>`<button class="kpi" data-page="${k[1]}"><div class="name">${k[0]}</div><div class="value num">${data[i]}</div><div class="code">${({reorder:'H_ROP230',orders:'H_PO300',receiving:'H_GRN350',products:'H_SKU200',stock:'H_INV410',pos:'H_POS500',sales:'H_POS500',returns:'H_RET550',payables:'H_AP650',receivables:'H_AR680',shift:'H_SHF600',reports:'H_RPT800'})[k[1]]||'HBS OS'}</div></button>`).join('')}</div><button class="alertbox" data-page="reorder"><span>資料與現場異常</span><strong>${a.total}</strong><span>缺貨 ${a.low} ＋ 貨架待補 ${a.shelf} ＋ 售價低於成本 ${a.price}${a.open?'':' ＋ 未開班 1'}</span></button><div class="status">🟢 本機資料可讀寫 · v1.0 Demo · ${db.settings.mode==='demo'?'🧪 示範資料':'正式空白帳套'} · 尚未連接雲端</div></div>${panel('🔄 一條龍作業動線',`<div class="flowline">${[['products','商品'],['reorder','缺貨'],['orders','採購'],['receiving','驗收'],['stock','後倉'],['replenish','補貨'],['pos','銷售'],['payables','對帳']].map((s,i)=>`${i?'<span class="flowarrow">→</span>':''}<button class="flowstep" data-page="${s[0]}">${s[1]}<small>第 ${i+1} 站</small></button>`).join('')}</div><p class="caption">所有庫存數量由商品資料及異動紀錄計算；POS 成交、驗收入庫、補 function cartTotal(){return round(cart.reduce((s,l)=>s+l.qty*l.unitPrice,0))}function cartView(){return cart.length?cart.map((l,i)=>{let p=db.products.find(p=>p.id===l.pid);return `<div class="cartitem"><div><strong>${esc(p?.name||l.pid)}</strong><div class="caption">${money(l.unitPrice)} × ${l.qty} · 架上餘量 ${nfmt(p?.shelf||0)}</div></div><div class="filters"><input type="number" min="0.001" step="0.001" value="${l.qty}" data-cartqty="${i}"><button class="btn sm danger" data-cartdel="${i}">✕</button></div></div>`}).join(''):'<div class="empty">購物車是空的，先掃條碼或選擇商品</div>'}

ass="cartitem"><span><strong>${esc(h.id)}</strong> · ${h.lines.length} 種品項 · ${dateFmt(h.ts)}</span><button class="btn sm" data-loadhold="${esc(h.id)}">取單</button></div>`).join(''):'<div class="empty">目前沒有掛單</div>')+(lastReceipt?panel('最近完成交易',`<p><strong>${esc(lastReceipt.id)}</strong>　${money(lastReceipt.total)}　${lastReceipt.pay==='ar'?'工程行掛帳':lastReceipt.pay==='cash'?'現金':'電子支付'}　${lastReceipt.change?`找零 ${money(lastReceipt.change)}`:''}</p><div class="toolbar" style="margin-top:10px"><button class="btn" data-action="print-receipt">🖨️ 列印收據</button></div>`):''),'H_POS500')}

function returnsPage(){return showPage('客退換貨／退款',panel('以原交易退貨',`<form id="returnForm" class="formgrid"><label>原銷售單<select id="returnSale" name="saleId" required>${options(db.sales.map(x=>({id:x.id,name:x.id+' · '+money(x.total)})))}</select></label><label>退貨品項<select id="returnPid" name="pid" required><option value="">先選原銷售單</option></select></label>${input('qty','本次退貨數量','number',true,'min="0.001" step="0.001"')}<label>商品狀態<select name="condition"><option value="good">良品：退回貨架</option><option value="damaged">不良品：不上架</option></select></label>${input('reason','退貨原因','text',true)}<div class="wide"><button type="submit" class="btn primary">確認銷退／退款記錄</button></div></form><div class="caption">依原交易單價退款、按可退餘量控管；現金退貨影響交班現金，工程行退貨抵減應收。</div>`)+panel('已處理銷退',tb(['退貨單','原單','商品','數量','退款','處理'],range(db.returns).map(r=>`<tr><td>${r.id}</td><td>${r.saleId}</td><td>${esc(db.products.find(p=>p.id===r.pid)?.name)}</td><td>${r.qty}</td><td>${money(r.amount)}</td><td>${r.condition==='good'?'良品回架':'不良品隔離'}</td></tr>`))), 'H_RET550')}

function shiftStats(s){let end=s.close?new Date(s.close).getTime():Infinity,start=new Date(s.open).getTime(),inPeriod=x=>{let t=new Date(x.ts).getTime();return t>=start&&t<=end};let cashSales=sum(db.sales.filter(x=>x.pay==='cash'&&inPeriod(x)),'total'),cashReturns=sum(db.returns.filter(x=>x.pay==='cash'&&inPeriod(x)),'amount'),arCollections=sum(db.arPayments.filter(x=>x.method==='cash'&&inPeriod(x)),'amount'),expenses=sum(db.expenses.filter(x=>x.method==='cash'&&inPeriod(x)),'amount');return{cashSales,cashReturns,arCollections,expenses,expected:round(s.float+cashSales-cashReturns+arCollections-expenses)}}

function reportsPage(){let catTotals={};for(const s of db.sales)if(rangeCheck(s.ts))for(const l of s.lines){let p=db.products.find(p=>p.id===l.pid),cat=p?.cat||'其他';catTotals[cat]=(catTotals[cat]||0)+l.qty*l.unitPrice}let cats=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...cats.map(x=>x[1]));let sales=range(db.sales),rets=range(db.returns);return showPage('營運統計／報表',`<div class="grid3">${[['淨銷售',money(totalSales())],['銷售筆數',sales.length],['毛利（估算）',money(gross())],['銷退金額',money(sum(rets,'amount'))],['庫存成本',money(invValue())],['供應商未付款',money(db.suppliers.reduce((s,v)=>s+payBal(v.id),0))]].map(([a,b])=>`<div class="mini">${a}<div class="big">${b}</div></div>`).join('')}</div>`+panel('類別銷售（本期銷售額，未按類別分攤退貨）',cats.length?cats.map(([c,v])=>`<div style="margin:9px 0"><div class="filters" style="justify-content:space-between"><span>${icons(c)} ${esc(c)}</span><strong>${money(v)}</strong></div><div class="reportbar"><div style="width:${Math.round(v/max*100)}%"></div></div></div>`).join(''):'<div class="empty">本期間尚無銷售交易</div>')+panel('資料查核與匯出',`<div class="toolbar"><button class="btn" data-action="csv-sales">銷售 CSV</button><button class="btn" data-action="csv-ledger">庫存異動 CSV</button><button class="btn" data-action="csv-products">商品 CSV</button><button class="btn" data-action="export">完整 JSON 備份</button></div><div class="note warning">毛利 = 銷售收入 − 交易時成本（退貨依原單扣回）。未扣租金、工資、稅金、水電等營運費用，並非淨利。</div>`),'H_RPT800')}
function settingsPage(){return showPage('系統設定／備份還原',panel('🏬 門市基本設定',`<form id="settingsForm" class="formgrid">${input('name','門市名稱','text',true,`value="${val(db.settings,'name')}"`)}<label>貨幣<select name="currency"><option value="TWD" ${curr()==='TWD'?'selected':''}>TWD 新台幣</option><option value="USD" ${curr()==='USD'?'selected':''}>USD 美元</option><option value="KHR" ${curr()==='KHR'?'selected':''}>KHR 柬埔寨瑞爾</option></select></label><div class="wide"><button type="submit" class="btn primary">保存設定</button></div></form><div class="note warning">變更幣別僅修改顯示符號，**不自動換算歷史金額**。正式使用前請選好並保持一致。</div>`)+panel('☁↑ ☁↓ 本機資料安全',`<p>目前模式：<strong>${db.settings.mode==='demo'?'🧪 示範測試（全部均為假資料）':'正式空白帳套'}</strong>；資料只存在本機此瀏覽器。<br>最近保存：${dateFmt(db.savedAt)}。請至少每日匯出 JSON 備份，並另存安全位置。</p><div class="toolbar" style="margin-top:15px"><button class="btn primary" data-action="export">☁↓ 完整 JSON 備份</button><label class="btn">☁↑ 選檔還原<input type="file" id="importFile" accept="application/json,.json" style="display:none"></label><button class="btn" data-action="csv-products">商品 CSV</button></div><div class="divider"></div><div class="toolbar"><button class="btn danger" data-action="empty">清除示範資料／啟用正式空白帳套</button><button class="btn danger" data-action="seed">恢復示範資料（覆蓋本機）</button></div>`)+panel('🔌 後續雲端接口（尚未啟用）',`<div class="grid2"><div class="mini">GitHub Pages<div class="strong">saintdou-weng / hbs-os</div><small>預留代碼倉庫名稱，尚未建立</small></div><div class="mini">Google Apps Script<div class="strong">HBS_OS_API</div><small>預留雲端同步與 API</small></div><div class="mini">Google Sheets<div class="strong">HBS_OS_DB</div><small>預留資料分頁 H_...</small></div><div class="mini">Telegram Bot<div class="strong">HBS OS 門市助手</div><small>建議 username：HBSStoreOpsBot</small></div></div><div class="note">Telegram 群建議：「HBS OS｜門市營運通知」、「HBS OS｜採購補貨追蹤」，可選「HBS OS｜主管核可」。這些只是名稱建議，並未建立群組／Bot，也沒有雲端同步。未來 Bot Token 必須放在後端，不能寫入本 HTML。</div>`)+panel('已知限制與操作規範',`<ul><li>單一 HTML 本地版，適合離線展示／少量單機測試；不同裝置無法即時共享交易。</li><li>資料儲存在瀏覽器 localStorage，清除網 function renderDrawer(){let q=document.getElementById('navSearch').value?.toLowerCase()||'';document.getElementById('drawerList').innerHTML=`<button class="nav-btn ${page==='home'?'active':''}" data-page="home"><span>🏠</span> 營運主工作台</button>`+NAV.map(group=>{let arr=group.links.filter(x=>x[1].toLowerCase().includes(q)||group.name.toLowerCase().includes(q));return arr.length?`<section class="nav-cat"><div class="nav-title">${group.name}</div>${arr.map(([id,t,emoji])=>`<button class="nav-btn ${page===id?'active':''}" data-page="${id}"><span>${emoji}</span> ${t}</button>`).join('')}</section>`:''}).join('')}
function render(){app.innerHTML=`<header class="top"><button class="hamb" aria-label="開啟功能選單" data-action="drawer">☰</button><div><h1>HBS OS</h1><div class="muted">${esc(db.settings.name)} · 五金百貨營運中心</div></div><div class="topright"><span class="chip">${db.settings.mode==='demo'?'🧪 示範資料':'● 單機本地版'}</span><button class="btn sm" data-page="settings">⚙</button></div></header>${db.settings.mode==='demo'?'<div class="banner"><span>⚠️ 目前所有商品、供應商、金額都是示範測試資料</span><button class="btn sm" data-page="settings">啟用正式帳套</button></div>':''}${page==='home'?renderHome():({products:productsPage,suppliers:suppliersPage,reorder:reorderPage,orders:ordersPage,receiving:receivingPage,vendorReturns:vendorReturnsPage,stock:stockPage,replenish:replenishPage,count:countPage,adjust:adjustPage,ledger:ledgerPage,pos:posPage,sales:salesPage,returns:returnsPage,customers:customersPage,receivables:receivablesPage,payables:payablesPage,shift:shiftPage,expenses:expensesPage,tasks:tasksPage,reports:reportsPage,settings:settingsPage})[page]?.()||renderHome()}`;document.getElementById('footer').innerHTML=`<span>🟢 本地資料可用 · v1.0</span><span>｜</span><span>☁ 雲端未設定</span><span>｜</span><span>${db.settings.mode==='demo'?'🧪 示範模式':'📁 正式空白帳套'}</span><span>｜</span><span>${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span>`;renderDrawer();if(page==='pos')updateCart();if(page==='receiving'&&window.preselectPO){let sel=document.getElementById('recvOrder');if(sel){sel.value=window.preselectPO;fillReceiveLines();}window.preselectPO=null}if(page==='returns'&&window.preselectSale){let sel=document.getElementById('returnSale');if(sel){sel.value=window.preselectSale;fillReturnLines()}window.preselectSale=null}}
function navigate(p){page=p;query='';closeDrawer();render();window.scrollTo({top:0,behavior:'instant'})}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}function closeDrawer(){drawerOpen=false;drawer.classList.remove('open');mask.classList.remove('open')}function openDrawer(){drawerOpen=true;drawer.classList.add('open');mask.classList.add('open');document.getElementById('navSearch').focus()}
function updateCart(){let c=document.getElementById('cartContent');if(c)c.innerHTML=cartView();let t=document.getElementById('cartTotal');if(t)t.textContent=money(cartTotal());let btn=document.querySelector('#checkoutForm button[type=submit]');if(btn)btn.disabled=!cart.length}function addToCart(id){try{let p=product(db,id),l=cart.find(x=>x.pid===id);if(l)l.qty=round(l.qty+1);else cart.push({pid:id,qty:1,unitPrice:p[priceMode]});updateCart();toast('已加入 '+p.name)}catch(e){alert(e.message)}}function fillReceiveLines(){let id=document.getElementById('recvOrder')?.value,o=db.po.find(x=>x.id===id),el=document.getElementById('recvLines');if(!el)return;if(!o){el.innerHTML='請先選擇採購單';return}el.innerHTML=`<div class="tablewrap"><table><tr><th>商品</th><th>訂／收／待收</th><th>本次實收</th><th>本次進價（單位）</th></tr>${o.lines.filter(l=>l.received<l.qty).map(l=>{let p=db.products.find(p=>p.id===l.pid);return `<tr><td>${esc(p?.name)}</td><td>${nfmt(l.qty)} / ${nfmt(l.received)} / ${nfmt(l.qty-l.received)}</td><td><input name="qty_${l.pid}" type="number" min="0" max="${round(l.qty-l.received)}" value="0" step="0.001"></td><td><input name="cost_${l.pid}" type="number" min="0" step="0.01" value="${l.cost}"><small>原成本 ${money(p?.cost||0)}</small></td></tr>`}).join('')}</table></div><p class="caption">本次實收填 0 不會入庫；可多次分批驗收，禁止超過剩餘訂購量。</p>`}
function fillReturnLines(){let id=document.getElementById('returnSale')?.value,s=db.sales.find(s=>s.id===id),el=document.getElementById('returnPid');if(!el)return;el.innerHTML='<option value="">選退貨商品</option>'+(s?.lines||[]).map(l=>{let returned=db.returns.filter(r=>r.saleId===id&&r.pid===l.pid).reduce((a,r)=>a+r.qty,0);return `<option value="${l.pid}" ${l.qty-returned<=0?'disabled':''}>${esc(db.products.find(p=>p.id===l.pid)?.name)}（可退 ${nfmt(round(l.qty-returned))}）</option>`}).join('')}
function parseForm(f){return Object.fromEntries(new FormData(f).entries())}function exportJSON(){let text=JSON.stringify(db,null,2),name='HBS_OS_完整備份_'+new Date().toISOString().slice(0,10)+'.json';download(text,name,'application/json');toast('已產生完整 JSON 備份')}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}function csv(v){let arr=Array.isArray(db[v])?db[v]:[];if(!arr.length){alert('沒有可匯出的資料');return}let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))];let cell=x=>{let s=typeof x==='object'?JSON.stringify(x):String(x??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download('\uFEFF'+keys.map(cell).join(',')+'\n'+arr.map(x=>keys.map(k=>cell(x[k])).join(',')).join('\n'),'HBS_'+v+'_'+new Date().toISOString().slice(0,10)+'.csv','text/csv;charset=utf-8')}
// 所有業務更新集中經過 tx()：先驗證、複製資料、一次性保存，避免只更新畫面或半途扣庫。
app.addEventListener('submit',event=>{event.preventDefault();let f=event.target,x=parseForm(f),id=f.getAttribute('id');try{switch(id){
case 'productForm':{let pid=(x.id||'').trim(),editing=pid&&db.products.some(p=>p.id===pid);let name=x.name.trim(),pack=fnum(x.pack,1),cost=fnum(x.cost),retail=fnum(x.retail),trade=fnum(x.trade),safety=fnum(x.safety),shelf=fnum(x.shelf),back=fnum(x.back);if(!x.supplier||!name||!x.loc.trim())throw Error('供應商、商品名及儲位必須填寫');if(db.products.some(p=>p.barcode&&x.barcode&&p.barcode===x.barcode&&p.id!==pid))throw Error('條碼已存在');tx(editing?'已更新商品資料':'已建立新商品',d=>{vendor(d,x.supplier);if(editing){let p=product(d,pid);Object.assign(p,{name,barcode:x.barcode,cat:x.cat,supplier:x.supplier,loc:x.loc,unit:x.unit,pack,retail,trade,safety,lead:d.suppliers.find(v=>v.id===x.supplier)?.lead||3});}else{pid=pid||uid('H',d);if(d.products.some(p=>p.id===pid))throw Error('商品編號重複');d.products.push({id:pid,name,barcode:x.barcode||pid,cat:x.cat,supplier:x.supplier,loc:x.loc,unit:x.unit,pack,cost,retail,trade,safety,shelf:0,back:0,lead:d.suppliers.find(v=>v.id===x.supplier)?.lead||3});if(shelf)stockMove(d,pid,'shelf',shelf,pid,'期初建檔');if(back)stockMove(d,pid,'back',back,pid,'期初建檔')}});break}
case 'supplierForm':tx('已新增供應商',d=>d.suppliers.push({id:uid('V',d),name:x.name.trim(),contact:x.contact.trim(),phone:x.phone.trim(),terms:fnum(x.terms),lead:fnum(x.lead,1)}));break;
case 'customerForm':tx('已新增工程行客戶',d=>d.customers.push({id:uid('C',d),name:x.name.trim(),phone:x.phone.trim(),terms:fnum(x.terms),limit:fnum(x.limit)}));break;
case 'reorderForm':{let checked=[...f.querySelectorAll('input[name=pid]:checked')].map(e=>e.value);if(!checked.length)throw Error('未勾選待採購商品');tx('已依供應商分單建立採購單',d=>{let grouped={};for(const pid of checked){let p=product(d,pid),q=fnum(f.elements['qty_'+pid].value);if(!q)continue;let onOrder=d.po.filter(o=>['ordered','partial'].includes(o.status)).flatMap(o=>o.lines).filter(l=>l.pid===pid).reduce((s,l)=>s+l.qty-l.received,0);if(q>1000000)throw Error('採購量異常');if(!p.supplier)throw Error('商品缺供應商：'+p.name);(grouped[p.supplier]??=[]).push({pid,qty:q,received:0,cost:p.cost});}if(!Object.keys(grouped).length)throw Error('未輸入可採購數量');for(const [supplier,lines]of Object.entries(grouped))d.po.unshift({id:uid('PO',d),supplier,status:'ordered',ts:today(),lines})});break}
case 'poForm':{let q=fnum(x.qty,0.001),cost=fnum(x.cost);tx('已建立採購單',d=>{let p=product(d,x.pid);vendor(d,x.supplier);if(p.supplier!==x.supplier)throw Error('此商品主供應商與選擇廠商不同，請先更新商品主檔');d.po.unshift({id:uid('PO',d),supplier:x.supplier,status:'ordered',ts:today(),lines:[{pid:x.pid,qty:q,received:0,cost}]})});break}
case 'receiveForm':{let o=db.po.find(o=>o.id===x.orderId);if(!o)throw Error('請選在途 PO');let lines=o.lines.map(l=>({pid:l.pid,qty:fnum(f.elements['qty_'+l.pid]?.value||0),cost:fnum(f.elements['cost_'+l.pid]?.value||0)})).filter(l=>l.qty>0);if(!lines.length)throw Error('本次實收數量須大於零');let changed=lines.filter(l=>l.cost>product(db,l.pid).cost*1.00001);if(changed.length&&!confirm('⚠️ 本批進價高於商品原成本：\n'+changed.map(l=>product(db,l.pid).name+'：'+money(product(db,l.pid).cost)+' → '+money(l.cost)).join('\n')+'\n仍要依本次價格驗收？'))return;tx('驗收成功：後倉入庫並產生應付',d=>{let po=d.po.find(p=>p.id===o.id);if(!po||!['ordered','partial'].includes(po.status))throw Error('PO 不在收貨狀態');let grnId=uid('GRN',d),amount=0;for(const r of lines){let l=po.lines.find(l=>l.pid===r.pid);if(!l||r.qty>round(l.qty-l.received))throw Error('超過採購單待收數量');let p=product(d,r.pid),oldQty=qty(p),oldCost=p.cost;stockMove(d,r.pid,'back',r.qty,grnId,'驗收入庫');p.cost=oldQty+r.qty>0?round((oldQty*oldCost+r.qty*r.cost)/(oldQty+r.qty)):r.cost;l.received=round(l.received+r.qty);amount+=r.qty*r.cost}po.status=po.lines.every(l=>l.received>=l.qty)?'received':'partial';d.grn.unshift({id:grnId,poId:po.id,supplier:po.supplier,ts:today(),lines,amount:round(amount)})});break}
case 'vendorReturnForm':{let q=fnum(x.qty,0.001),amount=fnum(x.amount),p=product(db,x.pid);if(amount>payBal(p.supplier)+.001)throw Error('扣款不可高於供應商目前應付淨額');tx('已辦理廠退並抵減應付',d=>{let p=product(d,x.pid),rid=uid('RTV',d);stockMove(d,p.id,'back',-q,rid,'廠商退貨');d.rtv.unshift({id:rid,ts:today(),pid:p.id,supplier:p.supplier,qty:q,amount,reason:x.reason.trim()})});break}
case 'replenishForm':{let q=fnum(x.qty,0.001);tx('已完成後倉→貨架移倉',d=>{let p=product(d,x.pid),rid=uid('REP',d);stockMove(d,p.id,'back',-q,rid,'移倉出庫');stockMove(d,p.id,'shelf',q,rid,'移倉入庫')});break}
case 'countForm':{let count=fnum(x.actual),p=product(db,x.pid),before=p[x.where],diff=round(count-before);if(!confirm(`確認盤點：${p.name}\n帳面 ${before} → 實盤 ${count}\n差異 ${diff>0?'+':''}${diff}？`))return;tx('盤點已確認，庫存差異已記錄',d=>{let cId=uid('CNT',d);d.counts.unshift({id:cId,ts:today(),pid:x.pid,where:x.where,before,actual:count,diff,note:x.note||''});if(diff)stockMove(d,x.pid,x.where,diff,cId,'盤點調整')});break}
case 'adjustForm':{let q=fnum(x.qty,0.001);if(!confirm('確定將商品庫存報廢扣減？此操作無法直接刪除。'))return;tx('報廢已完成並登記損失',d=>stockMove(d,x.pid,x.where,-q,uid('ADJ',d),'報廢'));break}
case 'checkoutForm':{if(!cart.length)throw Error('購物車沒有商品');let lines=cart.map(l=>({...l,qty:fnum(l.qty,0.001)})),total=cartTotal(),pay=x.pay,tender=x.tender?fnum(x.tender):total;if(pay==='cash'&&tender+.0001<total)throw Error('現金實收小於應收金額');if(pay==='cash'&&!db.shifts.some(s=>!s.close))throw Error('請先開班再收現金');if(pay==='ar'&&!x.customer)throw Error('月結掛帳請選客戶');if(pay==='ar'){let c=customer(db,x.customer);if(arBal(c.id)+total>c.limit+.001)throw Error('超過工程行信用額度')}let saleRecord=null;let ok=tx('結帳成功：銷售與貨架庫存已連動',d=>{let id=uid('POS',d),saleLines=lines.map(l=>{let p=product(d,l.pid);if(p.shelf<l.qty)throw Error(`${p.name} 架上不足：${p.shelf}，需先補貨`);return{...l,cost:p.cost,amount:round(l.qty*l.unitPrice)}});for(const l of saleLines)stockMove(d,l.pid,'shelf',-l.qty,id,'POS 銷售');saleRecord={id,ts:today(),lines:saleLines,total,pay,customer:pay==='ar'?x.customer:'',tender:pay==='cash'?tender:0,change:pay==='cash'?round(tender-total):0};d.sales.unshift(saleRecord);if(activeHold)d.holds=d.holds.filter(h=>h.id!==activeHold)});if(ok){cart=[];activeHold=null;lastReceipt=saleRecord;render()}break}

if(period==='D'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)}
else if(period==='W'){let diff=(now.getDay()+6)%7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-diff);end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+7)}

else{start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear()+1,0,1)}return d>=start && d<end && d<=new Date()};
