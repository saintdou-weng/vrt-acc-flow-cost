<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="VRT ACC independent tools center">
  <title>VRT ACC 工具中心</title>
  <style>
    :root{--navy:#102a43;--navy2:#183f67;--blue:#0f6db2;--gold:#d2a832;--bg:#f3f6f9;--card:#fff;--ink:#172b3f;--muted:#65788c;--line:#dce5ed;--green:#16866b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer","Noto Sans TC","Segoe UI",Arial,sans-serif}button,input{font:inherit}.head{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 3px 18px rgba(16,42,67,.22)}.headin{max-width:1280px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}.logo{width:42px;height:42px;border-radius:11px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.brand{line-height:1.2}.title{font-size:16px;font-weight:850}.sub{font-size:10px;opacity:.72;margin-top:3px}.spacer{flex:1}.back,.lang button{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:8px 10px;text-decoration:none;font-size:11px;font-weight:750;cursor:pointer}.lang{display:flex;gap:4px}.lang button.on{background:var(--gold);border-color:var(--gold);color:#102a43}.wrap{max-width:1280px;margin:auto;padding:20px 18px 50px}.intro{background:linear-gradient(120deg,#eaf6ff,#fff,#edf9f4);border:1px solid #cfe0eb;border-radius:16px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.intro h1{font-size:20px;margin:0 0 6px}.intro p{font-size:12px;color:var(--muted);line-height:1.65;margin:0;max-width:780px}.pill{padding:8px 11px;border-radius:20px;background:#ddf4eb;color:#11684f;font-size:10px;font-weight:850;white-space:nowrap}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:220px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none}.filter{border:1px solid var(--line);background:#fff;color:#52687b;border-radius:10px;padding:9px 11px;font-size:11px;font-weight:800;cursor:pointer}.filter.on{background:var(--blue);border-color:var(--blue);color:#fff}.section{margin:20px 0 8px;font-size:13px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.card{display:grid;grid-template-columns:48px 1fr;gap:11px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 3px 14px rgba(16,42,67,.04);transition:.18s;min-height:142px}.card:hover{transform:translateY(-2px);border-color:#84b5d3;box-shadow:0 9px 24px rgba(16,42,67,.1)}.icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:25px;background:#e8f4fb}.card h2{font-size:14px;margin:1px 0 5px}.card p{font-size:10px;line-height:1.55;color:var(--muted);margin:0;min-height:48px}.badges{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}.badge{font-size:9px;font-weight:800;padding:3px 6px;border-radius:10px;background:#edf3f7;color:#52687b}.badge.cloud{background:#ddf4eb;color:#11684f}.arrow{position:absolute;right:12px;top:12px;color:#98a8b7}.empty{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}.foot{text-align:center;color:#8b9aa8;font-size:9px;margin-top:25px}
    @media(max-width:650px){.headin{padding:9px 10px}.brand .sub{display:none}.wrap{padding:12px 10px 35px}.intro{grid-template-columns:1fr}.intro h1{font-size:17px}.pill{justify-self:start}.grid{grid-template-columns:1fr}.filter{flex:1}.back{order:3;width:100%;text-align:center}}
  </style>
</head>
<body>
  <header class="head"><div class="headin"><div class="logo">ACC</div><div class="brand"><div class="title" data-t="title">VRT ACC 工具中心</div><div class="sub" data-t="sub">每個工具獨立作業、獨立保存、獨立雲端資料</div></div><div class="spacer"></div><a class="back" href="index.html" data-t="back">← 回 ACC Flow</a><div class="lang"><button data-lang="zh" class="on">中</button><button data-lang="en">EN</button><button data-lang="km">ខ្មែរ</button></div></div></header>
  <main class="wrap">
    <section class="intro"><div><h1 data-t="introTitle">11 個工具已分開整合</h1><p data-t="introText">每一頁都有自己的工作資料清單與新增、儲存、刪除、匯入、匯出、雲端上傳及下載。切換工具不會覆蓋其他工具資料；進入後可從最上方操作列返回本頁。</p></div><div class="pill" data-t="safe">✓ 獨立資料區</div></section>
    <div class="tools"><input id="search" class="search" data-ph="search" placeholder="搜尋工具或用途…"><button class="filter on" data-filter="all" data-t="all">全部</button><button class="filter" data-filter="business" data-t="business">公司／管理</button><button class="filter" data-filter="personal" data-t="personal">生活／旅遊</button><button class="filter" data-filter="creative" data-t="creative">AI 創作</button></div>
    <div id="grid" class="grid"></div><div id="empty" class="empty" data-t="empty">沒有符合的工具。</div><div class="foot">VRT ACC Flow v1.7.0 · Independent Module Workspace</div>
  </main>
  <script>
  'use strict';
  const ITEMS=[
    {id:'twse-stock',cat:'business',icon:'📈',file:'modules/twse-stock-analyzer.html',zh:['台股上市財報分析','讀取 TWSE 官方資料，檢查營收、獲利、財務體質、估值及歷史趨勢。'],en:['TWSE Financial Analysis','Official TWSE revenue, profitability, financial strength, valuation and history.'],km:['វិភាគហិរញ្ញវត្ថុ TWSE','ទិន្នន័យផ្លូវការ TWSE សម្រាប់ចំណូល ប្រាក់ចំណេញ និងនិន្នាការ។']},
    {id:'manager-payroll',cat:'business',icon:'💵',file:'modules/foreign-manager-payroll.html',zh:['外籍／當地管理層薪資','分開管理外籍與當地主管薪資、日曆、比較、異常及匯入歷史。'],en:['Manager Payroll','Separate expat and local payroll, calendar, comparisons, exceptions and import history.'],km:['ប្រាក់ខែអ្នកគ្រប់គ្រង','ប្រាក់ខែបរទេស និងក្នុងស្រុក ប្រតិទិន ការប្រៀបធៀប និងភាពមិនប្រក្រតី។']},
    {id:'leave-manager',cat:'business',icon:'🏖️',file:'modules/leave-manager.html',zh:['外籍幹部年假管理','年假申請、餘額、季度使用、機票及紀錄摘要。'],en:['Expat Leave Manager','Leave requests, balances, quarterly use, tickets and record summaries.'],km:['គ្រប់គ្រងការឈប់សម្រាក','សំណើ សមតុល្យ ត្រីមាស សំបុត្រ និងសេចក្តីសង្ខេប។']},
    {id:'contract-manager',cat:'business',icon:'📑',file:'modules/contract-manager.html',zh:['海外幹部合約管理','員工、試用／正式合約、條款、歷史與離職文件分開管理。'],en:['Expat Contract Manager','Employees, probation/regular contracts, clauses, history and termination documents.'],km:['គ្រប់គ្រងកិច្ចសន្យា','បុគ្គលិក កិច្ចសន្យា លក្ខខណ្ឌ ប្រវត្តិ និងឯកសារបញ្ចប់។']},
    {id:'life-manager',cat:'personal',icon:'🗂️',file:'modules/life-manager.html',zh:['個人生活管理中心','面試、費用、金融、想法、影音、旅遊、日常及採購資料。'],en:['Life Manager','Interviews, expenses, finance, ideas, media, travel, daily notes and purchases.'],km:['មជ្ឈមណ្ឌលគ្រប់គ្រងជីវិត','សម្ភាសន៍ ចំណាយ ហិរញ្ញវត្ថុ គំនិត មេឌៀ ដំណើរ និងការទិញ។']},
    {id:'travel-planner',cat:'personal',icon:'✈️',file:'modules/travel-planner.html',zh:['旅遊行程規劃','依旅程、日期與景點安排時間、預算、交通、住宿及待辦。'],en:['Travel Planner','Organize trips by day with time, budget, transport, lodging and tasks.'],km:['ផែនការធ្វើដំណើរ','រៀបចំតាមថ្ងៃ ពេលវេលា ថវិកា ដឹកជញ្ជូន ស្នាក់នៅ និងកិច្ចការ។']},
    {id:'video-analyzer',cat:'creative',icon:'🎬',file:'modules/video-analyzer.html',zh:['影片智能分析','分析影片連結或本機檔案，整理平台、內容類型、重點、受眾與改進建議。'],en:['Video Analyzer','Analyze a URL or local video for platform, content, audience, key points and improvements.'],km:['វិភាគវីដេអូ','វិភាគតំណ ឬឯកសារវីដេអូ សម្រាប់មាតិកា ទស្សនិកជន និងការកែលម្អ។']},
    {id:'ai-ppt',cat:'creative',icon:'📊',file:'modules/ai-ppt-generator.html',zh:['AI 簡報生成器','由檔案與文字建立主題化簡報，保留簡報庫與可下載成品。'],en:['AI Presentation Generator','Build themed presentations from files and text with a reusable library.'],km:['បង្កើតបទបង្ហាញ AI','បង្កើតបទបង្ហាញពីឯកសារ និងអត្ថបទ ហើយរក្សាទុកក្នុងបណ្ណាល័យ។']},
    {id:'manga-generator',cat:'creative',icon:'🎨',file:'modules/manga-generator.html',zh:['漫畫自動生成','把長文拆成角色、分段、分鏡與漫畫頁，支援畫風與密度設定。'],en:['Manga Generator','Turn long text into characters, chunks, storyboards and manga pages.'],km:['បង្កើតតុក្កតា','បម្លែងអត្ថបទទៅតួអង្គ ផ្នែក Storyboard និងទំព័រតុក្កតា។']},
    {id:'novel-video',cat:'creative',icon:'🎞️',file:'modules/novel-to-video.html',zh:['小說影片生成','把小說拆成場景、角色、字幕與可播放故事板，支援影片輸出。'],en:['Novel to Video','Turn a novel into scenes, characters, captions, a playable storyboard and video.'],km:['ប្រលោមលោកទៅវីដេអូ','បម្លែងប្រលោមលោកទៅឈុត តួអង្គ ចំណងជើង និងវីដេអូ។']},
    {id:'ocr-tool',cat:'creative',icon:'🔎',file:'modules/ocr-tool.html',zh:['OCR 文字提取與翻譯','從圖片、文字、Word 或 Excel 提取內容，分類、複製及翻譯。'],en:['OCR & Translation','Extract, classify, copy and translate text from images, text, Word or Excel.'],km:['OCR និងបកប្រែ','ស្រង់ ចាត់ថ្នាក់ ចម្លង និងបកប្រែពីរូបភាព Word ឬ Excel។']}
  ];
  const TX={zh:{title:'VRT ACC 工具中心',sub:'每個工具獨立作業、獨立保存、獨立雲端資料',back:'← 回 ACC Flow',introTitle:'11 個工具已分開整合',introText:'每一頁都有自己的工作資料清單與新增、儲存、刪除、匯入、匯出、雲端上傳及下載。切換工具不會覆蓋其他工具資料；進入後可從最上方操作列返回本頁。',safe:'✓ 獨立資料區',search:'搜尋工具或用途…',all:'全部',business:'公司／管理',personal:'生活／旅遊',creative:'AI 創作',empty:'沒有符合的工具。',open:'開啟工具',independent:'獨立保存',cloud:'雲端上下傳',backup:'匯入匯出'},en:{title:'VRT ACC Tool Center',sub:'Independent operation, storage and cloud data for every tool',back:'← Back to ACC Flow',introTitle:'11 tools integrated as separate modules',introText:'Every page has its own workspace list plus New, Save, Delete, Import, Export, Cloud Upload and Cloud Download. One tool cannot overwrite another.',safe:'✓ Independent data',search:'Search tools or uses…',all:'All',business:'Business / Admin',personal:'Life / Travel',creative:'AI Creation',empty:'No matching tools.',open:'Open tool',independent:'Independent save',cloud:'Cloud sync',backup:'Import / export'},km:{title:'មជ្ឈមណ្ឌលឧបករណ៍ VRT ACC',sub:'ឧបករណ៍នីមួយៗដំណើរការ និងរក្សាទុកដោយឡែក',back:'← ត្រឡប់ទៅ ACC Flow',introTitle:'ឧបករណ៍ 11 ត្រូវបានបំបែក',introText:'ទំព័រនីមួយៗមានបញ្ជីការងារ បន្ថែម រក្សាទុក លុប នាំចូល នាំចេញ ផ្ទុកឡើង និងទាញយក Cloud ដោយឡែក។',safe:'✓ ទិន្នន័យដាច់ដោយឡែក',search:'ស្វែងរកឧបករណ៍…',all:'ទាំងអស់',business:'អាជីវកម្ម / រដ្ឋបាល',personal:'ជីវិត / ដំណើរ',creative:'ការបង្កើត AI',empty:'រកមិនឃើញឧបករណ៍។',open:'បើកឧបករណ៍',independent:'រក្សាទុកដោយឡែក',cloud:'Cloud',backup:'នាំចូល / នាំចេញ'}};
  let lang=localStorage.getItem('vrt_flow_lang')||'zh',filter='all';const $=s=>document.querySelector(s),tr=k=>(TX[lang]||TX.zh)[k]||k;
  function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=tr(el.dataset.ph));document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));const q=$('#search').value.trim().toLowerCase();const rows=ITEMS.filter(x=>(filter==='all'||x.cat===filter)&&[x.zh,x.en,x.km].flat().join(' ').toLowerCase().includes(q));$('#grid').innerHTML=rows.map(x=>{const a=x[lang]||x.zh;return `<a class="card" href="${x.file}"><span class="arrow">↗</span><div class="icon">${x.icon}</div><div><h2>${a[0]}</h2><p>${a[1]}</p></div><div class="badges"><span class="badge">${tr('independent')}</span><span class="badge cloud">${tr('cloud')}</span><span class="badge">${tr('backup')}</span></div></a>`}).join('');$('#empty').style.display=rows.length?'none':'block'}
  $('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('vrt_flow_lang',lang);render()});render();
  </script>
