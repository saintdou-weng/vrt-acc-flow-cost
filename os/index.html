<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACC Flow · Saintdou AI OS</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#182d40;font:15px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:3;background:#ffffffed;padding:12px 15px;border-bottom:1px solid #dce5ed;display:flex;align-items:center;gap:10px}header strong{font-size:18px}header small{display:block;color:#657788;font-size:11px}button,a{font:inherit}button{cursor:pointer;border:1px solid #d9e3ec;background:white;color:#243b50;border-radius:10px;padding:9px 12px;font-weight:750}main{max-width:1050px;margin:auto;padding:16px}.tabs{display:flex;overflow:auto;gap:7px;position:sticky;top:65px;z-index:2;background:#edf2f7;padding:5px 0 11px;scrollbar-width:none}.tabs button{flex-shrink:0;border-radius:30px}.tabs button.active{background:var(--tone);color:#fff;border-color:var(--tone)}.hero{padding:20px;border-radius:22px;background:var(--tone);color:white;margin-bottom:13px}.hero h1{font-size:25px;margin:0 0 5px}.hero p{opacity:.9;margin:0;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{display:flex;flex-direction:column;gap:5px;padding:15px 12px;background:#fff;border:1px solid #dce5ed;border-radius:16px;color:#1b3348;text-decoration:none;min-height:100px}.tile:hover{border-color:var(--tone)}.tile b{font-size:16px}.tile small{font-size:11px;color:#66798b}.tile .icon{font-size:27px}.toplink{margin-left:auto;color:#3b5066;text-decoration:none;font-size:12px}.notice{background:#fff9e9;border:1px solid #edddb0;border-radius:12px;padding:11px;margin-top:15px;font-size:12px;color:#805d1e}.footer{font-size:11px;color:#697c8e;margin:18px 0}@media(min-width:750px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><span style="font-size:26px">◈</span><div><strong>Saintdou AI OS</strong><small>AI_acc_flow · ACC Unified Hub</small></div><a class="toplink" href="../index.html">← ACC</a><button id="menuBtn" type="button" onclick="window.ACCMenu&&ACCMenu.open()">☰ 選單</button><button id="lang">EN</button></header><main><nav id="tabs" class="tabs"></nav><section id="hero" class="hero"></section><section id="grid" class="grid"></section><div id="notice" class="notice"></div><div class="footer">ACC Flow · BIZ / LAW / EDU / Personal · 2026-11-21</div></main><script src="acc-menu.js" data-nobutton></script><script>const groups=window.ACC_OS_GROUPS;let active=new URLSearchParams(location.search).get('view')||'biz',lang=localStorage.getItem('acc_os_hub_lang')||'zh';if(!groups.some(g=>g.id===active))active='biz';const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const g=groups.find(g=>g.id===active),zh=lang==='zh';document.documentElement.style.setProperty('--tone',g.color);document.documentElement.lang=zh?'zh-Hant':'en';$('lang').textContent=zh?'EN':'中文';$('tabs').innerHTML=groups.map(x=>'<button data-id="'+x.id+'" class="'+(x.id===active?'active':'')+'">'+x.icon+' '+escape(zh?x.zh:x.en)+'</button>').join('');$('hero').innerHTML='<h1>'+g.icon+' '+escape(zh?g.zh:g.en)+'</h1><p>'+g.items.length+(zh?' 個入口 · 原有連結及資料保留':' modules · legacy links and data retained')+'</p>';$('grid').innerHTML=g.items.map(x=>'<a class="tile" href="'+escape(x[3])+'"><span class="icon">'+x[0]+'</span><b>'+escape(zh?x[1]:x[2])+' ↗</b><small>'+escape(zh?x[4]:x[1])+'</small></a>').join('');$('notice').textContent=zh?'新系統（酒店、咖啡店、鞋廠、五金、超商、法規）目前為本機示範版；正式 GS 雲端同步與 Telegram 選單尚未部署。勿輸入正式敏感資料。既有 ACC 工具及 ERP 路徑保留。':'New systems are local demo versions. GS sync and Telegram menu are not deployed. Do not enter sensitive production data. Existing ACC and ERP links stay unchanged.';$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.id))}function go(id){active=id;const u=new URL(location.href);u.searchParams.set('view',active);history.replaceState(null,'',u);draw()}$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('acc_os_hub_lang',lang);draw()};let x=0,y=0;document.querySelector('main').addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});document.querySelector('main').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){const i=groups.findIndex(g=>g.id===active);go(groups[Math.max(0,Math.min(groups.length-1,i+(dx<0?1:-1)))].id)}},{passive:true});draw();</script><script src="https://saintdou-weng.github.io/PSJERP/music.js?v=2.24" defer></script><!-- 2026-11-25 Paul：ACC Flow 也套用 ♪ 音樂＋🎨 調色盤／背景／3D 等設定（每個平台各自記住） -->
</body></html>
