.modal-backdrop{position:fixed;inset:0;background:rgba(8,22,36,.68);z-index:100;display:grid;place-items:center;padding:16px}.modal{background:#fff;width:min(920px,100%);max-height:92vh;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.32);display:flex;flex-direction:column;overflow:hidden}.modal.wide{width:min(1280px,100%)}.modal-head,.modal-foot{padding:11px 14px;display:flex;align-items:center;gap:8px}.modal-head{border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:17px;color:var(--navy);flex:1}.modal-body{padding:14px;overflow:auto}.modal-foot{border-top:1px solid var(--line);justify-content:flex-end}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-group label{display:block;color:var(--muted);font-size:11px;font-weight:750;margin-bottom:4px}.form-group.full{grid-column:1/-1}.form-group textarea{min-height:86px;resize:vertical;width:100%}.form-group input,.form-group select{width:100%}.viewer{height:min(75vh,900px);background:#111b25;display:grid;place-items:center;overflow:auto;position:relative}.viewer img{max-width:none;transform-origin:center;transition:transform .12s}.viewer iframe{width:100%;height:100%;border:0;background:#fff}.viewer-tools{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:6px;background:rgba(10,20,30,.72);padding:6px;border-radius:10px}.viewer-tools button{border:0;background:#fff;color:#17334c;border-radius:7px;padding:7px 10px}.dropbox{border:2px dashed #acd0e8;border-radius:12px;padding:20px;text-align:center;background:#f6fbff;color:var(--muted)}

<body>
  <header class="topbar">
    <div class="toprow">
      <a class="brand" href="factory-map.html"><span class="brandmark">VRT</span><span><b data-i="brand">工廠數位地圖</b><small>Factory Digital Map · <span class="version">v5.0</span></small></span></a>
      <span class="cloud"><i id="cloudDot"></i><span id="cloudText" data-i="checking">檢查雲端…</span></span>
      <span class="spacer"></span>
      <a class="topbtn" href="./" data-i="accounting">會計平台</a>
      <button class="topbtn" id="cloudUpBtn">☁↑ <span data-i="cloudSave">雲端儲存</span></button>
      <button class="topbtn" id="cloudDownBtn">☁↓ <span data-i="cloudLoad">雲端下載</span></button>
      <button class="topbtn admin-only" id="uploadBtn">＋ <span data-i="uploadFile">上傳附件</span></button>
      <button class="topbtn" id="exportBtn">⇩ JSON</button>
      <button class="topbtn" id="importBtn">⇧ JSON</button>
      <button class="topbtn" id="adminBtn">⚙ <span data-i="admin">管理</span></button>
      <div class="langs"><button data-lang="zh">中</button><button data-lang="en">EN</button><button data-lang="km">ខ្មែរ</button></div>

  </header>

    <div id="usageText">—</div>
  </section>

  <div class="filters">
    <input id="searchInput" class="field grow" data-i-placeholder="search" placeholder="搜尋區域、設備或檔名">
    <select id="buildingSelect" class="field"></select>
    <select id="jumpSelect" class="field"></select>
    <button id="addAreaBtn" class="btn primary admin-only">＋ <span data-i="addArea">新增區域</span></button>
  </div>

  <main class="layout">
    <aside class="sidebar card">
      <div class="sidehead"><span data-i="areaList">區域清單</span><span id="areaCount" class="count">0</span></div>
      <div id="areaList" class="arealist"></div>
    </aside>
    <section id="content" class="content"></section>
  </main>

  <input id="jsonInput" type="file" accept="application/json,.json" hidden>
  <div id="modalRoot"></div>

const $ = selector => document.querySelector(selector);

const tr = key => I18N[lang]?.[key] || I18N.zh[key] || key;

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

const nl2br = value => esc(value).replace(/\n/g, '<br>');
function clamp(value,min,max){return Math.max(min,Math.min(max,Number(value)||min))}

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(saved) return normalizeState(saved.state || saved);
  }catch(_error){}
  return normalizeState({areas: JSON.parse(JSON.stringify(DEFAULT_BUNDLE.data || []))});
}

function normalizeState(input){
  const areas = Array.isArray(input) ? input : Array.isArray(input?.areas) ? input.areas : [];
  return {schemaVersion:2,updatedAt:input?.updatedAt || null,areas:areas.map(normalizeArea)};
}

function normalizeArea(area, areaIndex){
  const id = String(area.id || `AREA-${areaIndex + 1}`);
  return {
    id, building:String(area.building || 'A'), category:String(area.category || 'Other'), status:String(area.status || ''),
    name:{zh:String(area.name?.zh || ''),en:String(area.name?.en || ''),km:String(area.name?.km || '')},
    size:String(area.size || ''), qty:String(area.qty || ''), notes:String(area.notes || ''),
    gallery:(area.gallery || []).map((asset,index)=>normalizeAsset(asset,'image',id,index)),
    files:(area.files || []).map((asset,index)=>normalizeAsset(asset,'file',id,index))
  };
}

function normalizeAsset(asset, kind, areaId, index){
  const original = String(asset.fileName || asset.file || asset.src || '');
  const source = asset.source || (asset.assetId ? 'cloud' : kind === 'image' && asset.src ? 'bundled' : 'reference');
  const bundledName = original.replace(/\.png$/i,'.webp');
  return {
    id:String(asset.id || `${areaId}-${kind}-${index}`), kind, source,
    assetId:String(asset.assetId || ''), label:String(asset.label || original || (kind === 'image' ? 'Image' : 'File')),
    fileName:String(asset.fileName || original), mimeType:String(asset.mimeType || mimeFromType(asset.type, original)),
    sizeBytes:Number(asset.sizeBytes || 0), chunkCount:Number(asset.chunkCount || 0), chunkSize:Number(asset.chunkSize || UPLOAD_CHUNK_BYTES),
    url:String(asset.url || (source === 'bundled' ? `map-assets/${bundledName}` : '')),
    display:{widthPct:clamp(asset.display?.widthPct || (kind === 'image' ? 48 : 100),25,100),heightPx:clamp(asset.display?.heightPx || 280,160,1000),fit:asset.display?.fit === 'cover' ? 'cover' : 'contain'}
  };
}

function mimeFromType(type, name){
  const ext=String(name||'').split('.').pop().toLowerCase();
  const map={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',pdf:'application/pdf',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',zip:'application/zip'};
  return map[ext] || (String(type||'').toLowerCase()==='pdf'?'application/pdf':'application/octet-stream');
}

function packageState(){return {schema:'vrt-factory-map',schemaVersion:2,appVersion:APP_VERSION,updatedAt:new Date().toISOString(),state:clone(state)}}
function saveLocal(){state.updatedAt=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(packageState()));localStorage.setItem(SELECT_KEY,selectedId)}
function areaById(id){return state.areas.find(area=>area.id===id)}
function currentName(area){return area.name?.[lang] || area.name?.zh || area.name?.en || area.id}
function formatBytes(bytes){const value=Number(bytes||0);if(!value)return '0 B';const units=['B','KB','MB','GB','TB'];const i=Math.min(units.length-1,Math.floor(Math.log(value)/Math.log(1024)));return `${(value/Math.pow(1024,i)).toFixed(i?1:0)} ${units[i]}`}
function formatNumber(value){return Number(value||0).toLocaleString('en-US')}
function assetIcon(asset){if(asset.mimeType.startsWith('image/'))return '🖼️';if(asset.mimeType.includes('pdf'))return '📕';if(/presentation|powerpoint/.test(asset.mimeType))return '📊';if(/sheet|excel/.test(asset.mimeType))return '📗';if(/word/.test(asset.mimeType))return '📘';if(/zip|rar|7z/.test(asset.mimeType))return '🗜️';return '📎'}

function setLang(next){lang=next;localStorage.setItem(LANG_KEY,lang);renderLanguage();renderAll()}
function renderLanguage(){
  $$('[data-i]').forEach(node=>{const value=tr(node.dataset.i);if(value)node.textContent=value});
  $$('[data-i-placeholder]').forEach(node=>node.placeholder=tr(node.dataset.iPlaceholder));
  $$('[data-lang]').forEach(button=>button.classList.toggle('on',button.dataset.lang===lang));
  $('#adminBtn').querySelector('span').textContent=document.body.classList.contains('admin')?tr('logout'):tr('admin');
}

function filteredAreas(){
  const query=$('#searchInput').value.trim().toLowerCase();const building=$('#buildingSelect').value;
  return state.areas.filter(area=>{
    if(building && building!=='ALL' && area.building!==building)return false;
    if(!query)return true;
    const text=[area.id,area.building,area.category,area.status,area.size,area.qty,area.notes,...Object.values(area.name||{}),...(area.gallery||[]).flatMap(x=>[x.label,x.fileName]),...(area.files||[]).flatMap(x=>[x.label,x.fileName])].join(' ').toLowerCase();
    return text.includes(query);
  });
}

function renderAll(){
  if(!areaById(selectedId)&&state.areas[0])selectedId=state.areas[0].id;
  const buildings=[...new Set(state.areas.map(area=>area.building).filter(Boolean))].sort();
  const current=$('#buildingSelect').value||'ALL';
  $('#buildingSelect').innerHTML=`<option value="ALL">${esc(tr('allBuildings'))}</option>`+buildings.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('');
  $('#buildingSelect').value=buildings.includes(current)?current:'ALL';
  renderList();
}

function renderList(){
  const areas=filteredAreas();$('#areaCount').textContent=areas.length;
  const groups={};areas.forEach(area=>{const key=`${area.building} / ${area.category}`;(groups[key] ||= []).push(area)});
  $('#areaList').innerHTML=Object.keys(groups).sort().map(group=>`<div><div class="group-title">${esc(group)}</div>${groups[group].map(area=>`<button class="area-btn ${area.id===selectedId?'on':''}" data-select-area="${encodeURIComponent(area.id)}"><b>${esc(currentName(area))}</b><small>${esc(area.status)} · ${esc(area.id)}</small></button>`).join('')}</div>`).join('')||`<div class="empty">${esc(tr('noArea'))}</div>`;
  $$('[data-select-area]').forEach(button=>button.onclick=()=>selectArea(decodeURIComponent(button.dataset.selectArea)));
  $('#jumpSelect').innerHTML=`<option value="">${esc(tr('quickSelect'))}</option>`+areas.map(area=>`<option value="${esc(area.id)}" ${area.id===selectedId?'selected':''}>${esc(currentName(area))}</option>`).join('');
  renderContent();
}

function selectArea(id){selectedId=id;localStorage.setItem(SELECT_KEY,id);renderList();window.scrollTo({top:0,behavior:'smooth'})}

function renderContent(){
  const area=areaById(selectedId);if(!area){$('#content').innerHTML=`<div class="card empty">${esc(tr('noArea'))}</div>`;return}
  const hero=area.gallery.find(asset=>asset.source==='bundled');
  const gallery=area.gallery.length?area.gallery.map((asset,index)=>galleryCard(area,asset,index)).join(''):`<div class="empty">${esc(tr('noArea'))}</div>`;

      <div class="info-grid"><div class="info"><b>${esc(tr('size'))}</b><div>${nl2br(area.size||'—')}</div></div><div class="info"><b>${esc(tr('equipment'))}</b><div>${nl2br(area.qty||'—')}</div></div><div class="info"><b>${esc(tr('notes'))}</b><div>${nl2br(area.notes||'—')}</div></div></div>
      <div class="hero-actions admin-only"><button class="btn primary" data-area-edit>${esc(tr('edit'))}</button><button class="btn" data-add-kind="auto">＋ ${esc(tr('uploadFile'))}</button><button class="btn danger" data-area-delete>${esc(tr('delete'))}</button></div></div>
    </article>
    <section class="card section"><h2 class="section-title"><span>${esc(tr('images'))}</span><button class="btn small admin-only" data-add-kind="image">＋ ${esc(tr('addImage'))}</button></h2><div class="gallery">${gallery}</div></section>
    <section class="card section"><h2 class="section-title"><span>${esc(tr('files'))}</span><button class="btn small admin-only" data-add-kind="file">＋ ${esc(tr('addFile'))}</button></h2><div class="files">${files}</div></section>
    <section class="card section"><h2 class="section-title"><span>${esc(tr('basic'))}</span></h2><div class="info-grid"><div class="info"><b>${esc(tr('status'))}</b><div>${esc(area.status||'—')}</div></div><div class="info"><b>${esc(tr('building'))}</b><div>${esc(area.building||'—')}</div></div><div class="info"><b>${esc(tr('category'))}</b><div>${esc(area.category||'—')}</div></div></div></section>`;
  $('[data-area-edit]')?.addEventListener('click',()=>editArea(area.id));
  $('[data-area-delete]')?.addEventListener('click',()=>deleteArea(area.id));
  $$('[data-add-kind]').forEach(button=>button.onclick=()=>chooseFiles(button.dataset.addKind));
  attachAssetActions(area);
}

function galleryCard(area,asset,index){
  const direct=asset.source==='bundled';
  const preview=direct?`<img loading="lazy" src="${esc(encodeURI(asset.url))}" alt="${esc(asset.label)}">`:`<div class="asset-placeholder"><strong>${assetIcon(asset)}</strong>${esc(formatBytes(asset.sizeBytes))}<br>${esc(asset.source==='reference'?tr('legacy'):tr('preview'))}</div>`;
  return `<article class="asset-card" style="width:${clamp(asset.display.widthPct,25,100)}%;--asset-fit:${esc(asset.display.fit)}"><div class="asset-preview" style="height:${clamp(asset.display.heightPx,160,1000)}px">${preview}</div><div class="asset-meta"><b>${esc(asset.label)}</b><small>${esc(asset.fileName)}${asset.sizeBytes?` · ${esc(formatBytes(asset.sizeBytes))}`:''}</small></div><div class="asset-actions"><button class="btn small" data-asset-action="preview" data-kind="gallery" data-index="${index}">${esc(tr('preview'))}</button>${asset.source==='cloud'?`<button class="btn small" data-asset-action="download" data-kind="gallery" data-index="${index}">${esc(tr('download'))}</button>`:''}<button class="btn small admin-only" data-asset-action="edit" data-kind="gallery" data-index="${index}">${esc(tr('edit'))}</button><button class="btn small danger admin-only" data-asset-action="delete" data-kind="gallery" data-index="${index}">${esc(tr('delete'))}</button></div></article>`;

function fileRow(area,asset,index){
  const legacy=asset.source==='reference';
  return `<div class="file-row"><div class="file-info"><b>${assetIcon(asset)} ${esc(asset.label)}</b><small class="${legacy?'legacy':''}">${esc(asset.fileName)}${asset.sizeBytes?` · ${esc(formatBytes(asset.sizeBytes))}`:''}${legacy?` · ${esc(tr('legacy'))}`:''}</small></div><div class="file-actions">${isPreviewable(asset)?`<button class="btn small" data-asset-action="preview" data-kind="files" data-index="${index}" ${legacy?'disabled':''}>${esc(tr('preview'))}</button>`:''}<button class="btn small" data-asset-action="download" data-kind="files" data-index="${index}" ${legacy?'disabled':''}>${esc(tr('download'))}</button><button class="btn small admin-only" data-asset-action="edit" data-kind="files" data-index="${index}">${esc(tr('edit'))}</button><button class="btn small danger admin-only" data-asset-action="delete" data-kind="files" data-index="${index}">${esc(tr('delete'))}</button></div></div>`;

function attachAssetActions(area){
  $$('[data-asset-action]').forEach(button=>button.onclick=()=>{
    const kind=button.dataset.kind,index=Number(button.dataset.index),asset=area[kind][index];if(!asset)return;
    if(button.dataset.assetAction==='preview')previewAsset(asset);
    if(button.dataset.assetAction==='download')downloadAsset(asset);
    if(button.dataset.assetAction==='edit')editAsset(area.id,kind,index);
    if(button.dataset.assetAction==='delete')deleteAsset(area.id,kind,index);
  });

function isPreviewable(asset){return asset.mimeType.startsWith('image/')||asset.mimeType.includes('pdf')}
function openModal(title,body,footer='',wide=false){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal ${wide?'wide':''}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn small" data-modal-close>×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`;$$('[data-modal-close]').forEach(button=>button.onclick=closeModal);$('.modal-backdrop').onclick=event=>{if(event.target.classList.contains('modal-backdrop'))closeModal()}}

function editArea(id){
  const existing=id?areaById(id):null;const area=existing||{id:`AREA-${Date.now()}`,building:'A',category:'Other',status:'新建',name:{zh:tr('newArea'),en:'New Area',km:'តំបន់ថ្មី'},size:'',qty:'',notes:'',gallery:[],files:[]};
  const field=(label,key,value,full=false,textarea=false)=>`<div class="form-group ${full?'full':''}"><label>${esc(label)}</label>${textarea?`<textarea class="field" id="${key}">${esc(value)}</textarea>`:`<input class="field" id="${key}" value="${esc(value)}">`}</div>`;
  const body=`<div class="form-grid">${field(tr('areaId'),'areaId',area.id)}${field(tr('status'),'areaStatus',area.status)}${field(tr('nameZh'),'nameZh',area.name.zh)}${field(tr('nameEn'),'nameEn',area.name.en)}${field(tr('nameKm'),'nameKm',area.name.km)}${field(tr('building'),'areaBuilding',area.building)}${field(tr('category'),'areaCategory',area.category)}${field(tr('size'),'areaSize',area.size,true,true)}${field(tr('equipment'),'areaQty',area.qty,true,true)}${field(tr('notes'),'areaNotes',area.notes,true,true)}</div>`;
  openModal(existing?tr('edit'):tr('addArea'),body,`<button class="btn" data-modal-close>${esc(tr('cancel'))}</button><button class="btn primary" id="saveAreaBtn">${esc(tr('save'))}</button>`);
  $('#saveAreaBtn').onclick=async()=>{
    const nextId=$('#areaId').value.trim();if(!nextId)return toast(tr('areaId'),'error');if(nextId!==id&&areaById(nextId))return toast('Area ID already exists','error');
    const updated={...area,id:nextId,status:$('#areaStatus').value.trim(),building:$('#areaBuilding').value.trim()||'A',category:$('#areaCategory').value.trim()||'Other',name:{zh:$('#nameZh').value.trim(),en:$('#nameEn').value.trim(),km:$('#nameKm').value.trim()},size:$('#areaSize').value,qty:$('#areaQty').value,notes:$('#areaNotes').value};
    if(existing){Object.assign(existing,updated)}else state.areas.unshift(normalizeArea(updated,0));selectedId=nextId;closeModal();await persistAndCloud();renderAll();
  };
}

async function deleteArea(id){if(!confirm(tr('confirmDeleteArea')))return;state.areas=state.areas.filter(area=>area.id!==id);selectedId=state.areas[0]?.id||'';await persistAndCloud();renderAll()}

function editAsset(areaId,kind,index){
  const asset=areaById(areaId)?.[kind]?.[index];if(!asset)return;
  const imageFields=kind==='gallery'?`<div class="form-group"><label>${esc(tr('width'))}</label><input id="assetWidth" class="field" type="number" min="25" max="100" value="${clamp(asset.display.widthPct,25,100)}"></div><div class="form-group"><label>${esc(tr('height'))}</label><input id="assetHeight" class="field" type="number" min="160" max="1000" value="${clamp(asset.display.heightPx,160,1000)}"></div><div class="form-group"><label>${esc(tr('fit'))}</label><select id="assetFit" class="field"><option value="contain">${esc(tr('contain'))}</option><option value="cover" ${asset.display.fit==='cover'?'selected':''}>${esc(tr('cover'))}</option></select></div>`:'';
  openModal(tr('edit'),`<div class="form-grid"><div class="form-group full"><label>${esc(tr('label'))}</label><input id="assetLabel" class="field" value="${esc(asset.label)}"></div><div class="form-group full"><label>${esc(tr('fileName'))}</label><input id="assetName" class="field" value="${esc(asset.fileName)}"></div>${imageFields}</div>`,`<button class="btn" data-modal-close>${esc(tr('cancel'))}</button><button class="btn primary" id="saveAssetBtn">${esc(tr('save'))}</button>`);
  $('#saveAssetBtn').onclick=async()=>{asset.label=$('#assetLabel').value.trim()||asset.label;asset.fileName=$('#assetName').value.trim()||asset.fileName;if(kind==='gallery'){asset.display.widthPct=clamp($('#assetWidth').value,25,100);asset.display.heightPx=clamp($('#assetHeight').value,160,1000);asset.display.fit=$('#assetFit').value==='cover'?'cover':'contain'}closeModal();await persistAndCloud();renderContent()};
}

async function deleteAsset(areaId,kind,index){
  const area=areaById(areaId),asset=area?.[kind]?.[index];if(!asset||!confirm(tr('confirmDeleteAsset')))return;
  if(asset.source==='cloud'&&asset.assetId){try{await gasPost({action:'mapDeleteAsset',assetId:asset.assetId})}catch(error){return toast(`${tr('cloudFailed')}: ${error.message}`,'error')}}
  area[kind].splice(index,1);await persistAndCloud();renderContent();refreshUsage();
}

function chooseFiles(mode='auto'){if(!document.body.classList.contains('admin'))return toggleAdmin();if(!selectedId)return toast(tr('noArea'),'error');uploadMode=mode;$('#assetInput').accept=mode==='image'?'image/*':mode==='file'?'.pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z,.dwg':'image/*,.pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z,.dwg';$('#assetInput').click()}

async function uploadFiles(files){
  const area=areaById(selectedId);if(!area||!files.length)return;for(const file of files){if(file.size>MAX_FILE_BYTES)return toast(`${file.name}: ${tr('tooLarge')}`,'error')}
  uploadCancelled=false;showBusy(tr('uploading'),0,true);
  try{
    for(let fileIndex=0;fileIndex<files.length;fileIndex++){
      const file=files[fileIndex];const asset=await uploadOneFile(file,(fraction,label)=>showBusy(`${tr('uploading')} · ${label}`,(fileIndex+fraction)/files.length,true));
      const kind=uploadMode==='image'||(uploadMode==='auto'&&file.type.startsWith('image/'))?'gallery':'files';area[kind].push(normalizeAsset({...asset,kind:kind==='gallery'?'image':'file'},kind==='gallery'?'image':'file',area.id,area[kind].length));
    }
    saveLocal();renderContent();await cloudSave(true);toast(tr('uploadDone'),'success');refreshUsage();
  }catch(error){toast(error.code==='UPLOAD_CANCELLED'?tr('uploadCancelled'):`${tr('cloudFailed')}: ${error.message}`,'error')}
  finally{hideBusy();$('#assetInput').value=''}
}

async function uploadOneFile(file,onProgress){
  const totalChunks=Math.max(1,Math.ceil(file.size/UPLOAD_CHUNK_BYTES));
  const start=await gasPost({action:'mapUploadStart',fileName:file.name,mimeType:file.type||mimeFromType('',file.name),sizeBytes:file.size,totalChunks,chunkSize:UPLOAD_CHUNK_BYTES});
  let completed=0,nextIndex=0;
  const worker=async()=>{while(true){const index=nextIndex++;if(index>=totalChunks)return;if(uploadCancelled){const err=new Error('cancelled');err.code='UPLOAD_CANCELLED';throw err}const slice=file.slice(index*UPLOAD_CHUNK_BYTES,Math.min(file.size,(index+1)*UPLOAD_CHUNK_BYTES));const chunk=await blobToBase64(slice);await gasPost({action:'mapUploadChunk',assetId:start.assetId,index,totalChunks,data:chunk});completed++;onProgress(completed/totalChunks,file.name)}};
  try{await Promise.all(Array.from({length:Math.min(2,totalChunks)},worker));if(uploadCancelled){const err=new Error('cancelled');err.code='UPLOAD_CANCELLED';throw err}await gasPost({action:'mapUploadFinish',assetId:start.assetId});return {id:uid(),source:'cloud',assetId:start.assetId,label:file.name,fileName:file.name,mimeType:file.type||mimeFromType('',file.name),sizeBytes:file.size,chunkCount:totalChunks,chunkSize:UPLOAD_CHUNK_BYTES,display:{widthPct:48,heightPx:280,fit:'contain'}}}
  catch(error){await gasPost({action:'mapUploadAbort',assetId:start.assetId}).catch(()=>{});throw error}
}

async function blobToBase64(blob){const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(binary)}
function b64ToBytes(base64){const binary=atob(base64);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes}

async function fetchCloudBlob(asset){
  if(asset.source!=='cloud'||!asset.assetId||!asset.chunkCount)throw new Error(tr('actualFile'));
  showBusy(`${tr('downloading')} · ${asset.fileName}`,0,false);const parts=new Array(asset.chunkCount);let completed=0,next=0;
  const worker=async()=>{while(true){const index=next++;if(index>=asset.chunkCount)return;const data=await gasGet('mapFileChunk',{assetId:asset.assetId,index});parts[index]=b64ToBytes(data.data);completed++;showBusy(`${tr('downloading')} · ${asset.fileName}`,completed/asset.chunkCount,false)}};
  try{await Promise.all(Array.from({length:Math.min(4,asset.chunkCount)},worker));return new Blob(parts,{type:asset.mimeType||'application/octet-stream'})}finally{hideBusy()}
}

async function previewAsset(asset){
  if(asset.source==='reference')return toast(tr('actualFile'),'error');
  try{
    let url=asset.source==='bundled'?encodeURI(asset.url):URL.createObjectURL(await fetchCloudBlob(asset));
    if(asset.mimeType.startsWith('image/')||asset.source==='bundled')return imageViewer(asset.label,url,asset.source==='cloud');
    if(asset.mimeType.includes('pdf'))return pdfViewer(asset.label,url,asset.source==='cloud');
    if(asset.source==='cloud')URL.revokeObjectURL(url);toast(tr('notSupported'),'error');
  }catch(error){toast(`${tr('cloudFailed')}: ${error.message}`,'error')}
}

function imageViewer(title,url,revoke){
  openModal(title,`<div class="viewer"><img id="viewerImage" src="${esc(url)}" alt="${esc(title)}"><div class="viewer-tools"><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">＋</button></div></div>`,`<button class="btn" id="viewerClose">${esc(tr('close'))}</button>`,true);let zoom=1;const image=$('#viewerImage');image.dataset.objectUrl=revoke?url:'';const draw=()=>{image.style.transform=`scale(${zoom})`;$('#zoomReset').textContent=`${Math.round(zoom*100)}%`};$('#zoomOut').onclick=()=>{zoom=clamp(zoom-.25,.25,5);draw()};$('#zoomIn').onclick=()=>{zoom=clamp(zoom+.25,.25,5);draw()};$('#zoomReset').onclick=()=>{zoom=1;draw()};$('#viewerClose').onclick=()=>{if(revoke)URL.revokeObjectURL(url);closeModal()};
}
function pdfViewer(title,url,revoke){openModal(title,`<div class="viewer"><iframe src="${esc(url)}" data-object-url="${revoke?esc(url):''}" title="${esc(title)}"></iframe></div>`,`<button class="btn" id="viewerClose">${esc(tr('close'))}</button>`,true);$('#viewerClose').onclick=closeModal}

async function downloadAsset(asset){
  if(asset.source==='reference')return toast(tr('actualFile'),'error');
  try{const url=asset.source==='bundled'?encodeURI(asset.url):URL.createObjectURL(await fetchCloudBlob(asset));const link=document.createElement('a');link.href=url;link.download=asset.fileName||asset.label;document.body.appendChild(link);link.click();link.remove();if(asset.source==='cloud')setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){toast(`${tr('cloudFailed')}: ${error.message}`,'error')}
}

async function gasPost(payload){const response=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tool:'vrt_acc',...payload})});const text=await response.text();let data;try{data=JSON.parse(text)}catch(_error){throw new Error(text.slice(0,180)||`HTTP ${response.status}`)}if(!response.ok||data.ok===false)throw new Error(data.message||`HTTP ${response.status}`);return data}
async function gasGet(action,params={}){const query=new URLSearchParams({action,tool:'vrt_acc',...Object.fromEntries(Object.entries(params).map(([key,value])=>[key,String(value)]))});const response=await fetch(`${GAS_URL}?${query}`);const data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.message||`HTTP ${response.status}`);return data}

async function checkCloud(){try{const data=await gasGet('status');$('#cloudDot').className='ok';$('#cloudText').textContent=tr('connected');return data}catch(_error){$('#cloudDot').className='bad';$('#cloudText').textContent=tr('offline');return null}}
async function refreshUsage(){try{const data=await gasGet('mapStorage');$('#usageText').textContent=`${tr('tracked')}: ${formatBytes(data.bytes)} · ${formatNumber(data.files)} ${tr('fileCount')}`}catch(_error){$('#usageText').textContent='—'}}

async function cloudSave(silent=false){
  if(!silent)showBusy(tr('cloudSave'),.2,false);try{saveLocal();const result=await gasPost({action:'mapPush',data:packageState()});state.updatedAt=result.updatedAt||state.updatedAt;saveLocal();if(!silent)toast(tr('savedCloud'),'success');await checkCloud();return true}catch(error){toast(`${tr('cloudFailed')}: ${error.message}`,'error');return false}finally{if(!silent)hideBusy()}
}

async function cloudLoad(){
  if(!confirm(tr('confirmCloudLoad')))return;showBusy(tr('cloudLoad'),.2,false);try{const result=await gasGet('mapPull');if(!result.data?.state?.areas)throw new Error(tr('noCloudData'));state=normalizeState(result.data.state);selectedId=state.areas[0]?.id||'';saveLocal();renderAll();toast(tr('loadedCloud'),'success')}catch(error){toast(`${tr('cloudFailed')}: ${error.message}`,'error')}finally{hideBusy()}
}

async function persistAndCloud(){saveLocal();toast(tr('savedLocal'),'success');await cloudSave(true)}
function exportJson(){const blob=new Blob([JSON.stringify(packageState(),null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`VRT_Factory_Map_Backup_${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
async function importJson(file){try{const payload=JSON.parse(await file.text());const source=payload.schema==='vrt-factory-map'?(payload.state||payload):payload;state=normalizeState(source);selectedId=state.areas[0]?.id||'';saveLocal();renderAll();toast(tr('jsonImported'),'success');await cloudSave(true)}catch(_error){toast(tr('invalidJson'),'error')}finally{$('#jsonInput').value=''}}

function toggleAdmin(){
  if(document.body.classList.contains('admin')){document.body.classList.remove('admin');renderLanguage();renderContent();return}
  const password=prompt(tr('password'),'');if(password==='1111'){document.body.classList.add('admin');renderLanguage();renderContent()}else if(password!==null)toast(tr('wrongPassword'),'error');
}

function showBusy(title,fraction=0,cancellable=false){$('#busyTitle').textContent=title;$('#progressBar').style.width=`${clamp(fraction*100,0,100)}%`;$('#progressText').textContent=`${Math.round(clamp(fraction*100,0,100))}%`;$('#cancelUploadBtn').classList.toggle('hidden',!cancellable);$('#busy').classList.remove('hidden')}
function hideBusy(){$('#busy').classList.add('hidden')}
function toast(message,type=''){clearTimeout(toastTimer);const node=$('#toast');node.textContent=message;node.className=`toast show ${type}`;toastTimer=setTimeout(()=>node.className='toast',3200)}

function bind(){
  $$('[data-lang]').forEach(button=>button.onclick=()=>setLang(button.dataset.lang));
  $('#searchInput').oninput=renderList;$('#buildingSelect').onchange=renderList;$('#jumpSelect').onchange=event=>event.target.value&&selectArea(event.target.value);
  $('#addAreaBtn').onclick=()=>editArea(null);$('#adminBtn').onclick=toggleAdmin;$('#uploadBtn').onclick=()=>chooseFiles('auto');$('#assetInput').onchange=event=>uploadFiles([...event.target.files]);
  $('#cloudUpBtn').onclick=()=>cloudSave(false);$('#cloudDownBtn').onclick=cloudLoad;$('#exportBtn').onclick=exportJson;$('#importBtn').onclick=()=>$('#jsonInput').click();$('#jsonInput').onchange=event=>event.target.files[0]&&importJson(event.target.files[0]);
  $('#cancelUploadBtn').onclick=()=>{uploadCancelled=true;$('#cancelUploadBtn').disabled=true};
}

bind();renderLanguage();renderAll();checkCloud();refreshUsage();
</script>
</body>
</html>
