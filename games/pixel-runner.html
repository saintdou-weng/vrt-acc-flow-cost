<script src="engine.js"></script><script>
/* 像素跑跳（原創橫向捲軸平台遊戲，2026-11-26）：每關由關卡號自動產生（無限關，越後面坑越多、敵人越多、有尖刺和移動平台）。
   搖桿左右跑（推越多跑越快）、A 或往上推跳（按久跳高）、踩敵人頭可以打倒、吃金幣加分、碰到終點旗過關、中間旗子是存檔點。 */
const T=12,VW=180,VH=220,ROWS=17,OY=16;
const HEROES=[{n:'RED',c:'#e5383b',d:'#8d1b1d',l:'#ff8a8c',p:'#2b4fd8'},{n:'BLUE',c:'#2f7de1',d:'#173f80',l:'#8cc1ff',p:'#2c2c38'},{n:'GREEN',c:'#2fb34a',d:'#16642a',l:'#93ee9f',p:'#6b3a1e'}];
let M,COLS,pl,cam,coins,foes,parts,flagX,ck,seed,movers,tt,THEME;
const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const THEMES=[{s1:'#5ec8ff',s2:'#d8f3ff',h1:'#5fbf6a',h2:'#3b8c4a',g:'#4cc35a',d1:'#a0612e',d2:'#5f3518'},
              {s1:'#ff9e6b',s2:'#ffe0b8',h1:'#c9795a',h2:'#8c4b36',g:'#e0b84a',d1:'#b5713a',d2:'#6b3a1e'},
              {s1:'#1a2350',s2:'#4b4f9a',h1:'#2d3570',h2:'#1c2250',g:'#58d6c9',d1:'#5a5f86',d2:'#2c3052'},
              {s1:'#9fd8ff',s2:'#ffffff',h1:'#cfe6f5',h2:'#8fb4cc',g:'#f4fbff',d1:'#7f9db3',d2:'#4d6578'}];
/* 地形：0 空、1 土（上面有草）、2 石磚平台、3 尖刺、4 問號磚（頂一下掉金幣）、5 已用磚 */
function gen(lv){seed=lv*9973+7;THEME=THEMES[Math.floor((lv-1)/5)%THEMES.length];
  COLS=Math.min(260,70+lv*3);M=Array.from({length:ROWS},()=>Array(COLS).fill(0));coins=[];foes=[];movers=[];
  const diff=Math.min(1,lv/60);let h=4,x=0;const col=(x,h)=>{for(let y=ROWS-h;y<ROWS;y++)M[y][x]=1};
  while(x<8){col(x,h);x++}
  while(x<COLS-12){const r=R();
    if(r<.22+diff*.18){/* 坑：寬 2～3 格（一定跳得過），後面地面高度差最多 1 */const w=2+(R()<.3+diff*.4?1:0);
      if(R()<diff*.6&&w===3){for(let i=0;i<w;i++)M[ROWS-1][x+i]=3} x+=w;h=Math.max(2,Math.min(7,h+(R()<.5?-1:1)*(R()<.5?1:0)))}
    else if(r<.45){/* 階梯 */const up=R()<.5&&h<8?1:-1;h=Math.max(2,Math.min(8,h+up));const n=3+Math.floor(R()*4);for(let i=0;i<n;i++)col(x+i,h);x+=n}
    else{const n=4+Math.floor(R()*6);for(let i=0;i<n;i++){col(x+i,h);if(i>0&&i<n-1&&R()<.12+diff*.15&&lv>3)M[ROWS-h-1][x+i]=3}
      /* 地上敵人 */if(n>=5&&R()<.35+diff*.4)foes.push({x:(x+2)*T,y:(ROWS-h-1)*T,vx:-18-diff*20,k:R()<diff*.5?1:0,dead:0});
      /* 浮空平台與問號磚、金幣 */if(R()<.55){const py=ROWS-h-3,px=x+1+Math.floor(R()*2),pw=2+Math.floor(R()*3);
        for(let i=0;i<pw;i++)M[py][px+i]=R()<.25?4:2;for(let i=0;i<pw;i++)coins.push({x:(px+i)*T+6,y:(py-1)*T+6,got:0})}
      else for(let i=1;i<n-1;i+=2)coins.push({x:(x+i)*T+6,y:(ROWS-h-2)*T+4,got:0});
      x+=n}
    /* 後面的關卡：移動平台跨過大坑 */
    if(lv>6&&R()<.08+diff*.1&&x<COLS-20){const w=5;movers.push({x0:x*T,x1:(x+w-2)*T,y:(ROWS-h)*T,w:2*T,x:x*T,v:24+diff*16,dir:1});x+=w}
  }
  flagX=x+4;while(x<COLS){col(x,h);x++}h=Math.max(2,h);ck={x:2*T,y:(ROWS-5)*T};
  /* 中間存檔旗 */const mid=Math.floor(COLS/2);let mh=0;for(let y=0;y<ROWS;y++)if(M[y][mid]===1){mh=y;break}window._mid={x:mid*T,y:(mh-2)*T,on:0,ok:!!mh};
  return M}
const cell=(px,py)=>{const cx=Math.floor(px/T),cy=Math.floor(py/T);if(cx<0||cx>=COLS)return 2;if(cy<0)return 0;if(cy>=ROWS)return 0;return M[cy][cx]};
const solidV=v=>v===1||v===2||v===4||v===5;
function burst(x,y,n,c,sp){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(sp||80),vy:-Math.random()*(sp||80),t:.5+Math.random()*.3,c})}
function hurt(G){if(pl.inv>0)return;G.lives--;G.sfx.lose();burst(pl.x+5,pl.y+6,24,HEROES[G.char].c);if(G.lives<=0){G.lose();return}
  const m=window._mid;const s=m.on?m:ck;pl.x=s.x;pl.y=s.y;pl.vx=pl.vy=0;pl.inv=2}
GE.run({id:'pixelrunner',title:'PIXEL RUNNER',w:VW,h:VH,chars:HEROES.map(h=>h.n),lives:3,
 start(G,lv){gen(lv);pl={x:ck.x,y:ck.y,vx:0,vy:0,on:0,face:1,inv:1.2,run:0,jh:0};cam=0;parts=[];tt=0},
 step(G,dt,k,p){tt+=dt;const ax=G.ax,acc=520,max=82;

   if(!jumpK&&pl.vy<-90)pl.vy=-90;/* 放開就跳低 */

     movers.forEach(m=>{if(pl.x+W>m.x&&pl.x<m.x+m.w&&pl.y+H<=m.y+1&&ny+H+1>=m.y){ny=m.y-H-1;pl.vy=0;pl.on=1;pl.x+=m.v*m.dir*dt}})}
   else if(pl.vy<0){for(const sx of [pl.x+2,pl.x+W-2]){const cx=Math.floor(sx/T),cy=Math.floor(ny/T),v=cell(sx,ny);if(solidV(v)){ny=(cy+1)*T;pl.vy=0;

   /* 敵人 */foes.forEach(f=>{if(f.dead){f.dead+=dt;return}if(Math.abs(f.x-pl.x)>VW*1.2)return;const nx=f.x+f.vx*dt;
     const ahead=f.vx>0?nx+10:nx;if(solidV(cell(ahead,f.y+4))||!solidV(cell(ahead,f.y+T+2))||cell(ahead,f.y+6)===3)f.vx=-f.vx;else f.x=nx;
     if(pl.x+W>f.x+1&&pl.x<f.x+10&&pl.y+H>f.y+2&&pl.y<f.y+10){

   coins.forEach(c=>{if(!c.got&&Math.abs(pl.x+W/2-c.x)<8&&Math.abs(pl.y+H/2-c.y)<9){c.got=1;G.sfx.coin();G.add(50);burst(c.x,c.y,6,'#fff3a0',40)}});
   const m=window._mid;if(m.ok&&!m.on&&pl.x>m.x){m.on=1;G.sfx.clear();burst(m.x+6,m.y,16,'#5f5')}
   parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=200*dt;q.t-=dt});parts=parts.filter(q=>q.t>0);
   cam+=((pl.x-VW*.4)-cam)*Math.min(1,dt*6);cam=Math.max(0,Math.min(COLS*T-VW,cam));
   if(pl.x>=flagX*T){G.add(500+Math.max(0,Math.round(G.lives*100)));G.win()}},
 draw(G){const g=G.g,th=THEME;const sk=g.createLinearGradient(0,0,0,VH);sk.addColorStop(0,th.s1);sk.addColorStop(1,th.s2);g.fillStyle=sk;g.fillRect(0,0,VW,VH);
   if(th===THEMES[2]){g.fillStyle='#fff';for(let i=0;i<40;i++){const sx=((i*53-cam*.05)%VW+VW)%VW,sy=(i*37)%110+12;g.globalAlpha=.4+.6*Math.abs(Math.sin(tt*2+i));g.fillRect(sx,sy,.8,.8)}g.globalAlpha=1}
   /* 太陽／月亮 */const sg=g.createRadialGradient(140,40,2,140,40,22);sg.addColorStop(0,'rgba(255,255,230,1)');sg.addColorStop(.35,'rgba(255,250,200,.8)');sg.addColorStop(1,'rgba(255,250,200,0)');g.fillStyle=sg;g.fillRect(110,10,60,60);
   /* 雲 */g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<6;i++){const cx=((i*97-cam*.15)%(VW+60)+VW+60)%(VW+60)-30,cy=24+(i*29)%50;[[0,0,7],[7,-3,8],[15,0,6],[7,2,7]].forEach(([a,b,r])=>{g.beginPath();g.arc(cx+a,cy+b,r,0,7);g.fill()})}
   /* 遠山（兩層視差、漸層） */for(const [par,col,base,amp] of [[.2,th.h2,130,26],[.4,th.h1,150,20]]){g.fillStyle=col;g.beginPath();g.moveTo(0,VH);for(let x=0;x<=VW;x+=4){const wx=x+cam*par;g.lineTo(x,base-Math.abs(Math.sin(wx*.021))*amp-Math.sin(wx*.007)*10)}g.lineTo(VW,VH);g.fill()}

       g.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<3;i++){const h=(x*7+y*13+i*5)%11;g.fillRect(X+h,Y+((h*3+i*4)%10)+1,1.5,1)}
       if(top){g.fillStyle=th.g;g.fillRect(X,Y,T,3.2);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(X,Y,T,.8);g.fillStyle=th.g;for(let i=0;i<T;i+=2)g.fillRect(X+i,Y+3,1,((x+i)%3)*.6+.6)}}
     else if(v===2||v===4||v===5){const gr=g.createLinearGradient(X,Y,X,Y+T);
       if(v===2){gr.addColorStop(0,'#c9ccd6');gr.addColorStop(1,'#6e7383')}else if(v===4){gr.addColorStop(0,'#ffe27a');gr.addColorStop(1,'#d18a10')}else{gr.addColorStop(0,'#a88a5a');gr.addColorStop(1,'#6b5130')}
       g.fillStyle=gr;g.fillRect(X,Y,T,T);g.fillStyle='rgba(255,255,255,.45)';g.fillRect(X,Y,T,1);g.fillRect(X,Y,1,T);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(X,Y+T-1,T,1);g.fillRect(X+T-1,Y,1,T);
       if(v===2){g.fillStyle='rgba(0,0,0,.15)';g.fillRect(X+T/2,Y+1,.6,T/2-1);g.fillRect(X+1,Y+T/2,T-2,.6)}
       if(v===4){g.fillStyle='#7a4a00';G.text(g,'?',X+5,Y+3+Math.sin(tt*5)*.5,'#7a4a00')}}
     else if(v===3){g.fillStyle='#3b3f4a';g.fillRect(X,Y+T-2,T,2);for(let i=0;i<3;i++){const gr=g.createLinearGradient(X+i*4,0,X+i*4+4,0);gr.addColorStop(0,'#f2f4f8');gr.addColorStop(1,'#7c8394');g.fillStyle=gr;g.beginPath();g.moveTo(X+i*4,Y+T-2);g.lineTo(X+i*4+2,Y+3);g.lineTo(X+i*4+4,Y+T-2);g.fill()}}}
   movers.forEach(m=>{const gr=g.createLinearGradient(0,m.y,0,m.y+6);gr.addColorStop(0,'#ffcf6b');gr.addColorStop(1,'#a0661c');g.fillStyle=gr;g.fillRect(m.x,m.y,m.w,6);g.fillStyle='rgba(255,255,255,.5)';g.fillRect(m.x,m.y,m.w,1);g.fillStyle='#5b3a10';for(let i=2;i<m.w;i+=5)g.fillRect(m.x+i,m.y+2,1,1)});
   /* 終點旗、中間旗 */const fx=flagX*T;let fy=0;for(let y=0;y<ROWS;y++)if(M[y][flagX]===1){fy=y*T;break}
   g.fillStyle='#d9dde6';g.fillRect(fx+5,fy-70,1.6,70);g.fillStyle='#ffd23f';g.beginPath();g.arc(fx+5.8,fy-71,2,0,7);g.fill();
   const wv=Math.sin(tt*6)*2;g.fillStyle='#ff3b5c';g.beginPath();g.moveTo(fx+6.6,fy-68);g.lineTo(fx+22,fy-63+wv);g.lineTo(fx+6.6,fy-56);g.fill();g.fillStyle='#8d1b2f';g.fillRect(fx+1,fy-3,10,3);
   const mm=window._mid;if(mm.ok){g.fillStyle='#bbb';g.fillRect(mm.x+5,mm.y-10,1,22);g.fillStyle=mm.on?'#3fdc5a':'#888';g.beginPath();g.moveTo(mm.x+6,mm.y-10);g.lineTo(mm.x+14,mm.y-7+wv*.5);g.lineTo(mm.x+6,mm.y-4);g.fill()}
   coins.forEach(c=>{if(c.got)return;const s=Math.abs(Math.sin(tt*4+c.x*.1));const gr=g.createRadialGradient(c.x-1,c.y-1,.5,c.x,c.y,4);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.5,'#ffd23f');gr.addColorStop(1,'#b8790a');g.fillStyle=gr;
     g.beginPath();g.ellipse(c.x,c.y,Math.max(.6,3.6*s),3.8,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.8)';g.fillRect(c.x-.5,c.y-2.5,.8*s,2)});
   foes.forEach(f=>{const sq=f.dead?.35:1+Math.sin(tt*10+f.x)*.08;g.save();g.translate(f.x+5,f.y+T);g.scale(1/sq,sq);

     g.fillStyle=gr;g.beginPath();g.moveTo(-5.5,0);g.quadraticCurveTo(-6,-10,0,-10);g.quadraticCurveTo(6,-10,5.5,0);g.closePath();g.fill();

   /* 主角：漸層身體、會擺動的手腳、帽子 */
   if(pl.inv<=0||Math.floor(pl.inv*12)%2){const h=HEROES[G.char],x=pl.x,y=pl.y,f=pl.face,ph=pl.on?Math.sin(pl.run*.35):0.8;
     g.fillStyle='rgba(0,0,0,.25)';if(pl.on){g.beginPath();g.ellipse(x+4.5,y+11.5,5,1.3,0,0,7);g.fill()}

     g.fillStyle='#111';g.fillRect(1,1.8,1,1.2);g.fillStyle=h.c;g.fillRect(-3.4,-1.2,6.8,2.2);g.fillRect(0,0,5.2,1);g.fillStyle=h.l;g.fillRect(-3,-1.2,4,.6);
     g.fillStyle='#ffd23f';g.fillRect(-1,5.2,2,1.4);g.restore()}
   g.globalCompositeOperation='lighter';parts.forEach(q=>{g.globalAlpha=Math.min(1,q.t*2);g.fillStyle=q.c;g.fillRect(q.x-.8,q.y-.8,1.6,1.6)});g.globalAlpha=1;g.globalCompositeOperation='source-over';
   g.restore();
   g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,VW,11);for(let i=0;i<G.lives;i++){g.fillStyle='#ff4d6d';g.beginPath();const hx=40+i*8,hy=5;g.arc(hx-1.3,hy-1,1.8,0,7);g.arc(hx+1.3,hy-1,1.8,0,7);g.moveTo(hx-3,hy-.4);g.lineTo(hx,hy+3);g.lineTo(hx+3,hy-.4);g.fill()}
   const pr=Math.min(1,pl.x/(flagX*T));g.fillStyle='#333';g.fillRect(80,4,50,3);g.fillStyle='#5f5';g.fillRect(80,4,50*pr,3)},
