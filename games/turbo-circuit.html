<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Circuit 極速賽道</title><link rel="stylesheet" href="game.css"></head><body><canvas id="cv"></canvas>
<script src="engine.js"></script><script>
/* 極速賽道（原創俯視繞圈賽車，2026-11-28）：每關一條由關卡號產生的封閉賽道（無限關），跑 3 圈和 3～5 台電腦車比賽。
   車子會自己加速，只要把搖桿推向想去的方向，車頭就會轉過去（十字鍵是 8 個方向；也可以直接用手指按住畫面上想去的地方）。
   放開搖桿時車子會自己沿著賽道微微修正，老人小孩都好開。A＝氮氣加速（每圈補 1 次，最多 3 次）。開到草地／沙地會變慢，不會爆炸。
   前 29 關跑進前 3 名過關，第 30 關起要前 2 名；沒進名次扣一顆心重跑，心用完可以接關。越後面賽道越窄越彎、電腦車越快越多。
   白天草地／沙漠／夜晚（有車燈）三種場景輪流。 */
const VW=160,VH=230,LAPS=3;
const CARS=[{n:'RED',a:'#ff3b3b',b:'#8f1010',l:'#ffd0d0',v:84,t:3.2},{n:'BLUE',a:'#2f86ff',b:'#123f8a',l:'#cfe2ff',v:80,t:3.8},{n:'GOLD',a:'#ffc531',b:'#8a5a00',l:'#fff4c8',v:88,t:2.9}];
const AIC=[['#3fd16b','#13662e','#c8ffd8'],['#c56bff','#4d1f80','#f0d8ff'],['#ff8a3d','#8a3a0a','#ffe0c8'],['#f2f2f2','#6a6f78','#ffffff'],['#29d3e0','#0e5a66','#d0fbff']];
const TH=[{g1:'#63c450',g2:'#4fa83f',as:'#596069',ed:'#e8e8e8',dk:0,tr:'tree'},{g1:'#f1d08c',g2:'#e2bb72',as:'#6b645b',ed:'#fff4dc',dk:0,tr:'cactus'},{g1:'#21422e',g2:'#1a3726',as:'#3c414b',ed:'#cfd3dc',dk:1,tr:'tree'}];
let tr,p,ai,marks,parts,cam,cd,tt=0,lv,th,msg,msgT,need,fin,lastBeep;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function wrapA(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function build(l){const R=rng(l*7919+13),n=480,Rad=250+Math.min(90,l*1.6),sx=.8+R()*.45,sy=.8+R()*.45;
  const a2=.1+R()*.15,a3=R()*.1,a4=R()*(.04+Math.min(.05,l*.001)),a5=l>20?R()*Math.min(.03,l*.0004):0,f=[R()*7,R()*7,R()*7,R()*7];
  const P=[];for(let i=0;i<n;i++){const q=i/n*Math.PI*2,r=Rad*(1+a2*Math.sin(2*q+f[0])+a3*Math.sin(3*q+f[1])+a4*Math.sin(4*q+f[2])+a5*Math.sin(5*q+f[3]));P.push({x:Math.cos(q)*r*sx,y:Math.sin(q)*r*sy})}
  const ang=[],cum=[0];let L=0;for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];ang.push(Math.atan2(b.y-a.y,b.x-a.x));L+=Math.hypot(b.x-a.x,b.y-a.y);cum.push(L)}
  const cv=[];for(let i=0;i<n;i++)cv.push(Math.abs(wrapA(ang[(i+14)%n]-ang[i])));
  const W=Math.max(30,52-l*.25);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;P.forEach(q=>{x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y)});
  const deco=[];for(let k=0;k<110;k++){const i=Math.floor(R()*n),s=R()<.5?-1:1,d=W/2+14+R()*70,x=P[i].x-Math.sin(ang[i])*s*d,y=P[i].y+Math.cos(ang[i])*s*d;let ok=1;for(let j=0;j<n;j+=3){if(Math.hypot(P[j].x-x,P[j].y-y)<W/2+10){ok=0;break}}if(ok)deco.push({x,y,s:.8+R()*.7,k:R()<.2?'rock':'plant'})}
  const ms=40/Math.max(x1-x0,y1-y0);return{P,ang,cum,L,n,cv,W,deco,x0,y0,x1,y1,ms}}
function pos(pr,off){const n=tr.n,q=((pr%n)+n)%n,i=Math.floor(q),fr=q-i,a=tr.P[i],b=tr.P[(i+1)%n],an=tr.ang[i];return{x:a.x+(b.x-a.x)*fr-Math.sin(an)*off,y:a.y+(b.y-a.y)*fr+Math.cos(an)*off,a:an}}
function nearest(x,y,from,span){const n=tr.n;let bj=from,bd=1e9;for(let k=-span;k<=span;k++){const j=((from+k)%n+n)%n,q=tr.P[j],d=(q.x-x)*(q.x-x)+(q.y-y)*(q.y-y);if(d<bd){bd=d;bj=j}}return{j:bj,d:Math.sqrt(bd)}}
function setup(G){const nA=Math.min(5,3+Math.floor(lv/6)),C=CARS[G.char],fac=Math.min(.95,.8+lv*.0035),R=rng(lv*31+7);ai=[];marks=[];parts=[];fin=0;
  for(let k=0;k<=nA;k++){const pr=-(6+k*6),off=(k%2?1:-1)*tr.W*.22;if(k===nA){const s=pos(pr,off);p={x:s.x,y:s.y,a:s.a,v:0,prog:pr,idx:((Math.round(pr)%tr.n)+tr.n)%tr.n,boosts:2,bT:0,off:0,offT:0,hitT:0,done:0,lap:0}}
    else ai.push({prog:pr,off,tOff:off,v:0,base:C.v*(fac-k*.025+R()*.02),c:AIC[k%AIC.length],done:0,ch:R()*3})}
  ai.forEach(a=>{const q=pos(a.prog,a.off);a.x=q.x;a.y=q.y;a.a=q.a});cam={x:p.x,y:p.y};cd=3;lastBeep=4;msg='';msgT=0}
function burst(x,y,n,c,s){for(let i=0;i<n;i++){const a=Math.random()*7,v=(s||40)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.3+Math.random()*.4,c})}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function car(g,x,y,a,c1,c2,c3,sc,boost){g.save();g.translate(x,y);g.rotate(a);g.scale(sc||1.2,sc||1.2);
  g.fillStyle='rgba(0,0,0,.33)';rr(g,-6.5,-3.2,15,9,3);g.fill();
  if(boost){g.fillStyle='rgba(120,200,255,.85)';g.beginPath();g.moveTo(-8,-2);g.lineTo(-13-Math.random()*5,0);g.lineTo(-8,2);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(-8,-1);g.lineTo(-10.5-Math.random()*2,0);g.lineTo(-8,1);g.fill()}
  g.fillStyle='#16181c';[[-5.6,-5],[2.6,-5],[-5.6,3.4],[2.6,3.4]].forEach(w=>{rr(g,w[0],w[1],3.6,1.8,.6);g.fill()});
  const gr=g.createLinearGradient(0,-4.2,0,4.2);gr.addColorStop(0,c2);gr.addColorStop(.25,c1);gr.addColorStop(.45,c3);gr.addColorStop(.65,c1);gr.addColorStop(1,c2);
  g.fillStyle=gr;g.beginPath();g.moveTo(8,-1.6);g.quadraticCurveTo(8.4,0,8,1.6);g.lineTo(5,3.8);g.lineTo(-6.5,4);g.quadraticCurveTo(-8,4,-8,2.6);g.lineTo(-8,-2.6);g.quadraticCurveTo(-8,-4,-6.5,-4);g.lineTo(5,-3.8);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=.35;g.stroke();
  const wg=g.createLinearGradient(1,0,4,0);wg.addColorStop(0,'#1b2a40');wg.addColorStop(1,'#6aa0d8');g.fillStyle=wg;g.beginPath();g.moveTo(1,-2.8);g.lineTo(3.8,-2.2);g.lineTo(3.8,2.2);g.lineTo(1,2.8);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(-4.5,-.45,10,.9);g.fillStyle='#1b2a40';rr(g,-5.4,-2.6,2,5.2,.6);g.fill();
  g.fillStyle='#fff6b0';g.fillRect(7.2,-2.4,.9,1.2);g.fillRect(7.2,1.2,.9,1.2);g.fillStyle='#ff3030';g.fillRect(-8.1,-2.8,.8,1.4);g.fillRect(-8.1,1.4,.8,1.4);g.restore()}
function plant(g,d,T){const x=d.x,y=d.y,s=d.s;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x+3*s,y+3*s,7*s,4*s,0,0,7);g.fill();
  if(d.k==='rock'){const gr=g.createRadialGradient(x-2*s,y-2*s,1,x,y,6*s);gr.addColorStop(0,'#c9c4bb');gr.addColorStop(1,'#6e6a63');g.fillStyle=gr;g.beginPath();g.ellipse(x,y,6*s,4.5*s,.3,0,7);g.fill();return}
  if(T.tr==='cactus'){g.fillStyle='#2f8a3c';rr(g,x-2*s,y-9*s,4*s,13*s,2*s);g.fill();rr(g,x-6*s,y-5*s,2.6*s,6*s,1.3*s);g.fill();rr(g,x+3.4*s,y-7*s,2.6*s,6*s,1.3*s);g.fill();g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x-1*s,y-8*s,.8*s,11*s);return}
  const gr=g.createRadialGradient(x-2.5*s,y-3*s,1,x,y,8*s);gr.addColorStop(0,T.dk?'#4a8a52':'#9be36f');gr.addColorStop(1,T.dk?'#0f2c18':'#2a7a2a');g.fillStyle=gr;[[0,0,7],[-4,2,5],[4,2,5],[0,-4,5]].forEach(c=>{g.beginPath();g.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,7);g.fill()})}
function strokeTrack(g){const P=tr.P;g.beginPath();g.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length;i++)g.lineTo(P[i].x,P[i].y);g.closePath();g.stroke()}
GE.run({id:'turbocircuit',title:'TURBO CIRCUIT',w:VW,h:VH,chars:CARS.map(c=>c.n),lives:3,
 start(G,l){lv=l;th=TH[Math.floor((l-1)/2)%3];tr=build(l);need=l<30?3:2;G.lives=3;setup(G);
   if(!window._tcTap){window._tcTap=1;const cv=document.getElementById('cv'),f=e=>{const r=cv.getBoundingClientRect();window._tcPt={x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}};
     cv.addEventListener('pointerdown',f);cv.addEventListener('pointermove',e=>{if(window._tcPt)f(e)});['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{window._tcPt=null}))}
   window._tcS={get p(){return p},get ai(){return ai},get tr(){return tr},get cam(){return cam}}},
 step(G,dt,k,pr){tt+=dt;msgT-=dt;const C=CARS[G.char],n=tr.n,W=tr.W;
   parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt});parts=parts.filter(q=>q.t>0);
   if(cd>0){cd-=dt;if(Math.ceil(cd)<lastBeep){lastBeep=Math.ceil(cd);if(lastBeep>0)G.beep(440,.15,'square',.05);else G.beep(880,.35,'square',.06)}if(cd>0)return}
   /* 玩家：搖桿方向＝車頭要去的方向 */
   let ix=G.ax,iy=G.ay,ta=null;const pt=window._tcPt;
   if(pt&&pt.y>20){const sx=p.x-cam.x+VW/2,sy=p.y-cam.y+VH/2;if(Math.hypot(pt.x-sx,pt.y-sy)>6)ta=Math.atan2(pt.y-sy,pt.x-sx)}
   else if(Math.hypot(ix,iy)>.25)ta=Math.atan2(iy,ix);
   const spf=Math.min(1,p.v/25);let turn=0;
   if(ta!==null){const da=wrapA(ta-p.a);turn=Math.max(-C.t*dt,Math.min(C.t*dt,da))*spf}
   else{const da=wrapA(tr.ang[(p.idx+10)%n]-p.a);turn=Math.max(-C.t*.4*dt,Math.min(C.t*.4*dt,da))*spf}
   p.a+=turn;
   if(pr.A&&p.boosts>0&&p.bT<=0){p.boosts--;p.bT=1.6;G.beep(200,.5,'sawtooth',.05,900)}p.bT-=dt;p.hitT-=dt;
   const nr=nearest(p.x,p.y,p.idx,30);const off=nr.d>W/2+2;
   const vt=C.v*(off?.45:1)*(p.bT>0?1.5:1);p.v+=(vt-p.v)*Math.min(1,dt*(vt>p.v?1.1:2.6));
   p.x+=Math.cos(p.a)*p.v*dt;p.y+=Math.sin(p.a)*p.v*dt;
   let dj=nr.j-p.idx;if(dj<-n/2)dj+=n;if(dj>n/2)dj-=n;p.prog+=dj;p.idx=nr.j;
   const lapNow=Math.floor(p.prog/n);if(lapNow>p.lap){p.lap=lapNow;if(lapNow<LAPS){p.boosts=Math.min(3,p.boosts+1);msg='LAP '+(lapNow+1)+'/'+LAPS;msgT=1.4;G.sfx.coin()}}
   if(off){if(Math.random()<.5)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,t:.4,c:th.tr==='cactus'?'#c9a060':'#3d7a2e'});p.offT=nr.d>W*2.2?p.offT+dt:0}else p.offT=0;
   if(p.offT>1.5){const s=pos(p.idx,0);p.x=s.x;p.y=s.y;p.a=s.a;p.v=10;p.offT=0;msg='BACK ON TRACK';msgT=1.2}
   if((Math.abs(turn)>C.t*dt*.7&&p.v>50)||off){const c=Math.cos(p.a),s=Math.sin(p.a);marks.push({x:p.x-c*6-s*4,y:p.y-s*6+c*4},{x:p.x-c*6+s*4,y:p.y-s*6-c*4});if(marks.length>500)marks.splice(0,marks.length-500)}
   /* 電腦車：沿著賽道走，彎道會減速 */
   ai.forEach(a=>{const ci=((Math.floor(a.prog)%n)+n)%n;let s=a.base*(1-Math.min(.32,tr.cv[ci]*.55));const gap=(a.prog-p.prog)/n;if(gap>.4)s*=.94;if(gap<-.4)s*=1.05;
     a.v+=(s-a.v)*Math.min(1,dt*1.2);a.prog+=a.v*dt*n/tr.L;a.ch-=dt;if(a.ch<=0){a.ch=1.5+Math.random()*2.5;a.tOff=(Math.random()-.5)*W*.5}a.off+=(a.tOff-a.off)*dt*.8;
     const q=pos(a.prog,a.off);a.x=q.x;a.y=q.y;a.a=q.a;if(!a.done&&a.prog>=LAPS*n){a.done=1;fin++}
     const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);if(d<11&&d>0){p.x+=dx/d*(11-d);p.y+=dy/d*(11-d);if(p.hitT<=0){p.hitT=.4;p.v*=.75;a.v*=.9;G.sfx.hit();burst((p.x+a.x)/2,(p.y+a.y)/2,8,'#ffe08a',50)}}});
   const lk={x:p.x+Math.cos(p.a)*Math.min(38,p.v*.45),y:p.y+Math.sin(p.a)*Math.min(38,p.v*.45)};cam.x+=(lk.x-cam.x)*Math.min(1,dt*4);cam.y+=(lk.y-cam.y)*Math.min(1,dt*4);
   if(!p.done&&p.prog>=LAPS*n){p.done=1;const rank=fin+1;
     if(rank<=need){G.add(1500*(need+1-rank)+lv*50+p.boosts*100);G.win();return}
     G.lives--;G.sfx.lose();if(G.lives<=0){G.lose();return}setup(G);msg='TRY AGAIN - TOP '+need;msgT=2.5}},
 draw(G){const g=G.g,n=tr.n,W=tr.W;g.fillStyle=th.g1;g.fillRect(0,0,VW,VH);
   g.fillStyle=th.g2;const b0=Math.floor((cam.y-VH/2)/24)*24;for(let y=b0;y<cam.y+VH/2+24;y+=48)g.fillRect(0,y-cam.y+VH/2,VW,24);
   g.save();g.translate(VW/2-cam.x,VH/2-cam.y);g.lineJoin='round';
   g.strokeStyle='#fff';g.lineWidth=W+7;strokeTrack(g);g.strokeStyle='#e33a3a';g.setLineDash([7,7]);strokeTrack(g);g.setLineDash([]);
   g.strokeStyle=th.ed;g.lineWidth=W;strokeTrack(g);g.strokeStyle=th.as;g.lineWidth=W-3;strokeTrack(g);
   g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=W*.55;strokeTrack(g);
   g.strokeStyle='rgba(255,230,140,.55)';g.lineWidth=1;g.setLineDash([6,9]);strokeTrack(g);g.setLineDash([]);
   const s0=tr.P[0];g.save();g.translate(s0.x,s0.y);g.rotate(tr.ang[0]);for(let j=-W/2+1.5,c=0;j<W/2-1.5;j+=3.5,c++)for(let r=0;r<2;r++){g.fillStyle=(c+r)%2?'#111':'#fff';g.fillRect(r*3.5-3.5,j,3.5,3.5)}g.restore();
   for(let k=0;k<6;k++){const s=pos(-(6+k*6),(k%2?1:-1)*W*.22);g.save();g.translate(s.x,s.y);g.rotate(s.a);g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=.8;g.beginPath();g.moveTo(9,-6);g.lineTo(11,-6);g.lineTo(11,6);g.lineTo(9,6);g.stroke();g.restore()}
   g.fillStyle='rgba(20,20,20,.22)';marks.forEach(m=>{if(Math.abs(m.x-cam.x)<VW&&Math.abs(m.y-cam.y)<VH)g.fillRect(m.x-.9,m.y-.9,1.8,1.8)});
   tr.deco.forEach(d=>{if(Math.abs(d.x-cam.x)<VW/2+20&&Math.abs(d.y-cam.y)<VH/2+20)plant(g,d,th)});
   const cars=ai.map(a=>({x:a.x,y:a.y,a:a.a,c:a.c,b:0})).concat([{x:p.x,y:p.y,a:p.a,c:[CARS[G.char].a,CARS[G.char].b,CARS[G.char].l],b:p.bT>0,me:1}]);
   if(th.dk){g.restore();g.fillStyle='rgba(5,8,30,.5)';g.fillRect(0,0,VW,VH);g.save();g.translate(VW/2-cam.x,VH/2-cam.y);g.globalCompositeOperation='lighter';
     cars.forEach(c=>{if(c.x===undefined)return;const hx=c.x+Math.cos(c.a)*30,hy=c.y+Math.sin(c.a)*30,gr=g.createRadialGradient(hx,hy,2,hx,hy,26);gr.addColorStop(0,'rgba(255,240,170,.35)');gr.addColorStop(1,'rgba(255,240,170,0)');g.fillStyle=gr;g.beginPath();g.arc(hx,hy,26,0,7);g.fill()});g.globalCompositeOperation='source-over'}
   cars.forEach(c=>{if(c.x!==undefined)car(g,c.x,c.y,c.a,c.c[0],c.c[1],c.c[2],1.2,c.b)});
   const me=cars[cars.length-1];g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=.8;g.beginPath();g.moveTo(me.x-3,me.y-13);g.lineTo(me.x,me.y-10);g.lineTo(me.x+3,me.y-13);g.stroke();
   g.globalCompositeOperation='lighter';parts.forEach(q=>{g.globalAlpha=Math.min(1,q.t*2.5);g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,.7+q.t*2,0,7);g.fill()});g.globalAlpha=1;g.globalCompositeOperation='source-over';
   g.restore();
   /* 小地圖 */
   const mx=VW-46,my=22;g.fillStyle='rgba(0,0,0,.4)';rr(g,mx-2,my-2,46,46,4);g.fill();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.6;g.beginPath();
   const M=q=>[mx+(q.x-tr.x0)*tr.ms+(40-(tr.x1-tr.x0)*tr.ms)/2,my+(q.y-tr.y0)*tr.ms+(40-(tr.y1-tr.y0)*tr.ms)/2];
   for(let i=0;i<n;i+=6){const m=M(tr.P[i]);i?g.lineTo(m[0],m[1]):g.moveTo(m[0],m[1])}g.closePath();g.stroke();
   cars.forEach(c=>{if(c.x===undefined)return;const m=M(c);g.fillStyle=c.me?'#fff':c.c[0];g.beginPath();g.arc(m[0],m[1],c.me?2.4:1.7,0,7);g.fill();if(c.me){g.fillStyle=c.c[0];g.beginPath();g.arc(m[0],m[1],1.4,0,7);g.fill()}});
   /* HUD */
   const rank=1+fin+ai.filter(a=>!a.done&&a.prog>p.prog).length;
