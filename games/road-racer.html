<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road Racer 公路賽車</title><link rel="stylesheet" href="game.css"></head><body><canvas id="cv"></canvas>
<script src="engine.js"></script><script>
/* 公路賽車（原創俯視賽車，2026-11-26）：每關一條由關卡號產生的彎曲公路（無限關），在時間內跑完距離就過關。
   搖桿左右轉（類比，推越多轉越快）、往上推加速／往下推煞車、A 氮氣加速（有限量，吃藍色罐子補充）。撞車會減速並扣一顆心；開出路面會變慢。
   越後面車越多、路越彎、會有卡車和慢車、晚上關卡有車燈。 */
const VW=160,VH=240,LW=22;
const CARS=[{n:'RED',a:'#ff4d4d',b:'#9a1010',l:'#ffb3b3'},{n:'BLUE',a:'#3d8bff',b:'#123a90',l:'#b3d1ff'},{n:'YELLOW',a:'#ffd23f',b:'#a07000',l:'#fff1b3'},{n:'BLACK',a:'#4a4f5c',b:'#15171c',l:'#9aa1ae'}];
let dist,goal,speed,px,pv,traffic,pick,parts,timeL,nitro,boostT,seed,lanes,lv,tt,crashT,night,trees;
const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
/* 路中心：幾個不同頻率的正弦波相加，關卡越高振幅越大 */
function roadC(d){const a=Math.min(38,10+lv*.6);return VW/2+Math.sin(d*.0021+lv)*a*.7+Math.sin(d*.0053+lv*2.3)*a*.3}
const roadW=()=>lanes*LW;
function screenY(d){return VH-40-(d-dist)}
function drawCar(g,x,y,P,sc,lights,brake){sc=sc||1;g.save();g.translate(x,y);g.scale(sc,sc);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(1.2,2,6.5,11,0,0,7);g.fill();
  g.fillStyle='#111';[[-6,-7],[4.2,-7],[-6,4],[4.2,4]].forEach(([a,b])=>g.fillRect(a,b,1.8,4));
  const gr=g.createLinearGradient(-5,0,5,0);gr.addColorStop(0,P.b);gr.addColorStop(.35,P.a);gr.addColorStop(.6,P.l);gr.addColorStop(1,P.b);g.fillStyle=gr;
  g.beginPath();g.moveTo(-4,-10);g.quadraticCurveTo(0,-11.5,4,-10);g.lineTo(5,-4);g.lineTo(5,8);g.quadraticCurveTo(0,10.5,-5,8);g.lineTo(-5,-4);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=.35;g.stroke();
  const wg=g.createLinearGradient(0,-6,0,-2);wg.addColorStop(0,'#bfe6ff');wg.addColorStop(1,'#2a4a6a');g.fillStyle=wg;g.beginPath();g.moveTo(-3.6,-5.5);g.lineTo(3.6,-5.5);g.lineTo(3,-2);g.lineTo(-3,-2);g.closePath();g.fill();
  g.fillStyle='#1d2a3a';g.fillRect(-3,3.2,6,2.2);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(-1,-9.5,2,18);
  g.fillStyle='#fff7c0';g.fillRect(-3.8,-10,1.6,.9);g.fillRect(2.2,-10,1.6,.9);g.fillStyle=brake?'#ff2020':'#a01818';g.fillRect(-4,8,2,.9);g.fillRect(2,8,2,.9);
  if(lights){const lg=g.createLinearGradient(0,-10,0,-46);lg.addColorStop(0,'rgba(255,250,200,.45)');lg.addColorStop(1,'rgba(255,250,200,0)');g.fillStyle=lg;g.beginPath();g.moveTo(-4,-10);g.lineTo(-11,-46);g.lineTo(11,-46);g.lineTo(4,-10);g.fill()}
  g.restore()}
function drawTruck(g,x,y,P){g.save();g.translate(x,y);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-5,-15,12,32);
  const gr=g.createLinearGradient(-6,0,6,0);gr.addColorStop(0,'#8a8f9c');gr.addColorStop(.5,'#eef1f6');gr.addColorStop(1,'#7a7f8c');g.fillStyle=gr;g.fillRect(-6,-8,12,24);
  g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=.3;for(let i=-6;i<16;i+=3){g.beginPath();g.moveTo(-6,i);g.lineTo(6,i);g.stroke()}
  const cg=g.createLinearGradient(-5,0,5,0);cg.addColorStop(0,P.b);cg.addColorStop(.5,P.a);cg.addColorStop(1,P.b);g.fillStyle=cg;g.fillRect(-5,-16,10,8);g.fillStyle='#9fd3ff';g.fillRect(-4,-15,8,2.5);g.restore()}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*7,v=20+Math.random()*50;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.4+Math.random()*.4,c})}}
GE.run({id:'roadracer',title:'ROAD RACER',w:VW,h:VH,chars:CARS.map(c=>c.n),lives:3,
 start(G,l){lv=l;seed=l*31337+5;lanes=l<10?4:l<30?3:3;goal=2400+Math.min(6000,l*120);dist=0;speed=60;px=roadC(0);pv=0;traffic=[];pick=[];parts=[];
   timeL=Math.round(goal/150)+12;nitro=3;boostT=0;tt=0;crashT=0;night=Math.floor((l-1)/4)%3===2;
   trees=[];for(let i=0;i<60;i++)trees.push({d:i*45+R()*30,s:R()<.5?-1:1,o:16+R()*30,k:Math.floor(R()*3)})},
 step(G,dt,k,p){tt+=dt;timeL-=dt;crashT-=dt;
   const maxS=150+Math.min(70,lv*1.4)+(boostT>0?90:0);const ay=G.ay;
   if(ay>.3)speed-=160*dt*ay;else speed+=(ay<-.2?120:60)*dt;
   if(p.A&&nitro>0&&boostT<=0){nitro--;boostT=2.2;G.sfx.jump();G.beep(110,.6,'sawtooth',.05,330)}if(boostT>0){boostT-=dt;speed+=200*dt}
   const rc=roadC(dist+40),half=roadW()/2,off=Math.abs(px-rc)>half-4;if(off){speed-=speed*1.5*dt;if(Math.random()<.4)parts.push({x:px+(Math.random()-.5)*8,y:VH-30,vx:(Math.random()-.5)*20,vy:20,t:.4,c:'#a0794a'})}
   speed=Math.max(off?35:0,Math.min(maxS,speed));if(crashT>0)speed=Math.min(speed,60);
   /* 轉向：類比搖桿，速度越快轉越靈敏 */pv+=(G.ax*(70+speed*.4)-pv)*Math.min(1,dt*10);px+=pv*dt;px=Math.max(6,Math.min(VW-6,px));
   const od=dist;dist+=speed*dt;if(Math.floor(dist/10)>Math.floor(od/10))G.add(Math.floor(dist/10)-Math.floor(od/10));
   /* 車流：同方向的慢車，在各自車道 */
   const dens=Math.min(.9,.25+lv*.02);if(traffic.length<3+Math.min(9,lv/3)&&Math.random()<dens*dt*2.2){const ln=Math.floor(Math.random()*lanes),d=dist+VH-40+22+Math.random()*12;
     if(!traffic.some(t=>t.ln===ln&&Math.abs(t.d-d)<40))traffic.push({ln,d,v:40+Math.random()*(40+Math.min(50,lv)),truck:Math.random()<Math.min(.35,lv*.015),P:CARS[Math.floor(Math.random()*4)],sw:lv>15&&Math.random()<.2?1:0,lx:0})}
   if(Math.random()<dt*.35)pick.push({d:dist+VH-10,ln:Math.floor(Math.random()*lanes),k:Math.random()<.5?'n':'t'});
   traffic.forEach(t=>{t.d+=t.v*dt;if(t.sw){t.lx=Math.sin(tt*1.2+t.d*.01)*LW*.5}const tx=roadC(t.d)-roadW()/2+LW*(t.ln+.5)+t.lx,ty=screenY(t.d);t.x=tx;t.y=ty;
     const hw=t.truck?6:5,hh=t.truck?15:10;if(Math.abs(tx-px)<hw+4&&Math.abs(ty-(VH-40))<hh+9&&crashT<=0){crashT=1.4;speed*=.3;G.lives--;G.sfx.boom();burst(px,VH-46,26,'#ffb347');t.v=speed+60;pv=(px<tx?-1:1)*60;if(G.lives<=0){G.lose()}}});
   traffic=traffic.filter(t=>t.y>-40&&t.y<VH+60);
   pick.forEach(q=>{q.x=roadC(q.d)-roadW()/2+LW*(q.ln+.5);q.y=screenY(q.d);if(!q.got&&Math.abs(q.x-px)<8&&Math.abs(q.y-(VH-40))<12){q.got=1;if(q.k==='n'){nitro=Math.min(5,nitro+1);G.sfx.coin()}else{timeL+=4;G.sfx.coin()}G.add(100);burst(q.x,q.y,10,q.k==='n'?'#5cf':'#ffd23f')}});
   pick=pick.filter(q=>!q.got&&q.y<VH+20);
   trees.forEach(t=>{if(screenY(t.d)>VH+20){t.d+=60*45;t.o=16+Math.random()*30;t.k=Math.floor(Math.random()*3)}});
   parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt});parts=parts.filter(q=>q.t>0);
   if(dist>=goal){G.add(Math.round(timeL*50)+G.lives*200);G.win();return}
   if(timeL<=0&&G.mode==='play')G.lose()},
 draw(G){const g=G.g;const theme=Math.floor((lv-1)/4)%3;const grass=[['#3f9a3a','#2f7a2c'],['#d9b46a','#c49a50'],['#1d3b2a','#142a1e']][theme];
   g.fillStyle=grass[0];g.fillRect(0,0,VW,VH);for(let y=-((dist*1)%16);y<VH;y+=16){g.fillStyle=grass[1];g.fillRect(0,y,VW,8)}
   /* 路面：一條一條橫切片，連成彎路 */const step=4;
   for(let y=VH;y>-step;y-=step){const d=dist+(VH-40-y),c=roadC(d),w=roadW();
     g.fillStyle=Math.floor(d/24)%2?'#e8e8e8':'#d03030';g.fillRect(c-w/2-4,y-step,4,step+.5);g.fillRect(c+w/2,y-step,4,step+.5);
     const rg=g.createLinearGradient(c-w/2,0,c+w/2,0);rg.addColorStop(0,'#3a3d44');rg.addColorStop(.5,'#4b4f58');rg.addColorStop(1,'#3a3d44');g.fillStyle=rg;g.fillRect(c-w/2,y-step,w,step+.5);
     if(Math.floor(d/20)%2)for(let i=1;i<lanes;i++){g.fillStyle='#f2f2e6';g.fillRect(c-w/2+i*LW-.6,y-step,1.2,step+.5)}}
   trees.forEach(t=>{const y=screenY(t.d);if(y<-20||y>VH+20)return;const c=roadC(t.d),x=c+t.s*(roadW()/2+t.o);
     g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x+3,y+3,7,5,0,0,7);g.fill();
     if(t.k===2&&theme===1){g.fillStyle='#8a6a3a';g.beginPath();g.arc(x,y,5,0,7);g.fill();g.fillStyle='#a8865a';g.beginPath();g.arc(x-1,y-1,3,0,7);g.fill();return}
     const tg=g.createRadialGradient(x-2,y-2,1,x,y,8);tg.addColorStop(0,theme===2?'#4a8a5a':'#8be07a');tg.addColorStop(1,theme===2?'#0e2a18':'#1f5a22');g.fillStyle=tg;g.beginPath();g.arc(x,y,6+t.k,0,7);g.fill();
     g.fillStyle='rgba(255,255,255,.15)';g.beginPath();g.arc(x-2,y-2.5,2,0,7);g.fill()});
   pick.forEach(q=>{const x=q.x,y=q.y+Math.sin(tt*6)*1;if(q.k==='n'){const gr=g.createLinearGradient(x-3,0,x+3,0);gr.addColorStop(0,'#1a6aff');gr.addColorStop(.5,'#9fe0ff');gr.addColorStop(1,'#1a6aff');g.fillStyle=gr;g.fillRect(x-3,y-5,6,10);g.fillStyle='#fff';g.fillRect(x-1.5,y-6.5,3,1.5);G.text(g,'N',x+.5,y-2,'#0a2a6a',1,'c')}
     else{const gr=g.createRadialGradient(x-1,y-1,.5,x,y,5);gr.addColorStop(0,'#fff8d0');gr.addColorStop(1,'#e0a000');g.fillStyle=gr;g.beginPath();g.arc(x,y,4.5,0,7);g.fill();g.strokeStyle='#7a4a00';g.lineWidth=.5;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-3);g.moveTo(x,y);g.lineTo(x+2,y);g.stroke()}});
   traffic.forEach(t=>{if(t.truck)drawTruck(g,t.x,t.y,t.P);else drawCar(g,t.x,t.y,t.P,1,night,0)});
   if(boostT>0){for(let i=0;i<3;i++){g.fillStyle='rgba(120,200,255,'+(.5-i*.15)+')';g.beginPath();g.ellipse(px+(Math.random()-.5)*2,VH-28+i*4,2.5-i*.5,3+i*2,0,0,7);g.fill()}}
   if(crashT<=0||Math.floor(crashT*12)%2)drawCar(g,px,VH-40,CARS[G.char],1.05,night,G.ay>.3);
   g.globalCompositeOperation='lighter';parts.forEach(q=>{g.globalAlpha=Math.min(1,q.t*2);g.fillStyle=q.c;g.fillRect(q.x-.8,q.y-.8,1.6,1.6)});g.globalAlpha=1;g.globalCompositeOperation='source-over';
   if(night){const ng=g.createRadialGradient(px,VH-70,20,px,VH-60,170);ng.addColorStop(0,'rgba(0,0,20,0)');ng.addColorStop(1,'rgba(0,0,20,.72)');g.fillStyle=ng;g.fillRect(0,0,VW,VH)}
   /* 儀表 */g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,10,VW,18);const pr=Math.min(1,dist/goal);g.fillStyle='#333';g.fillRect(4,24,VW-8,2.5);g.fillStyle='#5f5';g.fillRect(4,24,(VW-8)*pr,2.5);
   G.text(g,'TIME '+Math.max(0,Math.ceil(timeL)),4,13,timeL<10?'#f55':'#fff');G.text(g,Math.round(speed*1.2)+' KM/H',VW/2,13,'#ffd23f',1,'c');G.text(g,'N'+nitro,VW-4,13,'#5cf',1,'r');
   for(let i=0;i<G.lives;i++){g.fillStyle='#ff4d6d';g.fillRect(VW-30+i*8,18,5,4)}G.text(g,Math.max(0,Math.round((goal-dist)/10))+'M',VW/2,19,'#aaa',1,'c')},
 titleArt(G,f){const g=G.g;g.fillStyle='#4b4f58';g.fillRect(50,60,60,130);g.fillStyle='#f2f2e6';for(let y=0;y<130;y+=20)g.fillRect(79,60+((y+f*80)%130),2,10);
   drawCar(g,80+Math.sin(f*2)*12,150,CARS[G.char],1.6,0,0);drawCar(g,64,100-((f*30)%40),CARS[(G.char+1)%4],1.2,0,0)}
});
</script></body></html>
