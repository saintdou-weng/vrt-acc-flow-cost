<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tank Battle 坦克大戰</title><link rel="stylesheet" href="game.css"></head><body><canvas id="cv"></canvas>
<script src="engine.js"></script><script>
/* 坦克大戰（原創地圖，每關自動產生、無限關）：守住下方的基地，打完敵方坦克過關；方向鍵移動、A 開砲；紅磚打得掉、鐵牆打不掉、水過不去、樹叢可躲 */
const N=13,T=12,OY=34;const TANKS=[{n:'GREEN',b:'#3fae4a',d:'#1f6b2a',l:'#9be38f'},{n:'GOLD',b:'#d9a830',d:'#7a5a10',l:'#ffe38a'},{n:'BLUE',b:'#3d7bff',d:'#1a3a8a',l:'#9cc0ff'}];
let M,pl,foes,bul,left,onField,spawnT,base,parts,seed;
const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function gen(lv){seed=lv*7919+13;M=Array.from({length:N},()=>Array(N).fill(0));
  for(let y=1;y<N-2;y++)for(let x=0;x<N;x++){const r=R();M[y][x]=r<.3?1:r<.3+Math.min(.12,lv*.01)?2:r<.45?4:r<.5?3:0}
  /* 出生點與基地周圍清空，基地用紅磚圍起來 */
  [[0,0],[6,0],[12,0],[4,12],[8,12]].forEach(([x,y])=>{M[y][x]=0;if(M[y+1])M[y+1][x]=M[y+1][x]===2?0:M[y+1][x]});
  for(let y=10;y<N;y++)for(let x=4;x<=8;x++)M[y][x]=0;[[5,11],[6,11],[7,11],[5,12],[7,12]].forEach(([x,y])=>M[y][x]=1);M[12][6]=9}
const solid=(x,y,ignoreTank)=>{const cx=Math.floor(x/T),cy=Math.floor(y/T);if(cx<0||cy<0||cx>=N||cy>=N)return true;const v=M[cy][cx];return v===1||v===2||v===3||v===9};
function canGo(t,nx,ny){const pts=[[nx+1,ny+1],[nx+T-2,ny+1],[nx+1,ny+T-2],[nx+T-2,ny+T-2]];if(pts.some(p=>solid(p[0],p[1])))return false;
  return ![pl,...foes].some(o=>o&&o!==t&&!o.dead&&Math.abs(o.x-nx)<T-1&&Math.abs(o.y-ny)<T-1)}
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function fire(t){if(t.cd>0)return;t.cd=t.isP?.35:1.2;const[dx,dy]=DIRS[t.dir];bul.push({x:t.x+T/2-1+dx*6,y:t.y+T/2-1+dy*6,dx,dy,p:t.isP,v:t.isP?140:90});if(t.isP)GE_API.sfx.shoot()}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,t:.4,c:c||'#fc3'})}
/* 2026-11-26 畫面精修：坦克有陰影、履帶會動、砲塔圓頂、金屬光澤 */
function drawTank(g,t,pal){const x=t.x,y=t.y,tr=((t.x+t.y)*1.5|0)%3;g.save();g.translate(x+6,y+6);
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(1,1.5,6.5,6.5,0,0,7);g.fill();
  g.rotate({U:0,R:Math.PI/2,D:Math.PI,L:-Math.PI/2}[t.dir]);
  for(const sx of [-6,3.4]){g.fillStyle='#1b1d22';g.fillRect(sx,-6,2.6,12);g.fillStyle=pal.d;for(let k=-6+tr*.8;k<6;k+=2.4)g.fillRect(sx+.2,k,2.2,1.1);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(sx,-6,.5,12)}
  const gr=g.createLinearGradient(-3.4,-5,3.4,5);gr.addColorStop(0,pal.l);gr.addColorStop(.5,pal.b);gr.addColorStop(1,pal.d);g.fillStyle=gr;g.fillRect(-3.4,-5,6.8,10.4);
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=.35;g.strokeRect(-3.4,-5,6.8,10.4);
  g.fillStyle=pal.d;g.fillRect(-.75,-9,1.5,7);g.fillStyle=pal.l;g.fillRect(-.75,-9,.5,7);g.fillStyle='#111';g.fillRect(-.9,-9.4,1.8,.8);
  const rg=g.createRadialGradient(-.8,-.8,.3,0,0,2.8);rg.addColorStop(0,'#fff');rg.addColorStop(.25,pal.l);rg.addColorStop(1,pal.d);g.fillStyle=rg;g.beginPath();g.arc(0,.4,2.7,0,7);g.fill();
  g.restore()}
function drawTile(g,v,X,Y,t){
  if(v===1){g.fillStyle='#7a2e12';g.fillRect(X,Y,T,T);for(let r=0;r<4;r++)for(let c=-1;c<3;c++){const bx=X+c*5+(r%2?2.5:0),by=Y+r*3;if(bx+4.6<X||bx>X+T)continue;const x0=Math.max(X,bx),x1=Math.min(X+T,bx+4.6);
      const gr=g.createLinearGradient(0,by,0,by+2.6);gr.addColorStop(0,'#e0864a');gr.addColorStop(1,'#a8461f');g.fillStyle=gr;g.fillRect(x0,by+.3,x1-x0,2.4);g.fillStyle='rgba(255,220,180,.35)';g.fillRect(x0,by+.3,x1-x0,.4)}}
  else if(v===2){const gr=g.createLinearGradient(X,Y,X+T,Y+T);gr.addColorStop(0,'#e9edf3');gr.addColorStop(.5,'#9aa1ad');gr.addColorStop(1,'#5b616c');g.fillStyle=gr;g.fillRect(X,Y,T,T);
      g.fillStyle='rgba(0,0,0,.25)';g.fillRect(X+T/2-.3,Y,.6,T);g.fillRect(X,Y+T/2-.3,T,.6);g.fillStyle='#d6dbe3';[[2,2],[8.5,2],[2,8.5],[8.5,8.5]].forEach(([a,b])=>{g.beginPath();g.arc(X+a+.7,Y+b+.7,.7,0,7);g.fill()})}
  else if(v===3){const gr=g.createLinearGradient(0,Y,0,Y+T);gr.addColorStop(0,'#1f5fc0');gr.addColorStop(1,'#123a80');g.fillStyle=gr;g.fillRect(X,Y,T,T);g.strokeStyle='rgba(170,210,255,.55)';g.lineWidth=.45;
      for(let k=0;k<3;k++){g.beginPath();const yy=Y+2+k*4;for(let xx=0;xx<=T;xx+=1){const w=Math.sin((xx+X)*.9+t*3+k*2)*.6;xx?g.lineTo(X+xx,yy+w):g.moveTo(X,yy+w)}g.stroke()}}
  else if(v===9){g.fillStyle='#1a1a1a';g.fillRect(X,Y,T,T);if(base){const gr=g.createRadialGradient(X+6,Y+5,1,X+6,Y+6,6);gr.addColorStop(0,'#fff6b0');gr.addColorStop(1,'#d49a10');g.fillStyle=gr;
      g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?2.2:5;g.lineTo(X+6+Math.cos(a)*r,Y+6.3+Math.sin(a)*r)}g.closePath();g.fill();g.strokeStyle='#7a4a00';g.lineWidth=.4;g.stroke()}else{g.fillStyle='#555';g.fillRect(X+3,Y+5,6,4)}}}
function drawTree(g,X,Y){const c=[['#1f6b2a',3,3,3.2],['#2f8f3a',8.5,3.5,3],['#2a7f35',3.5,8.5,3],['#3aa047',8.5,8.5,3.2],['#4cc35a',6,6,2.6]];c.forEach(([col,a,b,r])=>{g.fillStyle=col;g.beginPath();g.arc(X+a,Y+b,r,0,7);g.fill()});g.fillStyle='rgba(200,255,200,.35)';g.beginPath();g.arc(X+5,Y+4.5,1,0,7);g.fill()}
GE.run({id:'tankbattle',title:'TANK BATTLE',w:160,h:240,chars:TANKS.map(t=>t.n),lives:3,
 start(G,lv){gen(lv);pl={x:4*T,y:12*T,dir:'U',cd:0,isP:1,inv:2};foes=[];bul=[];parts=[];left=8+Math.min(22,lv*2);onField=0;spawnT=0;base=1},
 step(G,dt,k,p){
   pl.cd-=dt;pl.inv-=dt;const sp=48;let mv=null;for(const d of ['U','D','L','R'])if(k[d]){mv=d;break}
   if(mv){pl.dir=mv;const[dx,dy]=DIRS[mv];let nx=pl.x+dx*sp*dt,ny=pl.y+dy*sp*dt;if(dx)ny=Math.round(pl.y/6)*6;if(dy)nx=Math.round(pl.x/6)*6;if(canGo(pl,nx,ny)){pl.x=nx;pl.y=ny}else{/* 轉角自動對齊，比較好轉進路口 */const ax=Math.round(pl.x/T)*T,ay=Math.round(pl.y/T)*T;if(dx&&Math.abs(pl.y-ay)<5&&canGo(pl,pl.x,ay))pl.y+=(ay-pl.y)*.5;if(dy&&Math.abs(pl.x-ax)<5&&canGo(pl,ax,pl.y))pl.x+=(ax-pl.x)*.5}}
   if(k.A)fire(pl);
   spawnT-=dt;if(left>0&&onField<Math.min(6,2+Math.floor(G.level/3))&&spawnT<=0){const sx=[0,6,12][G.rnd(0,2)]*T;if(canGo(null,sx,0)){foes.push({x:sx,y:0,dir:'D',cd:1,turn:0,hp:G.level>8&&Math.random()<.3?2:1,fast:Math.random()<Math.min(.4,G.level*.03)});left--;onField++;spawnT=2.2-Math.min(1.4,G.level*.05)}}
   foes.forEach(f=>{f.cd-=dt;f.turn-=dt;const sp2=f.fast?42:26;const[dx,dy]=DIRS[f.dir];const nx=f.x+dx*sp2*dt,ny=f.y+dy*sp2*dt;
     if(canGo(f,nx,ny)){f.x=nx;f.y=ny}else f.turn=0;
     if(f.turn<=0){f.turn=1+Math.random()*2;const r=Math.random();f.dir=r<.4?'D':r<.6?(pl.x<f.x?'L':'R'):['U','L','R'][G.rnd(0,2)];if(f.dir==='L'||f.dir==='R')f.y=Math.round(f.y/6)*6;else f.x=Math.round(f.x/6)*6}
     if(Math.random()<dt*(.6+G.level*.04))fire(f)});
   bul.forEach(b=>{b.x+=b.dx*b.v*dt;b.y+=b.dy*b.v*dt;const cx=Math.floor((b.x+1)/T),cy=Math.floor((b.y+1)/T);
     if(cx<0||cy<0||cx>=N||cy>=N){b.dead=1;return}const v=M[cy][cx];
     if(v===1){M[cy][cx]=0;b.dead=1;boom(b.x,b.y,5,'#c63');G.sfx.hit()}else if(v===2){b.dead=1;G.beep(200,.04,'square',.04)}else if(v===9){b.dead=1;base=0;boom(cx*T+6,cy*T+6,40,'#f44');G.sfx.boom()}
     if(b.p){foes.forEach(f=>{if(!b.dead&&!f.dead&&b.x>f.x&&b.x<f.x+T&&b.y>f.y&&b.y<f.y+T){b.dead=1;f.hp--;if(f.hp<=0){f.dead=1;onField--;boom(f.x+6,f.y+6,20);G.sfx.boom();G.add(f.fast?200:100)}}})}
     else if(!b.dead&&pl.inv<=0&&b.x>pl.x&&b.x<pl.x+T&&b.y>pl.y&&b.y<pl.y+T){b.dead=1;boom(pl.x+6,pl.y+6,25,'#7cf');G.sfx.boom();G.lives--;pl.x=4*T;pl.y=12*T;pl.dir='U';pl.inv=2}});
   /* 子彈互撞抵銷 */bul.forEach(a=>bul.forEach(b=>{if(a!==b&&a.p!==b.p&&!a.dead&&!b.dead&&Math.abs(a.x-b.x)<3&&Math.abs(a.y-b.y)<3){a.dead=b.dead=1}}));
   bul=bul.filter(b=>!b.dead);foes=foes.filter(f=>!f.dead);parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt});parts=parts.filter(q=>q.t>0);
   if(!base||G.lives<=0){G.lose();return}if(left<=0&&!foes.length)G.win()},
 draw(G){const g=G.g;g.fillStyle='#111';g.fillRect(0,0,160,240);g.save();g.translate(2,OY);g.fillStyle='#000';g.fillRect(0,0,N*T,N*T);
   const tt=performance.now()/1000;g.fillStyle='#0b0d10';g.fillRect(0,0,N*T,N*T);g.fillStyle='rgba(255,255,255,.025)';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x+y)%2)g.fillRect(x*T,y*T,T,T);
   for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=M[y][x];if(v&&v!==4)drawTile(g,v,x*T,y*T,tt)}
   foes.forEach(f=>drawTank(g,f,f.fast?{b:'#d84',d:'#733',l:'#fc9'}:f.hp>1?{b:'#aaa',d:'#555',l:'#fff'}:{b:'#c9c9c9',d:'#666',l:'#eee'}));
   if(pl.inv<=0||Math.floor(pl.inv*10)%2)drawTank(g,pl,TANKS[G.char]);
   bul.forEach(b=>{g.fillStyle='rgba(255,230,120,.35)';g.beginPath();g.arc(b.x+1,b.y+1,2.2,0,7);g.fill();g.fillStyle='#fff8d0';g.beginPath();g.arc(b.x+1,b.y+1,.9,0,7);g.fill()});
   for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(M[y][x]===4)drawTree(g,x*T,y*T);
   g.globalCompositeOperation='lighter';parts.forEach(q=>{g.globalAlpha=Math.max(0,q.t/.4);g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,.4+q.t*2,0,7);g.fill()});g.globalAlpha=1;g.globalCompositeOperation='source-over';g.restore();
   G.text(g,'ENEMY '+(left+foes.length),2,14,'#f88');for(let i=0;i<G.lives;i++){g.fillStyle='#5f5';g.fillRect(120+i*7,14,5,5)}
   G.text(g,'PROTECT THE BASE',80,OY+N*T+12,'#666',1,'c')},
 titleArt(G,f){drawTank(G.g,{x:58,y:96,dir:['U','R','D','L'][Math.floor(f)%4]},TANKS[G.char]);drawTank(G.g,{x:90,y:96,dir:'L'},{b:'#c9c9c9',d:'#666',l:'#eee'})}
});
</script></body></html>
