<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Blast 打磚塊</title><link rel="stylesheet" href="game.css"></head><body><canvas id="cv"></canvas>
<script src="engine.js"></script><script>
/* 打磚塊（每關圖形自動產生、無限關）：◀▶ 移動擋板、A 發球；打到掉下來的寶物：W 變長、M 多球、S 變慢；也可以用手指在畫面上左右拖 */
const PADS=[{n:'CLASSIC',c:'#29d3ff'},{n:'LAVA',c:'#ff6b3d'},{n:'MINT',c:'#4dffb0'}];
const COLS=['#ff4d6d','#ff9a3d','#ffe14d','#4dff7a','#29d3ff','#c36bff','#ffffff'];
let pad,balls,bricks,drops,parts,held,wide,slowT;
function layout(lv){bricks=[];const rows=Math.min(10,4+Math.floor(lv/2)),pat=lv%6;
  for(let r=0;r<rows;r++)for(let c=0;c<10;c++){let on=true;
    if(pat===1)on=(r+c)%2===0;else if(pat===2)on=Math.abs(c-4.5)<=r*0.7+1;else if(pat===3)on=c%3!==1;else if(pat===4)on=r%2===0||c===0||c===9;else if(pat===5)on=Math.sin(c*.9+r)>-.3;
    if(on){const hp=lv>3&&r<Math.floor(lv/4)?2:1,steel=lv>6&&Math.random()<Math.min(.12,lv*.008);bricks.push({x:5+c*15,y:30+r*8,hp:steel?99:hp,col:COLS[r%7],steel})}}}
function burst(x,y,c){for(let i=0;i<8;i++)parts.push({x,y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,t:.4,c})}
let touchX=null;addEventListener('touchmove',e=>{const r=document.getElementById('cv').getBoundingClientRect(),t=e.touches[0];if(t.clientY<r.bottom)touchX=(t.clientX-r.left)/r.width*160},{passive:true});
addEventListener('mousemove',e=>{const r=document.getElementById('cv').getBoundingClientRect();if(e.clientY>r.top&&e.clientY<r.bottom)touchX=(e.clientX-r.left)/r.width*160});
GE.run({id:'brickblast',title:'BRICK BLAST',w:160,h:240,chars:PADS.map(p=>p.n),lives:3,
 start(G,lv){layout(lv);pad={x:64,w:32};balls=[{x:80,y:214,vx:0,vy:0}];held=1;drops=[];parts=[];wide=0;slowT=0},
 step(G,dt,k,p){const sp=140;if(k.L)pad.x-=sp*dt;if(k.R)pad.x+=sp*dt;if(touchX!=null){pad.x+=(touchX-pad.w/2-pad.x)*Math.min(1,dt*18)}
   pad.w=wide>0?48:32;wide-=dt;slowT-=dt;pad.x=Math.max(0,Math.min(160-pad.w,pad.x));
   if(held){balls[0].x=pad.x+pad.w/2;balls[0].y=214;if(p.A||p.U||(touchX!=null&&p.B===undefined&&Math.random()<0)){}if(p.A||p.U){held=0;const v=95+G.level*3;balls[0].vx=v*.6;balls[0].vy=-v;G.sfx.jump()}}
   const f=slowT>0?.6:1;
   balls.forEach(b=>{if(held)return;b.x+=b.vx*dt*f;b.y+=b.vy*dt*f;
     if(b.x<2){b.x=2;b.vx=Math.abs(b.vx);G.sfx.blip()}if(b.x>158){b.x=158;b.vx=-Math.abs(b.vx);G.sfx.blip()}if(b.y<20){b.y=20;b.vy=Math.abs(b.vy);G.sfx.blip()}
     if(b.vy>0&&b.y>=216&&b.y<=222&&b.x>=pad.x-2&&b.x<=pad.x+pad.w+2){const h=(b.x-pad.x-pad.w/2)/(pad.w/2),sp2=Math.hypot(b.vx,b.vy)*1.01;b.vx=sp2*h*.85;b.vy=-Math.sqrt(Math.max(400,sp2*sp2-b.vx*b.vx));G.sfx.move()}
     for(const br of bricks){if(br.dead)continue;if(b.x>br.x-1&&b.x<br.x+15&&b.y>br.y-1&&b.y<br.y+7){
       const ox=Math.min(b.x-br.x+1,br.x+15-b.x),oy=Math.min(b.y-br.y+1,br.y+7-b.y);if(ox<oy)b.vx*=-1;else b.vy*=-1;
       if(!br.steel){br.hp--;if(br.hp<=0){br.dead=1;burst(br.x+7,br.y+3,br.col);G.add(10*G.level);G.sfx.hit();if(Math.random()<.12)drops.push({x:br.x+5,y:br.y,t:'WMS'[G.rnd(0,2)]})}else G.sfx.blip()}else G.beep(1200,.03,'square',.03);break}}});
   balls=balls.filter(b=>b.y<244);
   drops.forEach(d=>{d.y+=50*dt;if(d.y>214&&d.y<222&&d.x>pad.x-6&&d.x<pad.x+pad.w){d.dead=1;G.sfx.coin();if(d.t==='W')wide=12;if(d.t==='S')slowT=10;if(d.t==='M'&&balls[0])[1,-1].forEach(s=>balls.push({x:balls[0].x,y:balls[0].y,vx:balls[0].vx+s*40,vy:balls[0].vy}))}});drops=drops.filter(d=>!d.dead&&d.y<244);
   parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt});parts=parts.filter(q=>q.t>0);
   if(!balls.length){G.lives--;G.sfx.lose();if(G.lives<=0){G.lose();return}balls=[{x:80,y:214,vx:0,vy:0}];held=1}
   if(!bricks.some(b=>!b.dead&&!b.steel))G.win()},
 draw(G){const g=G.g;g.fillStyle='#080b1f';g.fillRect(0,0,160,240);for(let i=0;i<240;i+=8){g.fillStyle=i%16?'#0a0e26':'#0c1130';g.fillRect(0,i,160,8)}
   bricks.forEach(b=>{if(b.dead)return;g.fillStyle=b.steel?'#8a8f99':b.col;g.fillRect(b.x,b.y,14,6);g.fillStyle='rgba(255,255,255,.4)';g.fillRect(b.x,b.y,14,1);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(b.x,b.y+5,14,1);if(b.hp===2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(b.x+3,b.y+2,8,2)}});
   drops.forEach(d=>{g.fillStyle={W:'#29d3ff',M:'#ffe14d',S:'#4dff7a'}[d.t];g.fillRect(d.x,d.y,6,5);G.text(g,d.t,d.x+1,d.y,'#000')});
   const c=PADS[G.char].c;g.fillStyle=c;g.fillRect(pad.x,218,pad.w,4);g.fillStyle='#fff';g.fillRect(pad.x,218,pad.w,1);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(pad.x,221,pad.w,1);
   g.fillStyle='#fff';balls.forEach(b=>{g.fillRect(b.x-1,b.y-1,3,3)});parts.forEach(q=>{g.fillStyle=q.c;g.fillRect(q.x,q.y,1,1)});
   for(let i=0;i<G.lives;i++){g.fillStyle=c;g.fillRect(2+i*8,232,6,2)}if(held)G.text(g,'PRESS A',80,190,'#5f5',1,'c')},
 titleArt(G,f){for(let r=0;r<4;r++)for(let c=0;c<10;c++){G.g.fillStyle=COLS[(r+Math.floor(f*3))%7];G.g.fillRect(5+c*15,70+r*8,14,6)}}
});
</script></body></html>
