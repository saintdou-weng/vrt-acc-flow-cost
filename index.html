function gasResponseJson(text,status=0){const clean=String(text||'').trim();if(/^<!doctype|^<html/i.test(clean))throw new Error(l3('GAS 回傳的是 Google 網頁，不是資料。請更新為 v1.8.1 部署版本，網址必須以 /exec 結尾。','GAS returned a Google page instead of data. Deploy v1.8.1 and use the URL ending in /exec.','GAS បានត្រឡប់ទំព័រ Google មិនមែនទិន្នន័យ។'));try{return JSON.parse(clean)}catch(e){throw new Error(clean.slice(0,160)||`HTTP ${status}`)}}
async function gasGet(action,params={},url=SETTINGS.gasUrl){url=canonicalGasUrl(url);const q=new URLSearchParams({action,tool:SETTINGS.cloudKey,_:Date.now(),...params});const r=await fetch(`${url}?${q}`,{method:'GET',cache:'no-store',redirect:'follow',referrerPolicy:'no-referrer'}),text=await r.text(),data=gasResponseJson(text,r.status);if(!r.ok||data.ok===false)throw new Error(data.message||`HTTP ${r.status}`);return data}
function cloudStatus(mode,label=''){const dot=$('#cloudDot'),text=$('#cloudText');if(!dot||!text)return;dot.className=`status-dot ${mode==='ok'?'ok':mode==='error'?'err':mode==='sync'?'sync':''}`;text.textContent=label||({ok:l3('AutoSync 已同步','AutoSync synced','AutoSync បានធ្វើសមកាលកម្ម'),sync:l3('AutoSync 同步中…','AutoSync syncing…','AutoSync កំពុងធ្វើសមកាលកម្ម…'),pending:l3('待自動上傳','Pending auto-upload','រង់ចាំផ្ទុកឡើង'),error:l3('AutoSync 失敗','AutoSync failed','AutoSync បរាជ័យ')}[mode]||tr('notConfigured'))}
async function checkCloud(url=SETTINGS.gasUrl){if(!url){cloudStatus('',tr('notConfigured'));return false}cloudStatus('sync','…');try{const d=await gasGet('status',{},url);if(d.ok||d.status||d.success){cloudStatus('ok',SYNC.pending?l3('已連線・待上傳','Connected · pending','បានភ្ជាប់ · រង់ចាំ'):l3('已連線・AutoSync','Connected · AutoSync','បានភ្ជាប់ · AutoSync'));return true}throw new Error('bad response')}catch(e){cloudStatus('error',l3('離線／未對接','Offline / not wired','មិនភ្ជាប់'));return false}}
function stateRecordCount(state=STATE){return Object.values(state?.periods||{}).reduce((total,entry)=>total+['wip','fg','expense'].reduce((n,module)=>n+(entry?.modules?.[module]?.records?.length||0),0),0)}
async function gasPost(payload){const url=canonicalGasUrl(SETTINGS.gasUrl),q=new URLSearchParams({action:String(payload.action||''),tool:SETTINGS.cloudKey,_:Date.now()});const r=await fetch(`${url}?${q}`,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),cache:'no-store',redirect:'follow',referrerPolicy:'no-referrer'}),text=await r.text(),data=gasResponseJson(text,r.status);if(!r.ok||data.ok===false)throw new Error(data.message||`HTTP ${r.status}`);return data}
function extractCloudPayload(d){return d?.data?.schema==='vrt-flow-cost'?d.data:d?.payload?.schema==='vrt-flow-cost'?d.payload:d?.data?.data?.schema==='vrt-flow-cost'?d.data.data:null}
function scheduleAutoUpload(reason='change',delay=1600){SYNC.pending=true;SYNC.lastError='';saveSyncMeta();cloudStatus('pending');clearTimeout(SYNC.timer);if(!SETTINGS.gasUrl)return;SYNC.timer=setTimeout(()=>autoCloudSync(reason,{showNotice:false}),delay)}
async function autoCloudSync(reason='auto',options={}){if(!SETTINGS.gasUrl){SYNC.pending=true;saveSyncMeta();if(options.showNotice)openSettings();return {ok:false,reason:'not-configured'}}if(SYNC.inFlight){SYNC.pending=true;saveSyncMeta();return {ok:false,reason:'busy'}}SYNC.inFlight=true;clearTimeout(SYNC.timer);const started=Date.now(),before=stateRecordCount(),beforePeriods=allPeriods().length,oldActive=ACTIVE_PERIOD;cloudStatus('sync');if(options.showLoading)loading(true,l3('正在安全合併雲端資料…','Safely merging cloud data…','កំពុងបញ្ចូល Cloud ដោយសុវត្ថិភាព…'));try{const pulled=await gasGet('pull'),payload=extractCloudPayload(pulled);if(!payload?.state?.periods)throw new Error(tr('invalidBackup'));const remoteHash=stateFingerprint(payload.state);STATE=mergeStates(STATE,payload.state);let mergedHash=stateFingerprint(STATE),pushed=false,response=null;if(options.forcePush||mergedHash!==remoteHash){response=await gasPost({tool:SETTINGS.cloudKey,action:'push',updatedAt:nowIso(),merge:true,reason,data:exportPayload()});pushed=true;mergedHash=stateFingerprint(STATE);SYNC.lastPushAt=response.updatedAt||nowIso()}SYNC.lastPullAt=nowIso();SYNC.lastCloudHash=mergedHash;SYNC.pending=false;SYNC.lastError='';saveSyncMeta();const available=allPeriods();ACTIVE_PERIOD=available.includes(oldActive)?oldActive:(available.slice(-1)[0]||'');await saveState({touch:false});buildPeriodSelect();render();cloudStatus('ok',l3(`已同步 ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,`Synced ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,`បានធ្វើសមកាលកម្ម ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`));const after=stateRecordCount(),afterPeriods=allPeriods().length,detail=`${before} → ${after} ${tr('records')} · ${beforePeriods} → ${afterPeriods} ${tr('period')} · ${((Date.now()-started)/1000).toFixed(1)}s\n${pushed?l3('已先下載合併，再增量上傳；較多資料與不同月份均保留。','Pulled and merged first, then incrementally uploaded; larger and different-period data was retained.','បានទាញ បញ្ចូល និងផ្ទុកឡើងដោយបន្ថែម។'):l3('本機與雲端內容相同，未重複上傳。','Local and cloud data matched; no duplicate upload was made.','ទិន្នន័យដូចគ្នា មិនបានផ្ទុកឡើងម្ដងទៀត។')}`;if(options.showNotice){toast(`${l3('雲端同步完成','Cloud sync complete','Cloud បានធ្វើសមកាលកម្ម')} · ${after} ${tr('records')}`,'success');operationNotice('success',l3('AutoSync 完成','AutoSync complete','AutoSync រួចរាល់'),detail)}return {ok:true,pushed,records:response?.records??after,detail}}catch(e){SYNC.pending=true;SYNC.lastError=e.message||String(e);saveSyncMeta();cloudStatus('error');const message=`${SYNC.lastError}\n${l3('本機資料仍安全保留；恢復連線後會再自動同步。','Local data remains safe and will sync again after the connection recovers.','ទិន្នន័យក្នុងម៉ាស៊ីននៅតែមានសុវត្ថិភាព។')}`;if(options.showNotice){toast(`${tr('sendFailed')}: ${SYNC.lastError}`,'error');operationNotice('error',l3('AutoSync 失敗','AutoSync failed','AutoSync បរាជ័យ'),message)}return {ok:false,error:e}}finally{SYNC.inFlight=false;if(options.showLoading)loading(false)}}
async function cloudUpload(){return autoCloudSync('manual-upload',{showNotice:true,showLoading:true,forcePush:true})}
async function cloudDownload(){return autoCloudSync('manual-download',{showNotice:true,showLoading:true})}

function summaryText(module='overview',period=ACTIVE_PERIOD,lang=LANG){
  const D=I18N[lang],pl=k=>{if(!/^\d{4}-\d{2}$/.test(k||''))return k||'—';const[y,m]=k.split('-');return lang==='zh'?`${y}年${Number(m)}月`:`${MONTHS[Number(m)-1]} ${y}`},mo=m=>m==='wip'?'WIP':m==='fg'?(lang==='zh'?'成品入庫':lang==='km'?'ទំនិញចូលឃ្លាំង':'FG Inbound'):(lang==='zh'?'工廠費用':lang==='km'?'ថ្លៃរោងចក្រ':'Factory Expense'),w=summary('wip',period),f=summary('fg',period),e=summary('expense',period),a=generateAnomalies(period).filter(x=>!x.reviewed),lines=[];
  lines.push(`🏭 VRT ${module==='overview'?(lang==='zh'?'生產流動與成本摘要':lang==='km'?'សង្ខេបលំហូរផលិតកម្ម និងថ្លៃដើម':'Production Flow & Cost Summary'):mo(module)}`);lines.push(`📅 ${pl(period)}`);lines.push('');
  if((module==='overview'||module==='wip')&&moduleRecords('wip',period).length){lines.push(`🧶 WIP`);lines.push(`${D.wipAmount}: ${money(w.wipAmount,2)} | ${D.wipQty}: ${integer(w.wipQty)}`);lines.push(`${D.fabricAmount}: ${money(w.fabricAmount,2)} | ${D.trimAmount}: ${money(w.trimAmount,2)}`);lines.push(`${D.customers}: ${integer(w.customers)} | ${D.styles}: ${integer(w.styles)}`);lines.push('')}
  if((module==='overview'||module==='fg')&&moduleRecords('fg',period).length){lines.push(`📦 ${mo('fg')}`);lines.push(`${D.fgQty}: ${integer(f.qty)} | ${D.fgValue}: ${money(f.value,2)}`);lines.push(`${D.customers}: ${integer(f.customers)} | ${D.poCount}: ${integer(f.pos)} | ${D.styles}: ${integer(f.styles)}`);lines.push('')}
  if((module==='overview'||module==='expense')&&moduleRecords('expense',period).length){lines.push(`💰 ${mo('expense')}`);lines.push(`${D.factoryCost}: ${money(e.totalCost,2)} | ${D.reportedPV}: ${money(e.pv,2)}`);lines.push(`${D.directLabor}: ${money(e.directLabor,2)} | ${D.overhead}: ${money(e.overhead,2)}`);lines.push(`${D.associates}: ${integer(e.associates)} | ${D.costRatio}: ${pct(e.costRatio)}`);lines.push('')}
  if(module==='overview'||module==='cross'){lines.push(`🔄 ${D.cross}`);crossRules(period).forEach(r=>lines.push(`${r.level==='good'?'✅':r.level==='warn'?'⚠️':'❗'} ${r.text}`));lines.push('')}
  lines.push(`⚠️ ${D.anomalies}: ${a.length}`);a.slice(0,5).forEach((x,i)=>lines.push(`${i+1}. [${D[x.severity]}] ${x.title} — ${x.description}`));lines.push('');lines.push(`${D.source}: ${sourceFiles(period)}`);return lines.join('\n');
}
function workflowStatusLine(period,module){const targets=workflowTargets(period,module);if(!targets.length)return l3('此期間沒有可發送資料','No data to send for this period','គ្មានទិន្នន័យសម្រាប់ផ្ញើ');return targets.map(type=>{const item=STATE.workflow.items[workflowKey(period,type)]||{},revision=item.revision||'legacy',summaryOk=item.summaryRevision===revision,approvalOk=item.approvedRevision===revision,requested=item.approvalRequestedRevision===revision;return `${moduleLabel(type)}：${summaryOk?'摘要✓':'待摘要'} · ${approvalOk?`核可✓${item.approvedBy?` (${item.approvedBy})`:''}`:requested?'待核可':'未送核可'}`}).join('　')}
function openTelegram(){let module=PAGE==='wip'||PAGE==='fg'||PAGE==='expense'||PAGE==='cross'?PAGE:'overview',lang=LANG,kind='summary';const draw=()=>{const base=summaryText(module,ACTIVE_PERIOD,lang),prefix=kind==='approval'?(lang==='zh'?'📝 核可申請':lang==='km'?'📝 សំណើសុំអនុម័ត':'📝 APPROVAL REQUEST'):(lang==='zh'?'📨 摘要發送':lang==='km'?'📨 ផ្ញើសេចក្តីសង្ខេប':'📨 SUMMARY');$('#tgText').textContent=`${prefix}\n${base}`;$('#tgStatus').textContent=workflowStatusLine(ACTIVE_PERIOD,module);$$('[data-tg-lang]').forEach(b=>b.classList.toggle('on',b.dataset.tgLang===lang));$('#tgModule').value=module;$('#tgKind').value=kind};const body=`<div class="form-grid"><div class="form-group"><label class="form-label">${tr('module')}</label><select id="tgModule"><option value="overview">${tr('overview')}</option><option value="wip">WIP</option><option value="fg">${tr('fg')}</option><option value="expense">${tr('expense')}</option><option value="cross">${tr('cross')}</option></select></div><div class="form-group"><label class="form-label">${l3('發送類型','Send type','ប្រភេទផ្ញើ')}</label><select id="tgKind"><option value="summary">${l3('發摘要','Send summary','ផ្ញើសេចក្តីសង្ខេប')}</option><option value="approval">${l3('送核可','Request approval','ស្នើសុំអនុម័ត')}</option></select></div></div><div id="tgStatus" class="secret-note" style="margin-top:10px"></div><div class="form-label" style="margin-top:10px">${tr('summaryLanguage')}</div><div class="choice-row"><button class="btn" data-tg-lang="zh">中</button><button class="btn" data-tg-lang="en">EN</button><button class="btn" data-tg-lang="km">ខ្មែរ</button></div><pre id="tgText" class="summary-box"></pre>`;$('#modalRoot').innerHTML=modalHtml(tr('telegramSummary'),body,`<button class="btn" id="copyTg">${tr('copy')}</button><button class="btn" id="modalCancel">${tr('cancel')}</button><button class="btn primary" id="sendTg">${tr('send')}</button>`);attachModalClose();$('#modalCancel').onclick=closeModal;$('#tgModule').onchange=e=>{module=e.target.value;draw()};$('#tgKind').onchange=e=>{kind=e.target.value;draw()};$$('[data-tg-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.tgLang;draw()});$('#copyTg').onclick=async()=>{await navigator.clipboard.writeText($('#tgText').textContent);toast(tr('copied'),'success')};$('#sendTg').onclick=()=>sendTelegram($('#tgText').textContent,module,lang,kind);draw()}
async function sendTelegram(message,module,lang,kind='summary'){if(!SETTINGS.gasUrl){await navigator.clipboard.writeText(message).catch(()=>{});toast(tr('cloudNotSet'),'warn');return}loading(true,tr('send'));try{await autoCloudSync('before-telegram',{showNotice:false});let data;try{const revisions={};workflowTargets(ACTIVE_PERIOD,module).forEach(type=>{const item=ensureWorkflowItem(ACTIVE_PERIOD,type);if(!item.revision){item.updatedAt=item.updatedAt||nowIso();item.revision=hashString(`${ACTIVE_PERIOD}|${type}|${item.updatedAt}|legacy`)}revisions[type]=item.revision});data=await gasPost({action:SETTINGS.telegramAction,tool:SETTINGS.cloudKey,module,period:ACTIVE_PERIOD,language:lang,kind,revisions,message})}catch(postError){if(kind!=='summary')throw postError;data=await gasGet('telegramCloudSend',{module,period:ACTIVE_PERIOD,language:lang,kind})}if(!data.ok)throw new Error(data.message||tr('cloudServerError'));markWorkflowSent(ACTIVE_PERIOD,module,kind,data.workflow||{});await saveState();SYNC.pending=true;saveSyncMeta();await autoCloudSync('workflow-status',{showNotice:false,forcePush:true});toast(kind==='approval'?l3('核可申請已發送','Approval request sent','បានផ្ញើសំណើអនុម័ត'):l3('Telegram 摘要已發送','Telegram summary sent','បានផ្ញើសេចក្តីសង្ខេប'),'success');operationNotice('success',l3('Telegram 發送完成','Telegram sent','Telegram បានផ្ញើ'),`${periodLabel(ACTIVE_PERIOD)} · ${moduleLabel(module)} · ${kind==='approval'?l3('待核可','Pending approval','រង់ចាំអនុម័ត'):l3('摘要已發','Summary sent','បានផ្ញើសេចក្តីសង្ខេប')}`);closeModal()}catch(e){toast(`${tr('sendFailed')}: ${e.message}`,'error');operationNotice('error',tr('sendFailed'),e.message||String(e))}finally{loading(false)}}

function initEvents(){
  $('#mainNav').onclick=e=>{const tool=e.target.closest('[data-tool]');if(tool){ACTIVE_TOOL=tool.dataset.tool;PAGE='tool';render();return}const b=e.target.closest('[data-page]');if(!b)return;ACTIVE_TOOL='';PAGE=b.dataset.page;if(PAGE==='wip'||PAGE==='fg'||PAGE==='expense'){TABLE={...TABLE,module:PAGE,page:1,search:'',customer:'',type:''}}render()};
  $('#periodSelect').onchange=e=>{ACTIVE_PERIOD=e.target.value;TABLE.page=1;render()};$$('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;applyLanguage()});
  const dz=$('#dropZone'),input=$('#smartInput');input.onchange=e=>{smartImport(e.target.files);e.target.value=''};['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>smartImport([...e.dataTransfer.files].filter(f=>/\.xlsx$/.test(f.name.toLowerCase()))));
  $('#settingsBtn').onclick=openSettings;$('#cloudUpBtn').onclick=cloudUpload;$('#cloudDownBtn').onclick=cloudDownload;$('#telegramBtn').onclick=openTelegram;$('#exportBtn').onclick=openDataExport;$('#jsonImportBtn').onclick=openDataImport;$('#jsonInput').onchange=e=>{if(e.target.files[0])importJsonFile(e.target.files[0]);e.target.value=''};$('#gitBtn').onclick=()=>{if(!SETTINGS.gitUrl){toast(tr('gitNotSet'),'warn');openSettings()}else window.open(SETTINGS.gitUrl,'_blank','noopener')};
}
function applyLaunchParams(){const q=new URLSearchParams(location.search),requestedTool=q.get('tool')||'';if(TOOL_MODULES[requestedTool]){ACTIVE_TOOL=requestedTool;PAGE='tool'}else{const requested=(q.get('module')||q.get('page')||'').toLowerCase(),aliases={factory:'expense',cost:'expense',finished:'fg',finishedgoods:'fg'};const page=aliases[requested]||requested;if(['overview','wip','fg','expense','time','cross','anomaly','history'].includes(page))PAGE=page}LAUNCH_PERIOD=q.get('period')||'';const gas=q.get('gas')||'';if(/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?|$)/.test(gas)){SETTINGS.gasUrl=canonicalGasUrl(gas);saveSettings()}}
async function init(){loadSettings();loadSyncMeta();applyLaunchParams();initEvents();loading(true,'Loading…');await loadState();STATE=migrateState(STATE);const periods=allPeriods();ACTIVE_PERIOD=periods.includes(LAUNCH_PERIOD)?LAUNCH_PERIOD:(periods.slice(-1)[0]||'');loading(false);buildPeriodSelect();$$('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));$$('[data-i]').forEach(el=>{const k=el.dataset.i;if(I18N[LANG][k])el.textContent=I18N[LANG][k]});render();if(SETTINGS.gasUrl)autoCloudSync('startup',{showNotice:false});else checkCloud();SYNC.pollTimer=setInterval(()=>{if(document.visibilityState==='visible'&&SETTINGS.gasUrl&&!SYNC.inFlight)autoCloudSync('poll',{showNotice:false})},5*60*1000)}
window.addEventListener('DOMContentLoaded',init);
window.addEventListener('online',()=>{if(SYNC.pending)scheduleAutoUpload('online',350)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SYNC.pending)scheduleAutoUpload('resume',500)});
</script>
