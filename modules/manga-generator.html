<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫畫自動生成引擎</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&family=Share+Tech+Mono&family=Zen+Antique+Soft&display=swap');

:root {
  --ink: #0d0d0d;
  --paper: #f7f3ec;
  --red: #c0392b;
  --amber: #d35400;
  --muted: #888;
  --panel-border: 3px solid var(--ink);
  --gutter: 5px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  font-family: 'Noto Serif TC', serif;
  color: var(--ink);
  min-height: 100vh;
}

/* ─── HEADER ─── */
header {
  background: var(--ink);
  color: var(--paper);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 4px solid var(--red);
  position: sticky;
  top: 0;
  z-index: 50;
}
header h1 {
  font-family: 'Zen Antique Soft', serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--red);
}
header .subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: #666;
  margin-top: 2px;
}
.header-right {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ─── SETUP SCREEN ─── */
#setup-screen {
  max-width: 820px;
  margin: 40px auto;
  padding: 0 24px 60px;
}

.setup-card {
  background: #fff;
  border: var(--panel-border);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: 4px 4px 0 #ddd;
}

.card-title {
  font-family: 'Zen Antique Soft', serif;
  font-size: 16px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid #eee;
  display: flex;
  align-items: center;
  gap: 10px;
}

.card-title .num {
  background: var(--ink);
  color: var(--paper);
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-family: 'Share Tech Mono', monospace;
  flex-shrink: 0;
}

label {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 6px;
  margin-top: 14px;
}
label:first-child { margin-top: 0; }

input[type=text], textarea, select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e0e0e0;
  background: #fafafa;
  font-family: 'Noto Serif TC', serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--ink); background: #fff; }

#big-text {
  height: 220px;
  resize: vertical;
  font-size: 12px;
  line-height: 1.8;
}

.text-stats {
  display: flex;
  gap: 20px;
  margin-top: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.text-stats .stat strong { color: var(--ink); }

/* Style toggles */
.toggle-row {
  display: flex;
  gap: 0;
  border: 2px solid var(--ink);
  width: fit-content;
  overflow: hidden;
}
.toggle-row button {
  padding: 7px 16px;
  border: none;
  border-right: 2px solid var(--ink);
  background: transparent;
  cursor: pointer;
  font-family: 'Noto Serif TC', serif;
  font-size: 12px;
  transition: all 0.15s;
  color: #666;
}
.toggle-row button:last-child { border-right: none; }
.toggle-row button.on { background: var(--ink); color: var(--paper); }
.toggle-row button:hover:not(.on) { background: #f0f0f0; }

/* Style preset chips */
.style-group-title { font-size: 11px; color: var(--muted); margin: 10px 0 6px; }
.style-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.style-chip {
  border: 2px solid var(--ink); background: #fff; color: #444;
  padding: 7px 12px; font-family: 'Noto Serif TC', serif; font-size: 12px;
  cursor: pointer; min-height: 36px; line-height: 1.3;
}
.style-chip.on { background: var(--ink); color: var(--paper); }
.style-desc { margin-top: 8px; font-size: 11.5px; color: #555; line-height: 1.6; background: #faf7f0; border-left: 3px solid var(--ink); padding: 6px 10px; }
.engine-note { margin: 0 0 12px; padding: 8px 12px; font-size: 12px; background: #fff7e0; border: 1px solid #e6c766; color: #7a5a00; display: none; }
.engine-note.show { display: block; }
/* AI image layer */
.ai-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; z-index: 2; }
.ai-img.loaded { opacity: 1; }
.panel-art .img-wait { position: absolute; left: 6px; bottom: 6px; z-index: 3; font-size: 9px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; font-family: 'Share Tech Mono', monospace; }
.panel-art.has-img .img-wait { display: none; }

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* Chunk preview */
#chunk-preview {
  display: none;
  margin-top: 16px;
}
.chunk-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 100px;
  overflow-y: auto;
  padding: 8px;
  background: #fafafa;
  border: 1px solid #eee;
}
.chunk-pill {
  background: #f0f0f0;
  border: 1px solid #ddd;
  padding: 3px 10px;
  font-size: 10px;
  font-family: 'Share Tech Mono', monospace;
  border-radius: 12px;
  color: #555;
  cursor: default;
}
.chunk-pill.done { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
.chunk-pill.active { background: #fff3e0; border-color: #ffcc02; color: #e65100; animation: pulse 1s infinite; }
.chunk-pill.error { background: #fdecea; border-color: #ef9a9a; color: #c62828; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

/* BIG LAUNCH BUTTON */
#btn-launch {
  width: 100%;
  padding: 18px;
  background: var(--red);
  color: #fff;
  border: none;
  font-family: 'Zen Antique Soft', serif;
  font-size: 18px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  box-shadow: 4px 4px 0 #8b1a1a;
}
#btn-launch:hover { background: #a93226; transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #8b1a1a; }
#btn-launch:disabled { background: #bbb; box-shadow: 4px 4px 0 #888; cursor: not-allowed; transform: none; }

/* ─── PROGRESS BAR ─── */
#progress-bar-wrap {
  display: none;
  background: var(--ink);
  padding: 14px 32px;
  position: sticky;
  top: 62px;
  z-index: 40;
}
#progress-bar-wrap.show { display: block; }
.pb-labels {
  display: flex;
  justify-content: space-between;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: #aaa;
  margin-bottom: 6px;
}
.pb-labels strong { color: #fff; }
.pb-track {
  height: 6px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
}
.pb-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--amber));
  border-radius: 3px;
  transition: width 0.6s ease;
  width: 0%;
}
#current-task-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: #666;
  margin-top: 4px;
}

/* ─── MANGA VIEWER ─── */
#manga-viewer {
  display: none;
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
}
#manga-viewer.show { display: block; }

.episode-group {
  margin-bottom: 48px;
}
.episode-title-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 3px solid var(--ink);
}
.episode-title-bar .ep-badge {
  background: var(--ink);
  color: var(--paper);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 4px 10px;
  white-space: nowrap;
}
.episode-title-bar h2 {
  font-family: 'Zen Antique Soft', serif;
  font-size: 20px;
}
.episode-title-bar .ep-chars {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
}

/* ─── MANGA PAGE ─── */
.manga-page {
  background: #fff;
  border: var(--panel-border);
  box-shadow: 5px 5px 0 #aaa;
  margin-bottom: 28px;
  position: relative;
  break-inside: avoid;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}
.page-topbar {
  background: var(--ink);
  color: #aaa;
  padding: 6px 14px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  display: flex;
  justify-content: space-between;
}
.page-topbar strong { color: #fff; }

/* ─── MANGA GRID ─── */
.manga-grid {
  display: grid;
  background: var(--ink);
  gap: var(--gutter);
  padding: var(--gutter);
}

/* Layout types */
.layout-A { grid-template-columns: 1fr 1fr;       grid-template-rows: 180px 130px 130px; }
.layout-B { grid-template-columns: 2fr 1fr;       grid-template-rows: 200px 160px; }
.layout-C { grid-template-columns: 1fr 1fr 1fr;   grid-template-rows: 200px 140px; }
.layout-D { grid-template-columns: 1fr;           grid-template-rows: 180px 140px 140px; }
.layout-E { grid-template-columns: 1fr 2fr;       grid-template-rows: 180px 180px; }

/* Panel */
.panel {
  background: var(--paper);
  position: relative;
  overflow: hidden;
  cursor: zoom-in;
}
.panel.span2 { grid-column: span 2; }
.panel.span3 { grid-column: 1 / -1; }
.panel.rowspan2 { grid-row: span 2; }

/* Art layer */
.panel-art {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.panel-art svg { width: 100%; height: 100%; }

/* Caption */
.panel-caption {
  position: absolute;
  top: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.82);
  color: #fff;
  padding: 5px 10px;
  font-size: 10.5px;
  line-height: 1.55;
  z-index: 10;
  font-family: 'Noto Serif TC', serif;
}

/* Bubble */
.bubble {
  position: absolute;
  background: #fff;
  border: 2px solid var(--ink);
  padding: 4px 9px;
  font-size: 10.5px;
  line-height: 1.45;
  max-width: 60%;
  z-index: 12;
  box-shadow: 2px 2px 0 #ccc;
  border-radius: 14px;
  font-family: 'Noto Serif TC', serif;
}
.bubble b { font-size: 9px; display: block; color: #888; margin-bottom: 1px; }
.bubble.thought { border-style: dashed; font-style: italic; border-radius: 40px; }
.bubble.tl { top:8px; left:8px; }
.panel.has-cap .bubble.tl, .panel.has-cap .bubble.tr { top:42px; }
@media (max-width:560px){ .bubble{font-size:9.5px;padding:3px 7px;max-width:72%} .panel-caption{font-size:9.5px;padding:4px 7px} .panel.has-cap .bubble.tl,.panel.has-cap .bubble.tr{top:36px} .bubble.bl,.bubble.br{bottom:8px} }
.bubble.tr { top:8px; right:8px; }
.bubble.bl { bottom:30px; left:8px; }
.bubble.br { bottom:30px; right:8px; }
/* Tail */
.bubble.tl::after { content:''; position:absolute; bottom:-9px; left:18px; border:5px solid transparent; border-top-color:var(--ink); }
.bubble.tr::after { content:''; position:absolute; bottom:-9px; right:18px; border:5px solid transparent; border-top-color:var(--ink); }
.bubble.bl::after { content:''; position:absolute; top:-9px; left:18px; border:5px solid transparent; border-bottom-color:var(--ink); }
.bubble.br::after { content:''; position:absolute; top:-9px; right:18px; border:5px solid transparent; border-bottom-color:var(--ink); }

/* SFX */
.sfx {
  position: absolute;
  font-family: 'Zen Antique Soft', serif;
  font-size: 30px;
  font-weight: 900;
  color: var(--red);
  -webkit-text-stroke: 1.5px var(--ink);
  z-index: 8;
  transform: rotate(-8deg);
  right: 8px; top: 8px;
  opacity: 0.75;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
}

/* Panel loading skeleton */
.panel-skeleton {
  background: repeating-linear-gradient(135deg, #f0ece2 0px, #f0ece2 10px, #e8e4da 10px, #e8e4da 20px);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px;
}
.skel-dots { display: flex; gap: 4px; }
.skel-dots span {
  width: 5px; height: 5px;
  background: #bbb;
  border-radius: 50%;
  animation: sdot 0.7s infinite alternate;
}
.skel-dots span:nth-child(2) { animation-delay:.2s }
.skel-dots span:nth-child(3) { animation-delay:.4s }
@keyframes sdot { from{opacity:.3;transform:scale(.8)} to{opacity:1;transform:scale(1)} }

/* Page number stamp */
.page-stamp {
  position: absolute;
  bottom: 4px; right: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: rgba(0,0,0,0.2);
  z-index: 20;
  pointer-events: none;
}

/* ─── CHARACTER SHEET ─── */
#char-sheet {
  display: none;
  background: #fff;
  border: var(--panel-border);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 4px 4px 0 #ddd;
}
#char-sheet.show { display: block; }
#char-sheet h3 {
  font-family: 'Zen Antique Soft', serif;
  font-size: 15px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid #eee;
}
.char-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.char-card {
  background: #fafafa;
  border: 1px solid #e0e0e0;
  padding: 10px 14px;
  font-size: 11px;
  line-height: 1.6;
  min-width: 180px;
}
.char-card strong { font-size: 13px; display: block; margin-bottom: 3px; }
.char-card .char-role { font-size: 9px; color: var(--red); font-family: 'Share Tech Mono', monospace; text-transform: uppercase; margin-bottom: 4px; }

/* ─── MODAL ZOOM ─── */
#zoom-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#zoom-overlay.show { display: flex; }
#zoom-img {
  max-width: 90vw; max-height: 90vh;
  background: #fff;
  padding: 20px;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
}

/* Misc */
.mono { font-family: 'Share Tech Mono', monospace; }
.tag { background: #eee; padding: 2px 8px; font-size: 10px; font-family: 'Share Tech Mono', monospace; border-radius: 2px; }
.tag.red { background: #fdecea; color: var(--red); }
.tag.green { background: #e8f5e9; color: #2e7d32; }
.error-banner {
  background: #fdecea;
  border-left: 4px solid var(--red);
  padding: 10px 14px;
  font-size: 12px;
  color: #c62828;
  margin: 8px 0;
}
.info-box {
  background: #fffde7;
  border-left: 3px solid #fbc02d;
  padding: 8px 12px;
  font-size: 11px;
  color: #5d4037;
  line-height: 1.6;
  margin-top: 12px;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
</style>
  <link rel="stylesheet" href="../acc-module-shell.css?v=20261121">
  <script defer src="../acc-module-shell.js"></script>
<style id="acc-mobile-fit">/* 2026-11-21 手機版：不超出螢幕寬度 */
@media(max-width:760px){
.options-grid{grid-template-columns:1fr!important}
.toggle-row{flex-wrap:wrap}
}</style></head>
<body>

<!-- HEADER -->
<header>
  <div>
    <h1>漫畫自動引擎</h1>
    <div class="subtitle">AUTO MANGA PIPELINE · AI SEQUENTIAL GENERATION</div>
  </div>
  <div class="header-right">
    <span id="hdr-status" class="tag" style="display:none;"></span>
    <button id="btn-restart" onclick="restartSetup()" style="display:none; background:transparent; border:1px solid #444; color:#aaa; padding:5px 12px; cursor:pointer; font-family:'Noto Serif TC',serif; font-size:11px;">← 重新開始</button>
  </div>
</header>

<!-- PROGRESS BAR -->
<div id="progress-bar-wrap">
  <div class="pb-labels">
    <span>生成進度 <strong id="pb-done">0</strong> / <strong id="pb-total">0</strong> 頁</span>
    <span id="pb-pct">0%</span>
  </div>
  <div class="pb-track"><div class="pb-fill" id="pb-fill"></div></div>
  <div id="current-task-label">準備中…</div>
</div>

<!-- SETUP SCREEN -->
<div id="setup-screen">

  <div class="setup-card">
    <div class="card-title"><div class="num">1</div> 貼入故事文字</div>
    <label>故事內容（可貼入1萬~5萬字，系統自動切段）</label>
    <textarea id="big-text" placeholder="貼上你的小說、劇本、故事文字…

系統會自動：
① 分析人物出場並建立角色檔
② 依場景/段落切割成若干批次
③ 序列生成每一頁漫畫，全程自動"></textarea>
    <div class="text-stats">
      <div class="stat">字數：<strong id="stat-chars">0</strong></div>
      <div class="stat">預估批次：<strong id="stat-chunks">—</strong></div>
      <div class="stat">預估頁數：<strong id="stat-pages">—</strong></div>
      <div class="stat">預估時間：<strong id="stat-time">—</strong></div>
    </div>
    <div id="chunk-preview">
      <label>切割預覽</label>
      <div class="chunk-list" id="chunk-list"></div>
    </div>
  </div>

  <div class="setup-card">
    <div class="card-title"><div class="num">2</div> 作品設定</div>
    <div class="options-grid">
      <div>
        <label>作品標題</label>
        <input type="text" id="work-title" placeholder="我的漫畫作品" />
        <label>對白語言</label>
        <div class="toggle-row" id="lang-toggle">
          <button class="on" data-val="zh">中文</button>
          <button data-val="en">English</button>
        </div>
        <label>分鏡引擎</label>
        <div class="toggle-row" id="engine-toggle">
          <button class="on" data-val="ai">AI 自動分鏡</button>
          <button data-val="local">本機快速分鏡</button>
        </div>
      </div>
      <div>
        <label>色彩模式</label>
        <div class="toggle-row" id="color-toggle">
          <button class="on" data-val="bw">黑白</button>
          <button data-val="color">彩色</button>
        </div>
        <label style="margin-top:16px;">分頁密度</label>
        <div class="toggle-row" id="density-toggle">
          <button data-val="light">疏（~500字/頁）</button>
          <button class="on" data-val="normal">中（~1000字/頁）</button>
          <button data-val="dense">密（~1500字/頁）</button>
        </div>
        <label style="margin-top:16px;">每格畫面</label>
        <div class="toggle-row" id="art-toggle">
          <button class="on" data-val="ai">AI 繪圖</button>
          <button data-val="svg">簡易示意圖</button>
        </div>
      </div>
    </div>
    <label style="margin-top:18px;">漫畫畫風（只模仿線條、上色、構圖，不使用任何現有作品角色）</label>
    <div class="style-group-title">基本畫風</div>
    <div class="style-chips" id="style-chips-base"></div>
    <div class="style-group-title">年代＋類型預設</div>
    <div class="style-chips" id="style-chips-era"></div>
    <input type="text" id="style-custom" style="margin-top:8px;" placeholder="或自己描述畫風（選填，會疊加在所選畫風上），例：粗獷墨線、復古網點、夕陽橘色調" />
    <div class="style-desc" id="style-desc"></div>
    <div class="info-box">
      💡 <strong>人物自動提取</strong>：系統會在生成前先讓 AI 分析全文，自動識別主要人物的外觀、性格與關係，並在整個生成過程中保持一致。你也可以在下方補充。
    </div>
    <label style="margin-top:16px;">補充人物/場景說明（選填，優先套用）</label>
    <textarea id="extra-char-notes" style="height:70px; font-size:12px;" placeholder="例：主角陳凱 — 17歲男生，黑色亂髮，左臉有疤，藍色校服&#10;場景：2085年台北，廢墟都市"></textarea>
  </div>

  <div id="launch-error" class="error-banner" style="display:none;"></div>

  <button id="btn-launch" onclick="launchPipeline()">▶ 開始自動生成漫畫</button>

</div>

<!-- MANGA VIEWER -->
<div id="manga-viewer">
  <div id="char-sheet">
    <h3>📋 自動識別角色檔</h3>

const CAMERA_EN = { '遠景':'wide establishing shot', '中景':'medium shot', '近景':'medium close-up', '特寫':'dramatic close-up of face', '俯角':'high angle bird eye view', '俯視':'high angle bird eye view', '仰角':'low angle worm eye view', '仰視':'low angle worm eye view' };

// ═══════════════════════════════════════════
//  TEXT ANALYSIS & CHUNKING
// ═══════════════════════════════════════════
function smartChunk(text, charsPerChunk) {
  // Split on chapter/section markers first
  const chapterRe = /^[\s\n]*(第[一二三四五六七八九十百\d]+[章節集回部]|Chapter\s*\d+|CHAPTER\s*\d+|[一二三四五六七八九十]+、)/m;
  let segments = [];

  // Try to split on natural chapter breaks
  const parts = text.split(/\n{2,}/); // paragraphs
  let buf = '';
  let segIndex = 0;

  for (const p of parts) {
    const trimmed = p.trim();
    if (!trimmed) continue;
    // Chapter heading → force new segment
    if (chapterRe.test(trimmed) && buf.length > 200) {
      segments.push(buf.trim());
      buf = trimmed + '\n\n';
    } else {
      buf += trimmed + '\n\n';
      if (buf.length >= charsPerChunk) {
        segments.push(buf.trim());
        buf = '';
      }
    }
  }
  if (buf.trim()) segments.push(buf.trim());

  // Build chunk objects
  const PAGES_PER_EP = 5;
  return segments.map((text, i) => ({
    id: i,
    text,
    pageNum: i + 1,
    episodeNum: Math.floor(i / PAGES_PER_EP) + 1,
    chunkLabel: `P.${i+1}`,
    status: 'pending', // pending | active | done | error
  }));
}

//  MAIN PIPELINE
// ═══════════════════════════════════════════
async function launchPipeline() {
  const text = $('big-text').value.trim();
  if (text.length < 100) { showErr('請貼入至少100字的故事文字！'); return; }

  S.rawText = text;
  S.title = $('work-title').value.trim() || '我的漫畫';
  S.extraNotes = $('extra-char-notes').value.trim();
  S.styleCustom = ($('style-custom')?.value || '').trim();
  S.offline = S.engine === 'local';
  IMGQ.q = [];
  const note = $('engine-note');
  if (note) { note.classList.toggle('show', S.offline); note.textContent = S.offline ? '⚡ 使用本機快速分鏡：依對白「」與句子自動分格，不呼叫 AI。' : ''; }
  const cpc = DENSITY_MAP[S.density];
  S.chunks = smartChunk(text, cpc);
  S.total = S.chunks.length;
  S.done = 0;
  S.pages = {};
  S.characters = [];

  if (S.chunks.length === 0) { showErr('文字太短，無法切割！'); return; }

  // Switch to viewer mode
  $('setup-screen').style.display = 'none';
  $('manga-viewer').classList.add('show');
  $('progress-bar-wrap').classList.add('show');
  $('btn-restart').style.display = 'block';
  $('hdr-status').style.display = 'inline';

  updateProgress(0, S.total, '正在分析人物角色…');

  // STEP 1: Extract characters from full text
  try {
    if (S.offline) throw new Error('local');
    await extractCharacters(text, S.extraNotes);
    if (!S.characters.length) throw new Error('empty');
  } catch(e) {
    if (e.message !== 'local') { console.warn('AI 角色提取失敗，改用本機規則：', e.message); setOffline(e.message); }
    S.characters = localExtractCharacters(text, S.extraNotes);
  }
  renderCharSheet();

  // STEP 2: Sequential page generation
  S.running = true;
  for (let i = 0; i < S.chunks.length; i++) {
    if (!S.running) break;
    const chunk = S.chunks[i];
    setPillStatus(i, 'active');
    updateProgress(i, S.total, `生成第 ${chunk.pageNum} 頁 — ${chunk.chunkLabel}…`);

    // Ensure episode container exists
    ensureEpisodeContainer(chunk.episodeNum, chunk.pageNum);

    // Insert skeleton
    insertSkeleton(chunk.id, chunk.episodeNum, chunk.pageNum);

    try {
      let pageData = null;
      if (!S.offline) {
        try { pageData = await generatePageAPI(chunk, S.characters, S.style, S.color, S.title); }
        catch (err) { console.warn('AI 分鏡失敗，改用本機分鏡：', err.message); setOffline(err.message); }
      }
      if (!pageData || !Array.isArray(pageData.panels) || !pageData.panels.length) pageData = localStoryboard(chunk, S.characters);
      S.pages[chunk.id] = pageData;
      chunk.status = 'done';
      replaceSkeleton(chunk.id, chunk.episodeNum, chunk.pageNum, pageData);
      setPillStatus(i, 'done');
      S.done++;
      updateProgress(S.done, S.total, `第 ${chunk.pageNum} 頁完成`);
    } catch(e) {
      chunk.status = 'error';
      setPillStatus(i, 'error');
      markSkeletonError(chunk.id, e.message);
    }

    // Small delay to avoid rate limiting
    if (i < S.chunks.length - 1) await sleep(S.offline ? 120 : 800);
  }

  updateProgress(S.done, S.total, S.done === S.total ? '✓ 全部生成完成！' : `完成 ${S.done}/${S.total} 頁`);
  $('hdr-status').textContent = `✓ ${S.done}/${S.total} 頁`;
  $('hdr-status').className = 'tag green';
}

function showErr(msg) {
  $('launch-error').textContent = msg;
  $('launch-error').style.display = 'block';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

${extraNotes ? '補充說明：\n' + extraNotes : ''}

  "characters": [
    {
      "name": "角色名",

layoutType說明：
A=2列×3行(各格normal) B=左寬右窄×2行 C=3列×2行 D=1列×3行 E=左窄右寬×2行
根據故事節奏選最適合的版型。共生成6個panels，大小搭配要有韻律感。
重點：人物外觀必須與固定設定一致，世界觀不得改變。`;

// ═══════════════════════════════════════════
//  CORE API CALL
// ═══════════════════════════════════════════
async function callAPI(prompt, maxTokens = 1000) {
  if (typeof window.accClaudeRequest !== 'function') throw new Error('ACC AI 服務尚未載入，請重新開啟頁面');
  const d = await window.accClaudeRequest({
    model: 'claude-sonnet-4-20250514',
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: prompt }]
  });
  return d.content.map(b => b.text || '').join('');
}

function safeParseJSON(raw) {
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  } catch(e) {
    // Try to extract JSON object
    const m = raw.match(/\{[\s\S]*\}/);
    if (m) {
      try { return JSON.parse(m[0]); } catch {}
    }
    console.warn('JSON parse failed:', raw.slice(0,200));
    return null;
  }
}

// ═══════════════════════════════════════════
//  本機分鏡備援（不需 AI；AI 服務連不上時自動切換）
// ═══════════════════════════════════════════
function setOffline(reason) {
  if (S.offline) return;
  S.offline = true;
  const note = $('engine-note');
  if (note) {
    note.textContent = '⚠ AI 分鏡服務暫時無法連線（' + String(reason || '').slice(0, 60) + '），已自動改用本機快速分鏡繼續生成。';
    note.classList.add('show');
  }
}

const QUOTE_RE = /[「“"]([^」”"]{1,200})[」”"]/g;
const NAME_STOP = new Set(['他們','我們','你們','她們','自己','大家','這時','然後','於是','突然','只見','忽然','一個','那個','這個','什麼','怎麼','因為','所以','但是','可是','如果','已經','還是','終於','不過','沒有','一聲','聲音','低聲','大聲','笑著','輕聲','冷冷','淡淡','緩緩','回頭','忍不住','小聲','喃喃','接著','對他','對她','問道','說道']);
const NAME_PREFIX = /^[對向跟和與把被讓叫給朝替是在]/;
function cleanName(n, text) {
  n = (n || '').trim();
  if (n.length === 3 && NAME_PREFIX.test(n)) n = n.slice(1);
  if (n.length === 3) {
    const tail = n.slice(1), occ = x => text.split(x).length - 1;
    if (occ(tail) > occ(n) * 1.5) n = tail;
  }
  return NAME_STOP.has(n) ? '' : n;
}

function localExtractCharacters(text, extraNotes) {
  const count = {};
  const occ = x => text.split(x).length - 1;
  const okName = n => n && n.length >= 2 && !NAME_STOP.has(n) && !/[地著了得的氣聲們這那裡]$/.test(n) && !/^[我你他她它這那一不也就又在]/.test(n);
  // ① 句首主詞：名字常出現在子句開頭（2 字與 3 字並比，決定第 3 字是否屬於名字）
  const g2 = {}, g3 = {};
  for (const m of text.matchAll(/(?:^|[。！？，；、\n」”])\s*([一-龥]{2,3})/gm)) {
    const w = m[1]; g2[w.slice(0, 2)] = (g2[w.slice(0, 2)] || 0) + 1; if (w.length === 3) g3[w] = (g3[w] || 0) + 1;
  }
  Object.entries(g3).forEach(([w, c]) => { if (c >= 2 && c >= 0.6 * (g2[w.slice(0, 2)] || 0) && okName(w)) { count[w] = c * 2; delete g2[w.slice(0, 2)]; } });
  Object.entries(g2).forEach(([w, c]) => { if (c >= 2 && okName(w)) count[w] = (count[w] || 0) + c; });
  // ② 對白標記：名字說：「…」／名字：「…」
  const add = n => { n = cleanName(n, text); if (!okName(n)) return; count[n] = (count[n] || 0) + 3; };
  for (const m of text.matchAll(/([一-龥]{2,3})(?:[說道問喊叫笑答吼]{1,2})?[：:]\s*[「“"]/g)) add(m[1]);
  // 僅保留全文出現至少 2 次者
  Object.keys(count).forEach(n => { if (occ(n) < 2) delete count[n]; });
  // 名字互為子字串時保留較長者
  Object.keys(count).forEach(n => { if (Object.keys(count).some(o => o !== n && o.includes(n) && occ(o) >= occ(n) * 0.7)) delete count[n]; });
  // 補充說明裡「名字 —」或「名字：」優先
  const notes = {};
  (extraNotes || '').split(/\n/).forEach(line => {
    const m = line.match(/^\s*(?:主角|配角|反派)?\s*([一-龥A-Za-z]{2,8})\s*[—\-：:]\s*(.+)$/);
    if (m) { notes[m[1]] = m[2].trim(); count[m[1]] = (count[m[1]] || 0) + 100; }
  });
  const names = Object.entries(count).filter(([n, c]) => c >= 3 || notes[n]).sort((a, b) => (notes[b[0]] ? 1e6 : 0) + occ(b[0]) - (notes[a[0]] ? 1e6 : 0) - occ(a[0])).slice(0, 6).map(x => x[0]);
  return names.map((n, i) => ({
    name: n,
    role: i === 0 ? '主角' : '配角',
    appearance: notes[n] || '',
    personality: '',
    signature: '',
    appearanceEn: '',
  }));
}

function detectMood(t) {
  if (/哭|淚|悲|傷心|難過|嗚/.test(t)) return '悲傷';
  if (/怒|氣死|可惡|混帳|吼/.test(t)) return '憤怒';
  if (/怕|恐|顫抖|毛骨|陰森/.test(t)) return '恐懼';
  if (/竟然|居然|什麼[！!?？]|不可能|愣住|震/.test(t)) return '震驚';
  if (/笑|開心|太好了|哈哈|高興/.test(t)) return '喜悅';
  if (/[！!]{1}|快|危險|衝|追|打|砍/.test(t)) return '緊張';
  return '平靜';
}
function detectSfx(t) {
  const m = t.match(/(砰|轟隆?|啪|咚|嘩啦?|唰|鏘|喀嚓|嗖|噹|碰|咻|叮|呼|轟)/);
  if (m) return S.lang === 'en' ? ({ '砰':'BANG!', '轟':'BOOM!', '轟隆':'RUMBLE!', '啪':'SLAP!', '咚':'THUD!', '嘩':'SPLASH!', '嘩啦':'SPLASH!', '唰':'SWISH!', '鏘':'CLANG!', '喀嚓':'CRACK!', '嗖':'WHOOSH!', '噹':'DONG!', '碰':'BAM!', '咻':'ZIP!', '叮':'DING!', '呼':'WHOOSH!' }[m[1]] || 'BAM!') : m[1] + '！';
  return '';
}

function localStoryboard(chunk, characters) {
  const text = chunk.text.replace(/\r/g, '');
  const names = (characters || []).map(c => c.name);
  const units = [];
  let last = 0;
  const pushNarr = seg => {
    seg.split(/(?<=[。！？!?…])\s*|\n+/).map(x => x.trim().replace(/[，,]\s*[^，,。！？]{0,8}[說道問喊叫答][：:]$/, '。'))
      .filter(x => x.length > 1 && !/^[^。！？]{0,8}[說道問喊叫答][：:，,]?$/.test(x)).forEach(x => units.push({ kind: 'n', text: x }));
  };
  for (const m of text.matchAll(QUOTE_RE)) {
    const before = text.slice(last, m.index);
    pushNarr(before);
    // 說話者：引號前 16 字內最後出現的已知角色，或「某某說：」
    const tail = text.slice(Math.max(0, m.index - 16), m.index);
    let speaker = '', pos = -1;
    names.forEach(n => { const k = tail.lastIndexOf(n); if (k > pos) { pos = k; speaker = n; } });
    if (!speaker) {
      const after = text.slice(m.index + m[0].length, m.index + m[0].length + 14);
      const am = after.match(/^[，,]?\s*([一-龥]{2,3}?)(?:[^。！？「]{0,5})[說道問喊叫答]/);
      if (am) speaker = names.find(n => after.startsWith(n) || after.slice(0, 5).includes(n)) || '';
    }
    if (/^[砰轟隆啪咚嘩啦唰鏘喀嚓嗖噹碰咻叮呼！!…\s]+$/.test(m[1])) { units.push({ kind: 's', text: m[1].trim() }); last = m.index + m[0].length; continue; }
    if (!speaker) { const mm = tail.match(/([一-龥]{2,3})(?:說|道|問|喊|叫|答)[：:，,]?\s*$/); if (mm) { speaker = cleanName(mm[1], text); if (/[地著了得的氣]$/.test(speaker)) speaker = ''; } }
    units.push({ kind: 'd', char: speaker, text: m[1].trim() });
    last = m.index + m[0].length;
  }
  pushNarr(text.slice(last));
  if (!units.length) units.push({ kind: 'n', text: text.slice(0, 60) });

  const N = units.length >= 6 ? 6 : units.length >= 4 ? 4 : Math.max(3, units.length);
  const layoutType = N === 6 ? (chunk.pageNum % 2 ? 'A' : 'C') : N === 4 ? (chunk.pageNum % 2 ? 'B' : 'E') : 'D';
  const per = units.length / N;
  const panels = [];
  for (let i = 0; i < N; i++) {
    const group = units.slice(Math.floor(i * per), Math.floor((i + 1) * per) || undefined);
    const narr = group.filter(u => u.kind === 'n').map(u => u.text).join('');
    const dias = group.filter(u => u.kind === 'd');
    const sfxU = group.find(u => u.kind === 's');
    const all = narr + dias.map(d => d.text).join('');
    const mood = detectMood(all);
    let cam;
    if (i === 0) cam = '遠景';
    else if (/抬頭|仰望|高聳|俯瞰著他|居高/.test(all)) cam = '仰角';
    else if (/低頭|俯視|從高處|鳥瞰|整座/.test(all)) cam = '俯角';
    else if (mood === '震驚' || mood === '憤怒' || mood === '悲傷') cam = '特寫';
    else if (dias.length) cam = i % 3 === 2 ? '近景' : '中景';
    else cam = i % 2 ? '中景' : '遠景';
    const focus = (dias[0] && dias[0].char) || names.find(n => all.includes(n)) || '';
    panels.push({
      id: i + 1,
      span: 'normal',
      sceneDesc: (narr || all).slice(0, 40),
      cameraAngle: cam,
      caption: narr && dias.length ? narr.slice(0, 25) + (narr.length > 25 ? '…' : '') : (!dias.length ? narr.slice(0, 40) + (narr.length > 40 ? '…' : '') : ''),
      dialogues: dias.slice(0, 2).map((d, di) => ({ char: d.char, text: d.text.length > 40 ? d.text.slice(0, 39) + '…' : d.text, type: /^[（(].*[)）]$|心想|暗想/.test(d.text) ? 'thought' : (/[！!]{1,}$/.test(d.text) ? 'shout' : 'speech'), pos: di === 0 ? 'tl' : 'br' })),
      sfx: sfxU ? (S.lang === 'en' ? detectSfx(sfxU.text) || 'BAM!' : sfxU.text) : detectSfx(all),
      mood,
      focusChar: focus,
    });
  }
  return { pageTitle: '', layoutType, panels, local: true };
}

function hashSeed(str) {
  let h = 2166136261;
  for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return Math.abs(h) % 1000000;
}

function zhToPrompt(t) {
  if (!t) return '';
  if (!/[一-龥]/.test(t)) return t;
  const out = [];
  let rest = String(t);
  ZH_EN.forEach(([zh, en]) => { if (rest.includes(zh)) { if (!out.includes(en)) out.push(en); rest = rest.split(zh).join(' '); } });
  return out.slice(0, 12).join(', ');
}

function buildImageURL(panel, index, chunkSeed) {
  const p = stylePreset();
  const ch = (S.characters || []).find(c => c.name && c.name === panel.focusChar);
  const scene = panel.artPrompt || panel.sceneDesc || '';
  const parts = [
    p.en,
    /[一-龥]/.test(S.styleCustom) ? '' : S.styleCustom,
    S.color === 'color' ? 'full color' : 'black and white manga, monochrome ink, screentone',
    CAMERA_EN[panel.cameraAngle] || 'medium shot',
    MOOD_EN[panel.mood] ? MOOD_EN[panel.mood] + ' mood' : '',
    panel.artPrompt ? scene : zhToPrompt(scene),
    ch ? (ch.appearanceEn || zhToPrompt(ch.appearance)) : '',
    S.worldSetting && !panel.artPrompt ? zhToPrompt(S.worldSetting) : '',
    zhToPrompt(S.styleCustom) === S.styleCustom ? '' : zhToPrompt(S.styleCustom),
    'original characters, single comic panel, no text, no speech bubbles, no logo, no watermark',
  ].filter(Boolean).join(', ').slice(0, 700);
  const wide = panel.span === 'span2' || panel.span === 'span3';
  const tall = panel.span === 'rowspan2';
  const w = wide ? 768 : tall ? 448 : 576, h = tall ? 704 : 432;
  // 同一角色固定種子，讓前後格外觀較一致；無主角的格用頁碼＋格號
  const seed = ch ? hashSeed(S.title + '|' + ch.name) : hashSeed(S.title + '|' + chunkSeed + '|' + index);
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(parts)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;
}

// 依序載入圖片（同時最多 2 張，失敗重試 1 次，最後保留示意圖）
const IMGQ = { q: [], busy: 0, max: 2 };
function pumpImgs() {
  while (IMGQ.busy < IMGQ.max && IMGQ.q.length) {
    const img = IMGQ.q.shift();
    if (!img.isConnected || !img.dataset.src) continue;
    IMGQ.busy++;
    let tries = 0, finished = false, timer = null;
    const finish = ok => {
      if (finished) return; finished = true; clearTimeout(timer);
      IMGQ.busy--;
      const art = img.parentElement;
      if (ok) { img.classList.add('loaded'); art && art.classList.add('has-img'); }
      else { const w = art && art.querySelector('.img-wait'); if (w) w.textContent = '示意圖（AI 繪圖暫不可用）'; img.remove(); }
      pumpImgs();
    };
    const attempt = () => {
      clearTimeout(timer);
      timer = setTimeout(() => img.onerror(), 90000);
      img.src = img.dataset.src + (tries ? '&retry=' + tries : '');
    };
    img.onload = () => finish(true);
    img.onerror = () => { if (finished) return; if (tries++ < 1) setTimeout(attempt, 5000); else finish(false); };
    attempt();
  }
}

function renderPanelHTML(panel, index, colorMode, style, seed) {
  const spanClass = panel.span === 'span2' ? 'span2' : panel.span === 'span3' ? 'span3' : panel.span === 'rowspan2' ? 'rowspan2' : '';
  const isColor = colorMode === 'color';

  const artSvg = buildPanelArt(panel, index, seed, isColor, (STYLE_PRESETS[style] || {}).svg || 'japanese');
  const imgHTML = S.art === 'ai'
    ? `<img class="ai-img" alt="${esc(panel.sceneDesc || '')}" data-src="${esc(buildImageURL(panel, index, seed))}"><span class="img-wait">AI 繪圖中…</span>`
    : '';

  const captionHTML = panel.caption
    ? `<div class="panel-caption">${esc(panel.caption)}</div>` : '';

  const dialoguesHTML = (panel.dialogues || []).slice(0,2).map((d, di) => {
    const pos = d.pos || (di === 0 ? 'tl' : 'br');
    const typeClass = d.type === 'thought' ? ' thought' : '';
    return `<div class="bubble ${pos}${typeClass}"><b>${esc(d.char)}</b>${esc(d.text)}</div>`;
  }).join('');

  return `
    <div class="panel ${spanClass}${panel.caption ? ' has-cap' : ''}" onclick="zoomPanel(this, ${index}, ${seed})">
      <div class="panel-art">${artSvg}${imgHTML}</div>

      ${dialoguesHTML}
      ${sfxHTML}
    </div>`;
}

// ═══════════════════════════════════════════
//  SVG ART GENERATION
// ═══════════════════════════════════════════
function buildPanelArt(panel, panelIndex, chunkSeed, isColor, style) {
  const seed = (chunkSeed * 31 + panelIndex * 17 + 7) & 0xFFFFFF;
  const rng = mkrng(seed);
  const mood = panel.mood || '平靜';
  const angle = panel.cameraAngle || '中景';

  // Color palettes per mood
  const palettes = {
    '緊張': isColor ? ['#ff4136','#ff851b','#ffdc00','#111'] : ['#000','#222','#666','#999'],
    '憤怒': isColor ? ['#c0392b','#e67e22','#f39c12','#111'] : ['#000','#111','#444','#888'],
    '喜悅': isColor ? ['#2ecc40','#01ff70','#7fdbff','#fff'] : ['#ddd','#aaa','#666','#333'],
    '悲傷': isColor ? ['#0074d9','#7fdbff','#b10dc9','#eee'] : ['#aaa','#777','#444','#111'],
    '平靜': isColor ? ['#3d9970','#7fdbff','#f0f4f8','#fff'] : ['#e0e0e0','#aaa','#666','#222'],
    '恐懼': isColor ? ['#111111','#6c3483','#1a5276','#333'] : ['#000','#111','#333','#777'],
    '震驚': isColor ? ['#ff851b','#ffdc00','#fff','#000'] : ['#ddd','#bbb','#555','#000'],
  };
  const pal = palettes[mood] || palettes['平靜'];

  const W = 200, H = 180;

  let art = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // Background
  art += `<rect width="${W}" height="${H}" fill="${pal[2]}"/>`;

  if (angle === '遠景') {
    art += drawWideScene(rng, pal, W, H, style);
  } else if (angle === '特寫') {
    art += drawCloseup(rng, pal, W, H, style, mood);
  } else if (angle === '俯角') {
    art += drawBirdEye(rng, pal, W, H, style);
  } else if (angle === '仰角') {
    art += drawWormEye(rng, pal, W, H, style);
  } else {
    art += drawMidShot(rng, pal, W, H, style, mood, panel);
  }

  // Manga-style overlays
  if (style === 'japanese' && (mood === '緊張' || mood === '震驚' || mood === '憤怒')) {
    art += drawSpeedLines(rng, W, H, pal[0]);
  }
  if (style === 'american') {
    art += drawHatchLines(rng, W, H);
  }

  art += '</svg>';
  return art;
}

function mkrng(seed) {
  let s = seed;
  return (min=0, max=1) => {
    s = (s * 1664525 + 1013904223) & 0x7FFFFFFF;
    return min + ((s / 0x7FFFFFFF) * (max - min));
  };
}

function drawWideScene(rng, pal, W, H) {
  let s = '';
  // Sky gradient
  s += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${pal[2]}"/><stop offset="100%" stop-color="${pal[1]}" stop-opacity="0.5"/></linearGradient></defs>`;
  s += `<rect width="${W}" height="${H*0.65}" fill="url(#sky)"/>`;
  s += `<rect y="${H*0.65}" width="${W}" height="${H*0.35}" fill="${pal[1]}" opacity="0.7"/>`;
  s += `<line x1="0" y1="${H*0.65}" x2="${W}" y2="${H*0.65}" stroke="${pal[3]}" stroke-width="1.5"/>`;
  // Buildings
  for (let i=0;i<6;i++) {
    const bx = rng(i*25, i*25+20);
    const bh = rng(20,70);
    const bw = rng(14,28);
    s += `<rect x="${bx}" y="${H*0.65-bh}" width="${bw}" height="${bh}" fill="${pal[0]}" opacity="${rng(0.6,1)}" stroke="${pal[3]}" stroke-width="0.8"/>`;
    // Windows
    for (let wr=0;wr<3;wr++) {
      for (let wc=0;wc<2;wc++) {
        s += `<rect x="${bx+3+wc*7}" y="${H*0.65-bh+6+wr*10}" width="4" height="5" fill="${pal[2]}" opacity="${rng(0.3,1)}"/>`;
      }
    }
  }
  // Ground figures
  for (let i=0;i<3;i++) {
    const fx = rng(20,W-20);
    s += `<ellipse cx="${fx}" cy="${H*0.65+4}" rx="3" ry="5" fill="${pal[3]}"/>`;
  }
  return s;
}

function drawCloseup(rng, pal, W, H, style, mood) {
  let s = '';
  const cx = W/2, cy = H*0.48;
  // Background emotion lines
  if (mood === '震驚' || mood === '緊張') {
    for (let i=0;i<16;i++) {
      const a = (i/16)*Math.PI*2;
      s += `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*160}" y2="${cy+Math.sin(a)*160}" stroke="${pal[0]}" stroke-width="${rng(0.3,1.5)}" opacity="0.25"/>`;
    }
  }
  // Face
  s += `<ellipse cx="${cx}" cy="${cy}" rx="45" ry="52" fill="${pal[1]}" opacity="0.9"/>`;
  // Hair blob
  const hairY = cy - 30;
  s += `<ellipse cx="${cx}" cy="${hairY}" rx="50" ry="32" fill="${pal[0]}" opacity="0.85"/>`;
  // Side hair
  s += `<ellipse cx="${cx-42}" cy="${cy}" rx="12" ry="28" fill="${pal[0]}" opacity="0.8"/>`;
  s += `<ellipse cx="${cx+42}" cy="${cy}" rx="12" ry="28" fill="${pal[0]}" opacity="0.8"/>`;
  // Eyes
  const eyeY = cy + 2;
  const eyeRx = style === 'japanese' ? 10 : 7;
  const eyeRy = style === 'japanese' ? 13 : 8;
  s += `<ellipse cx="${cx-16}" cy="${eyeY}" rx="${eyeRx}" ry="${eyeRy}" fill="${pal[3]}"/>`;
  s += `<ellipse cx="${cx+16}" cy="${eyeY}" rx="${eyeRx}" ry="${eyeRy}" fill="${pal[3]}"/>`;
  if (style === 'japanese') {
    s += `<circle cx="${cx-13}" cy="${eyeY-3}" r="3.5" fill="white"/>`;
    s += `<circle cx="${cx+19}" cy="${eyeY-3}" r="3.5" fill="white"/>`;
    // Eyelashes
    s += `<path d="M${cx-26} ${eyeY-6} Q${cx-20} ${eyeY-15} ${cx-12} ${eyeY-13}" stroke="${pal[3]}" stroke-width="1.5" fill="none"/>`;
    s += `<path d="M${cx+26} ${eyeY-6} Q${cx+20} ${eyeY-15} ${cx+12} ${eyeY-13}" stroke="${pal[3]}" stroke-width="1.5" fill="none"/>`;
  }
  // Nose
  s += `<path d="M${cx-4} ${cy+10} Q${cx} ${cy+18} ${cx+4} ${cy+10}" stroke="${pal[3]}" stroke-width="1.2" fill="none" opacity="0.5"/>`;
  // Mouth (expression by mood)
  if (mood === '喜悅' || mood === '平靜') {
    s += `<path d="M${cx-14} ${cy+22} Q${cx} ${cy+32} ${cx+14} ${cy+22}" stroke="${pal[3]}" stroke-width="2" fill="none"/>`;
  } else if (mood === '悲傷') {
    s += `<path d="M${cx-14} ${cy+28} Q${cx} ${cy+20} ${cx+14} ${cy+28}" stroke="${pal[3]}" stroke-width="2" fill="none"/>`;
    // Tears
    s += `<ellipse cx="${cx-14}" cy="${eyeY+18}" rx="3" ry="6" fill="#7fdbff" opacity="0.7"/>`;
  } else if (mood === '憤怒' || mood === '緊張') {
    s += `<line x1="${cx-14}" y1="${cy+26}" x2="${cx+14}" y2="${cy+26}" stroke="${pal[3]}" stroke-width="2"/>`;
    // Angry veins
    s += `<path d="M${cx+28} ${cy-20} L${cx+40} ${cy-28} L${cx+36} ${cy-18}" stroke="${pal[0]}" stroke-width="2" fill="none"/>`;
  } else {
    s += `<path d="M${cx-10} ${cy+24} L${cx+10} ${cy+24}" stroke="${pal[3]}" stroke-width="1.5"/>`;
  }
  return s;
}

function drawBirdEye(rng, pal, W, H) {
  let s = '';
  s += `<rect width="${W}" height="${H}" fill="${pal[2]}" opacity="0.8"/>`;
  // Grid floor
  for (let i=0;i<8;i++) {
    s += `<line x1="${i*28}" y1="0" x2="${i*28+H}" y2="${H}" stroke="${pal[3]}" stroke-width="0.4" opacity="0.3"/>`;
    s += `<line x1="0" y1="${i*24}" x2="${W}" y2="${i*24}" stroke="${pal[3]}" stroke-width="0.4" opacity="0.3"/>`;
  }
  // Top-down figures
  for (let i=0;i<3;i++) {
    const fx = rng(20, W-20), fy = rng(20, H-20);
    s += `<circle cx="${fx}" cy="${fy}" r="${rng(6,12)}" fill="${pal[0]}" opacity="0.8"/>`;
    s += `<ellipse cx="${fx}" cy="${fy+14}" rx="${rng(4,8)}" ry="${rng(8,16)}" fill="${pal[1]}" opacity="0.7"/>`;
    // Shadow
    s += `<ellipse cx="${fx+3}" cy="${fy+20}" rx="${rng(6,10)}" ry="3" fill="${pal[3]}" opacity="0.2"/>`;
  }
  return s;
}

function drawWormEye(rng, pal, W, H) {
  let s = '';
  // Sky
  s += `<rect width="${W}" height="${H}" fill="${pal[2]}"/>`;
  // Tall dramatic buildings from below
  for (let i=0;i<4;i++) {
    const bx = i*52 - 10;
    const bw = rng(40,55);
    const converge = W/2 + (bx + bw/2 - W/2) * 0.1;
    s += `<polygon points="${bx},${H} ${converge},0 ${converge+bw*0.3},0 ${bx+bw},${H}" fill="${pal[0]}" opacity="${rng(0.7,1)}"/>`;
    // windows
    for (let wr=0;wr<5;wr++) {
      const wy = H*0.2 + wr*H*0.14;
      s += `<rect x="${bx+10}" y="${wy}" width="8" height="10" fill="${pal[2]}" opacity="${rng(0.2,0.9)}"/>`;
    }
  }
  // Figure at bottom center
  const fig = W/2;
  s += `<ellipse cx="${fig}" cy="${H-8}" rx="16" ry="24" fill="${pal[1]}" opacity="0.9"/>`;
  s += `<circle cx="${fig}" cy="${H-38}" r="12" fill="${pal[1]}" opacity="0.9"/>`;
  return s;
}

function drawMidShot(rng, pal, W, H, style, mood, panel) {
  let s = '';
  // BG texture
  s += `<rect width="${W}" height="${H}" fill="${pal[2]}"/>`;
  // Simple bg lines
  for (let i=0;i<5;i++) {
    s += `<line x1="${rng(0,W)}" y1="0" x2="${rng(0,W)}" y2="${H}" stroke="${pal[1]}" stroke-width="${rng(0.2,0.8)}" opacity="0.3"/>`;
  }

  const numFigs = panel?.dialogues?.length > 1 ? 2 : 1;
  const positions = numFigs === 2 ? [W*0.3, W*0.7] : [W*0.5];

  positions.forEach((fx, fi) => {
    const headY = H*0.28 + rng(fi,10);
    const bodyH = H*0.5;
    const bodyW = rng(fi+1, 10) + 30;

    // Body
    s += `<rect x="${fx-bodyW/2}" y="${headY+22}" width="${bodyW}" height="${bodyH}" rx="5" fill="${pal[fi===0?0:1]}" opacity="0.85"/>`;
    // Head
    s += `<ellipse cx="${fx}" cy="${headY}" rx="18" ry="20" fill="${pal[2]}" opacity="0.95"/>`;
    // Hair
    s += `<ellipse cx="${fx}" cy="${headY-8}" rx="20" ry="14" fill="${pal[fi===0?3:0]}" opacity="0.9"/>`;
    // Eyes
    if (style === 'japanese') {
      s += `<ellipse cx="${fx-7}" cy="${headY+2}" rx="6" ry="7" fill="${pal[3]}"/>`;
      s += `<ellipse cx="${fx+7}" cy="${headY+2}" rx="6" ry="7" fill="${pal[3]}"/>`;
      s += `<circle cx="${fx-5}" cy="${headY}" r="2" fill="white"/>`;
      s += `<circle cx="${fx+9}" cy="${headY}" r="2" fill="white"/>`;
    } else {
      s += `<ellipse cx="${fx-7}" cy="${headY+2}" rx="5" ry="5" fill="${pal[3]}"/>`;
      s += `<ellipse cx="${fx+7}" cy="${headY+2}" rx="5" ry="5" fill="${pal[3]}"/>`;
    }
    // Arms
    s += `<line x1="${fx-bodyW/2}" y1="${headY+35}" x2="${fx-bodyW/2-18}" y2="${headY+70}" stroke="${pal[fi===0?0:1]}" stroke-width="8" stroke-linecap="round" opacity="0.85"/>`;
    s += `<line x1="${fx+bodyW/2}" y1="${headY+35}" x2="${fx+bodyW/2+18}" y2="${headY+70}" stroke="${pal[fi===0?0:1]}" stroke-width="8" stroke-linecap="round" opacity="0.85"/>`;
    // Legs
    s += `<line x1="${fx-8}" y1="${headY+22+bodyH}" x2="${fx-10}" y2="${H}" stroke="${pal[fi===0?0:1]}" stroke-width="9" stroke-linecap="round" opacity="0.85"/>`;
    s += `<line x1="${fx+8}" y1="${headY+22+bodyH}" x2="${fx+10}" y2="${H}" stroke="${pal[fi===0?0:1]}" stroke-width="9" stroke-linecap="round" opacity="0.85"/>`;
  });

  // Ground shadow
  s += `<ellipse cx="${W/2}" cy="${H}" rx="${W*0.4}" ry="10" fill="${pal[3]}" opacity="0.1"/>`;

  return s;
}

function drawSpeedLines(rng, W, H, color) {
  let s = '';
  const cx = W/2, cy = H/2;
  for (let i=0;i<20;i++) {
    const a = (i/20)*Math.PI*2 + rng(0,0.15);
    const len = rng(80,160);
    s += `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*len}" y2="${cy+Math.sin(a)*len}" stroke="${color}" stroke-width="${rng(0.2,1.2)}" opacity="${rng(0.05,0.2)}"/>`;
  }
  return s;
}

function drawHatchLines(rng, W, H) {
  let s = '';
  for (let i=0;i<8;i++) {
    const x1 = rng(0,W), y1 = rng(0,H/2);
    const x2 = x1 + rng(-30,30), y2 = y1 + rng(H*0.3,H*0.7);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="${rng(0.2,0.8)}" opacity="${rng(0.03,0.1)}"/>`;
  }
  return s;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════
function updateProgress(done, total, label) {
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  $('pb-done').textContent = done;
  $('pb-total').textContent = total;
  $('pb-pct').textContent = pct + '%';
  $('pb-fill').style.width = pct + '%';
  $('current-task-label').textContent = label;
  $('hdr-status').textContent = `${pct}% (${done}/${total})`;
  $('hdr-status').className = done === total && total > 0 ? 'tag green' : 'tag red';
}

function setPillStatus(i, status) {
  const pill = $(`cpill-${i}`);
  if (pill) {
    pill.className = 'chunk-pill ' + status;
    if (status === 'active') pill.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ═══════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════
function zoomPanel(el, index, seed) {
  const overlay = $('zoom-overlay');
  const img = $('zoom-img');
  img.innerHTML = el.outerHTML;
  img.querySelector('.panel').style.cssText = 'width:500px;height:400px;cursor:default;';
  overlay.classList.add('show');
}

// ═══════════════════════════════════════════
//  RESTART
// ═══════════════════════════════════════════
function restartSetup() {
  if (S.running && S.done < S.total) {
    if (!confirm('生成尚未完成，確定要重新開始嗎？')) return;
    S.running = false;
  }
  $('setup-screen').style.display = 'block';
  $('manga-viewer').classList.remove('show');
  $('progress-bar-wrap').classList.remove('show');
  $('episodes-container').innerHTML = '';
  $('char-cards-list').innerHTML = '';
  $('char-sheet').classList.remove('show');
  $('btn-restart').style.display = 'none';
  $('hdr-status').style.display = 'none';
  updateStats();
}
</script>
