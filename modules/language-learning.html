<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>語言學習中心｜Language Learning</title>
  <link rel="stylesheet" href="../acc-module-shell.css">
  <style>
    :root{--navy:#102a43;--blue:#0f6db2;--gold:#d2a832;--bg:#f3f7fa;--card:#fff;--ink:#18344e;--muted:#63798b;--line:#d9e4ec}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer","Noto Sans TC","Segoe UI",Arial,sans-serif}
    button,select{font:inherit}.course-head{position:sticky;top:var(--acc-shell-h,58px);z-index:20;background:linear-gradient(135deg,#eef8ff,#fff 55%,#f9f4df);border-bottom:1px solid var(--line);padding:12px 14px}
    .head-row{max-width:1400px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head-copy{flex:1;min-width:240px}.head-copy h1{margin:0;font-size:18px}.head-copy p{margin:4px 0 0;font-size:11px;color:var(--muted)}
    .chooser{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.chooser label{font-size:10px;font-weight:800;color:var(--muted)}.chooser select{min-width:220px;border:1px solid #aebfce;border-radius:9px;background:#fff;padding:9px 11px;color:var(--ink)}
    .catalog{max-width:1400px;margin:0 auto;padding:12px 14px 10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.course-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;color:var(--ink);cursor:pointer;min-height:82px;box-shadow:0 2px 9px rgba(16,42,67,.04)}.course-card:hover{border-color:#7db0d1}.course-card.on{border-color:var(--blue);box-shadow:inset 0 0 0 2px #cfe9fa;background:#f6fbff}.flag{font-size:21px}.course-name{font-weight:850;font-size:12px;margin-top:4px}.course-sub{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.35}
    .course-stage{max-width:1400px;margin:0 auto;padding:0 14px 30px}.stage-bar{background:#fff;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:9px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stage-title{font-size:12px;font-weight:850;flex:1}.stage-note{font-size:9px;color:var(--muted)}.frame-wrap{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}.course-frame{display:block;width:100%;height:max(760px,calc(100vh - 255px));border:0;background:#fff}
    .status{padding:8px 10px;border-radius:9px;background:#e7f5ee;color:#17684f;font-size:10px;font-weight:750}.hidden{display:none!important}
    @media(max-width:700px){.course-head{padding:9px 9px}.catalog,.course-stage{padding-left:8px;padding-right:8px}.cards{display:flex;overflow:auto}.course-card{min-width:150px}.chooser,.chooser select{width:100%}.course-frame{height:calc(100vh - 235px);min-height:650px}.head-copy p{display:none}}
  </style>
</head>
<body>
  <header class="course-head">
    <div class="head-row">
      <div class="head-copy"><h1 id="hubTitle">🌏 語言學習中心</h1><p id="hubSub">所有課程歸在同一類，先選想學的語言；每種語言進度分開保存。</p></div>
      <div class="chooser"><label id="chooseLabel" for="courseSelect">選擇課程</label><select id="courseSelect" aria-label="選擇語言課程"></select><span class="status" id="courseStatus">7 種語言 · 8 套課程</span></div>
    </div>
  </header>
  <section class="catalog"><div class="cards" id="courseCards"></div></section>
  <main class="course-stage">
    <div class="stage-bar"><div class="stage-title" id="stageTitle"></div><div class="stage-note" id="stageNote">切換課程不會清除其他語言進度</div></div>
    <div class="frame-wrap"><iframe id="courseFrame" class="course-frame" title="語言互動課程" allow="autoplay; clipboard-read; clipboard-write"></iframe></div>
  </main>
  <script>
  (()=>{
    const COURSES=[
      {id:'zulu',flag:'🇿🇦',zh:'祖魯語',en:'Zulu',km:'ភាសាហ្សូលូ',sub:'30 天手機互動課程',file:'languages/zulu-30-day.html'},
      {id:'thai',flag:'🇹🇭',zh:'泰語',en:'Thai',km:'ភាសាថៃ',sub:'30 天零基礎課程',file:'languages/thai-30-day.html'},
      {id:'spanish',flag:'🇪🇸',zh:'西班牙語',en:'Spanish',km:'ភាសាអេស្ប៉ាញ',sub:'零基礎到 A1',file:'languages/spanish-a1.html'},
      {id:'vietnamese',flag:'🇻🇳',zh:'越南語',en:'Vietnamese',km:'ភាសាវៀតណាម',sub:'28 天互動課程',file:'languages/vietnamese-28-day.html'},
      {id:'japanese',flag:'🇯🇵',zh:'日語',en:'Japanese',km:'ភាសាជប៉ុន',sub:'日劇聽力互動課程',file:'languages/japanese-drama.html'},
      {id:'malay',flag:'🇲🇾',zh:'馬來西亞語',en:'Malay',km:'ភាសាម៉ាឡេ',sub:'生活情境互動課',file:'languages/malay-life.html'},
      {id:'khmer-primer',flag:'🇰🇭',zh:'柬埔寨語｜快速入門',en:'Khmer | Quick Start',km:'ខ្មែរ | មូលដ្ឋាន',sub:'發音、常用語與小測驗',file:'languages/khmer-primer.html'},
      {id:'khmer-30',flag:'🇰🇭',zh:'柬埔寨語｜30 天',en:'Khmer | 30 Days',km:'ខ្មែរ | ៣០ ថ្ងៃ',sub:'完整 30 天互動課程',file:'languages/khmer-30-day.html'}
    ];
    const LANG=()=>localStorage.getItem('vrt_flow_lang')||'zh';
    const $=s=>document.querySelector(s), label=c=>LANG()==='en'?c.en:LANG()==='km'?c.km:c.zh;
    let active=localStorage.getItem('vrt_language_active')||'khmer-30';
    if(!COURSES.some(c=>c.id===active))active=COURSES[0].id;
    function text(){const l=LANG();$('#hubTitle').textContent=l==='en'?'🌏 Language Learning':l==='km'?'🌏 មជ្ឈមណ្ឌលរៀនភាសា':'🌏 語言學習中心';$('#hubSub').textContent=l==='en'?'Choose one language. Every course keeps its own progress.':l==='km'?'ជ្រើសភាសាដែលចង់រៀន។ វគ្គនីមួយៗរក្សាទុកវឌ្ឍនភាពដាច់ដោយឡែក។':'所有課程歸在同一類，先選想學的語言；每種語言進度分開保存。';$('#chooseLabel').textContent=l==='en'?'Choose course':l==='km'?'ជ្រើសវគ្គ':'選擇課程';$('#courseStatus').textContent=l==='en'?'7 languages · 8 courses':l==='km'?'៧ ភាសា · ៨ វគ្គ':'7 種語言 · 8 套課程';$('#stageNote').textContent=l==='en'?'Switching does not erase another course.':l==='km'?'ប្ដូរវគ្គមិនលុបវឌ្ឍនភាពវគ្គផ្សេងទេ។':'切換課程不會清除其他語言進度'}
    function draw(){text();const sel=$('#courseSelect');sel.innerHTML=COURSES.map(c=>`<option value="${c.id}" ${c.id===active?'selected':''}>${c.flag} ${label(c)}</option>`).join('');$('#courseCards').innerHTML=COURSES.map(c=>`<button class="course-card ${c.id===active?'on':''}" data-course="${c.id}"><div class="flag">${c.flag}</div><div class="course-name">${label(c)}</div><div class="course-sub">${c.sub}</div></button>`).join('');const c=COURSES.find(x=>x.id===active);$('#stageTitle').textContent=`${c.flag} ${label(c)} · ${c.sub}`;const frame=$('#courseFrame'),next=`${c.file}?embedded=1`;if(!frame.src.endsWith(next))frame.src=next;document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>select(b.dataset.course));sel.onchange=e=>select(e.target.value)}
    function select(id){if(!COURSES.some(c=>c.id===id)||id===active)return;active=id;localStorage.setItem('vrt_language_active',active);draw()}
    window.addEventListener('storage',e=>{if(e.key==='vrt_flow_lang')draw()});
    document.addEventListener('DOMContentLoaded',draw);
  })();
  </script>
  <script src="../acc-module-shell.js"></script>
</body>
</html>
