<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>泰語零基礎30天互動課程</title>
<style>
:root{--navy:#163459;--orange:#df7838;--pale:#eef5f8;--ink:#263442;--muted:#6b7783;--good:#16856b;--card:#fff;}
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","Noto Sans Thai",system-ui,sans-serif;background:#f4f7f9;color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,#163459,#2d668a);color:white;padding:22px 16px 26px;position:sticky;top:0;z-index:10;box-shadow:0 3px 16px #0002}
header h1{font-size:24px;margin:0 0 4px} header p{margin:0;opacity:.9;font-size:14px}
.wrap{max-width:980px;margin:auto;padding:14px}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:12px 0}
input[type=search]{width:100%;border:1px solid #c9d6df;border-radius:12px;padding:12px;font-size:16px;background:white}
button{border:0;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer}
.btn{background:var(--navy);color:white} .btn2{background:#e9f0f4;color:var(--navy)} .audio{background:#e8f6f2;color:#08725c;white-space:nowrap}
.slow{background:#fff1e7;color:#a84c14;white-space:nowrap}
.progressBox{background:white;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 9px #0001}
.bar{height:12px;background:#dbe5eb;border-radius:99px;overflow:hidden} .bar>div{height:100%;width:0;background:linear-gradient(90deg,#16856b,#5ac2a9)}
.tip{background:#fff6ea;border-left:5px solid var(--orange);padding:13px 14px;border-radius:10px;margin:12px 0}
.lesson{background:white;border-radius:16px;margin:12px 0;box-shadow:0 3px 12px #0001;overflow:hidden}
.lessonHead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px;background:var(--pale)}
.day{font-size:12px;font-weight:900;color:var(--orange)} .icon{font-size:30px} .lesson h2{margin:0;font-size:20px;color:var(--navy)} .goal{font-size:13px;color:var(--muted)}
.complete{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--good)} .complete input{width:22px;height:22px}
.phrase{padding:14px;border-top:1px solid #edf1f3} .thai{font-family:"Noto Sans Thai",sans-serif;font-size:27px;font-weight:800;color:var(--navy);line-height:1.35}
.meaning{font-size:18px;font-weight:800;margin:4px 0} .pron{font-size:14px;color:#51606b} .cn{font-size:13px;color:#7a5b42}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px} .practice{padding:14px;background:#fffaf4;border-top:1px solid #f4e4d4}
.hide{display:none!important} dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:92%;box-shadow:0 20px 60px #0005} dialog::backdrop{background:#0008}
.quiz{padding:20px} .quiz h3{color:var(--navy);margin-top:0} .option{display:block;width:100%;text-align:left;background:#edf3f6;color:var(--ink);margin:8px 0;padding:12px} .option.correct{background:#dff6ec;color:#08634f} .option.wrong{background:#fde5e2;color:#9a2c20}
.cardMode{position:fixed;inset:0;background:#102c48dd;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.flash{background:white;border-radius:20px;max-width:680px;width:100%;min-height:360px;padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center} .flash .thai{font-size:42px} .flash .meaning{font-size:24px}
footer{text-align:center;color:#75818b;padding:30px 10px;font-size:13px}
@media(max-width:650px){.controls{grid-template-columns:1fr 1fr} .controls input{grid-column:1/-1} header{position:relative} .thai{font-size:25px} .lessonHead{grid-template-columns:auto 1fr} .complete{grid-column:1/-1;justify-content:flex-end}}
@media print{header,.controls,.progressBox,.audio,.slow,.complete,footer{display:none} .lesson{break-inside:avoid;box-shadow:none;border:1px solid #ddd} body{background:white}}
</style></head>
<body>
<header><div class="wrap" style="padding:0"><h1>🇹🇭 泰語零基礎 30 天生活入門課</h1><p>先聽說、後認字｜每天約 15 分鐘｜男性禮貌句尾使用「ครับ」</p></div></header>
<main class="wrap">
<div class="tip"><b>使用方式：</b>每句先按「慢速」聽 3 次，再跟讀 3 次。中文近似音只幫助張口，真正發音以泰文語音為準。手機瀏覽器若沒有聲音，請開啟系統的泰語文字轉語音（Thai TTS）。</div>
<div class="controls"><input id="search" type="search" placeholder="搜尋：餐廳、多少錢、工廠、泰文……"><button class="btn" onclick="openQuiz()">隨機測驗</button><button class="btn2" onclick="startCards()">大字卡</button></div>
<div class="progressBox"><b>完成進度：<span id="progText">0 / 30</span></b><div class="bar"><div id="bar"></div></div></div>
<section id="lessons"></section>
</main>
<dialog id="quizDialog"><div class="quiz"><h3>隨機測驗</h3><p id="quizQ"></p><div id="quizOpts"></div><p id="quizResult"></p><button class="btn" onclick="makeQuiz()">下一題</button> <button class="btn2" onclick="quizDialog.close()">關閉</button></div></dialog>
<div id="cards" class="cardMode hide"><div class="flash"><div id="cardCount"></div><div id="cardThai" class="thai"></div><div id="cardMeaning" class="meaning"></div><div id="cardPron" class="pron"></div><div class="actions" style="justify-content:center;margin-top:22px"><button class="audio" onclick="speak(currentCard.th,.65)">🔊 聽</button><button class="btn2" onclick="prevCard()">上一張</button><button class="btn" onclick="nextCard()">下一張</button><button class="btn2" onclick="closeCards()">關閉</button></div></div></div>
<footer>本教材為生活入門與語言練習用途；醫療或緊急情況請同時使用翻譯工具並尋求當地協助。</footer>
<script>
const lessons=[{"day": 1, "theme": "先敢開口：打招呼", "scenario": "第一次見面、進商店、見同事", "goal": "今天只要會禮貌地開口，不追求完美。", "icon": "👋", "phrases": [{"th": "สวัสดีครับ", "rom": "sà-wàt-dii khráp", "cn": "沙-哇-滴／卡普", "meaning": "你好（男性說法）"}, {"th": "ขอบคุณครับ", "rom": "khɔ̀ɔp-khun khráp", "cn": "口-坤／卡普", "meaning": "謝謝"}, {"th": "ขอโทษครับ", "rom": "khɔ̌ɔ-thôot khráp", "cn": "口-透／卡普", "meaning": "對不起／不好意思"}, {"th": "ไม่เป็นไร", "rom": "mâi pen rai", "cn": "麥-奔-萊", "meaning": "沒關係"}]}, {"day": 2, "theme": "是、不是、懂、不懂", "scenario": "別人問你問題時", "goal": "先學會安全回應，不必硬猜。", "icon": "✅", "phrases": [{"th": "ใช่ครับ", "rom": "châi khráp", "cn": "柴／卡普", "meaning": "是的"}, {"th": "ไม่ใช่ครับ", "rom": "mâi châi khráp", "cn": "麥-柴／卡普", "meaning": "不是"}, {"th": "เข้าใจครับ", "rom": "khâo-jai khráp", "cn": "靠-齋／卡普", "meaning": "我懂了"}, {"th": "ไม่เข้าใจครับ", "rom": "mâi khâo-jai khráp", "cn": "麥-靠-齋／卡普", "meaning": "我不懂"}]}, {"day": 3, "theme": "請說慢一點", "scenario": "聽不清楚時", "goal": "這一課非常重要，聽不懂就用它救場。", "icon": "👂", "phrases": [{"th": "พูดช้าๆ ได้ไหมครับ", "rom": "phûut cháa-cháa dâai mái khráp", "cn": "普特／恰恰／戴-麥／卡普", "meaning": "可以說慢一點嗎？"}, {"th": "พูดอีกครั้งได้ไหมครับ", "rom": "phûut ìik khráng dâai mái khráp", "cn": "普特／益-克朗／戴-麥／卡普", "meaning": "可以再說一次嗎？"}, {"th": "หมายความว่าอะไรครับ", "rom": "mǎai-khwaam wâa à-rai khráp", "cn": "買-框／哇／阿萊／卡普", "meaning": "這是什麼意思？"}, {"th": "ช่วยเขียนให้ดูได้ไหมครับ", "rom": "chûai khǐan hâi duu dâai mái khráp", "cn": "吹／肯／海／督／戴麥／卡普", "meaning": "可以寫給我看嗎？"}]}, {"day": 4, "theme": "自我介紹", "scenario": "認識新朋友", "goal": "只要會姓名、來自哪裡即可。", "icon": "🙂", "phrases": [{"th": "ผมชื่อพอลครับ", "rom": "phǒm chʉ̂ʉ Paul khráp", "cn": "彭／去／Paul／卡普", "meaning": "我叫 Paul"}, {"th": "ผมมาจากไต้หวันครับ", "rom": "phǒm maa jàak Tâi-wǎn khráp", "cn": "彭／媽／架／台灣／卡普", "meaning": "我來自台灣"}, {"th": "ยินดีที่ได้รู้จักครับ", "rom": "yin-dii thîi dâai rúu-jàk khráp", "cn": "因-滴／替／戴／魯-甲／卡普", "meaning": "很高興認識你"}, {"th": "คุณชื่ออะไรครับ", "rom": "khun chʉ̂ʉ à-rai khráp", "cn": "坤／去／阿萊／卡普", "meaning": " const container=document.getElementById('lessons');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(filter=''){
 container.innerHTML=''; const q=filter.trim().toLowerCase();
 lessons.forEach(L=>{const blob=JSON.stringify(L).toLowerCase(); if(q&&!blob.includes(q))return;
 const el=document.createElement('article'); el.className='lesson'; el.dataset.search=blob;
 el.innerHTML=`<div class="lessonHead"><div class="icon">${L.icon}</div><div><div class="day">DAY ${String(L.day).padStart(2,'0')}</div><h2>${esc(L.theme)}</h2><div class="goal">情境：${esc(L.scenario)}｜${esc(L.goal)}</div></div><label class="complete"><input type="checkbox" data-day="${L.day}">完成本課</label></div>`+
 L.phrases.map((p,i)=>`<div class="phrase"><div class="thai">${esc(p.th)}</div><div class="meaning">${esc(p.meaning)}</div><div class="pron">羅馬拼音：${esc(p.rom)}</div><div class="cn">中文口型提示：${esc(p.cn)}</div><div class="actions"><button class="slow" onclick='speak(${JSON.stringify(p.th)},.52)'>🐢 慢速</button><button class="audio" onclick='speak(${JSON.stringify(p.th)},.72)'>🔊 正常</button></div></div>`).join('')+
 `<div class="practice"><b>今日開口任務：</b>依「${esc(L.scenario)}」情境，不看中文說出至少兩句。能讓對方理解就算完成。</div>`;
 container.appendChild(el);
 }); bindChecks();
}
function speak(text,rate=.7){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}
function bindChecks(){document.querySelectorAll('input[data-day]').forEach(cb=>{cb.checked=localStorage.getItem('thaiDay'+cb.dataset.day)==='1';cb.onchange=()=>{localStorage.setItem('thaiDay'+cb.dataset.day,cb.checked?'1':'0');updateProgress()}});updateProgress()}
function updateProgress(){let n=0;for(let i=1;i<=30;i++)if(localStorage.getItem('thaiDay'+i)==='1')n++;document.getElementById('progText').textContent=`${n} / 30`;document.getElementById('bar').style.width=(n/30*100)+'%'}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
const allP=lessons.flatMap(L=>L.phrases);
function openQuiz(){quizDialog.showModal();makeQuiz()}
function makeQuiz(){const target=allP[Math.floor(Math.random()*allP.length)];quizQ.innerHTML=`「<b>${esc(target.meaning)}</b>」是哪一句泰語？`;let opts=[target];while(opts.length<4){const x=allP[Math.floor(Math.random()*allP.length)];if(!opts.some(o=>o.th===x.th))opts.push(x)}opts.sort(()=>Math.random()-.5);quizOpts.innerHTML='';quizResult.textContent='';opts.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.th;b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o.th===target.th){b.classList.add('correct');quizResult.textContent='答對了！';speak(target.th,.65)}else{b.classList.add('wrong');quizResult.textContent='再看一次正確答案。';[...document.querySelectorAll('.option')].find(x=>x.textContent===target.th).classList.add('correct')}};quizOpts.appendChild(b)})}
let cardIndex=0,currentCard=null;function startCards(){cardIndex=0;cards.classList.remove('hide');showCard()}function showCard(){currentCard=allP[cardIndex];cardCount.textContent=`${cardIndex+1} / ${allP.length}`;cardThai.textContent=currentCard.th;cardMeaning.textContent=currentCard.meaning;cardPron.textContent=currentCard.rom}function nextCard(){cardIndex=(cardIndex+1)%allP.length;showCard()}function prevCard(){cardIndex=(cardIndex-1+allP.length)%allP.length;showCard()}function closeCards(){cards.classList.add('hide')}
render();
