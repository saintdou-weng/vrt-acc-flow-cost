<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柬語從零開始 · 50歲也學得會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A3A;        /* 深夜藍 */
  --gold:#C79A2A;       /* 金邊塔金 */
  --gold-soft:#F3E7C8;
  --paper:#FBFAF6;
  --card:#FFFFFF;
  --green:#2E7D5B;      /* 學會綠 */
  --red:#B8452F;
  --line:#E6E1D5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.6}
.khmer{font-family:'Noto Sans Khmer','Noto Sans TC',sans-serif}
header{background:var(--ink);color:#fff;padding:22px 18px 18px;position:relative;overflow:hidden}
header::after{content:"ក ខ គ ឃ ង";position:absolute;right:-10px;top:-18px;font-family:'Noto Sans Khmer';font-size:90px;color:rgba(199,154,42,.14);letter-spacing:6px;pointer-events:none}
header h1{font-size:24px;font-weight:900}
header p{color:var(--gold);font-size:15px;margin-top:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
.progress-band{background:var(--gold-soft);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.progress-band b{color:var(--green);font-size:22px}
/* 課程卡 */
.lesson-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .1s}
.lesson-card:active{transform:scale(.98)}
.lesson-num{font-family:'Noto Sans Khmer';font-size:30px;color:var(--gold);min-width:46px;text-align:center;font-weight:700}
.lesson-card h3{font-size:19px;font-weight:700}
.lesson-card small{color:#7A7466;font-size:14px}
.lesson-done{margin-left:auto;font-size:14px;color:var(--green);white-space:nowrap}
/* 片語卡 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btn-back{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer}
.phrase{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.phrase .km{font-family:'Noto Sans Khmer';font-size:34px;font-weight:700;line-height:1.5}
.phrase .roman{font-size:20px;color:var(--gold);font-weight:700;margin-top:2px}
.phrase .zh{font-size:20px;font-weight:700;margin-top:6px}
.phrase .memo{background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:16px}
.phrase .memo b{color:var(--red)}
.phrase .row{display:flex;gap:10px;margin-top:12px}
.btn-say{flex:1;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:12px;font-size:17px;font-family:inherit;cursor:pointer}
.btn-learn{flex:1;background:#fff;border:2px solid var(--green);color:var(--green);border-radius:12px;padding:12px;font-size:17px;font-family:inherit;cursor:pointer;font-weight:700}
.btn-learn.on{background:var(--green);color:#fff}
.tts-hint{background:#FFF4E5;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:14px;display:none}
/* 測驗 */
.btn-quiz{width:100%;background:var(--gold);color:var(--ink);border:none;border-radius:14px;padding:16px;font-size:19px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:6px}
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
.quiz-q .ask{font-size:17px;color:#7A7466}
.quiz-q .big{font-size:26px;font-weight:900;margin:10px 0 18px}
.opt{display:block;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:19px;font-family:inherit;margin-bottom:10px;cursor:pointer;text-align:left}
.opt .k{font-family:'Noto Sans Khmer';font-size:22px}
.opt.right{border-color:var(--green);background:#EAF6EF}
.opt.wrong{border-color:var(--red);background:#FBECE8}
.quiz-result{text-align:center;padding:30px 10px}
.quiz-result .score{font-size:52px;font-weight:900;color:var(--gold)}
.hidden{display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px;text-align:center;font-size:14px;color:#7A7466}
</style>
</head>
<body>
<header>
  <h1>柬語從零開始</h1>
  <p>一天 5 句 · 用中文諧音記 · 講給西港人聽得懂</p>
</header>

    </div>
    <div id="quizBody"></div>
  </div>
</div>

<footer>慢慢來，每天 5 句，三個月後你會嚇到自己 💪</footer>

  ["ទៅណា?","tov na?（都那?）","去哪裡？","柬國人打招呼常這樣問，不是查勤，是寒暄"],
  ["ក្តៅណាស់","kdav nah（克到拿）","好熱啊","西港天氣萬用開場白 🥵"],
  ["ភ្លៀង","phlieng（普連）","下雨","雨季每天用得到"],
  ["ស្អាត","s'at（沙啊）","漂亮／乾淨","稱讚廠區整潔、稱讚人都行"],
  ["អត់អីទេ","ot ei te（哦唉爹）","沒關係／不客氣","別人說哦昆，你回「哦唉爹」"],
  ["ជួបគ្នាថ្ងៃស្អែក","chuob knea thngai s'aek（左普尼亞 太沙耶）","明天見","下班道別進階版，比利亞嗨更有人情味"]
 ]}
];

let learned={}, curLesson=0;
const KH_NUM="០១២៣៤៥៦៧៨៩";

async function loadProgress(){
  try{
    if(window.storage?.get){const r=await window.storage.get('khmer-learned');if(r)learned=JSON.parse(r.value);}
    else learned=JSON.parse(localStorage.getItem('khmer_primer_learned')||'{}');
  }catch(e){learned={};}
  renderHome();
}
async function saveProgress(){
  try{
    localStorage.setItem('khmer_primer_learned',JSON.stringify(learned));
    if(window.storage?.set)await window.storage.set('khmer-learned',JSON.stringify(learned));
  }catch(e){}
}
function key(li,pi){return li+'-'+pi}
function totalPhrases(){return LESSONS.reduce((a,l)=>a+l.p.length,0)}
function learnedInLesson(li){return LESSONS[li].p.filter((_,i)=>learned[key(li,i)]).length}

function renderHome(){
  document.getElementById('totalCount').textContent=totalPhrases();
  document.getElementById('learnedCount').textContent=Object.values(learned).filter(Boolean).length;
  const el=document.getElementById('lessonList');el.innerHTML='';
  LESSONS.forEach((l,i)=>{
    const d=document.createElement('div');d.className='lesson-card';d.onclick=()=>openLesson(i);
    const done=learnedInLesson(i);
    d.innerHTML=`<div class="lesson-num">${String(i+1).split('').map(c=>KH_NUM[+c]).join('')}</div>
      <div><h3>第 ${i+1} 課 · ${l.t}</h3><small>${l.s}</small></div>
      <div class="lesson-done">${done===l.p.length?'✅ 完成':done+'/'+l.p.length}</div>`;
    el.appendChild(d);
  });
}
function show(id){['home','lessonView','quizView'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));window.scrollTo(0,0);}
function goHome(){renderHome();show('home');}

function openLesson(i){
  curLesson=i;
  document.getElementById('lessonTitle').textContent=`第 ${i+1} 課 · ${LESSONS[i].t}`;
  const el=document.getElementById('phraseList');el.innerHTML='';
  LESSONS[i].p.forEach((ph,pi)=>{
    const on=!!learned[key(i,pi)];
    const d=document.createElement('div');d.className='phrase';
    d.innerHTML=`<div class="km">${ph[0]}</div>
      <div class="roman">${ph[1]}</div>
      <div class="zh">${ph[2]}</div>
      <div class="memo">💡 <b>記法：</b>${ph[3]}</div>
      <div class="row">
        <button class="btn-say" onclick="speak('${ph[0].replace(/'/g,"\\'")}')">🔊 聽發音</button>
        <button class="btn-learn ${on?'on':''}" onclick="toggleLearn(${i},${pi},this)">${on?'✓ 學會了':'標記學會'}</button>
      </div>`;
    el.appendChild(d);
  });
  checkTTS();
  show('lessonView');
}
function toggleLearn(li,pi,btn){
  learned[key(li,pi)]=!learned[key(li,pi)];
  btn.classList.toggle('on');btn.textContent=learned[key(li,pi)]?'✓ 學會了':'標記學會';
  saveProgress();
}
let kmVoice=null;
function findVoice(){
  const vs=speechSynthesis.getVoices();
  kmVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('km'))||null;
}
function checkTTS(){
  if(!('speechSynthesis' in window)){document.getElementById('ttsHint').style.display='block';return;}
  findVoice();
  document.getElementById('ttsHint').style.display=kmVoice?'none':'block';
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=findVoice;}
function speak(text){
  if(!('speechSynthesis' in window))return;
  findVoice();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='km-KH';u.rate=0.75;
  if(kmVoice)u.voice=kmVoice;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

/* ---- 測驗 ---- */
let quiz=[],qi=0,score=0;
function startQuiz(){
  const pool=LESSONS[curLesson].p.slice();
  quiz=shuffle(pool).slice(0,Math.min(5,pool.length));
  qi=0;score=0;show('quizView');renderQ();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderQ(){
  const body=document.getElementById('quizBody');
  if(qi>=quiz.length){
    body.innerHTML=`<div class="quiz-result">
      <div class="score">${score} / ${quiz.length}</div>
      <p style="margin:10px 0 20px">${score===quiz.length?'太厲害了！全對 🎉':score>=3?'很不錯，再複習一下 👍':'沒關係，回去多聽幾次再來 💪'}</p>
      <button class="btn-quiz" onclick="startQuiz()">再測一次</button>
      <button class="btn-back" style="margin-top:10px;width:100%;padding:14px" onclick="openLesson(curLesson)">回課程</button>
    </div>`;return;
  }
  const q=quiz[qi];
  const others=shuffle(LESSONS[curLesson].p.filter(p=>p!==q)).slice(0,2);
  const opts=shuffle([q,...others]);
  body.innerHTML=`<div class="quiz-q">
    <div class="ask">第 ${qi+1} 題／共 ${quiz.length} 題 — 「${q[2]}」的柬語是？</div>
    <div class="big">${q[2]}</div>
    ${opts.map(o=>`<button class="opt" onclick="answer(this,${o===q})"><span class="k">${o[0]}</span><br><span style="color:#C79A2A">${o[1]}</span></button>`).join('')}
  </div>`;
}
function answer(btn,ok){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'right':'wrong');
  if(ok)score++;
  setTimeout(()=>{qi++;renderQ();},900);
}

loadProgress();
</script>
</body>
</html>
